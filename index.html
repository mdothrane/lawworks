  var sName=K.plate('',{size:0.2,weight:600,color:pal.ink});sName.position.set(SX,BH/2,Z0+CD/2+0.002);g.add(sName);
  /* what someone who has only seen the outside draws: one big box that does the work, a small tank by the outlet, no third part */
  var GUESS={T:{x:0.95,z:-0.35,w:0.5,h:0.55,d:0.5},B:{x:-0.3,z:-0.05,w:1.5,h:1.1,d:1.3},U:{x:-0.3,z:-0.05,w:0.05,h:0.05,d:0.05}};
  var gh={};
  ['T','B','U'].forEach(function(k){
    var l=K.lines(K.boxEdges(1,1,1),{color:pal.ink,dash:[4,3]});g.add(l);
    gh[k]={l:l,cur:copy(GUESS[k]),from:copy(GUESS[k]),to:copy(GUESS[k]),u:1,on:k!=='U',op:k==='U'?0:1};
  });
  function copy(o){return {x:o.x,z:o.z,w:o.w,h:o.h,d:o.d};}
  var links=K.lines([],{color:pal.ink,dash:[4,3]});g.add(links);
  /* the outlet is on the outside, so the sketch has it right from the start */
  var OUT=[SX+1.0,1.1,Z0+CD/2],OUT2=[SX+1.0,1.1,Z0+CD/2+0.3];
  var stub=K.lines(K.boxEdges(0.14,0.14,0.3),{color:pal.ink});stub.position.set(OUT[0],1.1,OUT[2]+0.15);g.add(stub);
  function place(k){var c=gh[k].cur;gh[k].l.position.set(SX+c.x,BH+c.h/2,Z0+c.z);gh[k].l.scale.set(c.w,c.h,c.d);}
  /* a connection in the sketch: a straight dashed line from the face of one part to the face of the next */
  function exitT(c,dx,dz){var tx=Math.abs(dx)>1e-6?(c.w/2)/Math.abs(dx):1e9,tz=Math.abs(dz)>1e-6?(c.d/2)/Math.abs(dz):1e9;return Math.min(1,tx,tz);}
  function link(a,b,y){
    var ax=SX+a.x,az=Z0+a.z,bx=b.pt?b.pt[0]:SX+b.x,bz=b.pt?b.pt[2]:Z0+b.z,dx=bx-ax,dz=bz-az,t0=exitT(a,dx,dz),t1=b.pt?1:1-exitT(b,-dx,-dz);
    if(t1<=t0)return null;
    return [ax+dx*t0,y,az+dz*t0,ax+dx*t1,y,az+dz*t1];
  }
  function drawLinks(){
    var order=gh.U.on?['T','B','U']:['T','B'],s=[],i,q;
    for(i=0;i<order.length-1;i++){var a=gh[order[i]].cur,b=gh[order[i+1]].cur;q=link(a,b,BH+0.5*Math.min(a.h,b.h));if(q)s.push(q);}
    var e=gh[order[order.length-1]].cur,y=BH+Math.min(e.h*0.8,1.1);q=link(e,{pt:[OUT[0],y,OUT[2]]},y);if(q){s.push(q);s.push([OUT[0],y,OUT[2],OUT[0],1.1,OUT[2]]);}

  }

  /* ---- the handle: how much the machine shows ---- */
  var v=0,vFrom=0,vTo=0,mk=1,auto=true,KEYS=[0,0.22,0.6,1],ki=0,hold=0,HOLD=3.6,MOVE=1.6,known={T:false,B:false,U:false},st='';
  function seen(){
    var s=SLIDE*Math.max(0,Math.min(1,(v-0.3)/0.7)),front=CD/2-s;
    return {T:v>=0.12,B:front<REAL.B.z,U:front<REAL.U.z,s:s,ind:v>=0.12};
  }
  function retarget(k,on){
    var G=gh[k];G.from=copy(G.cur);G.to=copy(on?REAL[k]:GUESS[k]);G.u=0;
    if(k==='U'){G.on=true;}
  }
  function stage(){var n=(known.T?1:0)+(known.B?1:0)+(known.U?1:0);return n;}
  function apply(){
    var S=seen();cg.position.z=-S.s;ind.visible=S.ind;
    ['T','B','U'].forEach(function(k){if(S[k]!==known[k]){known[k]=S[k];retarget(k,S[k]);dirty=true;}});
    var key=(S.ind?'i':'')+(S.s>0.01?'o':'')+(S.s>=SLIDE-0.01?'f':'')+stage();
    if(key!==st){st=key;if(api&&api.onUi)api.onUi();}
  }
  var dirty=true;
  function ghosts(dt){
    if(!dirty&&gh.T.u>=1&&gh.B.u>=1&&gh.U.u>=1)return;
    dirty=false;
    ['T','B','U'].forEach(function(k){
      var G=gh[k];
      if(G.u<1){G.u=Math.min(1,G.u+dt/1.3);var e=K.ease(G.u);['x','z','w','h','d'].forEach(function(p){G.cur[p]=G.from[p]+(G.to[p]-G.from[p])*e;});
        if(k==='U'&&G.u>=1&&!known.U)G.on=false;}
      G.l.visible=G.on;place(k);
    });
    drawLinks();
  }

  /* ---- the machine at work: the pipe fills part by part; the lamp is lit while it runs ---- */
  var cyc=0,CYC=5.6,LEN=pipes.map(function(p){return p.len;}),lampOn=null,lastF=[null,null,null];
  function pf(i,d){if(d===lastF[i])return;lastF[i]=d;pipes[i].fill(d);}
  function work(dt){
    cyc=(cyc+dt)%CYC;var t=cyc,T1=1.0,T2=1.7,T3=2.4,T4=3.8;
    pf(0,t<T4?LEN[0]*Math.min(1,t/T1):-1);
    pf(1,t<T4&&t>T1?LEN[1]*Math.min(1,(t-T1)/(T2-T1)):-1);
    pf(2,t<T4&&t>T2?LEN[2]*Math.min(1,(t-T2)/(T3-T2)):-1);
    var on=t<T4;if(on!==lampOn){lampOn=on;lampMat.color.setHex(on?pal.signal:pal.chip);}
    setLevel(t<T3?0.8-0.2*K.ease(t/T3):0.6+0.2*K.ease((t-T3)/(CYC-T3)));
  }

  function texts(){
    mName.setText(tr({da:'Maskinen',en:'The machine'}));
    sName.setText(tr({da:'Brugerens skitse af indmaden',en:'The user’s sketch of the inside'}));
    tLvl.setText(tr({da:'Niveau',en:'Level'}));tLamp.setText(tr({da:'Kører',en:'Running'}));
  }
  texts();apply();ghosts(0);work(0);
  var api={group:g,onUi:null,
    box:function(){return [[-4.3,0,-3.8],[4.4,2.5,1.5]];},
    update:function(dt){
      if(mk<1){mk=Math.min(1,mk+dt/MOVE);v=vFrom+(vTo-vFrom)*K.ease(mk);}
      else if(auto){hold+=dt;if(hold>=HOLD){hold=0;ki=(ki+1)%KEYS.length;vFrom=v;vTo=KEYS[ki];mk=0;}}
      apply();ghosts(dt);work(dt);
    },
    relabel:texts,
    ui:{
      label:function(){return tr({da:'Hvor meget maskinen viser',en:'How much the machine shows'});},
      ends:function(){return tr({da:['Lukket','Alt'],en:['Closed','Everything']});},
      min:0,max:100,step:1,
      value:function(){return Math.round(v*100);},
      set:function(x){auto=false;mk=1;v=x/100;},
      readout:function(){
        var S=seen(),what=S.s>=SLIDE-0.01?tr({da:'Helt åben',en:'Fully open'}):S.s>0.01?tr({da:'Delvis åben',en:'Partly open'}):S.ind?tr({da:'Lukket, med lampe og niveau',en:'Closed, with lamp and level'}):tr({da:'Lukket',en:'Closed'});
        return what+tr({da:' · skitsen har '+stage()+' af 3 dele rigtigt',en:' · the sketch has '+stage()+' of 3 parts right'});
      },
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;hold=0;}
    }
  };
  return api;
};
})();

</script>
<script>/* m_miller.js */
/* m_miller.js — Miller's law as three rows of digit places on a stand of three steps.
   The same digits are shown, one at a time, in all three rows. Afterwards each row keeps what it can hold, and the digits beyond its
   limit drop out and leave a dashed outline.
   Front: rehearsal and grouping prevented, about four (Cowan 2001: about 3–5 units when rehearsal and grouping are ruled out).
   Middle: ordinary digit span, about seven (Miller 1956).
   Back: the same digits in groups of three hold longer (here nine). The limits are the model's approximations; spans vary between people.
   Simplification: the digits that drop out are the last ones; in a real test the errors spread over the row. */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models.miller=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr;
  var g=new THREE.Group(),i,k;
  var NMAX=12,BS=0.46,PIT=0.54,GAP=0.24,DEP=1.5,ZF=2.25,W=9.8,XS=-3.15,STEP=0.34,RISE=0.26;
  var ROWS=[
    {lim:4,grp:0,name:{da:'Uden gentagelse og gruppering',en:'No rehearsal, no grouping'}},
    {lim:7,grp:0,name:{da:'Med gentagelse',en:'With rehearsal'}},
    {lim:9,grp:3,name:{da:'Med gentagelse, i grupper af tre',en:'With rehearsal, in groups of three'}}];
  var H=[0.45,0.95,1.45],ZB=ZF-3*DEP;
  function zf(k){return ZF-k*DEP;}
  /* the edges of a box that the camera sees (from the front left, above): the top, the front and the left side */
  function seen(w,h,d){var x=w/2,y=h/2,z=d/2;return [[-x,y,-z,x,y,-z],[x,y,-z,x,y,z],[x,y,z,-x,y,z],[-x,y,z,-x,y,-z],
    [-x,-y,z,x,-y,z],[-x,-y,z,-x,y,z],[x,-y,z,x,y,z],[-x,-y,-z,-x,y,-z],[-x,-y,-z,-x,-y,z]];}

  /* ---- the stand: three steps, drawn as one piece ---- */
  for(k=0;k<3;k++)g.add(K.solid(W,H[k],zf(k)-ZB,{edge:null,x:0,y:H[k]/2,z:(zf(k)+ZB)/2}));
  var prof=[[ZF,0],[ZF,H[0]],[zf(1),H[0]],[zf(1),H[1]],[zf(2),H[1]],[zf(2),H[2]],[ZB,H[2]],[ZB,0]],out=[];
  [-W/2,W/2].forEach(function(x){for(var j=0;j<prof.length;j++){var a=prof[j],b=prof[(j+1)%prof.length];out.push([x,a[1],a[0],x,b[1],b[0]]);}});
  prof.forEach(function(p){out.push([-W/2,p[1],p[0],W/2,p[1],p[0]]);});
  g.add(K.lines(out,{color:pal.borderStrong}));

  /* ---- the digit places ---- */
  var rows=ROWS.map(function(R,k){
    var plate=K.plate('',{size:0.19,weight:600,color:pal.ink});g.add(plate);
    var y0=k?H[k-1]:0;plate.position.set(0,y0+(k?0.29:H[0]/2),zf(k)+0.002);
    var cells=[];
    for(var j=0;j<NMAX;j++){
      var c=new THREE.Group();c.visible=false;g.add(c);
      var m=K.solid(BS,BS,BS,{tone:TONE.white,edge:pal.slate});c.add(m);
      var d=K.plate('0',{size:0.3,weight:600,color:pal.ink});d.position.set(0,0,BS/2+0.002);c.add(d);
      var gh=K.lines(seen(BS,BS,BS),{color:pal.slate,dash:[4,3]});gh.visible=false;c.add(gh);
      var x=XS+j*PIT+(R.grp?Math.floor(j/R.grp)*GAP:0);
      c.position.set(x,H[k]-BS/2-0.02,zf(k)-0.4);
      cells.push({c:c,m:m,d:d,gh:gh,x:x,y:0,lost:false});
    }
    return {R:R,plate:plate,cells:cells};
  });
  function cellY(k,u){return H[k]-BS/2-0.02+(BS+0.02)*u;}
  /* a digit that dropped out leaves its place: a dashed outline of the edges that can be seen */
  function setLost(cell,on){
    if(cell.lost===on)return;cell.lost=on;
    cell.m.visible=!on;cell.d.visible=!on;cell.gh.visible=on;
  }

  var n=8,auto=true,AUTO=[5,8,11],ai=1,phase='show',pt=0,digits=[],seed=7,dropped=false;
  function held(k){return Math.min(n,ROWS[k].lim);}
  function texts(){
    rows.forEach(function(r,k){
      var runs=[{t:tr(r.R.name)}];
      if(dropped)runs.push({t:tr({da:'   ·   '+held(k)+' af '+n+' holdt',en:'   ·   '+held(k)+' of '+n+' held'}),w:700});
      r.plate.setText([runs]);r.plate.position.x=-W/2+0.3+r.plate.w/2;
    });
  }
  function start(){
    var rnd=K.rng(seed++);digits=[];
    for(var j=0;j<NMAX;j++){var d=Math.floor(rnd()*10);if(j&&d===digits[j-1])d=(d+3)%10;digits.push(d);}
    rows.forEach(function(r,k){r.cells.forEach(function(cell,j){setLost(cell,false);cell.c.visible=false;cell.y=0;cell.c.position.y=cellY(k,0);if(j<n)cell.d.setText(String(digits[j]));});});
    phase='show';pt=0;dropped=false;texts();if(api&&api.onUi)api.onUi();
  }
  function drop(){
    dropped=true;
    rows.forEach(function(r,k){r.cells.forEach(function(cell,j){if(j<n&&j>=r.R.lim)setLost(cell,true);});});
    texts();if(api&&api.onUi)api.onUi();
  }
  function update(dt){
    pt+=dt;var j,u;
    if(phase==='show'){
      for(j=0;j<n;j++){u=Math.min(1,Math.max(0,(pt-j*STEP)/RISE));
        rows.forEach(function(r,k){var cell=r.cells[j];cell.c.visible=u>0;cell.c.position.y=cellY(k,K.ease(u));});}
      if(pt>=n*STEP+RISE+0.7){phase='drop';pt=0;drop();}
    }else if(phase==='drop'){
      if(pt>=3.8){phase='clear';pt=0;}
    }else if(phase==='clear'){
      u=Math.min(1,pt/0.45);
      rows.forEach(function(r,k){for(j=0;j<n;j++){var cell=r.cells[j];if(!cell.lost)cell.c.position.y=cellY(k,1-K.ease(u));else if(u>0.5)cell.c.visible=false;}});
      if(u>=1){if(auto){ai=(ai+1)%AUTO.length;n=AUTO[ai];}start();}
    }
  }
  start();
  var api={group:g,onUi:null,
    box:function(){return [[-W/2,0,ZB],[W/2,H[2]+BS,ZF+0.05]];},
    update:update,
    relabel:texts,
    ui:{
      label:function(){return tr({da:'Antal cifre',en:'Number of digits'});},
      ends:function(){return ['3','12'];},
      min:3,max:NMAX,step:1,
      value:function(){return n;},
      set:function(v){auto=false;v=Math.max(3,Math.min(NMAX,Math.round(v)));if(v===n&&phase!=='clear')return;n=v;start();},
      readout:function(){
        var a=held(0),b=held(1),c=held(2);
        return tr({da:n+' cifre · holdt: uden gentagelse '+a+', med '+b+', i grupper '+c,en:n+' digits · held: no rehearsal '+a+', rehearsal '+b+', grouped '+c});
      },
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;if(auto){var q=AUTO.indexOf(n);if(q<0){ai=0;n=AUTO[0];start();}else ai=q;}}
    }
  };
  return api;
};
})();

</script>
<script>/* m_occam.js */
/* m_occam.js — Occam's razor as two machines that deliver the same result.
   Both machines feed blocks from a dispenser along a belt into a bin, at the same rate, in step.
   The back machine has extra parts: a wheel that turns, a piston that pushes, a pipe that leads away.
   They move, but they touch nothing the result passes through.
   The handle removes parts one at a time from the back machine. A removed part is left as a dashed ghost for a moment.
   The result does not change while the extra parts go. The last part is the belt, and it was needed:
   without it the blocks fall to the floor and nothing reaches the bin. */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models.occam=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr;
  var g=new THREE.Group();
  var ZS=1.55,ZC=-1.45,BT=0.6,HX=-3.95,BX0=-3.55,BX1=1.85,BIN=2.95,PS=0.3,V=1.6,EVERY=1.3,CAP=24,BH=0.4,BP=0.2;
  function v3(x,y,z){return new THREE.Vector3(x,y,z);}

  /* ---- one machine: dispenser, belt, bin ---- */
  function machine(z){
    var M={z:z,parcels:[],floor:[],count:0,fill:0,fillTo:0,jam:false};
    g.add(K.solid(0.8,1.5,0.8,{x:HX,y:0.75,z:z}));
    M.belt=K.solid(BX1-BX0,BT,0.7,{x:(BX0+BX1)/2,y:BT/2,z:z});g.add(M.belt);
    g.add(K.solid(1.3,BP,1.3,{x:BIN,y:BP/2,z:z}));
    var bin=K.lines(K.boxEdges(1.0,BH,1.0),{color:pal.slate});bin.position.set(BIN,BP+BH/2,z);g.add(bin);
    M.fillM=K.solid(0.98,1,0.98,{tone:TONE.soft,edge:pal.signalMid,x:BIN,z:z});g.add(M.fillM);M.fillM.visible=false;
    M.val=K.plate('',{size:0.17,weight:700,color:pal.ink});M.val.position.set(BIN,BP/2,z+0.651);g.add(M.val);
    M.name=K.plate('',{size:0.2,weight:600,color:pal.ink});M.name.rotation.x=-Math.PI/2;g.add(M.name);
    for(var i=0;i<7;i++){var p=K.solid(PS,PS,PS,{tone:TONE.signal,edge:pal.signalShadow});p.visible=false;g.add(p);M.parcels.push({m:p,on:false});}
    return M;
  }
  var S=machine(ZS),C=machine(ZC);

  /* ---- the extra parts on the back machine ---- */
  var parts=[];
  function part(meshes,extra){var o={meshes:meshes,removed:false,fade:0};for(var k in extra)o[k]=extra[k];meshes.forEach(function(m){g.add(m);m.edgeCol=m.edges?pal.borderStrong:null;});parts.push(o);return o;}
  /* a wheel on a post: four spokes that turn, and nothing is attached to them */
  var WX=-1.55,WY=1.75,wheel=new THREE.Group();wheel.position.set(WX,WY,ZC-0.93);g.add(wheel);
  var sp1=K.solid(1.1,0.12,0.06,{}),sp2=K.solid(0.12,1.1,0.06,{});wheel.add(sp1);wheel.add(sp2);
  var wPart=part([K.solid(0.12,WY,0.12,{x:WX,y:WY/2,z:ZC-1.02})],{name:'wheel'});
  wPart.meshes=wPart.meshes.concat([sp1,sp2]);sp1.edgeCol=sp2.edgeCol=pal.borderStrong;
  /* a piston in a block behind the belt: it pushes out into the empty air beside it */
  var PX0=0.05,PZ=ZC-1.0,rod=K.solid(1,0.12,0.12,{y:0.95,z:PZ});
  var pPart=part([K.solid(0.5,1.2,0.5,{x:PX0-0.25,y:0.6,z:PZ}),rod],{name:'piston'});
  /* a pipe out of the dispenser that leads away and ends in the air */
  var pipePts=[v3(HX,1.5,ZC),v3(HX,2.45,ZC),v3(-2.85,2.45,ZC),v3(-2.85,2.0,ZC)];
  var pipe=K.pipe(0.07);pipe.set(pipePts);g.add(pipe);
  var pipeGhost=K.lines(K.chain(pipePts),{color:pal.mist,dash:[4,3]});pipeGhost.visible=false;g.add(pipeGhost);
  var qPart={meshes:[],removed:false,fade:0,name:'pipe',pipe:pipe,ghost:pipeGhost};parts.push(qPart);
  /* the belt: the one part the result needs */
  var bPart={meshes:[C.belt],removed:false,fade:0,name:'belt',needed:true};C.belt.edgeCol=pal.borderStrong;parts.push(bPart);

  function ghost(o,on){
    if(o.pipe){o.pipe.visible=!on;o.ghost.visible=on;o.ghost.setOpacity(1);}
    o.meshes.forEach(function(m){m.visible=true;m.setGhost(on);if(m.edges){m.edges.setDash(on?4:0,on?3:0);m.edges.setColor(on?pal.slate:m.edgeCol);m.edges.setOpacity(1);}});
    o.fade=on?1:0;
  }
  function stepGhost(o,dt){
    if(!o.removed||o.needed||o.fade<=0)return;
    o.fade=Math.max(0,o.fade-dt/1.4);var a=K.ease(o.fade);
    if(o.pipe){o.ghost.setOpacity(a);o.ghost.visible=a>0.01;}
    o.meshes.forEach(function(m){if(m.edges)m.edges.setOpacity(a);m.visible=a>0.01;});
  }

  /* ---- parcels: out of the dispenser, along the belt, over the end into the bin ---- */
  var X_OUT=BX0+0.25,X_END=BX1-0.2,T_OUT=0.45,T_BELT=(X_END-X_OUT)/V,T_DROP=0.6,Y_ON=BT+PS/2;
  function binTop(M){return BP+BH*Math.min(1,M.fill/CAP);}
  function release(M){
    if(M.jam)return;
    for(var i=0;i<M.parcels.length;i++){var p=M.parcels[i];if(!p.on){p.on=true;p.t=0;p.st='go';p.m.visible=true;p.m.scale.set(1,1,1);return;}}
  }
  function beltThere(M){return M!==C||!bPart.removed;}
  function toFloor(M,p,x){
    /* off the edge of where the belt was: down to the floor, next to the ones already there */
    var k=M.floor.length;p.st='fall';p.t=0;p.from=p.m.position.clone();p.to=v3(Math.max(x,BX0+0.25+k*0.36),PS/2,M.z+((k%2)?0.12:-0.12));M.floor.push(p);
    if(M.floor.length>=5)M.jam=true;
  }
  function stepParcel(M,p,dt){
    p.t+=dt;var x,y,u;
    if(p.st==='go'){
      var t=p.t;
      if(t<T_OUT){u=K.ease(t/T_OUT);x=HX+(X_OUT-HX)*u;y=Y_ON;if(!beltThere(M)&&x>BX0){toFloor(M,p,x);return;}}
      else if(t<T_OUT+T_BELT){x=X_OUT+V*(t-T_OUT);y=Y_ON;if(!beltThere(M)){toFloor(M,p,x);return;}}
      else{
        u=Math.min(1,(t-T_OUT-T_BELT)/T_DROP);var e=K.ease(u),top=binTop(M)+PS/2;
        x=X_END+(BIN-X_END)*e;y=Y_ON+(top-Y_ON)*u*u+0.25*Math.sin(Math.PI*Math.min(1,u*1.4))*(1-u);
        if(u>=1){p.on=false;p.m.visible=false;M.count++;M.fill++;M.val.setText(label(M));if(M.fill>CAP){M.fill=1;}if(api&&api.onUi&&M===C)api.onUi();return;}
      }
      p.m.position.set(x,y,M.z);
    }else if(p.st==='fall'){
      u=Math.min(1,p.t/0.55);p.m.position.set(p.from.x+(p.to.x-p.from.x)*K.ease(u),p.from.y+(p.to.y-p.from.y)*u*u,p.from.z+(p.to.z-p.from.z)*K.ease(u));
      if(u>=1){p.st='lie';p.m.rotation.set(0,((p.to.x*7.3)%1-0.5)*0.9,((p.to.x*3.1)%1-0.5)*0.5);p.m.position.y=PS/2+0.03;}
    }else if(p.st==='clear'){
      u=Math.min(1,p.t/0.4);var s=Math.max(0.001,1-K.ease(u));p.m.scale.set(s,s,s);if(u>=1){p.on=false;p.m.visible=false;p.m.rotation.set(0,0,0);}
    }
  }
  function setFill(M){var h=Math.max(0.001,BH*Math.min(1,M.fill/CAP));M.fillM.scale.y=h;M.fillM.position.y=BP+h/2;M.fillM.visible=M.fill>0;}

  /* ---- the handle: how many parts are taken out of the back machine ---- */
  var removed=0,auto=true,hold=0,clock=0;
  function setRemoved(n){
    n=Math.max(0,Math.min(parts.length,Math.round(n)));if(n===removed)return;removed=n;
    parts.forEach(function(o,i){var r=i<n;if(r!==o.removed){o.removed=r;ghost(o,r);}});
    /* when the belt comes back, the fallen blocks are cleared and both machines count again from zero, in step */
    if(!bPart.removed&&(C.floor.length||n===0)){C.floor.forEach(function(p){p.st='clear';p.t=0;});C.floor=[];C.jam=false;
      [S,C].forEach(function(M){M.count=0;M.fill=0;M.val.setText(label(M));});}
    hold=0;if(api&&api.onUi)api.onUi();
  }
  function label(M){return tr({da:'Leveret ',en:'Delivered '})+M.count;}
  function relabel(){
    S.name.setText(tr({da:'Enkel maskine',en:'Simple machine'}));C.name.setText(tr({da:'Maskine med ekstra dele',en:'Machine with extra parts'}));
    S.name.position.set(BX0-0.6+S.name.w/2,0.006,S.z+0.45+0.12+S.name.h/2);
    C.name.position.set(-2.2+C.name.w/2,0.006,C.z+0.45+0.12+C.name.h/2);
    [S,C].forEach(function(M){M.val.setText(label(M));});
  }
  function update(dt){
    clock+=dt;
    if(clock>=EVERY){clock-=EVERY;release(S);release(C);}
    [S,C].forEach(function(M){M.parcels.forEach(function(p){if(p.on)stepParcel(M,p,dt);});setFill(M);});
    if(!wPart.removed)wheel.rotation.z-=dt*1.1;
    if(!pPart.removed){var ext=0.45+0.3*Math.sin(clock/EVERY*Math.PI*2);rod.scale.x=ext;rod.position.x=PX0+ext/2;}
    parts.forEach(function(o){stepGhost(o,dt);});
    if(auto){hold+=dt;if(hold>=(removed===parts.length?6.5:4.6)){setRemoved((removed+1)%(parts.length+1));}}
  }
  relabel();rod.scale.x=0.45;rod.position.x=PX0+0.225;
  var NAMES={wheel:{da:'hjulet',en:'the wheel'},piston:{da:'stemplet',en:'the piston'},pipe:{da:'røret',en:'the pipe'},belt:{da:'båndet',en:'the belt'}};
  var api={group:g,onUi:null,
    box:function(){return [[-4.5,0,-2.7],[3.8,2.6,2.4]];},
    update:update,
    relabel:relabel,
    ui:{
      label:function(){return tr({da:'Fjern dele fra maskinen bagest',en:'Remove parts from the back machine'});},
      ends:function(){return tr({da:['Ingen','Alle fire'],en:['None','All four']});},
      min:0,max:4,step:1,
      value:function(){return removed;},
      set:function(v){auto=false;setRemoved(v);},
      readout:function(){
        if(removed===0)return tr({da:'Ingen dele fjernet · samme resultat',en:'No parts removed · same result'});
        var last=tr(NAMES[parts[removed-1].name]);
        if(bPart.removed)return tr({da:'Fjernet '+removed+' af 4 · '+last+' var nødvendigt: intet resultat',en:'Removed '+removed+' of 4 · '+last+' was needed: no result'});
        return tr({da:'Fjernet '+removed+' af 4, senest '+last+' · samme resultat',en:'Removed '+removed+' of 4, last '+last+' · same result'});
      },
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;hold=0;}
    }
  };
  return api;
};
})();

</script>
<script>/* m_pareto.js */
/* m_pareto.js — the Pareto principle as twenty causes and their effects.
   Each column is one cause; its height is its share of all the effects, and the lines across it count the effects in stacks of ten.
   The columns stand sorted, largest first. The board plots the cumulative share: how much of the effects the first causes account for.
   The handle sets how skewed the distribution is (the exponent of a power law, with a little fixed scatter, re-sorted).
   The dashed line at 80 % meets the curve where the few causes that are coloured account for 80 %; that is rarely exactly 20 % of the causes. */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models.pareto=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr,num=TB.num;
  var g=new THREE.Group();
  var N=20,TOTAL=200,X0=-4.9,PITCH=0.29,BW=0.23,BD=0.7,BZ=0.35,BY=0.16,HS=3.6;

  /* ---- the row of causes ---- */
  g.add(K.solid(N*PITCH+0.2,BY,BD+0.5,{x:X0+N*PITCH/2-PITCH/2,y:BY/2,z:BZ}));
  var bars=[];
  for(var i=0;i<N;i++){var b=K.solid(BW,1,BD,{tone:TONE.white,x:X0+i*PITCH,z:BZ});g.add(b);bars.push({m:b,sig:false});}
  var stacks=K.lines([],{color:pal.borderStrong});g.add(stacks);
  var rowT=K.plate('',{size:0.2,weight:600,color:pal.ink});rowT.rotation.x=-Math.PI/2;g.add(rowT);

  /* ---- the distribution: a power law with a fixed scatter, sorted largest first ---- */
  var rng=K.rng(29),SC=[];for(i=0;i<N;i++)SC.push(1+0.22*(rng()-0.5));
  function shares(a){
    var w=[],s=0;for(var j=0;j<N;j++){w.push(Math.pow(j+1,-a)*SC[j]);}
    w.sort(function(p,q){return q-p;});w.forEach(function(x){s+=x;});return w.map(function(x){return x/s;});
  }
  function k80(sh){var c=0;for(var j=0;j<N;j++){c+=sh[j];if(c>=0.8-1e-9)return {k:j+1,c:c};}return {k:N,c:1};}

  /* ---- the board: the cumulative share ---- */
  var GX=3.25,GZ=0.05,GW=3.7,GH=3.75,FZ=GZ+0.071;
  g.add(K.solid(GW,GH,0.14,{x:GX,y:GH/2,z:GZ}));
  var ax0=GX-GW/2+0.62,ax1=GX+GW/2-0.3,ay0=0.72,ay1=3.05;
  function gx(f){return ax0+(ax1-ax0)*f;}
  function gy(f){return ay0+(ay1-ay0)*f;}
  var axes=[[ax0,ay0,FZ,ax1,ay0,FZ],[ax0,ay0,FZ,ax0,ay1,FZ]],grid=[];
  for(i=1;i<=5;i++){axes.push([gx(i/5),ay0,FZ,gx(i/5),ay0-0.07,FZ],[ax0,gy(i/5),FZ,ax0-0.07,gy(i/5),FZ]);grid.push([ax0,gy(i/5),FZ,ax1,gy(i/5),FZ]);}
  g.add(K.lines(grid,{color:pal.border}));
  g.add(K.lines(axes,{color:pal.ink}));
  function txt(t,o,x,y,al){var p=K.plate(t,o);p.al=al;p.ax=x;p.position.set(x+(al==='r'?-p.w/2:al==='l'?p.w/2:0),y,FZ+0.002);g.add(p);return p;}
  /* the 80 on the axis is where the dashed line starts, so it carries the line's colour; no second label is needed */
  for(i=0;i<=5;i++){txt(String(i*20),{size:0.15,weight:400,color:pal.slate},gx(i/5),ay0-0.2);txt(String(i*20),i===4?{size:0.15,weight:700,color:pal.signal}:{size:0.15,weight:400,color:pal.slate},ax0-0.12,gy(i/5),'r');}
  var xl=txt('',{size:0.15,weight:600,color:pal.slate},ax1,ay0-0.45,'r');
  var yl=txt('',{size:0.15,weight:600,color:pal.slate},ax0-0.3,ay1+0.22,'l');
  /* the even distribution, as a ghost: every cause the same size */
  g.add(K.lines([[gx(0),gy(0),FZ+0.003,gx(1),gy(1),FZ+0.003]],{color:pal.mist,dash:[4,3]}));
  var curve=K.lines([],{color:pal.ink,width:1.5});g.add(curve);
  var dots=K.lines([],{color:pal.ink,width:3});g.add(dots);
  var mark80=K.lines([],{color:pal.signal,dash:[5,3]});g.add(mark80);
  var hit=K.quad(0.11,0.11,K.flat(pal.signal),0,0,FZ+0.008);g.add(hit);
  var hitT=K.plate('',{size:0.18,weight:700,color:pal.signal,bg:pal.chip,padX:0.04});g.add(hitT);
  var t80=K.plate('',{size:0.15,weight:700,color:pal.signal});g.add(t80);

  /* ---- state ---- */
  var v=0.35,from=v,to=v,mk=1,auto=true,KEYS=[0.12,0.35,0.55,0.8],ki=1,hold=0,HOLD=3.6,MOVE=1.5,cur=null,lastK=-1,shownK='';
  function aOf(x){return 3.0*x;}
  function draw(){
    var sh=shares(aOf(v)),r=k80(sh),j,c=0,pts=[[gx(0),gy(0)]],st=[],dd=[];
    cur={sh:sh,k:r.k,c:r.c};
    for(j=0;j<N;j++){
      var h=Math.max(0.002,sh[j]*HS),b=bars[j],x=X0+j*PITCH,on=j<r.k;
      b.m.scale.y=h;b.m.position.y=BY+h/2;
      if(on!==b.sig){b.sig=on;b.m.setTone(on?TONE.signal:TONE.white);b.m.setEdge(on?pal.signalShadow:pal.borderStrong);}
      /* the effects, in stacks of ten */
      var n=sh[j]*TOTAL,step=10*HS/TOTAL;
      for(var q=1;q*10<n-0.5;q++){var y=BY+q*step;st.push([x-BW/2,y,BZ+BD/2+0.002,x+BW/2,y,BZ+BD/2+0.002],[x-BW/2,y,BZ+BD/2+0.002,x-BW/2,y,BZ-BD/2]);}
      c+=sh[j];pts.push([gx((j+1)/N),gy(c)]);
    }
    stacks.set(st);
    var seg=[];for(j=0;j<pts.length-1;j++)seg.push([pts[j][0],pts[j][1],FZ+0.004,pts[j+1][0],pts[j+1][1],FZ+0.004]);
    curve.set(seg);
    for(j=1;j<pts.length;j++)dd.push([pts[j][0]-0.025,pts[j][1],FZ+0.005,pts[j][0]+0.025,pts[j][1],FZ+0.005]);
    dots.set(dd);
    var hx=gx(r.k/N),hy=gy(r.c);
    mark80.set([[ax0,gy(0.8),FZ+0.006,hx,gy(0.8),FZ+0.006],[hx,ay0,FZ+0.006,hx,hy,FZ+0.006]]);
    hit.position.set(hx,hy,FZ+0.008);
    if(r.k!==lastK){lastK=r.k;labels();if(api&&api.onUi)api.onUi();}
    /* beside the dashed line, on whichever side it fits */
    hitT.position.set(hx+0.12+hitT.w<=ax1?hx+0.12+hitT.w/2:hx-0.12-hitT.w/2,ay0+0.2,FZ+0.006);
  }
  function labels(){
    var k=cur?cur.k:lastK;
    hitT.setText(Math.round(100*k/N)+' %');
  }
  function texts(){
    rowT.setText(tr({da:'20 årsager, største først',en:'20 causes, largest first'}));rowT.position.set(X0-PITCH/2+rowT.w/2,0.006,BZ+BD/2+0.25+0.15+rowT.h/2);
    xl.setText(tr({da:'andel af årsagerne, %',en:'share of causes, %'}));xl.position.x=ax1-xl.w/2;
    yl.setText(tr({da:'andel af virkningerne, %',en:'share of effects, %'}));yl.position.x=ax0-0.3+yl.w/2;
    labels();
  }
  texts();draw();
  var api={group:g,onUi:null,
    box:function(){return [[-5.2,0,-0.3],[5.2,3.8,1.6]];},
    update:function(dt){
      if(mk<1){mk=Math.min(1,mk+dt/MOVE);v=from+(to-from)*K.ease(mk);draw();}
      else if(auto){hold+=dt;if(hold>=HOLD){hold=0;ki=(ki+1)%KEYS.length;from=v;to=KEYS[ki];mk=0;}}
    },
    relabel:texts,
    ui:{
      label:function(){return tr({da:'Hvor skæv fordelingen er',en:'How skewed the distribution is'});},
      ends:function(){return tr({da:['Jævn','Meget skæv'],en:['Even','Very skewed']});},
      min:0,max:100,step:1,
      value:function(){return Math.round(v*100);},
      set:function(x){auto=false;mk=1;v=x/100;draw();},
      readout:function(){
        var k=cur.k,p=Math.round(100*k/N),c=Math.round(100*cur.c);
        if(k===1)return tr({da:'Den største af 20 årsager (5 %) giver '+c+' % af virkningerne',en:'The largest of 20 causes (5 %) gives '+c+' % of the effects'});
        return tr({da:'De '+k+' største af 20 årsager ('+p+' %) giver '+c+' % af virkningerne',en:'The '+k+' largest of 20 causes ('+p+' %) give '+c+' % of the effects'});
      },
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;hold=0;}
    }
  };
  return api;
};
})();

</script>
<script>/* m_parkinson.js */
/* m_parkinson.js — Parkinson's law, schematic: a task in a box whose size is the time frame.
   The box lies on a ruler of days. The stylus works through the task, and the task grows until it fills the box:
   with more time it gets more steps, and every step takes longer. In front lies the work the task needed, dashed: two days.
   Parkinson's line (1955) opens a satirical essay; the model takes it literally and claims nothing more.
   It is about the task expanding in the time a team sets aside, not about time limits for users. */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models.parkinson=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr,num=TB.num;
  var g=new THREE.Group(),i;
  var NEEDED=2,TMIN=2,TMAX=10,DAY=0.66,X0=-4.2,SEC=0.42;
  function steps(T){return Math.round(3+(T-NEEDED)*0.75);}
  function DX(d){return X0+d*DAY;}

  /* ---- the plinth and the ruler of days ---- */
  var PY=0.25,PX0=-4.7,PX1=3.3,PZ0=-0.95,PZ1=2.6;
  g.add(K.solid(PX1-PX0,PY,PZ1-PZ0,{x:(PX0+PX1)/2,y:PY/2,z:(PZ0+PZ1)/2}));
  var RZ=2.0,rl=[[DX(0),PY+0.003,RZ,DX(TMAX),PY+0.003,RZ]];
  for(i=0;i<=TMAX;i++)rl.push([DX(i),PY+0.003,RZ-0.1,DX(i),PY+0.003,RZ+(i%2?0.06:0.1)]);
  g.add(K.lines(rl,{color:pal.ink}));
  for(i=0;i<=TMAX;i+=2){var p=K.plate(String(i),{size:0.18,weight:400,color:pal.slate});p.rotation.x=-Math.PI/2;p.position.set(DX(i),PY+0.003,RZ+0.27);g.add(p);}
  var rulT=K.plate('',{size:0.18,weight:600,color:pal.slate});rulT.rotation.x=-Math.PI/2;g.add(rulT);

  /* ---- the box: the time frame ---- */
  var TZ=-0.12,TD=1.2,WT=0.08,WH=0.34,FWH=0.14;
  var base=K.solid(1,0.05,TD,{tone:TONE.region,edge:pal.borderStrong,y:PY+0.025,z:TZ});g.add(base);
  var wL=K.solid(WT,WH,TD,{tone:TONE.white,x:DX(0)-WT/2,y:PY+WH/2,z:TZ});g.add(wL);
  var wR=K.solid(WT,WH,TD,{tone:TONE.white,y:PY+WH/2,z:TZ});g.add(wR);
  var wB=K.solid(1,WH,WT,{tone:TONE.white,y:PY+WH/2,z:TZ-TD/2+WT/2});g.add(wB);
  var wF=K.solid(1,FWH,WT,{tone:TONE.white,y:PY+FWH/2,z:TZ+TD/2-WT/2});g.add(wF);
  var boxT=K.plate('',{size:0.18,weight:700,color:pal.ink});g.add(boxT);
  var len=0;
  function setBox(T){
    len=T;var L=T*DAY,x=DX(0)+L/2;
    base.scale.x=L+2*WT;base.position.x=x;
    wR.position.x=DX(T)+WT/2;
    wB.scale.x=L;wB.position.x=x;wF.scale.x=L;wF.position.x=x;
  }

  /* ---- the task: its steps, laid end to end inside the box ---- */
  var PH=0.6,PD=0.8,GAP=0.07,pieces=[];
  for(i=0;i<12;i++){var m=K.solid(1,PH,PD,{tone:TONE.white,y:PY+0.05+PH/2,z:TZ});m.visible=false;g.add(m);pieces.push(m);}
  function layout(T){var n=steps(T),L=(T*DAY-GAP*(n+1))/n,out=[];for(var j=0;j<n;j++){var a=DX(0)+GAP+j*(L+GAP);out.push([a,a+L]);}return out;}
  var plan=[];
  function drawTask(xh){
    for(var j=0;j<pieces.length;j++){
      var m=pieces[j],s=plan[j];
      if(!s||xh<=s[0]+0.004){m.visible=false;continue;}
      var b=Math.min(s[1],xh);m.visible=true;m.scale.x=b-s[0];m.position.x=(s[0]+b)/2;
    }
  }
  /* ---- in front, dashed: the work the task needed ---- */
  var GZ=1.3,GD=0.45,ghost=[];
  (function(){
    var n=steps(NEEDED),L=(NEEDED*DAY-GAP*(n+1))/n,y0=PY,y1=PY+PH,a=GD/2,s=[];
    for(var j=0;j<n;j++){var x0=DX(0)+GAP+j*(L+GAP),x1=x0+L;
      s.push([x0,y1,GZ-a,x1,y1,GZ-a],[x1,y1,GZ-a,x1,y1,GZ+a],[x1,y1,GZ+a,x0,y1,GZ+a],[x0,y1,GZ+a,x0,y1,GZ-a],
        [x0,y0,GZ+a,x1,y0,GZ+a],[x0,y0,GZ+a,x0,y1,GZ+a],[x1,y0,GZ+a,x1,y1,GZ+a],[x1,y0,GZ-a,x1,y1,GZ-a],[x1,y0,GZ-a,x1,y0,GZ+a]);}
    g.add(K.lines(s,{color:pal.ink,dash:[4,3]}));
  })();
  var needT=K.plate('',{size:0.17,weight:600,color:pal.ink});needT.rotation.x=-Math.PI/2;g.add(needT);
  var dayP=K.plate('',{size:0.19,weight:700,color:pal.ink});g.add(dayP);

  /* ---- the stylus works along the top of the task ---- */
  var LEN=1.3,rod=K.solid(0.08,LEN,0.08,{tone:TONE.dark,edge:pal.midnight});rod.rotation.z=-0.25;g.add(rod);
  var TOP=PY+0.05+PH;
  function setTip(x,y){rod.position.set(x+Math.sin(0.25)*LEN/2,y+Math.cos(0.25)*LEN/2,TZ+0.1);}

  /* ---- states: the box takes its size, the stylus works, and the result stands ---- */
  var T=TMIN,auto=true,AUTO=[2,4,7,10],ai=0,phase='resize',pt=0,from=TMIN,to=TMIN,rdur=1,day=0,shown=-1,tipX=DX(0),tipFrom=DX(0);
  function goTo(v,dur){from=len||v;to=v;T=v;phase='resize';pt=0;rdur=dur;plan=layout(T);drawTask(-1e9);day=0;shown=-1;tipFrom=tipX;texts();}
  function update(dt){
    pt+=dt;
    if(phase==='resize'){
      var u=K.ease(Math.min(1,pt/rdur));setBox(from+(to-from)*u);
      tipX=tipFrom+(DX(0)-tipFrom)*u;setTip(tipX,TOP+0.35*Math.sin(Math.PI*u));
      if(u>=1){phase='run';pt=0;}
    }else if(phase==='run'){
      day=Math.min(T,pt/SEC);tipX=DX(day);drawTask(tipX);
      /* the tip rides on the step it works on, and lifts a little over the gap to the next */
      var y=TOP,inGap=true;for(var j=0;j<plan.length;j++)if(tipX>=plan[j][0]&&tipX<=plan[j][1]){inGap=false;break;}
      setTip(tipX,inGap?TOP+0.06:TOP);
      var d10=Math.floor(day*2)/2;if(d10!==shown){shown=d10;dayText();}
      if(day>=T){phase='hold';pt=0;dayText();if(api&&api.onUi)api.onUi();}
    }else if(phase==='hold'){
      setTip(DX(T),TOP+Math.min(0.35,pt*0.8));
      if(pt>=2.8){if(auto){ai=(ai+1)%AUTO.length;goTo(AUTO[ai],1.1);}else goTo(T,0.5);if(api&&api.onUi)api.onUi();}
    }
  }
  function dayText(){
    var dd=phase==='hold'?T:Math.min(T,day);
    dayP.setText(tr({da:'Dag '+num(dd,dd%1?1:0)+' af '+T,en:'Day '+num(dd,dd%1?1:0)+' of '+T}));
    dayP.position.set(PX1-0.3-dayP.w/2,PY/2,PZ1+0.002);
  }
  function texts(){
    boxT.setText(tr({da:'Tidsramme: '+T+' dage',en:'Time frame: '+T+' days'}));boxT.position.set(PX0+0.3+boxT.w/2,PY/2,PZ1+0.002);
    needT.setText(tr({da:'Det arbejde, opgaven krævede: 2 dage',en:'The work the task needed: 2 days'}));needT.position.set(DX(NEEDED)+0.3+needT.w/2,PY+0.003,GZ+0.02);
    rulT.setText(tr({da:'dage',en:'days'}));rulT.position.set(DX(TMAX)+0.3+rulT.w/2,PY+0.003,RZ+0.27);
    dayText();
  }
  setBox(T);plan=layout(T);setTip(DX(0),TOP+0.3);texts();phase='run';pt=0;
  var api={group:g,onUi:null,
    box:function(){return [[-4.8,0,-1.0],[3.1,2.4,2.65]];},
    update:update,
    relabel:texts,
    ui:{
      label:function(){return tr({da:'Tidsramme',en:'Time frame'});},
      ends:function(){return tr({da:['2 dage','10 dage'],en:['2 days','10 days']});},
      min:TMIN,max:TMAX,step:1,
      value:function(){return T;},
      set:function(v){auto=false;v=Math.round(v);if(v===T&&phase!=='hold')return;goTo(v,0.45);if(api.onUi)api.onUi();},
      readout:function(){
        return tr({da:'Tidsramme '+T+' dage · opgaven fylder '+T+' dage i '+steps(T)+' trin · krævet arbejde 2 dage',en:'Time frame '+T+' days · the task fills '+T+' days in '+steps(T)+' steps · work needed 2 days'});},
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;if(auto&&phase==='hold')pt=0;}
    }
  };
  return api;
};
})();

<script>/* m_peakend.js */
/* m_peakend.js — the peak-end rule as a lived timeline and a remembered one.
   Modelled on the cold-water experiment (Kahneman, Fredrickson, Schreiber & Redelmeier 1993): one trial ends abruptly,
   the other goes on with a milder stretch. Each column is five seconds of discomfort (a schematic 0–10 scale).
   While the trial is lived, the tank on the right fills with all of it. Afterwards memory takes two columns, the worst and the last,
   and the remembered discomfort is their mean. A longer trial can hold more discomfort and still be remembered as less. */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models['peak-end']=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr,num=TB.num;
  var g=new THREE.Group();
  var X0=-5.0,LEN=6.1,BIN=LEN/18,BW=BIN*0.8,BZ=0.35,BY=0.14,HS=0.3;
  g.add(K.solid(LEN+0.2,BY,1.2,{x:X0+LEN/2,y:BY/2,z:BZ}));
  /* the discomfort of each five seconds */
  function profile(mild){
    var v=[],k;for(k=0;k<12;k++)v.push(5.5+3*Math.sqrt(k/11));
    for(k=0;k<mild/5;k++)v.push(8.0-0.4*k);
    return v;
  }
  function sum(v){return v.reduce(function(a,b){return a+b;},0);}
  function memOf(v){return (Math.max.apply(null,v)+v[v.length-1])/2;}
  var BASE=sum(profile(0)),TMAX=sum(profile(30));
  var bars=[];
  for(var i=0;i<18;i++){var b=K.solid(BW,1,0.5,{tone:TONE.paper,edge:pal.slate,x:X0+BIN*(i+0.5),z:BZ});b.visible=false;g.add(b);bars.push({m:b,h:0,to:0,sel:false});}
  function setBar(i,h){var b=bars[i];b.h=h;b.m.visible=h>0.005;b.m.scale.y=Math.max(0.001,h);b.m.position.y=BY+h/2;}

  /* time along the floor */
  var tl=[];
  function tick(sec){var x=X0+LEN*sec/90;tl.push([x,0.004,BZ+0.62,x,0.004,BZ+0.78]);}
  [0,30,60,90].forEach(tick);g.add(K.lines(tl,{color:pal.slate}));
  [0,30,60,90].forEach(function(sec){var p=K.plate(sec+' s',{size:0.22,weight:400,color:pal.slate});p.rotation.x=-Math.PI/2;p.position.set(X0+LEN*sec/90,0.006,BZ+0.98);g.add(p);});
  var cond=K.plate('',{size:0.22,weight:600,color:pal.ink});cond.rotation.x=-Math.PI/2;g.add(cond);
  /* now: the moment being lived */
  var now=K.solid(0.05,3.0,0.05,{tone:TONE.dark,edge:pal.midnight,y:1.5+BY,z:BZ+0.5});g.add(now);now.visible=false;
  var tagP=K.plate('',{size:0.2,weight:700,color:pal.signalShadow}),tagE=K.plate('',{size:0.2,weight:700,color:pal.signalShadow});
  [tagP,tagE].forEach(function(t){t.visible=false;g.add(t);});

  /* the two gauges: everything that was lived, and what is remembered */
  var TX=2.5,MX=4.3,GZ=0.35,TH=3.0,PH=0.36;
  [TX,MX].forEach(function(x){g.add(K.solid(1.3,PH,1.3,{x:x,y:PH/2,z:GZ}));});
  var tank=K.lines(K.boxEdges(1.0,TH,1.0),{color:pal.slate});tank.position.set(TX,PH+TH/2,GZ);g.add(tank);
  var fill=K.solid(0.98,1,0.98,{tone:TONE.paper,edge:pal.slate,x:TX,z:GZ});g.add(fill);
  var memBar=K.solid(0.62,1,0.62,{tone:TONE.signal,edge:pal.signalShadow,x:MX,z:GZ});g.add(memBar);memBar.visible=false;
  var ghostT=K.lines([],{color:pal.ink,dash:[4,3]});g.add(ghostT);
  var ghostM=K.lines([],{color:pal.ink,dash:[4,3]});g.add(ghostM);
  var valT=K.plate('',{size:0.2,weight:700,color:pal.ink}),valM=K.plate('',{size:0.2,weight:700,color:pal.ink});
  valT.position.set(TX,PH/2,GZ+0.651);valM.position.set(MX,PH/2,GZ+0.651);g.add(valT);g.add(valM);
  var labT=K.plate('',{size:0.22,weight:600,color:pal.ink,align:'center'}),labM=K.plate('',{size:0.22,weight:600,color:pal.ink,align:'center'});
  [labT,labM].forEach(function(p,j){p.rotation.x=-Math.PI/2;g.add(p);});
  var fly=[0,1].map(function(){var c=K.solid(0.3,0.3,0.3,{tone:TONE.signal,edge:pal.signalShadow});c.visible=false;g.add(c);return c;});
  function setFill(v){var h=Math.max(0.001,TH*v/TMAX);fill.scale.y=h;fill.position.y=PH+h/2;fill.visible=v>0.01;}
  function setMem(m){var h=Math.max(0.001,m*HS);memBar.scale.y=h;memBar.position.y=PH+h/2;memBar.visible=m>0.01;}
  function ring(x,y,w){var a=w/2+0.08,z=GZ;return [[x-a,y,z-a,x+a,y,z-a],[x+a,y,z-a,x+a,y,z+a],[x+a,y,z+a,x-a,y,z+a],[x-a,y,z+a,x-a,y,z-a]];}

  /* ---- the cycle: live it, pick the peak and the end, remember, hold, and run the other trial ---- */
  var mild=0,auto=true,phase='live',pt=0,prof=profile(0),shown=0,memNow=0,lastMem=null;
  function texts(){
    cond.setText(tr({da:'Forsøg: 60 s koldt',en:'Trial: 60 s cold'})+(mild?tr({da:' + '+mild+' s mildere',en:' + '+mild+' s milder'}):''));
    cond.position.set(X0+0.05+cond.w/2,0.006,BZ+1.55);
    labT.setText(tr({da:['Samlet','ubehag'],en:['Total','discomfort']}));labM.setText(tr({da:['Husket','ubehag'],en:['Remembered','discomfort']}));
    labT.position.set(TX,0.006,GZ+0.9+labT.h/2);labM.position.set(MX,0.006,GZ+0.9+labM.h/2);
    valT.setText(Math.round(100*shownSum()/BASE)+' %');
    valM.setText(lastMem===null?'–':num(lastMem,1)+' / 10');
    ghosts();
  }
  function shownSum(){var s=0;for(var i=0;i<prof.length;i++)s+=prof[i]*Math.min(1,bars[i].h/(prof[i]*HS)||0);return s;}
  /* dashed: the other trial, so the two can be compared */
  function ghosts(){
    var other=mild?0:30,po=profile(other);
    ghostT.set(ring(TX,PH+TH*sum(po)/TMAX,1.0));
    var h=memOf(po)*HS,a=0.4,z=GZ,x=MX,y0=PH,y1=PH+h;
    ghostM.set([[x-a,y1,z-a,x+a,y1,z-a],[x+a,y1,z-a,x+a,y1,z+a],[x+a,y1,z+a,x-a,y1,z+a],[x-a,y1,z+a,x-a,y1,z-a],
      [x-a,y0,z+a,x-a,y1,z+a],[x+a,y0,z+a,x+a,y1,z+a],[x+a,y0,z-a,x+a,y1,z-a]]);
  }
  function peakIdx(){var m=-1,j=0;for(var i=0;i<prof.length;i++)if(prof[i]>m){m=prof[i];j=i;}return j;}
  function select(on){
    var p=peakIdx(),e=prof.length-1;
    bars.forEach(function(b,i){var s=on&&(i===p||i===e);if(s!==b.sel){b.sel=s;b.m.setTone(s?TONE.signal:TONE.paper);b.m.setEdge(s?pal.signalShadow:pal.slate);}});
    tagP.visible=tagE.visible=on;
    if(on){
      var xp=X0+BIN*(p+0.5),xe=X0+BIN*(e+0.5);
      tagE.setText(tr({da:'Slut',en:'End'}));
      if(p===e){tagP.setText(tr({da:'Top og slut',en:'Peak and end'}));tagE.visible=false;}else tagP.setText(tr({da:'Top',en:'Peak'}));
      /* each tag stands on its column */
      tagP.position.set(xp,BY+prof[p]*HS+0.62,BZ);tagE.position.set(xe,BY+prof[e]*HS+0.62,BZ);
    }
  }
  function start(){
    prof=profile(mild);phase='live';pt=0;shown=0;select(false);
    for(var i=0;i<18;i++)setBar(i,0);setFill(0);now.visible=true;fly.forEach(function(f){f.visible=false;});texts();
  }
  var LIVE=0.42;
  function update(dt){
    pt+=dt;var i,n=prof.length;
    if(phase==='live'){
      var T=n*LIVE,k=Math.min(1,pt/T);now.position.x=X0+LEN*(k*n*5)/90;
      for(i=0;i<n;i++){var r=Math.min(1,Math.max(0,(pt-i*LIVE)/0.3));setBar(i,prof[i]*HS*K.ease(r));}
      setFill(shownSum());valT.setText(Math.round(100*shownSum()/BASE)+' %');
      if(pt>=T+0.3){phase='pick';pt=0;now.visible=false;select(true);}
    }else if(phase==='pick'){
      if(pt>=0.9){phase='remember';pt=0;var p=peakIdx(),e=n-1;
        [p,e].forEach(function(j,q){var f=fly[q];f.visible=true;f.position.set(X0+BIN*(j+0.5),BY+prof[j]*HS+0.2,BZ);f.from=f.position.clone();f.val=prof[j];});
        memNow=0;}
    }else if(phase==='remember'){
      var u=Math.min(1,pt/1.3),m=memOf(prof);
      fly.forEach(function(f){var to=new THREE.Vector3(MX,PH+m*HS+0.2,GZ),e=K.ease(u),pos=f.from.clone().lerp(to,e);pos.y+=Math.sin(Math.PI*e)*1.0;f.position.copy(pos);});
      if(u>=1){fly.forEach(function(f){f.visible=false;});phase='settle';pt=0;}
    }else if(phase==='settle'){
      var mm=memOf(prof),u2=Math.min(1,pt/0.45);setMem((lastMem===null?mm:lastMem)+(mm-(lastMem===null?mm:lastMem))*K.ease(u2));
      if(u2>=1){lastMem=mm;texts();phase='hold';pt=0;if(api&&api.onUi)api.onUi();}
    }else if(phase==='hold'){
      if(pt>=4.2){phase='reset';pt=0;select(false);}
    }else if(phase==='reset'){
      var u3=Math.min(1,pt/0.6);for(i=0;i<n;i++)setBar(i,prof[i]*HS*(1-K.ease(u3)));setFill(shownSum());
      if(u3>=1){if(auto)mild=mild?0:30;start();if(api&&api.onUi)api.onUi();}
    }
  }
  function jump(){
    /* a change by hand: show the whole trial at once, then remember it */
    prof=profile(mild);select(false);
    for(var i=0;i<18;i++)setBar(i,i<prof.length?prof[i]*HS:0);setFill(sum(prof));now.visible=false;fly.forEach(function(f){f.visible=false;});
    texts();phase='pick';pt=0.4;select(true);
  }
  start();
  var api={group:g,onUi:null,
    box:function(){return [[-5.5,0,-0.6],[5.1,3.4,2.0]];},
    update:update,
    relabel:function(){texts();if(phase!=='live')select(phase==='pick'||phase==='remember'||phase==='settle'||phase==='hold');},
    ui:{
      label:function(){return tr({da:'Mildere afslutning',en:'Milder ending'});},
      ends:function(){return tr({da:['Ingen','30 s'],en:['None','30 s']});},
      min:0,max:30,step:5,
      value:function(){return mild;},
      set:function(v){auto=false;v=Math.round(v/5)*5;if(v===mild&&phase!=='live')return;mild=v;jump();},
      readout:function(){
        return tr({da:'Samlet ubehag ',en:'Total discomfort '})+Math.round(100*sum(profile(mild))/BASE)+tr({da:' % af det korte forsøg · husket ',en:' % of the short trial · remembered '})+num(memOf(profile(mild)),1)+' / 10';},
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;}
    }
  };
  return api;
};
})();

</script>
<script>/* m_postel.js */
/* m_postel.js — Postel's law as a date reader: liberal in what it accepts, conservative in what it sends.
   Dates people have typed lie in a stack on the left. One at a time each goes into the machine; the plate on top shows how the machine
   understood it (the echo), and the machine sends the date on in one format only, ISO 8601 (2026-10-31).
   The handle sets how tolerant the input is. Strict: only ISO 8601 gets through, and dates people actually write are rejected.
   Tolerant: every unambiguous form is read, and for 03/04/2026 the machine asks. Very tolerant: it guesses, here month first,
   as many parsers do, and the writer, who meant 3 April, gets 4 March. The dates and the rules are the model's. */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models.postel=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr;
  var g=new THREE.Group();
  var MON={da:['januar','februar','marts','april','maj','juni','juli','august','september','oktober','november','december'],
           en:['January','February','March','April','May','June','July','August','September','October','November','December']};
  function long(d){var m=MON[TB.lang]||MON.da;return TB.lang==='en'?(+d[2])+' '+m[d[1]-1]+' '+d[0]:(+d[2])+'. '+m[d[1]-1]+' '+d[0];}
  function iso(d){return d[0]+'-'+('0'+d[1]).slice(-2)+'-'+('0'+d[2]).slice(-2);}
  /* what people type; `lv` is the lowest tolerance that reads it; the third one can be read two ways */
  var IN=[
    {t:'24.11.2026',d:[2026,11,24],lv:1},
    {t:'2026-10-31',d:[2026,10,31],lv:0},
    {t:'03/04/2026',d:[2026,4,3],alt:[2026,3,4],lv:1,amb:true},
    {t:{da:'7. jan. 2027',en:'7 Jan 2027'},d:[2027,1,7],lv:1},
    {t:'24/12/2026',d:[2026,12,24],lv:1}
  ];
  var BW=1.6,BH=0.42,BD=0.8,PH=0.4;

  /* ---- the places: what people type, the reader, what is sent, and the rejects ---- */
  var IX=-3.75,IZ=-0.55,MX=-0.95,MZ=-0.55,MW=2.7,MHt=1.3,MD=1.3,OX=1.95,OZ=-0.55,RX=-2.9,RZ=2.0;
  g.add(K.solid(BW+0.2,PH,BD+0.25,{x:IX,y:PH/2,z:IZ}));
  g.add(K.solid(BW+0.2,PH,BD+0.25,{x:OX,y:PH/2,z:OZ}));
  g.add(K.solid(2*BW+0.35,0.1,1.1,{x:RX,y:0.05,z:RZ}));
  var tIn=K.plate('',{size:0.17,weight:600,color:pal.ink}),tOut=K.plate('',{size:0.17,weight:600,color:pal.ink});
  tIn.position.set(IX,PH/2,IZ+(BD+0.25)/2+0.002);tOut.position.set(OX,PH/2,OZ+(BD+0.25)/2+0.002);g.add(tIn);g.add(tOut);
  var tRej=K.plate('',{size:0.18,weight:600,color:pal.ink}),tSent=K.plate('',{size:0.18,weight:600,color:pal.ink});
  tRej.rotation.x=tSent.rotation.x=-Math.PI/2;g.add(tRej);g.add(tSent);
  g.add(K.solid(MW,MHt,MD,{x:MX,y:MHt/2,z:MZ}));
  var rule=K.plate('',{size:0.2,weight:600,color:pal.ink,align:'center',lead:1.4});rule.position.set(MX,MHt/2+0.17,MZ+MD/2+0.002);g.add(rule);
  /* the reject slot: low on the front, under the text; rejected dates come out here */
  var SLX=MX-0.5,SLW=BW+0.08,SLH=BH+0.06,SLZ=MZ+MD/2+0.003;
  g.add(K.lines([[SLX-SLW/2,0.01,SLZ,SLX+SLW/2,0.01,SLZ],[SLX+SLW/2,0.01,SLZ,SLX+SLW/2,SLH,SLZ],[SLX+SLW/2,SLH,SLZ,SLX-SLW/2,SLH,SLZ],[SLX-SLW/2,SLH,SLZ,SLX-SLW/2,0.01,SLZ]],{color:pal.ink}));
  /* the out slot: on top, at the front; the ISO date rises out of it */
  var OSX=MX+MW/2-BW/2-0.12,OSZ=MZ+0.2,OSW=BW+0.06,OSD=BD+0.05;
  g.add(K.lines([[OSX-OSW/2,MHt+0.003,OSZ-OSD/2,OSX+OSW/2,MHt+0.003,OSZ-OSD/2],[OSX+OSW/2,MHt+0.003,OSZ-OSD/2,OSX+OSW/2,MHt+0.003,OSZ+OSD/2],[OSX+OSW/2,MHt+0.003,OSZ+OSD/2,OSX-OSW/2,MHt+0.003,OSZ+OSD/2],[OSX-OSW/2,MHt+0.003,OSZ+OSD/2,OSX-OSW/2,MHt+0.003,OSZ-OSD/2]],{color:pal.ink}));
  /* the echo: a plate on the machine that shows how it understood the input */
  var EH=1.15,EW=MW-0.2,EZ=MZ-0.35;
  g.add(K.solid(EW,EH,0.1,{tone:TONE.white,x:MX,y:MHt+EH/2,z:EZ}));
  var echo=K.plate('',{size:0.2,weight:600,color:pal.ink,align:'center',lead:1.3});echo.position.set(MX,MHt+EH/2,EZ+0.052);g.add(echo);
  /* two keys the machine puts out when it asks */
  var keys=[0,1].map(function(i){
    var k=K.solid(1.27,0.08,0.5,{tone:TONE.white,x:MX+(i?0.66:-0.66),y:MHt+0.04,z:MZ+0.33});k.visible=false;g.add(k);
    var p=K.plate('',{size:0.185,weight:700,color:pal.ink});p.rotation.x=-Math.PI/2;p.position.set(k.position.x,MHt+0.083,k.position.z);p.visible=false;g.add(p);
    return {k:k,p:p};
  });

  /* ---- the blocks ---- */
  function block(){var m=K.solid(BW,BH,BD,{tone:TONE.white});var p=K.plate('',{size:0.2,weight:600,color:pal.ink});p.position.z=BD/2+0.002;m.add(p);m.t=p;m.visible=false;g.add(m);return m;}
  var inB=IN.map(block),outB=IN.map(block);
  var ghost=K.lines(K.boxEdges(BW,BH,BD),{color:pal.ink,dash:[4,3]});ghost.visible=false;g.add(ghost);
  var ghostT=K.plate('',{size:0.2,weight:600,color:pal.slate});ghost.add(ghostT);ghostT.position.z=BD/2+0.002;
  function inY(i){return PH+BH/2+i*BH;}

  /* ---- the stylus: the user, who answers when asked ---- */
  var PL=1.1,pen=K.solid(0.08,PL,0.08,{tone:TONE.dark,edge:pal.midnight});g.add(pen);
  var REST=[MX+MW/2+0.3,MHt-0.1,MZ+0.75];
  function setPen(p){pen.position.set(p[0],p[1]+PL/2,p[2]);}

  /* ---- the run: each date in turn ---- */
  var lv=1,auto=true,AUTO=[0,1,2],ai=1,phase='fill',pt=0,cur=0,step=null,nOut=0,nRej=0,nWrong=0,res=[];
  function outcome(it){
    if(lv<it.lv)return 'reject';
    if(it.amb)return lv===1?'ask':'guess';
    return 'ok';
  }
  function echoText(kind,it){
    if(kind==='reading')return [{t:tr({da:'Læser …',en:'Reading …'}),c:pal.slate,s:0.17},' '];
    if(kind==='reject')return [{t:tr({da:'Ukendt format: afvist',en:'Unknown format: rejected'}),c:pal.slate,s:0.17},tr({da:'Skriv ÅÅÅÅ-MM-DD',en:'Write YYYY-MM-DD'})];
    if(kind==='ask')return [{t:tr({da:'To mulige læsninger',en:'Two possible readings'}),c:pal.slate,s:0.17},tr({da:'Hvilken mener du?',en:'Which do you mean?'})];
    if(kind==='guess')return [{t:tr({da:'Gættet (måned først)',en:'Guessed (month first)'}),c:pal.slate,s:0.17},{t:long(it.alt),c:pal.signal},{t:tr({da:'ikke valgt: ',en:'not picked: '})+long(it.d),c:pal.slate,s:0.17,w:400}];
    return [{t:tr({da:'Forstået som',en:'Understood as'}),c:pal.slate,s:0.17},long(it.d)];
  }
  var lastEcho=null;
  var echoNow=[null,null];
  function setEcho(kind,it){echoNow=[kind,it];var key=kind+'|'+(it?IN.indexOf(it):'')+'|'+TB.lang;if(key===lastEcho)return;lastEcho=key;echo.setText(kind?echoText(kind,it):[' ']);}
  function counts(){
    tSent.setText(tr({da:'Sendt: '+nOut+(nWrong?' · heraf forkert: '+nWrong:''),en:'Sent: '+nOut+(nWrong?' · of which wrong: '+nWrong:'')}));
    tSent.position.set(OX-(BW+0.2)/2+tSent.w/2,0.006,OZ+(BD+0.25)/2+0.25);
    tRej.setText(tr({da:'Afvist: '+nRej,en:'Rejected: '+nRej}));
    tRej.position.set(RX-(2*BW+0.35)/2+tRej.w/2,0.006,RZ+0.55+0.22);
  }
  function fill(){
    /* the stack of what people typed, rebuilt from the top */
    cur=0;nOut=0;nRej=0;nWrong=0;res=[];
    inB.forEach(function(b,i){b.visible=true;b.position.set(IX,inY(i)+3,IZ);b.setTone(TONE.white);});
    outB.forEach(function(b){b.visible=false;});ghost.visible=false;keys.forEach(function(k){k.k.visible=k.p.visible=false;});
    setEcho(null);counts();setPen(REST);
  }
  function arc(m,a,b,u,h){var e=K.ease(u);m.position.set(a[0]+(b[0]-a[0])*e,a[1]+(b[1]-a[1])*e+Math.sin(Math.PI*e)*(h||0),a[2]+(b[2]-a[2])*e);}
  function newStep(){
    var it=IN[cur],b=inB[cur];
    step={it:it,b:b,k:outcome(it),t:0,from:[b.position.x,b.position.y,b.position.z],o:outB[cur]};
    var T=[0.9,0.5];                                    /* slide in, read */
    if(step.k==='reject')T.push(1.2);                   /* back out and onto the reject tray */
    else{if(step.k==='ask')T.push(2.2);T.push(1.2);}    /* (the user answers,) the ISO date goes out */
    step.T=T;
  }
  function runStep(dt){
    var s=step,i,acc=0,ph=0;s.t+=dt;
    for(i=0;i<s.T.length;i++){if(s.t<acc+s.T[i]){ph=i;break;}acc+=s.T[i];ph=i+1;}
    var u=ph<s.T.length?(s.t-acc)/s.T[ph]:1,b=s.b,it=s.it,k=s.k;
    /* the rest of the stack settles */
    /* the rest of the stack settles only once the date that left has cleared it */
    for(i=cur+1;i<IN.length;i++){var y=inY(i-cur-1)+BH*(1-K.ease(Math.min(1,Math.max(0,(s.t-0.55)/0.35))));inB[i].position.y=y;}
    if(ph===0){arc(b,s.from,[MX,PH+BH/2,MZ],u,0);if(u>0.7)setEcho('reading',it);}
    else if(ph===1){b.visible=false;setEcho(k==='ask'?'ask':k==='guess'?'guess':k==='reject'?'reject':'ok',it);
      if(k==='ask')keys.forEach(function(q,j){q.k.visible=q.p.visible=true;q.k.setTone(TONE.white);q.k.setEdge(pal.borderStrong);q.p.setText(long(j?it.alt:it.d));});}
    else if(k==='reject'&&ph===2){
      b.visible=true;
      var slot=[RX+(nRej%2?1:-1)*(BW/2+0.06),0.1+BH/2+Math.floor(nRej/2)*BH,RZ];
      /* a rejected date comes out through the slot, then down onto the tray */
      var lo=BH/2+0.03,ej=[SLX,lo,MZ+MD/2+BD/2+0.08];if(u<0.4)arc(b,[SLX,lo,MZ],ej,u/0.4,0);else arc(b,ej,slot,(u-0.4)/0.6,0.4);
      if(!s.dim){s.dim=true;b.setTone(TONE.paper);}
    }else if(k==='ask'&&ph===2){
      /* the user answers: the stylus presses the reading that was meant */
      var key=keys[0],kp=[key.k.position.x,MHt+0.085,key.k.position.z],hv=[kp[0],kp[1]+0.5,kp[2]];
      if(u<0.35)arc(pen,[REST[0],REST[1]+PL/2,REST[2]],[hv[0],hv[1]+PL/2,hv[2]],u/0.35,0);
      else if(u<0.5)arc(pen,[hv[0],hv[1]+PL/2,hv[2]],[kp[0],kp[1]+PL/2,kp[2]],(u-0.35)/0.15,0);
      else if(u<0.62){if(!s.pressed){s.pressed=true;key.k.setTone(TONE.signal);key.k.setEdge(pal.signalShadow);setEcho('ok',it);}}
      else arc(pen,[kp[0],kp[1]+PL/2,kp[2]],[REST[0],REST[1]+PL/2,REST[2]],(u-0.62)/0.38,0.2);
    }else if(ph>=2&&k!=='reject'){
      if(k==='ask')keys.forEach(function(q){q.k.visible=q.p.visible=false;});
      var o=s.o,lvl=nOut,dst=[OX,PH+BH/2+lvl*BH,OZ];
      if(!s.shown){s.shown=true;o.visible=true;var wrong=k==='guess',d=wrong?it.alt:it.d;
        /* wrong is struck through, within the text itself, so it stays on its block */
        o.t.setText(iso(d),{draw:wrong?function(c,W,H){c.lineWidth=0.022;c.strokeStyle='#1c1e29';c.beginPath();c.moveTo(0,H*0.52);c.lineTo(W,H*0.52);c.stroke();}:null,padX:0});
        o.wrong=wrong;}
      /* straight up out of the slot, across above the stack, then straight down onto it:
         it never passes through the machine's plate or the dates already sent */
      var hy=Math.max(MHt+BH/2+0.06,dst[1]+0.3),a0=[OSX,MHt-BH/2-0.02,OSZ],a1=[OSX,hy,OSZ],a2=[dst[0],hy,dst[2]],uu=Math.min(1,u);
      if(uu<0.35)arc(o,a0,a1,uu/0.35,0);else if(uu<0.72)arc(o,a1,a2,(uu-0.35)/0.37,0);else arc(o,a2,dst,(uu-0.72)/0.28,0);
      if(u>=1&&!s.counted&&o.wrong){ghost.visible=true;ghost.position.set(OX+BW+0.15,dst[1],OZ);ghostT.setText(iso(it.d));}
    }
    if(ph>=s.T.length){
      if(!s.counted){s.counted=true;if(k==='reject')nRej++;else{nOut++;if(k==='guess')nWrong++;}counts();res.push(k);}
      return true;
    }
    return false;
  }

  function texts(){
    tIn.setText(tr({da:'Det, folk skriver',en:'What people type'}));
    tOut.setText(tr({da:'Det, der sendes',en:'What is sent'}));
    rule.setText([tr({da:'Indgang: ',en:'Input: '})+tr([{da:'streng',en:'strict'},{da:'tolerant',en:'tolerant'},{da:'meget tolerant',en:'very tolerant'}][lv]),
      tr({da:'Udgang: ÅÅÅÅ-MM-DD',en:'Output: YYYY-MM-DD'})]);
    inB.forEach(function(b,i){b.t.setText(tr(IN[i].t));});
    counts();lastEcho=null;
    setEcho(echoNow[0],echoNow[1]);
    if(ghost.visible)ghostT.setText(iso(IN[2].d));
    keys.forEach(function(q,j){if(q.p.visible)q.p.setText(long(j?IN[2].alt:IN[2].d));});
  }
  function setLv(v){
    v=Math.max(0,Math.min(2,Math.round(v)));lv=v;texts();phase='fill';pt=0;step=null;fill();
    if(api&&api.onUi)api.onUi();
  }
  function plan(l){var r={out:0,rej:0,wrong:0};IN.forEach(function(it){if(l<it.lv)r.rej++;else{r.out++;if(it.amb&&l===2)r.wrong++;}});return r;}

  fill();texts();
  var api={group:g,onUi:null,
    box:function(){return [[-4.75,0,-1.3],[4.55,2.6,2.9]];},
    update:function(dt){
      pt+=dt;
      if(phase==='fill'){
        var u=Math.min(1,pt/0.8);inB.forEach(function(b,i){b.position.y=inY(i)+3*(1-K.ease(Math.min(1,Math.max(0,u*1.6-i*0.15))));});
        if(pt>=1.1){phase='run';pt=0;cur=0;newStep();}
      }else if(phase==='run'){
        if(runStep(dt)){cur++;if(cur>=IN.length){phase='hold';pt=0;if(api&&api.onUi)api.onUi();}else newStep();}
      }else if(phase==='hold'){
        if(pt>=3.0){if(auto){ai=(ai+1)%AUTO.length;setLv(AUTO[ai]);}else{phase='fill';pt=0;fill();}}
      }
    },
    relabel:texts,
    ui:{
      label:function(){return tr({da:'Hvor tolerant indgangen er',en:'How tolerant the input is'});},
      ends:function(){return tr({da:['Streng','Meget tolerant'],en:['Strict','Very tolerant']});},
      min:0,max:2,step:1,
      value:function(){return lv;},
      set:function(v){auto=false;setLv(v);},
      readout:function(){
        var r=plan(lv);
        return tr([{da:'Kun ISO 8601 · ',en:'ISO 8601 only · '},{da:'Entydige datoer, spørger ved tvivl · ',en:'Unambiguous dates, asks when unsure · '},{da:'Alt, gætter ved tvivl · ',en:'Anything, guesses when unsure · '}][lv])+
          tr({da:r.out+' sendt',en:r.out+' sent'})+(r.rej?tr({da:', '+r.rej+' afvist',en:', '+r.rej+' rejected'}):'')+(r.wrong?tr({da:', '+r.wrong+' forkert',en:', '+r.wrong+' wrong'}):'');
      },
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;if(auto)ai=lv;}
    }
  };
  return api;
};
})();

</script>
<script>/* m_praegnanz.js */
/* m_praegnanz.js — the law of Prägnanz as an exploded drawing.
   On a plinth lies a flat inlay that reads as a light square with a grey circle lying over one corner.
   It is made of five irregular pieces: two light ones and three grey ones, and none of them is a square or a circle.
   The handle pulls the pieces apart, each to its own level. While they lie together, the eye takes the simplest reading
   the picture allows (two whole figures, the hidden corner of the square included); the dashed outlines show it.
   When the layers part, that reading is gone and the pieces are seen for what they are.
   The switch is the model's simplification: the reading holds while the pieces lie together and is gone once they have parted. */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models.praegnanz=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr;
  var g=new THREE.Group();
  var PY=0.3,T=0.14,V2=THREE.Vector2;
  g.add(K.solid(5.0,PY,4.6,{x:0,y:PY/2,z:0.1}));
  var status=K.plate('',{size:0.2,weight:600,color:pal.ink,padX:0.42});status.position.set(0,PY/2,0.1+2.301);g.add(status);

  /* ---- the figures, in plan (u to the right, v away from the viewer) ---- */
  var OU=-0.3,OV=-0.35;
  var S={u0:-1.5+OU,u1:1.0+OU,v0:-1.3+OV,v1:1.2+OV},C={u:0.85+OU,v:0.75+OV,r:1.3};
  function P(u,v){return [u,v];}
  function onC(a){a=a*Math.PI/180;return P(C.u+C.r*Math.cos(a),C.v+C.r*Math.sin(a));}
  function arc(a0,a1){var n=Math.max(4,Math.ceil(Math.abs(a1-a0)/4)),out=[];for(var i=0;i<=n;i++)out.push(onC(a0+(a1-a0)*i/n));return out;}
  /* where the circle crosses the square's far edge and its right edge */
  var dv=S.v1-C.v,du=S.u1-C.u;
  var aP1=Math.atan2(dv,-Math.sqrt(C.r*C.r-dv*dv))*180/Math.PI,aP2=Math.atan2(-Math.sqrt(C.r*C.r-du*du),du)*180/Math.PI+360;
  var P1=onC(aP1),P2=onC(aP2),Q=P(S.u1,S.v1);
  /* the cuts that are not figure outlines: one through the light part, one through the grey part */
  var cutA=[P(-0.2+OU,S.v0),P(-0.45+OU,-0.6+OV),P(-0.95+OU,-0.25+OV),P(S.u0,0.15+OV)];
  var cutC=[Q,P(1.45+OU,1.05+OV),onC(30)];
  function rev(a){return a.slice().reverse();}
  /* each piece: runs of its outline, tagged 'out' (outline of the whole), 'tone' (where light meets grey) or 'seam' (a cut inside one tone) */
  var PIECES=[
    {id:'A1',tone:TONE.region,edge:pal.mist,runs:[
      {t:'out',p:[P(S.u0,S.v0),cutA[0]]},{t:'seam',p:cutA},{t:'out',p:[cutA[3],P(S.u0,S.v0)]}],
      off:[-0.45,0.0,0.4]},
    {id:'A2',tone:TONE.region,edge:pal.mist,runs:[
      {t:'out',p:[cutA[0],P(S.u1,S.v0),P2]},{t:'tone',p:arc(aP2,aP1),arc:1},{t:'out',p:[P1,P(S.u0,S.v1),cutA[3]]},{t:'seam',p:rev(cutA)}],
      off:[-0.2,0.7,0.05]},
    {id:'B',tone:TONE.slate,edge:pal.dusk,runs:[
      {t:'seam',p:[P1,Q,P2]},{t:'tone',p:arc(aP2,aP1),arc:1}],
      off:[0.15,1.4,0.1]},
    {id:'C1',tone:TONE.slate,edge:pal.dusk,runs:[
      {t:'out',p:arc(aP1,30),arc:1},{t:'seam',p:rev(cutC)},{t:'seam',p:[Q,P1]}],
      off:[-0.05,2.05,-0.35]},
    {id:'C2',tone:TONE.slate,edge:pal.dusk,runs:[
      {t:'out',p:arc(30,aP2-360),arc:1},{t:'seam',p:[P2,Q]},{t:'seam',p:cutC}],
      off:[0.45,2.7,0.15]}
  ];
  function X(p,y){return [p[0],y,-p[1]];}
  /* a piece is built by hand: its top face, and an upright wall along every edge of its outline.
     The walls along cuts are their own mesh, so that they can stay hidden while the pieces lie together. */
  var MAT=new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
  function walls(segs,t,ccw){
    var pos=[],col=[],c=new THREE.Color();
    segs.forEach(function(e){
      var a=e[0],b=e[1],du=b[0]-a[0],dv=b[1]-a[1],nu=ccw?dv:-dv,nv=ccw?-du:du,nx=nu,nz=-nv;
      c.setHex(Math.abs(nz)>=Math.abs(nx)?t[1]:t[2]);
      [[a,0],[b,0],[b,T],[a,0],[b,T],[a,T]].forEach(function(q){pos.push(q[0][0],q[1],-q[0][1]);col.push(c.r,c.g,c.b);});
    });
    var geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
    return new THREE.Mesh(geo,MAT);
  }
  var pieces=PIECES.map(function(pc){
    var poly=[];
    pc.runs.forEach(function(r){r.p.forEach(function(p,i){if(i===0&&poly.length)return;poly.push(p);});});
    if(Math.abs(poly[0][0]-poly[poly.length-1][0])<1e-6&&Math.abs(poly[0][1]-poly[poly.length-1][1])<1e-6)poly.pop();
    var area=0,i,j;for(i=0;i<poly.length;i++){var a=poly[i],b=poly[(i+1)%poly.length];area+=a[0]*b[1]-b[0]*a[1];}
    var cap=new THREE.ShapeGeometry(new THREE.Shape(poly.map(function(p){return new V2(p[0],p[1]);})));
    cap.rotateX(-Math.PI/2);cap.translate(0,T,0);
    var cc=new Float32Array(cap.attributes.position.count*3),col=new THREE.Color().setHex(pc.tone[0]);
    for(i=0;i<cap.attributes.position.count;i++){cc[i*3]=col.r;cc[i*3+1]=col.g;cc[i*3+2]=col.b;}
    cap.setAttribute('color',new THREE.BufferAttribute(cc,3));
    var hold=new THREE.Group();hold.add(new THREE.Mesh(cap,MAT));
    /* lines: the outline at the top and the bottom, and the upright edges at corners. Cuts are drawn only once the pieces part. */
    var keep=[],seam=[],wk=[],ws=[];
    pc.runs.forEach(function(r,ri){
      var dst=r.t==='seam'?seam:keep,wd=r.t==='seam'?ws:wk;
      for(i=0;i<r.p.length-1;i++){var a=r.p[i],b=r.p[i+1];dst.push(X(a,T).concat(X(b,T)),X(a,0).concat(X(b,0)));wd.push([a,b]);}
      /* the corner where this run meets the next */
      var nx=pc.runs[(ri+1)%pc.runs.length],q=r.p[r.p.length-1];
      (r.t==='seam'||nx.t==='seam'?seam:keep).push(X(q,0).concat(X(q,T)));
      if(!r.arc)for(j=1;j<r.p.length-1;j++)dst.push(X(r.p[j],0).concat(X(r.p[j],T)));
    });
    hold.add(walls(wk,pc.tone,area>0));
    var sw=walls(ws,pc.tone,area>0);hold.add(sw);
    var lk=K.lines(keep,{color:pc.edge}),ls=K.lines(seam,{color:pc.edge});hold.add(lk);hold.add(ls);
    hold.position.y=PY;g.add(hold);
    return {pc:pc,hold:hold,seam:[ls,sw]};
  });

  /* the reading: a whole square and a whole circle, a hair outside their edges */
  var reading=K.lines([],{color:pal.ink,dash:[5,4],width:1.25});g.add(reading);
  (function(){
    var y=PY+T+0.006,o=0.09,s=[],u0=S.u0-o,u1=S.u1+o,v0=S.v0-o,v1=S.v1+o;
    s.push(X(P(u0,v0),y).concat(X(P(u1,v0),y)),X(P(u1,v0),y).concat(X(P(u1,v1),y)),X(P(u1,v1),y).concat(X(P(u0,v1),y)),X(P(u0,v1),y).concat(X(P(u0,v0),y)));
    for(var i=0;i<90;i++){var a=i*4*Math.PI/180,b=(i+1)*4*Math.PI/180,R=C.r+o;s.push(X(P(C.u+R*Math.cos(a),C.v+R*Math.sin(a)),y).concat(X(P(C.u+R*Math.cos(b),C.v+R*Math.sin(b)),y)));}
    reading.set(s);
  })();

  var sep=0,THR=0.05,state='',fade=1;
  function apply(){
    pieces.forEach(function(p){var o=p.pc.off;p.hold.position.set(o[0]*sep,PY+o[1]*sep,o[2]*sep);p.seam.forEach(function(m){m.visible=sep>0.004;});});
    var st=sep<THR?'whole':'pieces';
    if(st!==state){state=st;fade=0;paintStatus();if(api&&api.onUi)api.onUi();}
  }
  var STATUS={whole:{da:'Ses som: et kvadrat og en cirkel',en:'Seen as: a square and a circle'},
    pieces:{da:'Ses som: fem uregelmæssige stykker',en:'Seen as: five irregular pieces'}};
  function paintStatus(){
    var st=state;
    status.setText(tr(STATUS[st]));
  }

  /* auto: together, just parted, apart, just parted, and together again */
  var KEYS=[0,0.15,1,0.15],ki=0,hold=0,auto=true,from=sep,to=sep,mk=1,HOLD=3.6,MOVE=1.8;
  function goTo(v){from=sep;to=v;mk=0;}
  apply();
  var api={group:g,onUi:null,
    box:function(){return [[-2.6,0,-2.3],[2.6,PY+2.7*1+T+0.2,2.5]];},
    update:function(dt){
      if(mk<1){mk=Math.min(1,mk+dt/MOVE);sep=from+(to-from)*K.ease(mk);apply();}
      else if(auto){hold+=dt;if(hold>=HOLD){hold=0;ki=(ki+1)%KEYS.length;goTo(KEYS[ki]);}}
      if(fade<1)fade=Math.min(1,fade+dt/0.35);
      reading.visible=state==='whole'||fade<1;reading.setOpacity(state==='whole'?fade:1-fade);
    },
    relabel:paintStatus,
    ui:{
      label:function(){return tr({da:'Træk stykkerne fra hinanden',en:'Pull the pieces apart'});},
      ends:function(){return tr({da:['Samlet','Adskilt'],en:['Together','Apart']});},
      min:0,max:100,step:1,
      value:function(){return Math.round(sep*100);},
      set:function(v){auto=false;mk=1;sep=v/100;apply();},
      readout:function(){
        return (sep<0.005?tr({da:'Samlet',en:'Together'}):tr({da:'Adskilt ',en:'Apart '})+Math.round(sep*100)+' %')+' · '+
          (state==='whole'?tr({da:'ses som to hele figurer',en:'seen as two whole figures'}):tr({da:'ses som fem stykker',en:'seen as five pieces'}));
      },
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;hold=0;}
    }
  };
  return api;
};
})();

</script>
<script>/* m_proximity.js */
/* m_proximity.js — the law of proximity in a form.
   Four labels and four fields stand on a screen. Only the spacing changes: how far a label is from its own field,
   and how far from the field above. The dashed frames are the groups the spacing makes; the marks in the margin are the gaps.
   The grouping rule is the model's simplification: a gap that is clearly larger than the smallest gap (1.5 x) separates groups. */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models.proximity=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr;
  var g=new THREE.Group();
  var SX=0.2,SW=4.6,SH=5.4,SY0=0.42,SZ=-0.4,FZ=SZ+0.081;
  /* a low plinth and the screen standing on it */
  var plinth=K.solid(5.4,SY0,1.9,{x:SX,y:SY0/2,z:SZ+0.55});g.add(plinth);
  g.add(K.solid(SW,SH,0.16,{x:SX,y:SY0+SH/2,z:SZ}));
  var status=K.plate('',{size:0.2,weight:600,color:pal.ink,padX:0.42});status.position.set(SX,SY0/2,SZ+0.55+0.951);g.add(status);

  var HL=0.22,HF=0.38,G=0.6,FW=3.4,LX=SX-FW/2,FCX=SX-0.25,RX=FCX+FW/2;
  var labels=[],fields=[];
  for(var i=0;i<4;i++){
    var L=K.plate('',{size:HL,weight:600,color:pal.ink});g.add(L);labels.push(L);
    var F=K.solid(FW,HF,0.05,{tone:TONE.white,edge:pal.borderStrong,x:FCX,z:FZ+0.025});g.add(F);fields.push(F);
  }
  var NAMES={da:['Fornavn','Efternavn','E-mail','Telefon'],en:['First name','Last name','Email','Phone']};
  var gapL=K.lines([],{color:pal.slate});g.add(gapL);
  var frames=K.lines([],{color:pal.ink,dash:[5,4],width:1.25});g.add(frames);

  var s=0.12,sig='',fade=1,state='pairs';
  /* element boxes from the top: label, field, label, field ... */
  function layout(){
    var g1=0.05+0.5*s,g2=G-g1,total=4*(HL+HF)+4*g1+3*g2,y=SY0+SH/2+total/2,boxes=[];
    for(var i=0;i<4;i++){
      boxes.push({y0:y-HL,y1:y,x0:LX-0.02,x1:LX+labels[i].w,k:'L'});
      labels[i].position.set(LX+labels[i].w/2-0.25,y-HL/2,FZ+0.003);
      y-=HL+g1;
      boxes.push({y0:y-HF,y1:y,x0:FCX-FW/2,x1:FCX+FW/2,k:'F'});
      fields[i].position.y=y-HF/2;
      y-=HF+g2;
    }
    boxes.forEach(function(b){if(b.k==='L'){b.x0-=0.25;b.x1-=0.25;}});
    return {boxes:boxes,g1:g1,g2:g2};
  }
  function groupsOf(lay){
    var gaps=[],i,b=lay.boxes;for(i=0;i<b.length-1;i++)gaps.push(b[i].y0-b[i+1].y1);
    var mn=Math.min.apply(null,gaps),out=[[0]];
    for(i=0;i<gaps.length;i++){if(gaps[i]>mn*1.5)out.push([]);out[out.length-1].push(i+1);}
    return {groups:out,gaps:gaps};
  }
  function draw(dt){
    var lay=layout(),gr=groupsOf(lay),b=lay.boxes,i;
    /* the gaps, as dimension marks in the right margin */
    var mx=RX+0.3,t=0.07,seg=[];
    for(i=0;i<b.length-1;i++){var y0=b[i].y0,y1=b[i+1].y1;if(y0-y1<0.02)continue;seg.push([mx,y0,FZ,mx,y1,FZ],[mx-t,y0,FZ,mx+t,y0,FZ],[mx-t,y1,FZ,mx+t,y1,FZ]);}
    gapL.set(seg);
    /* the groups */
    var key=gr.groups.map(function(a){return a.join('');}).join('|');
    if(key!==sig){sig=key;fade=0;
      state=gr.groups.length===1?'block':(gr.groups[0].length===2?'pairs':'wrong');paintStatus();if(api&&api.onUi)api.onUi();}
    fade=Math.min(1,fade+dt/0.35);frames.setOpacity(fade);
    var P=0.12,fr=[];
    gr.groups.forEach(function(a){
      var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
      a.forEach(function(j){x0=Math.min(x0,b[j].x0);x1=Math.max(x1,b[j].x1);y0=Math.min(y0,b[j].y0);y1=Math.max(y1,b[j].y1);});
      x0=Math.min(x0,FCX-FW/2);x1=Math.max(x1,FCX+FW/2);
      x0-=P;x1+=P;y0-=P*0.8;y1+=P*0.8;var z=FZ+0.06;
      fr.push([x0,y0,z,x1,y0,z],[x1,y0,z,x1,y1,z],[x1,y1,z,x0,y1,z],[x0,y1,z,x0,y0,z]);
    });
    frames.set(fr);
    return lay;
  }
  var STATUS={pairs:{da:'Læses som fire par: label og felt',en:'Reads as four pairs: label and field'},
    block:{da:'Læses som én liste: parrene er utydelige',en:'Reads as one list: the pairs are unclear'},
    wrong:{da:'Læses forkert: labels hører til feltet over',en:'Misread: labels belong to the field above'}};
  /* right is the dark one with a filled mark; unclear is hollow; wrong is hollow and struck through */
  function paintStatus(){
    var st=state;
    status.setText(tr(STATUS[st]),{draw:function(c,W,H){
      var x=0.12,y=H/2-0.09,s=0.18;c.lineWidth=0.022;c.strokeStyle=c.fillStyle='#1c1e29';
      if(st==='pairs')c.fillRect(x,y,s,s);else{c.strokeRect(x+0.011,y+0.011,s-0.022,s-0.022);if(st==='wrong'){c.beginPath();c.moveTo(x,y+s);c.lineTo(x+s,y);c.stroke();}}
    }});
  }
  function relabel(){var n=NAMES[TB.lang]||NAMES.da;labels.forEach(function(L,i){L.setText(n[i]);});paintStatus();draw(0);}

  /* auto: right, even, wrong, even, right ... with a pause on each */
  var KEYS=[0.12,0.5,0.88,0.5],ki=0,hold=0,auto=true,from=s,to=s,mk=1,HOLD=3.6,MOVE=1.5;
  function goTo(v){from=s;to=v;mk=0;}
  relabel();
  var api={group:g,onUi:null,
    box:function(){return [[-2.6,0,-0.6],[3.1,SY0+SH,1.5]];},
    update:function(dt){
      if(mk<1){mk=Math.min(1,mk+dt/MOVE);s=from+(to-from)*K.ease(mk);}
      else if(auto){hold+=dt;if(hold>=HOLD){hold=0;ki=(ki+1)%KEYS.length;goTo(KEYS[ki]);}}
      draw(dt);
    },
    relabel:relabel,
    ui:{
      label:function(){return tr({da:'Labelens plads',en:'Where the label sits'});},
      ends:function(){return tr({da:['Tæt på sit felt','Tæt på feltet over'],en:['Close to its field','Close to the field above']});},
      min:0,max:100,step:1,
      value:function(){return Math.round(s*100);},
      set:function(v){auto=false;mk=1;s=v/100;},
      readout:function(){var l=layout(),px=function(u){return Math.round(u*40);};
        return tr({da:'Label til sit felt ',en:'Label to its field '})+px(l.g1)+' px · '+tr({da:'til feltet over ',en:'to the field above '})+px(l.g2)+' px';},
      state:function(){return state;},
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;hold=0;}
    }
  };
  return api;
};
})();

</script>
<script>/* m_selective-attention.js */
/* m_selective-attention.js — selective attention as a counting task on a belt.
   Blocks ride a belt from one hood to the other. The task is to count the cubes: the focus (Signal) takes one cube at a time
   and follows it to the counting line, where the counter goes up. The flat tiles are not counted.
   Now and then a tall, dark block passes. Attention either catches it (the focus leaves the task for a moment) or it goes by unseen.
   Each pass is marked on the board, in the row for how much there was to count.
   The handle sets how many of every six blocks are cubes to count. The chance of noticing is the model's: it falls as the task gets harder. */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models['selective-attention']=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr;
  var g=new THREE.Group(),rnd=K.rng(1999);
  /* the model's chance of noticing the tall block, for 1..5 cubes to count in every six blocks. Not a measurement. */
  var PN=[0.8,0.68,0.56,0.44,0.32];
  var BX0=-5.1,BX1=2.0,BZ=0.3,BD=1.3,BH=0.3,TOP=BH,HW=1.2,HH=1.45;
  var V=0.75,S=0.6,N=11,L=N*S,XS=-4.85,XV0=BX0+HW,XV1=BX1-HW,CX=-0.55,DX=CX-1.45;

  /* ---- the belt, a hood at each end, the counting line and the counter ---- */
  g.add(K.solid(BX1-BX0-0.1,BH,BD,{x:(BX0+BX1)/2,y:BH/2,z:BZ}));
  [BX0+HW/2,BX1-HW/2].forEach(function(x){g.add(K.solid(HW,HH,BD+0.3,{x:x,y:HH/2,z:BZ}));});
  var task=K.plate('',{size:0.15,weight:600,color:pal.ink});task.position.set(XV0+0.12,BH/2,BZ+BD/2+0.002);g.add(task);
  g.add(K.lines([[CX,TOP+0.003,BZ-BD/2,CX,TOP+0.003,BZ+BD/2]],{color:pal.ink}));
  var CZ=BZ-BD/2-0.32,CF=CZ+0.101;
  g.add(K.solid(1.1,1.55,0.2,{x:CX,y:1.55/2,z:CZ}));
  var cLab=K.plate('',{size:0.15,weight:600,color:pal.slate});cLab.position.set(CX,1.3,CF);g.add(cLab);
  var cNum=K.plate('0',{size:0.42,weight:700,color:pal.ink});cNum.position.set(CX,0.92,CF);g.add(cNum);

  /* ---- the blocks: cubes to count, tiles to ignore, and now and then the tall block ---- */
  var DIM={T:[0.36,0.36,0.36],N:[0.42,0.08,0.42],O:[0.36,1.0,0.36]};
  var level=2,blocks=[],sinceOdd=3,uk=rnd();
  /* each block gets a number u, spread evenly but irregularly (golden-ratio steps); it is a cube to count when u < level/6.
     So any stretch of belt holds the right share of cubes, and a change of level changes as few blocks as possible. */
  function nextU(){uk=(uk+0.6180339887)%1;return uk;}
  /* noticed or missed is drawn at random from a bag per level that holds the model's share of each, so a short run already shows the rate */
  var bags=[[],[],[],[],[]];
  function draw(lv){var bag=bags[lv-1];if(!bag.length){var n=20,k=Math.round(PN[lv-1]*n);for(var j=0;j<n;j++)bag.push(j<k);}return bag.splice(Math.floor(rnd()*bag.length),1)[0];}
  function kindOf(u){return u<level/6?'T':'N';}
  function dress(b,on){
    b.lit=on;
    if(b.kind==='T'){b.m.setTone(on?TONE.signal:TONE.white);b.m.setEdge(on?pal.signalShadow:pal.slate);}
    else if(b.kind==='O'){b.m.setTone(TONE.slate);b.m.setEdge(on?pal.signal:pal.ink,on?1.5:1);}
    else{b.m.setTone(TONE.paper);b.m.setEdge(pal.borderStrong);}
  }
  function shape(b,d){b.d=d.slice();b.m.scale.set(d[0],d[1],d[2]);}
  function place(b){b.m.position.set(b.x,TOP+b.d[1]/2,BZ);}
  function deal(b,first){
    b.u=nextU();b.counted=false;b.decided=false;b.marked=false;b.noticed=false;b.mk=1;
    sinceOdd++;
    if(!first&&((sinceOdd>=6&&rnd()<0.5)||sinceOdd>=8)){b.kind='O';sinceOdd=0;}else b.kind=kindOf(b.u);
    shape(b,DIM[b.kind]);dress(b,false);
  }
  for(var i=0;i<N;i++){
    var m=K.solid(1,1,1,{tone:TONE.white,edge:pal.slate});g.add(m);
    var b={m:m,x:XS+i*S};deal(b,true);if(i===4){b.kind='O';shape(b,DIM.O);dress(b,false);}
    place(b);blocks.push(b);
  }

  /* ---- the focus: a frame that follows one block at a time ---- */
  var frame=K.lines(K.boxEdges(1,1,1),{color:pal.signal,width:1.5});g.add(frame);
  var foc={b:null,x:CX-0.4,h:0.5,fx:CX-0.4,fh:0.5,k:1,cap:0},count=0;
  function look(b){
    if(foc.b&&foc.b!==b)dress(foc.b,false);
    foc.fx=foc.x;foc.fh=foc.h;foc.k=0;foc.b=b;
  }
  function drop(){if(foc.b){dress(foc.b,false);foc.b=null;foc.fx=foc.x;foc.fh=foc.h;foc.k=0;}}
  function next(){
    var best=null;
    blocks.forEach(function(b){if(b.kind==='T'&&!b.counted&&b.mk>=1&&b.x<CX-0.05&&b.x>XV0+0.25&&(!best||b.x>best.x))best=b;});
    if(best)look(best);else drop();
  }
  function stepFocus(dt){
    if(foc.cap>0){foc.cap-=dt;if(foc.cap<=0){foc.cap=0;next();}}
    else if(foc.b&&foc.b.kind==='T'&&foc.b.x>=CX){foc.b.counted=true;count++;cNum.setText(String(count));next();}
    else if(!foc.b||foc.b.kind!=='T')next();
    foc.k=Math.min(1,foc.k+dt/0.32);var e=K.ease(foc.k),tx=foc.b?foc.b.x:CX-0.4,th=foc.b?foc.b.d[1]+0.16:0.5;
    foc.x=foc.fx+(tx-foc.fx)*e;foc.h=foc.fh+(th-foc.fh)*e;
    if(foc.b&&foc.k>=1&&!foc.b.lit)dress(foc.b,true);
    frame.scale.set(0.56,foc.h,0.56);frame.position.set(foc.x,TOP+foc.h/2,BZ);
  }

  /* ---- the board: was the tall block noticed? one row for each level of the task ---- */
  var GX=3.75,GZ=-0.2,GW=2.75,GH=3.05,FZ=GZ+0.071,MAXM=5;
  g.add(K.solid(GW,GH,0.14,{x:GX,y:GH/2,z:GZ}));
  var gx0=GX-GW/2+0.2,gm0=GX-GW/2+0.95,gx1=GX+GW/2-0.2,RY=[2.05,1.7,1.35,1.0,0.65];
  var hi=K.quad(GW-0.16,0.31,K.flat(TONE.focal[0]),GX,RY[0],FZ+0.001);g.add(hi);
  var texts=[];
  function txt(o,x,y,align){var p=K.plate('',o);p.position.set(x,y,FZ+0.003);g.add(p);texts.push({p:p,x:x,align:align});return p;}
  function setT(p,t){p.setText(t);texts.forEach(function(q){if(q.p===p)p.position.x=q.align==='r'?q.x-p.w/2:q.align==='c'?q.x:q.x+p.w/2;});}
  var title=txt({size:0.17,weight:700,color:pal.ink},gx0,2.75,'l');
  var hA=txt({size:0.13,weight:600,color:pal.slate},gx0,2.4,'l'),hB=txt({size:0.13,weight:600,color:pal.slate},gm0-0.08,2.4,'l'),hC=txt({size:0.13,weight:600,color:pal.slate},gx1,2.4,'r');
  var rowL=RY.map(function(y){return txt({size:0.15,weight:600,color:pal.ink},gx0,y,'l');});
  var rowP=RY.map(function(y,j){return txt({size:0.15,weight:400,color:pal.slate},gx1,y,'r');});
  var rows=RY.map(function(){return [];}),fillM=K.flat(pal.ink),MS=0.15,MG=0.24;
  function markMesh(seen){
    if(seen){return K.quad(MS,MS,fillM,0,0,FZ+0.004);}
    var h=MS/2-0.006;return K.lines([[-h,-h,0,h,-h,0],[h,-h,0,h,h,0],[h,h,0,-h,h,0],[-h,h,0,-h,-h,0]],{color:pal.ink});
  }
  function layoutRow(j){rows[j].forEach(function(r,k){r.position.set(gm0+k*MG+MS/2,RY[j],FZ+0.004);});}
  function addMark(lv,seen){
    var j=lv-1,mm=markMesh(seen);g.add(mm);rows[j].push(mm);
    if(rows[j].length>MAXM){g.remove(rows[j].shift());}
    layoutRow(j);
  }
  /* legend: filled is noticed, hollow is missed */
  var LY=0.25,lg1=markMesh(true),lg2=markMesh(false);lg1.position.set(gx0+MS/2,LY,FZ+0.004);g.add(lg1);g.add(lg2);
  var lgT1=txt({size:0.13,weight:400,color:pal.slate},gx0+MS+0.08,LY,'l'),lgT2=txt({size:0.13,weight:400,color:pal.slate},0,LY,'l');
  function legend(){var x2=gx0+MS+0.08+lgT1.w+0.3;lg2.position.set(x2+MS/2,LY,FZ+0.004);texts.forEach(function(q){if(q.p===lgT2)q.x=x2+MS+0.08;});setT(lgT2,tr({da:'overset',en:'missed'}));}

  function relabel(){
    task.setText(tr({da:'Opgave: tæl terningerne',en:'Task: count the cubes'}));task.position.x=XV0+0.15+task.w/2;
    cLab.setText(tr({da:'Talt',en:'Counted'}));
    setT(title,tr({da:'Blev den høje klods set?',en:'Was the tall block noticed?'}));
    setT(hA,tr({da:'Tælles',en:'To count'}));setT(hB,tr({da:'Denne kørsel',en:'This run'}));setT(hC,tr({da:'Model',en:'Model'}));
    rowL.forEach(function(p,j){setT(p,tr({da:(j+1)+' af 6',en:(j+1)+' of 6'}));});
    rowP.forEach(function(p,j){setT(p,Math.round(PN[j]*100)+' %');});
    setT(lgT1,tr({da:'set',en:'noticed'}));legend();
  }

  /* ---- the handle: how many of every six blocks are cubes to count ---- */
  var auto=true,SEQ=[2,5,1,4,3],si=0,marksHere=0,dwell=0;
  function setLevel(v){
    v=Math.max(1,Math.min(5,Math.round(v)));if(v===level)return;level=v;
    /* the blocks still ahead of the line take the new task; those already past keep theirs */
    blocks.forEach(function(b){
      if(b.kind==='O'||b.counted||b.x>=CX-0.1)return;
      var k=kindOf(b.u);if(k===b.kind)return;
      if(foc.b===b)drop();
      b.from=b.d.slice();b.kind=k;b.mk=0;dress(b,false);
    });
    hi.position.y=RY[level-1];count=0;cNum.setText('0');marksHere=0;dwell=0;
    if(api&&api.onUi)api.onUi();
  }
  function update(dt){
    var i,b;
