    if(z==='counter'&&cs){W.hold(false);m.ui.set(l.counterSet);settle();}
    else if(!answered()){
      /* before the answer: the model starts over and stands still */
      W.hold(false);m.ui.set(DEF[cur]);m.ui.setAuto(true);for(var q=0;q<24;q++)m.update(0.05,0,true);W.hold(true);held=true;
    }else{
      W.hold(false);var v=USERV[id];
      if(v==='auto'||(v===undefined&&(l.answerSet===null||l.answerSet===undefined)))m.ui.setAuto(true);
      else m.ui.set(v!==undefined?v:l.answerSet);
      settle();
    }
  }catch(e){}
  tag();caption();paintUi();playBtn();
}
/* the kind of model, over the model */
function tag(){
  var el=$('tag');if(!el)return;
  if(cur<0||zone==='rel'){el.hidden=true;return;}
  var ty=UI.types[LAWS[cur].type];el.hidden=false;
  el.innerHTML='<b>'+t(ty.n)+'</b><span>'+t(ty.d)+'</span>';el.title=t(ty.n)+': '+t(ty.d);
}

/* ---------- routing ---------- */
function route(){
  var id=(location.hash||'').replace(/^#/,''),i=byId(id),gm=/^group-(\d)$/.exec(id);
  clearInterval(timer);
  for(var k=0;k<LAWS.length;k++){var mm=has3d&&W.model(k);if(mm)mm.onUi=null;}
  if(has3d){W.hold(false);W.focus(null);}
  held=false;grp=gm?+gm[1]:-1;zones=[];
  if(i>=0){
    cur=i;app.dataset.view='law';if(has3d)W.goto('law',i);renderLaw(i);
  }else if(grp>=0&&grp<GROUPS.length){
    cur=-1;app.dataset.view='map';
    if(has3d)W.goto('rel',-1,LAWS.map(function(l,j){return l.g===grp?j:-1;}).filter(function(j){return j>=0;}));
    renderGroup(grp);
  }else{cur=-1;grp=-1;app.dataset.view='map';if(has3d)W.goto('map');renderMap();}
  caption();groupsNav();tag();still();insets();playBtn();
  document.title=(cur>=0?t(LAWS[cur].name)+' · ':grp>=0?t(GROUPS[grp])+' · ':'')+'MOTH: LAWWORKS';
  /* after the visitor moves, the focus goes to the new heading, so keyboard and screen reader users land on it */
  if(userNav){var hd=panel.querySelector('h1,h2');if(hd)try{hd.focus({preventScroll:true});}catch(e){hd.focus();}}
  userNav=true;
}
function caption(hover){
  var a=$('vfa'),b=$('vfb');
  if(!has3d){a.textContent='';b.textContent='';}
  else if(cur<0){
    if(hover>=0){var l=LAWS[hover];a.textContent=l.no+' · '+t(l.name);b.textContent='';}
    else{a.textContent=grp>=0?t(GROUPS[grp]):u('capMap');b.textContent=u('capMapB');}
  }else if(zone==='rel'){
    var h2=LAWS[hover>=0?hover:cur];a.textContent=h2.no+' · '+t(h2.name);b.textContent=u('capRel');
  }else{a.textContent=LAWS[cur].no+' · '+t(LAWS[cur].name);b.textContent=u('capLaw');}
  $('gl').setAttribute('aria-label',cur<0?(grp>=0?t(GROUPS[grp]):u('capMap')):TB.tr({da:'Model af ',en:'Model of '})+t(LAWS[cur].name)+'. '+t(LAWS[cur].shows));
}
function groupsNav(){
  var g=cur>=0?LAWS[cur].g:grp;
  $('groups').innerHTML=GROUPS.map(function(gr,gi){
    return '<a class="gnode'+(gi===g?' is-here':'')+'" href="#group-'+gi+'" title="'+esc(t(gr))+'"'+(gi===g?' aria-current="true"':'')+'>'+esc(t(gr.short))+'</a>';
  }).join('');
  $('groups').setAttribute('aria-label',u('groupNav'));
}
/* without 3D: a still of the model, or of the sheet */
function still(){
  var im=$('still');if(has3d||!im)return;
  var id=cur>=0?LAWS[cur].id:'_map';
  im.src=stillSrc(id);
  im.alt=cur>=0?u('stillOf')+t(LAWS[cur].name)+'. '+t(LAWS[cur].shows):u('capMap');
}
function setLang(l){
  TB.lang=l;document.documentElement.lang=l;
  $('lang').querySelectorAll('button').forEach(function(s){var on=s.dataset.l===l;s.classList.toggle('on',on);s.setAttribute('aria-pressed',on);});
  $('lang').setAttribute('aria-label',u('langLabel'));
  try{localStorage.setItem('lw-lang',l);}catch(e){}
  if(has3d)W.relabel();
  var keep=userNav,st=panel.scrollTop;userNav=false;route();userNav=keep;playBtn();
  if(cur>=0){panel.scrollTop=st;onScroll();}
}
/* the animation button is there only when something on the screen moves: the sheet, or a model after the answer
   (not while it waits for a guess, and not a model that stands still once it has reached its state) */
function playBtn(){
  var p=$('play'),show=has3d&&(cur<0||zone==='rel'||(!held&&LAWS[cur].loops!==false));
  p.hidden=!show;p.dataset.on=W.paused?'0':'1';p.querySelector('span').textContent=W.paused?u('play'):u('pause');
}

/* ---------- layout: the camera keeps the model clear of the panel ---------- */
function insets(){
  if(!has3d)return;
  var d=document.querySelector('.dock');
  W.setInsets(narrow()?{bottom:d.offsetHeight}:{left:d.offsetWidth});
}

TB.start=function(){
  var lang='da';try{lang=localStorage.getItem('lw-lang')||((navigator.language||'da').toLowerCase().indexOf('en')===0?'en':'da');}catch(e){}
  try{GUESS=JSON.parse(localStorage.getItem('lw-guess')||'{}')||{};}catch(e){GUESS={};}
  TB.lang=lang;
  var reduce=false;try{reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);}catch(e){}
  if(!W.init($('gl'),LAWS,GROUPS)){has3d=false;app.classList.add('no3d');}
  else LAWS.forEach(function(l,i){var m=W.model(i);DEF[i]=m?m.ui.value():0;});
  W.still=reduce;
  W.onOpen=function(i){location.hash=LAWS[i].id;};
  W.onHover=function(i){caption(i);panel.querySelectorAll('.item,.rel a').forEach(function(a){a.classList.toggle('is-hot',+a.dataset.i===i);});};
  $('lang').querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){if(b.dataset.l!==TB.lang)setLang(b.dataset.l);});});
  $('play').addEventListener('click',function(){W.paused=!W.paused;playBtn();});
  panel.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('hashchange',route);
  window.addEventListener('resize',function(){insets();onScroll();});
  document.addEventListener('keydown',function(e){
    if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
    if(e.key==='Escape'&&(cur>=0||grp>=0)){location.hash='';}
    else if(cur>=0&&!e.altKey&&!e.metaKey&&!e.ctrlKey&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){location.hash=LAWS[(cur+(e.key==='ArrowRight'?1:29))%30].id;}
  });
  if(reduce)W.paused=true;
  setLang(lang);
};
})();

</script>
<script>window.TB.start();</script>

</body></html>
