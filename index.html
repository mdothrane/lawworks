llem udfordring og evner.", "en": "The classic flow model: the balance between challenge and skill."}, "notShows": {"da": "At balance giver flow. Klare mål og hurtig feedback hører også med, og balancen hænger kun moderat sammen med flow.", "en": "That balance produces flow. Clear goals and fast feedback belong too, and balance is only moderately related to flow."}, "counter": {"da": "Ikke alle opgaver skal give flow. En betaling skal være hurtigt overstået, ikke fordybende.", "en": "Not every task should produce flow. A payment should be over quickly, not absorbing."}, "counterSet": null, "related": [["doherty", {"da": "Hurtig feedback", "en": "Fast feedback"}], ["cognitive-load", {"da": "For meget at holde trækker mod angst", "en": "Too much to hold pulls towards anxiety"}]], "answerSet": 100, "loops": true}, {"id": "parkinson", "no": "24", "g": 3, "name": {"da": "Parkinsons lov", "en": "Parkinson’s Law"}, "orig": "Parkinson’s Law", "def": {"da": "Med Parkinsons ord: »Arbejde breder sig, så det fylder den tid, der er til rådighed for at gøre det færdigt.« Sætningen indleder et satirisk essay om bureaukrati fra 1955.", "en": "In Parkinson’s words, “work expands so as to fill the time available for its completion”. The line opens a satirical essay on bureaucracy from 1955."}, "design": {"da": ["Sig, hvor lang tid en opgave tager, og hold den inden for det. Sæt ikke tidsgrænser for brugeren; WCAG kræver, at de kan slås fra, justeres eller forlænges, med få undtagelser.", "Autoudfyldning og gode standardværdier gør opgaven kortere end den tid, folk har afsat."], "en": ["State how long a task takes, and keep it within that. Do not impose time limits on users; WCAG requires that they can be turned off, adjusted or extended, with few exceptions.", "Autofill and good defaults make a task shorter than the time people have set aside."]}, "ev": "heuristic", "evWhy": {"da": "Et satirisk essay, ikke en undersøgelse. Ideen er senere testet som et spørgsmål om mål og tidsfrister, men »loven« selv er en iagttagelse.", "en": "A satirical essay, not a study. The idea was later tested as a matter of goals and deadlines, but the “law” itself is an observation."}, "origin": ["Parkinson, C. N. (1955, 19. november/November 19). Parkinson’s law. <i>The Economist</i>.", "Bryan, J. F. &amp; Locke, E. A. (1967). Parkinson’s law as a goal-setting phenomenon. <i>Organizational Behavior and Human Performance</i>, 2(3), 258–275."], "links": [{"t": "Parkinson’s law (Wikipedia)", "u": "https://en.wikipedia.org/wiki/Parkinson%27s_law"}], "model": {"da": ["Kassen er tidsrammen for en opgave, målt i dage langs linealen. Grebet styrer dens størrelse fra 2 til 10 dage.", "Pennen arbejder sig gennem opgaven, og opgaven vokser, til den fylder kassen: med mere tid får den flere trin, og hvert trin tager længere tid. De stiplede stykker foran er det arbejde, opgaven krævede: to dage.", "Modellen tager Parkinsons sætning bogstaveligt og påstår ikke mere. Den stammer fra et satirisk essay fra 1955 og er en iagttagelse og en tommelfingerregel, ikke en målt lov; senere forskning har testet den som et spørgsmål om mål og tidsfrister (Bryan og Locke, 1967). Trin og dage er modellens.", "Modellen handler om opgaven, der breder sig i den tid, et team selv sætter af. Den handler ikke om at give brugere tidsfrister."], "en": ["The box is the time frame for a task, measured in days along the ruler. The handle sets its size from 2 to 10 days.", "The stylus works through the task, and the task grows until it fills the box: with more time it gets more steps, and every step takes longer. The dashed pieces in front are the work the task needed: two days.", "The model takes Parkinson’s sentence literally and claims nothing more. It comes from a satirical essay of 1955 and is an observation and a rule of thumb, not a measured law; later research has tested it as a matter of goals and deadlines (Bryan and Locke, 1967). The steps and days are the model’s.", "The model is about a task spreading into the time a team sets aside for it. It is not about giving users time limits."]}, "type": "illustration", "ev3": ["rule", "mixed", "analogy"], "predict": {"q": {"da": "Opgaven kræver to dage. Hvad påstår Parkinson, der sker, når tidsrammen bliver ti dage?", "en": "The task needs two days. What does Parkinson claim happens when the time frame becomes ten days?"}, "opts": [{"da": "Den tager stadig to dage", "en": "It still takes two days"}, {"da": "Den fylder de ti dage", "en": "It fills the ten days"}, {"da": "Den tager kortere tid", "en": "It takes less time"}], "a": 1, "why": {"da": "Det er Parkinsons påstand, og modellen tager den bogstaveligt. Det er en satirisk iagttagelse, ikke en målt lov.", "en": "That is Parkinson’s claim, and the model takes it literally. It is a satirical observation, not a measured law."}}, "shows": {"da": "Parkinsons sætning taget bogstaveligt.", "en": "Parkinson’s sentence taken literally."}, "notShows": {"da": "En naturlov. Det er en iagttagelse fra et satirisk essay; senere forsøg har fundet, at folk med tid til overs arbejder langsommere, men forsøgene er få og små.", "en": "A law of nature. It is an observation from a satirical essay; later experiments found that people with time to spare work more slowly, but the experiments are few and small."}, "counter": {"da": "Brug ikke Parkinsons lov som grund til at give brugere korte tidsfrister. WCAG kræver, at tidsgrænser kan slås fra, justeres eller forlænges, med få undtagelser.", "en": "Do not use Parkinson’s law as a reason to give users short deadlines. WCAG requires that time limits can be turned off, adjusted or extended, with few exceptions."}, "counterSet": null, "related": [["goal-gradient", {"da": "Mål og tid hænger sammen", "en": "Goals and time are linked"}], ["pareto", {"da": "Hvor indsatsen faktisk gør en forskel", "en": "Where effort actually makes a difference"}]], "answerSet": 10, "loops": true}, {"id": "jakob", "no": "25", "g": 4, "name": {"da": "Jakobs lov", "en": "Jakob’s Law"}, "orig": "Jakob’s Law", "def": {"da": "Med Jakob Nielsens ord: »Brugere bruger det meste af deres tid på andre sites.« Derfor foretrækker de, at dit virker ligesom dem, de allerede kender.", "en": "In Jakob Nielsen’s words: “Users spend most of their time on other sites.” So they prefer yours to work the way the sites they already know do."}, "design": {"da": ["Brug kendte mønstre til kendte opgaver: kurv, søgning, login.", "Afvig kun, hvor det er klart bedre, og hjælp brugeren over overgangen."], "en": ["Use familiar patterns for familiar tasks: basket, search, sign-in.", "Deviate only where it is clearly better, and help users through the change."]}, "ev": "heuristic", "evWhy": {"da": "En designregel, Jakob Nielsen formulerede i 2000. Den passer med det, man ved om, hvordan vaner overføres fra ét system til et andet, men den er ikke målt som en lov.", "en": "A design rule Jakob Nielsen formulated in 2000. It fits what is known about how habits transfer from one system to another, but it has not been measured as a law."}, "origin": ["Nielsen, J. (2000, 22. juli/July 22). End of web design. <i>Alertbox</i>."], "links": [{"t": "End of Web Design (Jakob Nielsen, 2000)", "u": "https://www.nngroup.com/articles/end-of-web-design/"}, {"t": "Jakob’s Law of Internet User Experience (video)", "u": "https://www.nngroup.com/videos/jakobs-law-internet-ux/"}], "model": {"da": ["To ens maskiner med de samme fire betjeningsdele. Til venstre sidder de, hvor de plejer, og stregen er den vej, opgaven tager: fra 1 til 4.", "Grebet flytter delene på maskinen til højre. Pennen har lært den vante placering, så den leder først dér. Hvor en del er flyttet, viser den stiplede kontur, hvor den plejer at sidde; pennen gør holdt og må derefter tage en omvej.", "Beholderen fyldes med den tid, opgaven tager. Den stiplede ring er tiden på den vante placering, så alt over ringen er prisen for at flytte delene.", "Jakobs lov er en tommelfingerregel, som Jakob Nielsen formulerede i 2000, ikke en målt lov. Hastighed, pauser og sekunder er modellens. Modellen viser kun første gang; med øvelse bliver omvejen kortere."], "en": ["Two identical machines with the same four controls. On the left they sit where they usually do, and the line is the route the task takes: from 1 to 4.", "The handle moves the controls on the machine on the right. The stylus has learnt the usual layout, so it looks there first. Where a control has been moved, the dashed outline shows where it usually sits; the stylus stops and then has to take a detour.", "The container fills with the time the task takes. The dashed ring is the time on the usual layout, so everything above the ring is the cost of moving the controls.", "Jakob’s law is a rule of thumb Jakob Nielsen put forward in 2000, not a measured law. The speed, the pauses and the seconds are the model’s. The model shows only the first time; with practice the detour gets shorter."]}, "type": "illustration", "ev3": ["rule", "untested", "direct"], "predict": {"q": {"da": "Fire betjeningsdele flyttes. Hvad sker der første gang, pennen løser opgaven?", "en": "Four controls are moved. What happens the first time the stylus does the task?"}, "opts": [{"da": "Ingenting; den finder dem med det samme", "en": "Nothing; it finds them at once"}, {"da": "Den leder først det vante sted og tager en omvej", "en": "It looks in the usual place first and takes a detour"}, {"da": "Den giver op", "en": "It gives up"}], "a": 1, "why": {"da": "Vanen sender pennen derhen, hvor delen plejer at sidde. Hvor den er flyttet, koster det et stop og en omvej.", "en": "Habit sends the stylus where the control usually sits. Where it has moved, it costs a stop and a detour."}}, "shows": {"da": "Prisen første gang, noget kendt sidder et nyt sted.", "en": "The cost the first time something familiar sits somewhere new."}, "notShows": {"da": "At nyt er dårligt. Med øvelse bliver omvejen kortere, nye mønstre kan være bedre på sigt, og vaner gælder også begreber og betjening, ikke kun placering.", "en": "That new is bad. With practice the detour shrinks, new patterns can be better in the long run, and habits concern concepts and operation too, not only placement."}, "counter": {"da": "Det kendte er ikke altid bedst. Hvor noget nyt er klart bedre, kan prisen første gang være værd at betale. Modellen viser kun første gang.", "en": "The familiar is not always best. Where something new is clearly better, the first-time cost can be worth paying. The model only shows the first time."}, "counterSet": 4, "related": [["mental-model", {"da": "Det, brugeren forventer, at systemet gør", "en": "What users expect the system to do"}], ["active-user", {"da": "Folk går i gang med det, de kan", "en": "People start with what they know"}]], "answerSet": 4, "loops": true}, {"id": "mental-model", "no": "26", "g": 4, "name": {"da": "Mentale modeller", "en": "Mental Model"}, "orig": "Mental Model", "def": {"da": "Det billede, en person har af, hvordan et system virker. Det bygger på erfaring, er ofte ufuldstændigt, og det er det, folk handler ud fra.", "en": "The picture a person has of how a system works. It is built from experience, is often incomplete, and it is what people act on."}, "design": {"da": ["Design efter brugerens model, eller vis tydeligt, hvordan systemet faktisk virker.", "Find modellerne gennem research, fx ved at bede folk tegne, hvordan de tror, noget virker."], "en": ["Design to the user’s model, or show clearly how the system actually works.", "Find the models through research, for example by asking people to draw how they think something works."]}, "ev": "concept", "evWhy": {"da": "Et forklarende begreb fra kognitionsvidenskaben, ikke en lov med en målbar effekt. Forsøg viser, at det hjælper folk at lære at betjene et apparat, når de får en model af, hvordan det virker.", "en": "An explanatory concept from cognitive science, not a law with a measurable effect. Experiments show that giving people a model of how a device works helps them learn to use it."}, "origin": ["Craik, K. (1943). <i>The Nature of Explanation</i>. Cambridge University Press.", "Norman, D. A. (1983). Some observations on mental models. I/In D. Gentner &amp; A. L. Stevens (red./eds.), <i>Mental Models</i>, 7–14. Erlbaum.", "Kieras, D. E. &amp; Bovair, S. (1984). The role of a mental model in learning to operate a device. <i>Cognitive Science</i>, 8(3), 255–273."], "links": [{"t": "Mental Models and User Experience Design", "u": "https://www.nngroup.com/articles/mental-models/"}], "model": {"da": ["Til venstre en maskine: en tank, en blok og en enhed, forbundet af et rør, der ender i et udløb på forsiden. Et dæksel skjuler dem. Til højre brugerens skitse af indmaden, tegnet stiplet på en plade af samme størrelse.", "Udefra kan man kun se udløbet. Skitsen gætter derfor på én stor kasse, der gør arbejdet, og en lille tank ved udløbet.", "Grebet styrer, hvor meget maskinen viser af sig selv: først en lampe og et vindue, der viser niveauet i tanken, så glider dækslet tilbage. Hver del, maskinen har vist, flytter skitsen derhen, hvor den faktisk sidder.", "Mentale modeller er et begreb fra kognitionsforskningen, ikke en målt lov. Gættet og reglen for, hvornår skitsen retter sig, er modellens. Forsøg viser, at folk lettere lærer at bruge en maskine, når de får en model af, hvordan den virker, og modellen gør det muligt at udlede, hvordan den skal betjenes."], "en": ["On the left a machine: a tank, a block and a unit, joined by a pipe that ends in an outlet at the front. A cover hides them. On the right the user’s sketch of the inside, drawn dashed on a board of the same size.", "From the outside only the outlet can be seen. So the sketch guesses one big box that does the work, and a small tank by the outlet.", "The handle sets how much the machine shows of itself: first a lamp and a window showing the level in the tank, then the cover slides back. For each part the machine has shown, the sketch moves it to where it really is.", "Mental models are a concept from cognitive science, not a measured law. The guess, and the rule for when the sketch corrects itself, are the model’s. Experiments show that people learn to use a device more easily when they are given a model of how it works that lets them work out how to operate it."]}, "type": "illustration", "ev3": ["concept", "mixed", "direct"], "predict": {"q": {"da": "Maskinen begynder at vise en lampe og et vindue med niveauet i tanken. Hvad sker der med brugerens skitse?", "en": "The machine starts to show a lamp and a window with the level in the tank. What happens to the user’s sketch?"}, "opts": [{"da": "Ingenting; skitsen er brugerens egen", "en": "Nothing; the sketch is the user’s own"}, {"da": "Den flytter sig mod den rigtige indmad", "en": "It moves towards the real inside"}, {"da": "Den bliver mere forkert", "en": "It becomes more wrong"}], "a": 1, "why": {"da": "Udefra kan man kun gætte. Skitsen bygger på det, der kan ses, og retter sig, efterhånden som maskinen viser mere.", "en": "From outside you can only guess. The sketch builds on what can be seen and corrects itself as the machine shows more."}}, "shows": {"da": "At brugeren handler ud fra et gæt, og at det, systemet viser, kan rette gættet.", "en": "That the user acts on a guess, and that what the system shows can correct it."}, "notShows": {"da": "At mere synlig indmad altid giver en bedre model. Rå teknik kan også forvirre; det, der hjælper, er det, der betyder noget for betjeningen.", "en": "That more visible inside always gives a better model. Raw technology can also confuse; what helps is what matters for operating it."}, "counter": {"da": "Vis ikke al indmaden for at gøre brugerens model rigtig. Vis det, der betyder noget for betjeningen.", "en": "Do not show all the inside to make the user’s model right. Show what matters for operating it."}, "counterSet": null, "related": [["jakob", {"da": "Modeller bygger på det, man kender", "en": "Models build on what you know"}], ["postel", {"da": "Vis, hvordan systemet forstod input", "en": "Show how the system understood input"}]], "answerSet": null, "loops": true}, {"id": "active-user", "no": "27", "g": 4, "name": {"da": "Den aktive brugers paradoks", "en": "Paradox of the Active User"}, "orig": "Paradox of the Active User", "def": {"da": "Brugere læser sjældent vejledninger. De går i gang med det samme, også når lidt læsning ville spare dem tid i det lange løb.", "en": "Users rarely read manuals. They jump straight into the software, even when a little reading would save them time in the long run."}, "design": {"da": ["Læg hjælpen i interfacet, hvor den skal bruges: tips i konteksten, eksempler og gode tomme tilstande.", "Design til, at folk lærer ved at gøre, og gør fejl billige at fortryde."], "en": ["Put help in the interface where it is needed: tips in context, examples and good empty states.", "Design for learning by doing, and make mistakes cheap to undo."]}, "ev": "robust", "evWhy": {"da": "Det begyndte som iagttagelser af folk, der lærte nye systemer, men senere forsøg har bekræftet kernen: erfarne brugere holder fast i stabile, men ikke optimale fremgangsmåder. Korte manualer bygget på den indsigt forbedrede indlæringen.", "en": "It began as observations of people learning new systems, but later experiments confirmed the core: experienced users stick to stable but suboptimal procedures. Short manuals built on that insight improved learning."}, "origin": ["Carroll, J. M. &amp; Rosson, M. B. (1987). Paradox of the active user. I/In J. M. Carroll (red./ed.), <i>Interfacing Thought</i>. MIT Press.", "Fu, W.-T. &amp; Gray, W. D. (2004). Resolving the paradox of the active user. <i>Cognitive Science</i>, 28(6), 901–935.", "Carroll, J. M., Smith-Kerker, P. L., Ford, J. R. &amp; Mazur-Rimetz, S. A. (1987). The minimal manual. <i>Human-Computer Interaction</i>, 3(2), 123–153."], "links": [{"t": "Paradox of the Active User (Jakob Nielsen, 1998)", "u": "https://www.nngroup.com/articles/paradox-of-the-active-user/"}], "model": {"da": ["Pennen går direkte til maskinen og løser opgaven: de tre betjeningsdele i rækkefølge. I hvert forsøg går den i stå ved én af dem.", "Ved del 1 står et lille skilt med et tip på maskinen, lige dér hvor pennen er, og det bliver brugt hver gang. Ved de andre dele må pennen enten hente manualen på hylden eller prøve sig frem.", "Grebet styrer manualens længde. En kort manual bliver hentet de fleste gange; jo længere den er, jo sjældnere bliver den åbnet. Tavlen tæller, hvad der skete i de fire forsøg.", "Hvor ofte manualen bliver hentet, er modellens antagelse, ikke et måletal. Paradokset blev beskrevet ud fra observationer. I forsøg forbedrede korte, opgaveorienterede manualer indlæringen, så en manual kan sagtens hjælpe."], "en": ["The stylus goes straight to the machine and does the task: the three controls in turn. In each attempt it gets stuck at one of them.", "At control 1 a small sign with a tip stands on the machine, right where the stylus is, and it is used every time. At the other controls the stylus either fetches the manual from the shelf or works it out by trial and error.", "The handle sets the length of the manual. A short manual is fetched most of the time; the longer it is, the more rarely it is opened. The board counts what happened in the four attempts.", "How often the manual is fetched is the model’s assumption, not a measurement. The paradox was described from observation. In experiments, short task-oriented manuals improved learning, so a manual can certainly help."]}, "type": "illustration", "ev3": ["finding", "solid", "direct"], "predict": {"q": {"da": "Manualen på hylden bliver længere. Hvad sker der?", "en": "The manual on the shelf gets longer. What happens?"}, "opts": [{"da": "Den bliver brugt mere, for der står mere i den", "en": "It is used more, as it says more"}, {"da": "Den bliver hentet sjældnere", "en": "It is fetched less often"}, {"da": "Ingen forskel", "en": "No difference"}], "a": 1, "why": {"da": "Folk går i gang i stedet for at læse. Tippet, der står, hvor det skal bruges, bliver brugt hver gang. Hvor ofte manualen hentes, er modellens antagelse.", "en": "People start instead of reading. The tip placed where it is needed is used every time. How often the manual is fetched is the model’s assumption."}}, "shows": {"da": "At hjælp, der står, hvor den skal bruges, bliver brugt oftere end en lang manual, der bliver liggende på hylden.", "en": "That help placed where it is needed is used more often than a long manual that stays on the shelf."}, "notShows": {"da": "Hele paradokset. Folk holder også fast i kendte, tilstrækkelige metoder i stedet for at lære hurtigere metoder, og det handler ikke kun om manualens længde.", "en": "The whole paradox. People also stick to known, good-enough methods instead of learning faster ones, and it is not only about the manual’s length."}, "counter": {"da": "Fjern ikke vejledningen, fordi folk sjældent læser den. Korte, opgaveorienterede manualer har forbedret indlæringen i forsøg. Her er manualen to sider.", "en": "Do not remove the guide because people rarely read it. Short, task-oriented manuals improved learning in experiments. Here the manual is two pages."}, "counterSet": 0, "related": [["jakob", {"da": "Folk bruger det, de allerede kan", "en": "People use what they already know"}], ["mental-model", {"da": "Det, man lærer af at gøre", "en": "What you learn by doing"}]], "answerSet": 100, "loops": true}, {"id": "tesler", "no": "28", "g": 4, "name": {"da": "Teslers lov", "en": "Tesler’s Law"}, "orig": "Tesler’s Law (conservation of complexity)", "def": {"da": "Enhver applikation har en mængde kompleksitet, der ikke kan fjernes, kun flyttes. Spørgsmålet er, hvem der skal håndtere den: brugeren, udvikleren af applikationen eller udvikleren af platformen.", "en": "Every application has an amount of complexity that cannot be removed, only moved. The question is who has to deal with it: the user, the application developer or the platform developer."}, "design": {"da": ["Lad systemet bære kompleksiteten, hvor det kan, fx ved at udfylde adresser og gætte tidszoner.", "Skjul ikke det, brugeren selv skal tage stilling til. Noget kompleksitet hører til hos brugeren."], "en": ["Let the system carry complexity where it can, for example by filling in addresses and guessing time zones.", "Do not hide what users must decide themselves. Some complexity belongs with the user."]}, "ev": "heuristic", "evWhy": {"da": "En designregel fra Larry Teslers egen erfaring, som han selv daterer til omkring 1984. Den er ikke testet eller målt.", "en": "A design rule from Larry Tesler’s own experience, which he dates to around 1984. It has not been tested or measured."}, "origin": ["Tesler, L. (ca. 1984). The law of conservation of complexity. Gengivet på/As given on nomodes.com."], "links": [{"t": "Larry Tesler: The Law of Conservation of Complexity", "u": "https://www.nomodes.com/larry-tesler-consulting/complexity-law"}, {"t": "Tesler’s Law: Shift Complexity to Simplify UX (video)", "u": "https://www.nngroup.com/videos/teslers-law/"}], "model": {"da": ["Tolv klodser er den kompleksitet, én opgave rummer. Hver klods ligger enten i brugerens bakke ved pennen eller på maskinen.", "Grebet styrer, hvor mange klodser maskinen tager. Klodserne flytter sig, men ingen forsvinder. Bagefter løses opgaven: pennen tager sig af hver klods i sin bakke, én ad gangen, og maskinen tager sig af sine.", "Tavlen viser fordelingen. Summen er altid 12; kun skillelinjen flytter sig. De to mørke klodser er valg, som kun brugeren kan træffe, for eksempel hvem pakken skal sendes til, så dem kan maskinen ikke tage.", "Tesler skelnede mellem brugeren, udvikleren af applikationen og udvikleren af platformen; modellen slår de to udviklere sammen til maskinen. Loven er en tommelfingerregel fra Teslers egen erfaring, ikke en målt sammenhæng, og antallet af klodser er modellens."], "en": ["Twelve blocks are the complexity one task holds. Each block lies either in the user’s tray, by the stylus, or on the machine.", "The handle sets how many blocks the machine takes. The blocks move, but none disappear. Then the task is done: the stylus deals with every block in its tray, one at a time, and the machine deals with its own.", "The board shows the split. The total is always 12; only the dividing line moves. The two dark blocks are choices only the user can make, for example who the parcel should go to, so the machine cannot take them.", "Tesler distinguished between the user, the application developer and the platform developer; the model merges the two developers into the machine. The law is a rule of thumb from Tesler’s own experience, not a measured relationship, and the number of blocks is the model’s."]}, "type": "illustration", "ev3": ["rule", "untested", "direct"], "predict": {"q": {"da": "Maskinen tager flere klodser. Hvad sker der med den samlede mængde?", "en": "The machine takes more blocks. What happens to the total?"}, "opts": [{"da": "Den falder", "en": "It drops"}, {"da": "Den er den samme; kun fordelingen ændres", "en": "It stays the same; only the split changes"}, {"da": "Den stiger", "en": "It rises"}], "a": 1, "why": {"da": "Det er Teslers påstand: kompleksiteten kan flyttes, ikke fjernes. Modellen tager den bogstaveligt.", "en": "That is Tesler’s claim: complexity can be moved, not removed. The model takes it literally."}}, "shows": {"da": "At kompleksitet kan flyttes mellem bruger og maskine.", "en": "That complexity can be moved between user and machine."}, "notShows": {"da": "En målbar mængde. Tallet 12 er modellens, og når systemet overtager noget, kan der opstå nyt: fejl at håndtere og kontrol, brugeren mister.", "en": "A measurable amount. The number 12 is the model’s, and when the system takes something over, new work can appear: errors to handle and control the user loses."}, "counter": {"da": "Tag ikke beslutninger fra brugeren, som kun brugeren kan træffe. Her tager maskinen alt, hvad den kan, men de to mørke klodser bliver hos brugeren.", "en": "Do not take decisions from users that only they can make. Here the machine takes all it can, but the two dark blocks stay with the user."}, "counterSet": 10, "related": [["occam", {"da": "Det, der kan fjernes", "en": "What can be removed"}], ["postel", {"da": "Hvem der bærer det rodede input", "en": "Who carries the messy input"}]], "answerSet": 10, "loops": true}, {"id": "postel", "no": "29", "g": 4, "name": {"da": "Postels lov", "en": "Postel’s Law"}, "orig": "Postel’s Law (robustness principle)", "def": {"da": "»Vær konservativ i det, du gør, og liberal i det, du tager imod fra andre« (RFC 761, 1980). Princippet stammer fra specifikationerne af internettets protokoller.", "en": "“Be conservative in what you do, be liberal in what you accept from others” (RFC 761, 1980). The principle comes from the specifications of the internet’s protocols."}, "design": {"da": ["Tag imod input i mange formater, fx telefonnumre med og uden mellemrum.", "Vis, hvordan systemet har forstået inputtet, så et forkert gæt kan rettes."], "en": ["Accept input in many formats, for example phone numbers with and without spaces.", "Show how the system has understood the input, so a wrong guess can be corrected."]}, "ev": "heuristic", "evWhy": {"da": "Et ingeniørprincip, ikke et fund om mennesker. Internettets arkitekturråd (IAB) mener i dag, at tolerance over for fejlbehæftet input skjuler fejl, så de kan blive til de facto-standarder og blive svære at rette, og anbefaler i stedet at vedligeholde protokollerne aktivt.", "en": "An engineering maxim, not a finding about people. The Internet Architecture Board (IAB) now argues that tolerating faulty input hides faults, so they can become entrenched as de facto standards and hard to fix, and recommends maintaining protocols actively instead."}, "origin": ["Postel, J. (1980, januar/January). <i>RFC 760: DoD Standard Internet Protocol</i> og/and <i>RFC 761: DoD Standard Transmission Control Protocol</i>.", "Thomson, M. &amp; Schinazi, D. (2023). <i>RFC 9413: Maintaining Robust Protocols</i>. IAB."], "links": [{"t": "RFC 761: DoD Standard Transmission Control Protocol (1980)", "u": "https://www.rfc-editor.org/rfc/rfc761"}, {"t": "RFC 9413: Maintaining Robust Protocols (2023)", "u": "https://www.rfc-editor.org/rfc/rfc9413"}], "model": {"da": ["Til venstre ligger datoer, som folk har skrevet. Én ad gangen går de ind i maskinen. Pladen på toppen viser, hvordan maskinen forstod datoen, og ud kommer den altid i ét format: ISO 8601, for eksempel 2026-10-31.", "Grebet styrer, hvor tolerant indgangen er. Er den streng, kommer kun ISO-datoen igennem, og fire datoer skrevet på helt almindelige måder bliver afvist.", "Er den tolerant, læser den alle datoer, der kun kan betyde én dag, og ved 03/04/2026, der kan være 3. april eller 4. marts, spørger den brugeren. Er den meget tolerant, gætter den i stedet, her med måneden først som i amerikansk skrivemåde. Skribenten mente 3. april og får 4. marts; det stiplede er det, der var ment.", "Datoerne og reglerne er modellens. Postels princip stammer fra internettets protokoller, ikke fra forskning i brugere. I dag anbefaler internettets arkitekturråd (IAB) at vedligeholde protokollerne aktivt frem for at tolerere fejl, fordi tolerance kan skjule fejl, til de er svære at rette."], "en": ["On the left lie dates that people have typed. One at a time they go into the machine. The plate on top shows how the machine understood each date, and it always comes out in one format: ISO 8601, for example 2026-10-31.", "The handle sets how tolerant the input is. When it is strict, only the ISO date gets through, and four dates written in perfectly ordinary ways are rejected.", "When it is tolerant, it reads every date that can only mean one day, and for 03/04/2026, which could be 3 April or 4 March, it asks the user. When it is very tolerant, it guesses instead, here month first as in the American way of writing dates. The writer meant 3 April and gets 4 March; the dashed block is what was meant.", "The dates and the rules are the model’s. Postel’s principle comes from the internet’s protocols, not from research on users. Today the Internet Architecture Board (IAB) recommends maintaining protocols actively rather than tolerating faults, because tolerance can hide faults until they are hard to fix."]}, "type": "illustration", "ev3": ["engineering", "contested", "analogy"], "predict": {"q": {"da": "Indgangen bliver meget tolerant og gætter ved 03/04/2026. Hvad kan der ske?", "en": "The input becomes very tolerant and guesses at 03/04/2026. What can happen?"}, "opts": [{"da": "Alt går rigtigt igennem", "en": "Everything goes through correctly"}, {"da": "En dato kan blive læst forkert", "en": "A date can be read wrongly"}, {"da": "Datoen bliver afvist", "en": "The date is rejected"}], "a": 1, "why": {"da": "03/04/2026 kan være 3. april eller 4. marts. Gætter maskinen, kan den gætte forkert; spørger den, kan brugeren svare.", "en": "03/04/2026 can be 3 April or 4 March. If the machine guesses, it can guess wrong; if it asks, the user can answer."}}, "shows": {"da": "Forskellen på at afvise, spørge og gætte.", "en": "The difference between rejecting, asking and guessing."}, "notShows": {"da": "At tolerance altid er godt. At læse et format, der kun kan betyde én ting, er sjældent et problem; at gætte, når input kan betyde to ting, er risikabelt. Og over tid kan tolerance skjule fejl, til de er svære at rette.", "en": "That tolerance is always good. Reading a format that can only mean one thing is rarely a problem; guessing when input can mean two things is risky. And over time tolerance can hide errors until they are hard to fix."}, "counter": {"da": "Gæt ikke, når input kan betyde to ting. Her gætter indgangen, hvad 03/04/2026 betyder, og sender en forkert dato.", "en": "Do not guess when input can mean two things. Here the input guesses what 03/04/2026 means and sends a wrong date."}, "counterSet": 2, "related": [["tesler", {"da": "Hvem der bærer kompleksiteten", "en": "Who carries the complexity"}], ["mental-model", {"da": "Vis, hvordan systemet forstod det", "en": "Show how the system understood it"}]], "answerSet": 2, "loops": true}, {"id": "pareto", "no": "30", "g": 4, "name": {"da": "Pareto-princippet", "en": "Pareto Principle"}, "orig": "Pareto Principle (80/20)", "def": {"da": "For mange fænomener gælder, at en stor del af virkningerne kommer fra en lille del af årsagerne, ofte formuleret som 80/20. Tallene er en tommelfingerregel, ikke en naturlov.", "en": "For many phenomena, a large share of the effects comes from a small share of the causes, often put as 80/20. The numbers are a rule of thumb, not a law of nature."}, "design": {"da": ["Find de få funktioner og fejl, der rammer flest brugere, og begynd der.", "Brug dine egne data. Fordelingen er sjældent præcis 80/20."], "en": ["Find the few features and faults that affect most users, and start there.", "Use your own data. The distribution is rarely exactly 80/20."]}, "ev": "heuristic", "evWhy": {"da": "Det beskriver, at få årsager ofte står for de fleste virkninger i skæve fordelinger. 80/20 er en forkortelse, ikke en konstant. Joseph Juran, der gav princippet navn, skrev senere, at han havde sat det forkerte navn på det.", "en": "It describes how a few causes often account for most effects in skewed distributions. 80/20 is shorthand, not a constant. Joseph Juran, who named the principle, later wrote that he had given it the wrong name."}, "origin": ["Pareto, V. (1896–97). <i>Cours d’économie politique</i>. Lausanne.", "Juran, J. M. (1951). <i>Quality Control Handbook</i>. McGraw-Hill.", "Juran, J. M. (1974). The non-Pareto principle; mea culpa."], "links": [{"t": "Juran (1974): The Non-Pareto Principle; Mea Culpa", "u": "https://www.juran.com/wp-content/uploads/2021/03/The-Non-Pareto-Principle-1974.pdf"}, {"t": "Pareto principle (Wikipedia)", "u": "https://en.wikipedia.org/wiki/Pareto_principle"}], "model": {"da": ["Hver søjle er én årsag, og dens højde er dens andel af alle virkningerne. Stregerne på søjlen tæller virkningerne i stakke af ti. Søjlerne står sorteret, med den største først.", "Tavlen viser den kumulerede andel: hvor meget af virkningerne de første årsager står for tilsammen. Den stiplede diagonal er en jævn fordeling, hvor alle årsager er lige store.", "Grebet styrer, hvor skæv fordelingen er. Hvor kurven når 80 %, er de årsager, der står for det, farvet. Det er sjældent præcis 20 % af årsagerne: ved en jævn fordeling skal der omkring 80 % til, ved en meget skæv kun en eller to.", "80/20 er en forkortelse, ikke en konstant. Fordelingen i modellen er en potenslov med lidt fast spredning, og tallene er modellens. Virkelige data falder sjældent så jævnt."], "en": ["Each column is one cause, and its height is its share of all the effects. The lines on the column count the effects in stacks of ten. The columns stand sorted, largest first.", "The board shows the cumulative share: how much of the effects the first causes account for together. The dashed diagonal is an even distribution, where every cause is the same size.", "The handle sets how skewed the distribution is. Where the curve reaches 80 %, the causes that account for it are coloured. It is rarely exactly 20 % of the causes: with an even distribution it takes about 80 %, with a very skewed one only one or two.", "80/20 is shorthand, not a constant. The distribution in the model is a power law with a little fixed scatter, and the numbers are the model’s. Real data rarely fall off so smoothly."]}, "type": "simulation", "ev3": ["rule", "mixed", "caveat"], "predict": {"q": {"da": "Hvor stor en del af årsagerne står for 80 % af virkningerne?", "en": "What share of the causes accounts for 80% of the effects?"}, "opts": [{"da": "Altid 20 %", "en": "Always 20%"}, {"da": "Det afhænger af fordelingen", "en": "It depends on the distribution"}, {"da": "Altid 80 %", "en": "Always 80%"}], "a": 1, "why": {"da": "Ved en jævn fordeling skal der omkring 80 % af årsagerne til, ved en meget skæv kun en eller to. 80/20 er en forkortelse, ikke en konstant.", "en": "With an even distribution it takes about 80% of the causes, with a very skewed one only one or two. 80/20 is shorthand, not a constant."}}, "shows": {"da": "At få årsager kan stå for de fleste virkninger, når fordelingen er skæv.", "en": "That few causes can account for most effects when the distribution is skewed."}, "notShows": {"da": "Hvor alvorlige virkningerne er. Modellen tæller kun, hvor ofte noget sker.", "en": "How severe the effects are. The model only counts how often something happens."}, "counter": {"da": "Prioritér ikke kun efter hyppighed. En sjælden fejl, der sletter data, kan veje tungere end mange små irritationer.", "en": "Do not prioritise by frequency alone. A rare error that deletes data can outweigh many small irritations."}, "counterSet": null, "related": [["occam", {"da": "Det, der intet bidrager, kan fjernes", "en": "What contributes nothing can be removed"}], ["tesler", {"da": "Hvor indsatsen gør en forskel for brugeren", "en": "Where effort makes a difference for the user"}]], "answerSet": null, "loops": true}];

<script>/* m_activeuser.js */
/* m_activeuser.js — the paradox of the active user: a machine, a tip on the machine, and a manual on a shelf beside it.
   The stylus goes straight to the machine and does the task: three controls in turn. In each attempt it gets stuck at one of them.
   Where a tip sits on the machine, by the control, it uses the tip. Where there is none, it either fetches the manual or tries its way.
   The handle sets the length of the manual; the longer it is, the more rarely it is opened. The board counts what happened.
   How often the manual is opened is the model's assumption (an even spread of the chance over the round), not a measurement. */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models['active-user']=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr,num=TB.num;
  var g=new THREE.Group();
  function V(x,y,z){return [x,y,z];}

  /* ---- the machine ---- */
  var MX=-0.35,MZ=0.25,MW=3.2,MH=0.55,MD=2.2;
  g.add(K.solid(MW,MH,MD,{x:MX,y:MH/2,z:MZ}));
  var mName=K.plate('',{size:0.2,weight:600,color:pal.ink});mName.position.set(MX,MH/2,MZ+MD/2+0.002);g.add(mName);
  var CW=-0.35;
  var C=[{u:-1.0,w:0.5,h:0.15,d:0.5},{u:0,w:0.5,h:0.28,d:0.5},{u:1.0,w:0.72,h:0.09,d:0.26}].map(function(c,i){
    c.m=K.solid(c.w,c.h,c.d,{tone:TONE.white,x:MX+c.u,y:MH+c.h/2,z:MZ+CW});g.add(c.m);c.state='';
    var n=K.plate(String(i+1),{size:0.22,weight:700,color:pal.slate});n.rotation.x=-Math.PI/2;n.position.set(MX+c.u,MH+0.003,MZ+CW+c.d/2+0.22);g.add(n);
    return c;
  });
  function paint(c,s){if(c.state===s)return;c.state=s;c.m.setTone(s==='ok'?TONE.signal:s==='done'?TONE.focal:TONE.white);c.m.setEdge(s==='ok'?pal.signalShadow:s==='done'?pal.signal:pal.borderStrong);}
  /* the tip: a card on the machine, right by control 1 */
  /* a small sign standing just behind control 1 */
  var TIPU=-1.0,TIPW=CW-0.62,TIPH=0.62;
  var tip=K.solid(1.25,TIPH,0.05,{tone:TONE.white,x:MX+TIPU,y:MH+TIPH/2,z:MZ+TIPW});g.add(tip);
  var tipT=K.plate('',{size:0.16,weight:600,color:pal.ink,lead:1.15});tipT.position.set(MX+TIPU,MH+TIPH/2,MZ+TIPW+0.027);g.add(tipT);
  var tipOn=null;function tipState(on){if(on===tipOn)return;tipOn=on;tip.setTone(on?TONE.focal:TONE.white);tip.setEdge(on?pal.signal:pal.borderStrong);}

  /* ---- the shelf and the manual ---- */
  var SX=-3.4,SZ=-0.75,SH=1.25;
  g.add(K.solid(1.3,SH,1.05,{x:SX,y:SH/2,z:SZ}));
  var sName=K.plate('',{size:0.17,weight:600,color:pal.ink});sName.position.set(SX,SH*0.62,SZ+0.526);g.add(sName);
  var sPages=K.plate('',{size:0.17,weight:400,color:pal.slate});sPages.position.set(SX,SH*0.38,SZ+0.526);g.add(sPages);
  var BW=0.9,BD=1.0,book=K.solid(BW,1,BD,{tone:TONE.white,x:SX,z:SZ});g.add(book);
  var hinge=new THREE.Group();g.add(hinge);
  var cover=K.solid(BW,0.02,BD,{tone:TONE.paper,x:BW/2});hinge.add(cover);hinge.visible=false;
  var bookH=0.1;

  function thick(p){return 0.03+0.0017*p;}

  var GX=3.25,GZ=-0.55,GW=2.6,GH=2.8,FZ=GZ+0.071;
  g.add(K.solid(GW,GH,0.14,{x:GX,y:GH/2,z:GZ}));
  var X0=GX-GW/2+0.22,title=K.plate('',{size:0.19,weight:700,color:pal.ink});g.add(title);
  var ROWY=[2.0,1.3,0.6],rowT=ROWY.map(function(y){var p=K.plate('',{size:0.18,weight:600,color:pal.slate});g.add(p);return p;});
  var marks=[[],[],[]],mMat=K.flat(pal.ink),mSig=K.flat(pal.signal);
  function addMark(r){var n=marks[r].length,q=K.quad(0.24,0.24,mMat,X0+0.12+n*0.34,ROWY[r]-0.33,FZ+0.003);g.add(q);marks[r].push(q);}
  function clearMarks(){marks.forEach(function(a){a.forEach(function(q){g.remove(q);});a.length=0;});}

  /* ---- the stylus ---- */
  var PL=1.1,pen=K.solid(0.08,PL,0.08,{tone:TONE.dark,edge:pal.midnight});g.add(pen);
  function setPen(p){penAt=p;pen.position.set(p[0],p[1]+PL/2,p[2]);}

  /* ---- the attempts ---- */
  var HOV=MH+0.5,REST=V(MX,MH+1.1,MZ+MD/2+0.4),TRAVEL=2.1,SPEED=6,penAt=REST;
  var STUCK=[1,0,2,1],N=STUCK.length;   /* where it gets stuck in each attempt of a round; control 0 has the tip */
  var pages=2,pFrom=2,pTo=2,pk=1,auto=true,AUTO=[2,30,300],ai=0,acc=0.5,att=0,run=null,lastI=-1,phase='run',pt=0,result=[0,0,0];
  function pOpen(p){return 0.6/(1+p/12);}
  function cp(c){return [MX+c.u,0,MZ+CW];}
  function script(stuckAt,how,last){
    var S=[],cur=penAt.slice(),tot=0;
    function seg(b,d,o){S.push({a:cur,b:b,d:d,t0:tot,o:o||{}});tot+=d;cur=b;}
    function mv(b,o){var dx=b[0]-cur[0],dy=b[1]-cur[1],dz=b[2]-cur[2],L=Math.sqrt(dx*dx+dy*dy+dz*dz);seg(b,L<0.01?0.04:Math.max(0.24,L/SPEED),o);}
    function press(c,ci,ok,off){
      var p=cp(c),x=p[0]+(off||0),top=MH+c.h+0.004;
      mv([x,HOV,p[2]]);seg([x,top,p[2]],0.11);seg([x,top,p[2]],0.14,ok?{ok:ci}:{});seg([x,HOV,p[2]],0.11,ok?{done:ci}:{});
    }
    C.forEach(function(c,ci){
      if(ci!==stuckAt){press(c,ci,true);return;}
      press(c,ci,false);seg(cur,0.22);
      if(how===0){
        var tx=MX+TIPU,tz=MZ+TIPW;
        var ty=MH+TIPH+0.01,th=ty+0.35;mv([tx,th,tz],{tally:0});seg([tx,ty,tz],0.14,{tip:true});seg([tx,ty,tz],0.55,{tip:true});seg([tx,th,tz],0.14,{tipOff:true});
        press(c,ci,true);
      }else if(how===1){
        var hx=SX+0.1,hz=SZ+0.1,top=SH+bookH+0.02;
        mv([cur[0],TRAVEL,cur[2]],{tally:1});mv([hx,TRAVEL,hz]);
        seg([hx,TRAVEL,hz],0.35,{open:1});seg([hx,top,hz],0.2);seg([hx,top,hz],0.85);seg([hx,TRAVEL,hz],0.2);seg([hx,TRAVEL,hz],0.3,{open:-1});
        var p=cp(c);mv([p[0],TRAVEL,p[2]]);press(c,ci,true);
      }else{
        press(c,ci,false,-0.12);seg(cur,0.1,{tally:2});press(c,ci,false,0.12);seg(cur,0.1);press(c,ci,true);
      }
    });

    return {S:S,T:tot};
  }
  function decide(){
    var s=STUCK[att];
    if(s===0)return 0;
    acc+=pOpen(pTo);if(acc>=1){acc-=1;return 1;}
    return 2;
  }
  function startAttempt(){
    run=script(STUCK[att],decide(),att===N-1);run.t=0;lastI=-1;C.forEach(function(c){paint(c,'');});tipState(false);
  }
  function startRound(){att=0;acc=0.5;clearMarks();result=[0,0,0];startAttempt();phase='run';pt=0;}
  function ev(sg,start){
    var o=sg.o;
    if(start&&o.ok!==undefined)paint(C[o.ok],'ok');
    if(!start&&o.done!==undefined)paint(C[o.done],'done');
    if(start&&o.tip)tipState(true);
    if(start&&o.tipOff)tipState(false);
    if(start&&o.tally!==undefined){addMark(o.tally);result[o.tally]++;if(api&&api.onUi)api.onUi();}

    if(!start&&o.open===-1){hinge.visible=false;hinge.rotation.z=0;}
  }
  function stepRun(dt){

    while(i<S.length-1&&t>S[i].t0+S[i].d)i++;
    for(q=lastI+1;q<=i;q++){if(q>0)ev(S[q-1],false);ev(S[q],true);}
    lastI=Math.max(lastI,i);
    var sg=S[i],u=Math.min(1,Math.max(0,(t-sg.t0)/sg.d)),e=K.ease(u);
    setPen([sg.a[0]+(sg.b[0]-sg.a[0])*e,sg.a[1]+(sg.b[1]-sg.a[1])*e,sg.a[2]+(sg.b[2]-sg.a[2])*e]);
    if(sg.o.open===1)hinge.rotation.z=Math.PI*0.9*e;
    if(sg.o.open===-1)hinge.rotation.z=Math.PI*0.9*(1-e);
    if(t>=S[S.length-1].t0+S[S.length-1].d){ev(S[S.length-1],false);return true;}
    return false;
  }
  function setPages(p,fromAuto){
    p=Math.max(2,Math.min(300,Math.round(p)));
    if(p===pTo&&pk>=1&&!fromAuto)return;
    pFrom=pages;pTo=p;pk=0;
    hinge.visible=false;hinge.rotation.z=0;
    startRound();texts();
    if(api&&api.onUi)api.onUi();
  }

  function texts(){
    mName.setText(tr({da:'Maskinen',en:'The machine'}));
    tipT.setText(tr({da:['Tip:','hold nede i 2 s'],en:['Tip:','hold for 2 s']}));
    sName.setText(tr({da:'Manual',en:'Manual'}));
    sPages.setText(pTo+tr({da:' sider',en:' pages'}));
    title.setText(tr({da:'Når pennen går i stå',en:'When the stylus is stuck'}));title.position.set(X0+title.w/2,GH-0.3,FZ+0.002);
    var R=tr({da:['Tip på maskinen','Henter manualen','Prøver sig frem'],en:['Tip on the machine','Fetches the manual','Trial and error']});
    rowT.forEach(function(p,i){p.setText(R[i]);p.position.set(X0+p.w/2,ROWY[i],FZ+0.002);});
  }
  /* counts for a whole round, worked out the same way the round plays them */
  function plan(p){var a=0.5,r=[0,0,0];STUCK.forEach(function(s){if(s===0){r[0]++;return;}a+=pOpen(p);if(a>=1){a-=1;r[1]++;}else r[2]++;});return r;}

  setBook(thick(pages));texts();setPen(REST);startRound();
  var api={group:g,onUi:null,
    box:function(){return [[-4.15,0,-1.4],[4.65,3.0,1.9]];},
    update:function(dt){
      if(pk<1){pk=Math.min(1,pk+dt/0.8);pages=pFrom+(pTo-pFrom)*K.ease(pk);setBook(thick(pages));}
      pt+=dt;
      if(phase==='run'){
        if(stepRun(dt)){att++;if(att>=N){phase='hold';pt=0;}else startAttempt();}
      }else if(phase==='hold'){
        if(pt>=3.0){if(auto){ai=(ai+1)%AUTO.length;setPages(AUTO[ai],true);}else startRound();}
      }
    },
    relabel:texts,
    ui:{
      label:function(){return tr({da:'Manualens længde',en:'Length of the manual'});},
      ends:function(){return tr({da:['2 sider','300 sider'],en:['2 pages','300 pages']});},
      min:0,max:100,step:1,
      value:function(){return Math.round(100*Math.log(pTo/2)/Math.log(150));},
      set:function(v){auto=false;setPages(2*Math.pow(150,v/100));},
      readout:function(){
        var r=plan(pTo),no=r[1]+r[2];
        return tr({da:'Manual på '+pTo+' sider · hentet '+r[1]+' af '+no+' gange uden tip',en:pTo+'-page manual · fetched '+r[1]+' of '+no+' times with no tip'});
      },
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;if(auto)ai=Math.max(0,AUTO.indexOf(pTo));}
    }
  };
  return api;
};
})();

</script>
<script>/* m_aesthetic-usability.js */
/* m_aesthetic-usability.js — the aesthetic-usability effect with two cash machines, as in Kurosu & Kashimura (1995).
   Machine A and machine B have the same keys, the same screen and the same fault: the OK key sits far from the keypad, in the top corner.
   A is untidy. The handle tidies B: its keys line up, take one size and one tone, and the screen straightens. Nothing moves to a better place.
   Two pens use the machines in step: four digits, then the long way up to OK. The work is the same on both.
   The board shows three gauges, A beside B: expected usability before use follows the handle; measured usability does not move (the model's
   assumption, since function and faults are the same); and the rating after use is drawn as a dashed range, because the studies disagree there.
   Heights are schematic; they are the model's, not data. */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models['aesthetic-usability']=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr;
  var g=new THREE.Group();
  var PY=0.3,BH=3.0,BD=0.6,MZ=-0.3,FZ=MZ+BD/2;

  /* ---- a machine: plinth, body, screen, a 3 x 4 keypad and the OK key in the wrong place ---- */
  var KP=0.36,KS=0.27,KD=0.09,KX=-0.05,KY=PY+1.6;
  var LABELS=['1','2','3','4','5','6','7','8','9','*','0','#'];
  var MESSY=[TONE.paper,TONE.region,TONE.rule,TONE.slate],rnd=K.rng(7),mess=[];
  /* the untidiness, drawn once and shared, so that B at zero is exactly A */
  for(var i=0;i<14;i++)mess.push({dx:(rnd()-0.5)*0.14,dy:(rnd()-0.5)*0.12,rot:(rnd()-0.5)*0.5,sc:0.82+rnd()*0.32,tone:MESSY[Math.floor(rnd()*4)],at:0.15+rnd()*0.7});
  /* untidy, but each key keeps to its own cell: turned, scaled and shifted only as far as it can go without reaching a neighbour,
     so no key ever lies over another */
  var EMAX=KP/2-0.02;
  for(i=0;i<12;i++){var q=mess[i],e=q.sc*KS/2*(Math.cos(q.rot)+Math.abs(Math.sin(q.rot)));if(e>EMAX){q.sc*=EMAX/e;e=EMAX;}
    var room=EMAX-e;q.dx=Math.max(-room,Math.min(room,q.dx));q.dy=Math.max(-room,Math.min(room,q.dy));}
  mess[12]={dx:0.12,dy:-0.07,rot:-0.07,sc:1,tone:TONE.dark,at:2};
  mess[13].tone=TONE.region;
  function machine(x,letter,signalLetter){
    var m={x:x,keys:[],t:-1};
    g.add(K.solid(2.3,PY,1.5,{x:x,y:PY/2,z:MZ+0.25}));
    var lp=K.plate(letter,{size:0.24,weight:700,color:signalLetter?pal.signalShadow:pal.ink});lp.position.set(x,PY/2,MZ+1.001);g.add(lp);
    g.add(K.solid(2.0,BH,BD,{x:x,y:PY+BH/2,z:MZ}));
    var scr=K.solid(1.1,0.62,0.05,{tone:TONE.dark,edge:pal.midnight});g.add(scr);m.scr={m:scr,bx:x+0.15,by:PY+2.3,z:FZ+0.025,ms:mess[12]};
    for(var k=0;k<13;k++){
      var ok=k===12,w=ok?0.42:KS,key=K.solid(w,KS,KD,{tone:TONE.paper});g.add(key);
      var pl=K.plate(ok?'OK':LABELS[k],{size:ok?0.13:0.14,weight:600,color:pal.ink});pl.position.z=KD/2+0.002;key.add(pl);
      /* the fault, the same on both machines: OK sits in the top corner, far from the keypad */
      var bx=ok?x-0.62:x+KX+(k%3-1)*KP,by=ok?PY+BH-0.22:KY-Math.floor(k/3)*KP;
      m.keys.push({m:key,pl:pl,bx:bx,by:by,ms:mess[ok?13:k],tone:null,press:0});
    }
    return m;
  }
  function tidy(m,t){
    if(t===m.t)return;m.t=t;var u=1-t;
    m.keys.forEach(function(k,i){
      var s=k.ms;k.m.position.set(k.bx+s.dx*u,k.by+s.dy*u,FZ+KD/2-k.press);k.m.rotation.z=s.rot*u;var sc=1+(s.sc-1)*u;k.m.scale.set(sc,sc,1);
      var tn=t>=s.at?TONE.paper:s.tone;if(tn!==k.tone){k.tone=tn;k.m.setTone(tn);k.m.setEdge(tn===TONE.slate?pal.dusk:pal.borderStrong);k.pl.setText(k.pl.lastText||'',{color:tn===TONE.slate?pal.white:pal.ink});}
    });
    var s=m.scr.ms;m.scr.m.position.set(m.scr.bx+s.dx*u,m.scr.by+s.dy*u,m.scr.z);m.scr.m.rotation.z=s.rot*u;
  }
  var A=machine(-3.15,'A',false),B=machine(-0.45,'B',true);
  [A,B].forEach(function(m){m.keys.forEach(function(k,i){k.pl.lastText=i===12?'OK':LABELS[i];});});

  /* ---- the pens: the same task on both machines, in step ---- */
  var TASK=[0,4,8,10,12],SEQ=[],tt=0;
  (function(){
    var hold=0.5;SEQ.push({k:TASK[0],t0:0,t1:0.8});tt=0.8;
    for(var j=0;j<TASK.length;j++){
      SEQ.push({tap:TASK[j],t0:tt,t1:tt+0.24});tt+=0.24;
      if(j<TASK.length-1){var far=TASK[j+1]===12;SEQ.push({from:TASK[j],k:TASK[j+1],t0:tt,t1:tt+(far?1.25:0.42)});tt+=far?1.25:0.42;}
    }
    SEQ.push({rest:1,t0:tt,t1:tt+1.3});tt+=1.3;
  })();
  var CYCLE=tt,clock=0,HOVER=0.32;
  function pen(m){var p=K.solid(0.07,0.07,0.6,{tone:TONE.dark,edge:pal.midnight});g.add(p);m.pen=p;m.from=null;return p;}
  pen(A);pen(B);
  function keyFront(m,k){var key=m.keys[k];return [key.m.position.x,key.m.position.y,FZ+KD];}
  function placePen(m,x,y,gap){m.pen.position.set(x,y,FZ+KD+gap+0.3);}
  function stepPens(dt){
    clock=(clock+dt)%CYCLE;
    var cur=null;for(var j=0;j<SEQ.length;j++)if(clock>=SEQ[j].t0&&clock<SEQ[j].t1){cur=SEQ[j];break;}
    if(!cur)cur=SEQ[SEQ.length-1];
    var u=(clock-cur.t0)/(cur.t1-cur.t0);
    [A,B].forEach(function(m){
      m.keys.forEach(function(k){if(k.press){k.press=0;k.m.position.z=FZ+KD/2;}});
      if(cur.tap!==undefined){
        var f=keyFront(m,cur.tap),d=Math.sin(Math.PI*u);placePen(m,f[0],f[1],HOVER*(1-d));
        var key=m.keys[cur.tap];key.press=0.04*d;key.m.position.z=FZ+KD/2-key.press;
      }else if(cur.rest){
        var e=keyFront(m,12),h=K.ease(u),s0=keyFront(m,TASK[0]);placePen(m,e[0]+(s0[0]-e[0])*h,e[1]+(s0[1]-e[1])*h,HOVER+0.5*Math.sin(Math.PI*h));
      }else{
        var a=cur.from!==undefined?keyFront(m,cur.from):keyFront(m,TASK[0]),b=keyFront(m,cur.k),q=K.ease(Math.min(1,u));
        placePen(m,a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q,HOVER);
      }
    });
  }

  /* ---- the board: three gauges, A beside B ---- */
  var GX=3.55,GZ=-0.3,GW=3.1,GH=3.35,GF=GZ+0.07;
  g.add(K.solid(3.3,PY,1.3,{x:GX,y:PY/2,z:GZ+0.3}));
  g.add(K.solid(GW,GH,0.14,{x:GX,y:PY+GH/2,z:GZ}));
  var Y0=PY+1.05,UNIT=0.85,BW=0.28,CX=[GX-1.0,GX,GX+1.0];
  var base=[];CX.forEach(function(c){base.push([c-0.42,Y0,GF+0.002,c+0.42,Y0,GF+0.002]);});
  g.add(K.lines(base,{color:pal.ink}));
  function bar(x,tone,edge){var b=K.solid(BW,1,0.1,{tone:tone,edge:edge,x:x,z:GF+0.05});g.add(b);return b;}
  function setBar(b,h){b.scale.y=Math.max(0.001,h);b.position.y=Y0+h/2;b.visible=h>0.003;}
  var bars=CX.map(function(c){return {a:bar(c-0.17,TONE.paper,pal.borderStrong),b:bar(c+0.17,TONE.signal,pal.signalShadow)};});
  /* after use, B is a range: from no effect of looks (level with A) to some effect. A soft box with dashed edges. */
  var band=K.solid(BW,1,0.1,{tone:TONE.soft,edge:null,x:CX[1]+0.17,z:GF+0.05});g.add(band);
  band.add(K.lines(K.boxEdges(BW,1,0.1),{color:pal.signal,dash:[4,3],width:1.25}));
  var texts=[],title=K.plate('',{size:0.17,weight:700,color:pal.ink});g.add(title);
  CX.forEach(function(c){
    ['A','B'].forEach(function(l,j){var p=K.plate(l,{size:0.14,weight:700,color:j?pal.signalShadow:pal.slate});p.position.set(c+(j?0.17:-0.17),Y0-0.15,GF+0.002);g.add(p);});
    var p=K.plate('',{size:0.15,weight:600,color:pal.ink,align:'center',lead:1.25});p.position.set(c,Y0-0.55,GF+0.002);g.add(p);texts.push(p);
  });
  /* schematic values: expected before use follows looks; measured does not move; after use is a range from no effect to some effect */
  function vals(t){return {expA:1.0,expB:1.0+0.95*t,aftA:1.35,aftLo:1.35,aftHi:1.35+0.6*t,mesA:1.5,mesB:1.5};}
  function gauges(t){
    var v=vals(t);
    setBar(bars[0].a,v.expA*UNIT);setBar(bars[0].b,v.expB*UNIT);
    setBar(bars[1].a,v.aftA*UNIT);setBar(bars[1].b,v.aftLo*UNIT);
    setBar(bars[2].a,v.mesA*UNIT);setBar(bars[2].b,v.mesB*UNIT);
    var y0=Y0+v.aftLo*UNIT,h=(v.aftHi-v.aftLo)*UNIT;
    band.visible=h>0.01;band.scale.y=Math.max(0.001,h);band.position.y=y0+h/2;
  }
  function relabel(){
    title.setText(tr({da:'Brugbarhed, skematisk',en:'Usability, schematic'}));title.position.set(GX-GW/2+0.3+title.w/2,PY+GH-0.3,GF+0.002);
    var L=[{da:['Forventet','før brug'],en:['Expected','before use']},{da:['Vurderet','efter brug'],en:['Rated','after use']},{da:['Målt','under brug'],en:['Measured','in use']}];
    texts.forEach(function(p,i){p.setText(tr(L[i]));});
  }

  var t=0,auto=true,KEYS=[0,0.5,1,0.5],ki=0,hold=0,from=t,to=t,mk=1,HOLD=4.2,MOVE=1.6;
  function goTo(v){from=t;to=v;mk=0;}
  function apply(){tidy(B,t);gauges(t);}
  tidy(A,0);apply();relabel();stepPens(0);
  var api={group:g,onUi:null,
    box:function(){return [[-4.5,0,-0.9],[5.2,PY+GH,1.6]];},
    update:function(dt){
      if(mk<1){mk=Math.min(1,mk+dt/MOVE);t=from+(to-from)*K.ease(mk);apply();}
      else if(auto){hold+=dt;if(hold>=HOLD){hold=0;ki=(ki+1)%KEYS.length;goTo(KEYS[ki]);}}
      stepPens(dt);
    },
    relabel:relabel,
    ui:{
      label:function(){return tr({da:'Hvor ryddelig maskine B er',en:'How tidy machine B is'});},
      ends:function(){return tr({da:['Rodet som A','Ryddelig'],en:['Messy like A','Tidy']});},
      min:0,max:100,step:1,
      value:function(){return Math.round(t*100);},
      set:function(v){auto=false;mk=1;t=v/100;apply();if(api&&api.onUi)api.onUi();},
      readout:function(){
        var same=t<0.02;
        return tr({da:'Forventet: ',en:'Expected: '})+(same?tr({da:'ens',en:'the same'}):tr({da:'B over A',en:'B above A'}))+
          tr({da:' · efter brug: ',en:' · after use: '})+(same?tr({da:'ens',en:'the same'}):tr({da:'uafklaret',en:'unsettled'}))+
          tr({da:' · målt: ens',en:' · measured: the same'});
      },
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;hold=0;}
    }
  };
  return api;
};
})();

</script>
<script>/* m_choice-overload.js */
/* m_choice-overload.js — choice overload as a shelf of variants, two gauges and an uncertain net.
   The shelf holds n variants. The focus compares them one by one and then takes the best one.
   Two gauges show both sides: the chance that a good match is on the shelf (rises, but less and less),
   and the time spent comparing (grows with every variant).
   The board shows the net, gain minus cost, compared with a shelf of two. It is drawn as a dashed band, not a line:
   how heavily comparing weighs depends on the conditions (how hard the choice is, how clear the wants are),
   and the research does not agree on when the cost outweighs the gain. All numbers are the model's. */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models['choice-overload']=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr,num=TB.num;
  var g=new THREE.Group(),rnd=K.rng(2000);
  /* the model: each variant is a good match with probability Q; comparing takes DT seconds per variant.
     The net is gain minus a weighted cost, with the weight between W_LO (easy choice, clear wants) and W_HI (hard choice, unclear wants). */
  var Q=0.08,DT=0.17,W_LO=0.15,W_HI=1.5,NMIN=2,NMAX=30;
  function chance(n){return 1-Math.pow(1-Q,n);}
  function gain(n){return chance(n)-chance(NMIN);}
  function cost(n){return (n-NMIN)/(NMAX-NMIN);}
  function netHi(n){return gain(n)-W_LO*cost(n);}
  function netLo(n){return gain(n)-W_HI*cost(n);}

  /* ---- the shelf ---- */
  var SX=-3.25,SZ=-0.95,SW=3.7,SH=3.0,ROWY=[1.19,2.09,0.29],VZ=-0.45,PITCH=0.34;
  g.add(K.solid(SW,SH,0.12,{x:SX,y:SH/2,z:SZ}));
  ROWY.forEach(function(y){g.add(K.solid(SW,0.08,0.86,{x:SX,y:y-0.04,z:SZ+0.06+0.43}));});
  var vars=[],i;
  for(i=0;i<NMAX;i++){
    var h=0.32+0.2*((i*0.618034+0.31)%1),m=K.solid(0.24,h,0.3,{tone:TONE.white,edge:pal.slate});m.visible=false;g.add(m);
    vars.push({m:m,h:h,x:SX,fx:SX,tx:SX,y:0,s:0,fs:0,ts:0,fit:0,pull:0,lit:0});
  }
  function slot(k,n){var r=Math.floor(k/10),inRow=Math.min(10,n-r*10),c=k-r*10;return {x:SX+(c-(inRow-1)/2)*PITCH,y:ROWY[r]};}
  function placeVar(v){
    var s=Math.max(0.001,v.s);v.m.visible=v.s>0.01;v.m.scale.set(s,s,s);
    v.m.position.set(v.x,v.y+v.h*s/2,VZ+v.pull*0.32);
  }
  function tone(v,t){if(v.lit===t)return;v.lit=t;v.m.setTone(t===2?TONE.signal:TONE.white);v.m.setEdge(t===2?pal.signalShadow:pal.slate);}
  var frame=K.lines(K.boxEdges(1,1,1),{color:pal.signal,width:1.5});g.add(frame);frame.visible=false;
  /* the frame around the chosen jar stands a little above the shelf, so its lower edge is seen whole and does not run into the board */
  var FB=0.03,FT=0.1;
  function frameOn(v){frame.visible=true;frame.scale.set(0.34,v.h+FT-FB,0.42);frame.position.set(v.x,v.y+FB+(v.h+FT-FB)/2,VZ+v.pull*0.32);}

  /* ---- the two gauges ---- */
  var GZ=0.65,PH=0.32,TH=2.6,X1=-0.4,X2=1.0;
  [X1,X2].forEach(function(x){g.add(K.solid(1.2,PH,1.2,{x:x,y:PH/2,z:GZ}));var t=K.lines(K.boxEdges(0.9,TH,0.9),{color:pal.slate});t.position.set(x,PH+TH/2,GZ);g.add(t);});
  var fill1=K.solid(0.88,1,0.88,{tone:TONE.paper,edge:pal.slate,x:X1,z:GZ}),fill2=K.solid(0.88,1,0.88,{tone:TONE.paper,edge:pal.slate,x:X2,z:GZ});g.add(fill1);g.add(fill2);
  function setFill(f,k){var h=Math.max(0.001,TH*Math.min(1,k));f.scale.y=h;f.position.y=PH+h/2;f.visible=k>0.003;}
  var v1=K.plate('',{size:0.2,weight:700,color:pal.ink}),v2=K.plate('',{size:0.2,weight:700,color:pal.ink});
  v1.position.set(X1,PH/2,GZ+0.601);v2.position.set(X2,PH/2,GZ+0.601);g.add(v1);g.add(v2);
  var l1=K.plate('',{size:0.18,weight:600,color:pal.ink,align:'center'}),l2=K.plate('',{size:0.18,weight:600,color:pal.ink,align:'center'});
  [l1,l2].forEach(function(p){p.rotation.x=-Math.PI/2;g.add(p);});

  /* ---- the board: the net, as a band ---- */
  var BX=3.75,BZ=0.2,BW=2.8,BH=3.6,FZ=BZ+0.071;
  g.add(K.solid(BW,BH,0.14,{x:BX,y:BH/2,z:BZ}));
  var ax0=BX-BW/2+0.5,ax1=BX+BW/2-0.2,ay0=0.8,ay1=3.0,az=(ay0+ay1)/2;
  function bx(n){return ax0+(ax1-ax0)*(n-NMIN)/(NMAX-NMIN);}
  function by(v){return az+0.82*(ay1-ay0)/2*Math.max(-1,Math.min(1,v));}
  var ax=[[ax0,ay0,FZ,ax0,ay1,FZ],[ax0,ay0,FZ,ax1,ay0,FZ]];
  [2,10,20,30].forEach(function(n){ax.push([bx(n),ay0,FZ,bx(n),ay0-0.06,FZ]);});
  g.add(K.lines(ax,{color:pal.ink}));
  /* zero: as good as a shelf of two */
  g.add(K.lines([[ax0,az,FZ+0.002,ax1,az,FZ+0.002]],{color:pal.slate}));
  /* the band: filled faintly, edged with dashes cut along the curve */
  var hi=[],lo=[],k,STEP=56;
  for(k=0;k<=STEP;k++){var n=NMIN+(NMAX-NMIN)*k/STEP;hi.push([bx(n),by(netHi(n))]);lo.push([bx(n),by(netLo(n))]);}
  var pos=[];
  for(k=0;k<STEP;k++){var a=hi[k],b=hi[k+1],c=lo[k],d=lo[k+1];pos.push(a[0],a[1],FZ+0.001,c[0],c[1],FZ+0.001,b[0],b[1],FZ+0.001,b[0],b[1],FZ+0.001,c[0],c[1],FZ+0.001,d[0],d[1],FZ+0.001);}
  var bg=new THREE.BufferGeometry();bg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
  g.add(new THREE.Mesh(bg,K.flat(pal.white,{side:THREE.DoubleSide})));
  function dashed(p,on,off){
    var s=[],j,run=0,draw=true,left=on;
    for(j=0;j<p.length-1;j++){
      var x0=p[j][0],y0=p[j][1],x1=p[j+1][0],y1=p[j+1][1],L=Math.sqrt((x1-x0)*(x1-x0)+(y1-y0)*(y1-y0)),u=0;
      while(u<L){var st=Math.min(left,L-u),xa=x0+(x1-x0)*u/L,ya=y0+(y1-y0)*u/L,xb=x0+(x1-x0)*(u+st)/L,yb=y0+(y1-y0)*(u+st)/L;
        if(draw)s.push([xa,ya,FZ+0.003,xb,yb,FZ+0.003]);u+=st;left-=st;if(left<=1e-6){draw=!draw;left=draw?on:off;}}
    }
    return s;
  }
  g.add(K.lines(dashed(hi,0.07,0.05).concat(dashed(lo,0.07,0.05)),{color:pal.ink}));
  /* now: the range of outcomes at the current number of variants */
  var cur=K.lines([],{color:pal.signal,width:2.5});g.add(cur);
  var guide=K.lines([],{color:pal.signalSoft});g.add(guide);
  var texts=[];
  function txt(o,x,y,align){var p=K.plate('',o);g.add(p);var r={p:p,x:x,y:y,align:align};texts.push(r);return r;}
  function clearOf(r,curve,dir){
    var x0=r.p.position.x-r.p.w/2,x1=r.p.position.x+r.p.w/2,y=dir>0?-1e9:1e9;
    curve.forEach(function(q){if(q[0]>=x0-0.05&&q[0]<=x1+0.05)y=dir>0?Math.max(y,q[1]):Math.min(y,q[1]);});
    r.p.position.y=y+dir*(r.p.h/2+0.06);
  }
  function setT(r,t){r.p.setText(t);r.p.position.set(r.x+(r.align==='r'?-r.p.w/2:r.align==='l'?r.p.w/2:0),r.y,FZ+0.004);}
  var title=txt({size:0.16,weight:700,color:pal.ink},ax0-0.35,BH-0.22,'l');
  var tUp=txt({size:0.13,weight:600,color:pal.slate},ax0-0.08,ay1-0.08,'r'),tDn=txt({size:0.13,weight:600,color:pal.slate},ax0-0.08,ay0+0.1,'r'),t0=txt({size:0.13,weight:400,color:pal.slate},ax0-0.08,az,'r');
  var nl=[2,10,20,30].map(function(n){return txt({size:0.13,weight:400,color:pal.slate},bx(n),ay0-0.17,'c');});
  var xl=txt({size:0.13,weight:600,color:pal.slate},ax1,ay0-0.38,'r');
  /* the guide to the current number may pass behind these labels, so they are set on the board's own colour */
  var eHi=txt({size:0.13,weight:600,color:pal.ink,bg:pal.chip,padX:0.04},ax1,by(netHi(NMAX))+0.17,'r'),eLo=txt({size:0.13,weight:600,color:pal.ink,bg:pal.chip,padX:0.04},ax1,by(netLo(NMAX))-0.17,'r');

  /* ---- the cycle: compare one by one, take the best, hold, put it back ---- */
  var N=6,auto=true,SEQ=[6,12,20,30,2],si=0,phase='scan',pt=0,ci=0,best=null,tUsed=0,lk=1,chF=chance(N),chFrom=chF,chK=1;
  function deal(){vars.forEach(function(v,j){v.fit=j<N?rnd():0;});}
  function layout(first){
    vars.forEach(function(v,j){var p=slot(Math.min(j,N-1),N);v.fx=v.x;v.fs=v.s;
      if(j<N){v.tx=p.x;v.y=p.y;v.ts=1;if(first||v.s<0.01){v.x=v.fx=p.x;}}else{v.ts=0;}
      if(first){v.x=v.tx;v.s=v.ts;}
    });
    lk=first?1:0;
  }
  function start(){
    vars.forEach(function(v){tone(v,0);v.pull=0;});deal();phase='scan';pt=0;ci=0;best=null;tUsed=0;frame.visible=false;texts2();
  }
  function setN(n,fromAuto){
    n=Math.max(NMIN,Math.min(NMAX,Math.round(n)));if(n===N)return;N=n;layout(false);
    chFrom=chF;chK=0;start();marks();if(api&&api.onUi)api.onUi();
  }
  function update(dt){
    if(lk<1){lk=Math.min(1,lk+dt/0.5);var e=K.ease(lk);vars.forEach(function(v){v.x=v.fx+(v.tx-v.fx)*e;v.s=v.fs+(v.ts-v.fs)*e;});}
    if(chK<1){chK=Math.min(1,chK+dt/0.6);chF=chFrom+(chance(N)-chFrom)*K.ease(chK);setFill(fill1,chF);}
    pt+=dt;
    if(phase==='scan'){
      if(lk<1){pt=0;}
      else{
        var c2=Math.min(N-1,Math.floor(pt/DT));if(c2!==ci||pt<dt*1.5){ci=c2;v2.setText(num((ci+1)*DT,1)+' s');}
        frameOn(vars[ci]);tUsed=Math.min(N*DT,pt);setFill(fill2,tUsed/(NMAX*DT));
        if(pt>=N*DT){phase='pick';pt=0;best=vars[0];for(var j=1;j<N;j++)if(vars[j].fit>best.fit)best=vars[j];tUsed=N*DT;texts2();}
      }
    }else if(phase==='pick'){
      var u=K.ease(Math.min(1,pt/0.5));best.pull=u;frameOn(best);tone(best,2);
      if(pt>=0.5){phase='hold';pt=0;}
    }else if(phase==='hold'){
      if(pt>=2.6){phase='back';pt=0;frame.visible=false;}
    }else if(phase==='back'){
      var w=Math.min(1,pt/0.5),f=K.ease(w);best.pull=1-f;setFill(fill2,(tUsed/(NMAX*DT))*(1-f));
      if(w>=1){tone(best,0);if(auto){si=(si+1)%SEQ.length;setN(SEQ[si],true);}if(phase==='back')start();}
    }
    vars.forEach(placeVar);
  }
  function marks(){
    var lo=netLo(N),hh=netHi(N),x=bx(N);
    cur.set([[x,by(lo),FZ+0.005,x,by(hh),FZ+0.005]]);
    guide.set([[x,ay0,FZ+0.002,x,by(lo),FZ+0.002],[x,by(hh),FZ+0.002,x,ay1,FZ+0.002]]);
  }
  function texts2(){
    v1.setText(Math.round(100*chance(N))+' %');
    v2.setText(num(tUsed,1)+' s');
  }
  function relabel(){
    l1.setText(tr({da:['Chance for et','godt match'],en:['Chance of a','good match']}));l2.setText(tr({da:['Tid til at','sammenligne'],en:['Time spent','comparing']}));
    l1.position.set(X1,0.006,GZ+0.6+0.12+l1.h/2);l2.position.set(X2,0.006,GZ+0.6+0.12+l2.h/2);
    setT(title,tr({da:'Netto: gevinst minus omkostning',en:'Net: gain minus cost'}));
    setT(tUp,tr({da:'bedre',en:'better'}));setT(tDn,tr({da:'værre',en:'worse'}));setT(t0,'0');
    nl.forEach(function(r,j){setT(r,String([2,10,20,30][j]));});
    setT(xl,tr({da:'antal varianter',en:'number of variants'}));
    setT(eHi,tr({da:'let valg, klare ønsker',en:'easy choice, clear wants'}));
    setT(eLo,tr({da:'svært valg, uklare ønsker',en:'hard choice, unclear wants'}));
    /* each label keeps clear of its edge of the band along its whole width */
    clearOf(eHi,hi,1);clearOf(eLo,lo,-1);
    texts2();
  }
  layout(true);vars.forEach(placeVar);setFill(fill1,chF);setFill(fill2,0);relabel();marks();start();
  var api={group:g,onUi:null,
    box:function(){return [[-5.2,0,-1.0],[5.2,3.6,1.9]];},
    update:update,
    relabel:relabel,
    ui:{
      label:function(){return tr({da:'Antal varianter',en:'Number of variants'});},
      ends:function(){return ['2','30'];},
      min:NMIN,max:NMAX,step:1,
      value:function(){return N;},
      set:function(v){auto=false;setN(v);},
      readout:function(){
        return tr({da:N+' varianter · '+Math.round(100*chance(N))+' % chance for et godt match · '+num(N*DT,1)+' s til at sammenligne',
                   en:N+' variants · '+Math.round(100*chance(N))+' % chance of a good match · '+num(N*DT,1)+' s comparing'});},
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;}
    }
  };
  return api;
};
})();

</script>
<script>/* m_chunking.js */
/* m_chunking.js — chunking as eight digits on a rail that click together into groups.
   The digits never change; only the grouping does. The dashed frames are the units memory has to hold, and each unit drops a block
   into the container on the right, so the container counts the units.
   The model's rule: a group of up to three random digits is held as one unit; a longer random group is not, it costs two
   (4726 is held as 47 and 26). A group that means something, here the year 1989, is one unit whatever its length.
   So bigger groups help only up to a point, unless they mean something. The rule is a simplification, not a measurement. */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models.chunking=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr;
  var g=new THREE.Group(),i;
  var DIG=[4,7,2,6,1,9,8,9],YEAR=4;
  var RT=0.3,RC=-1.65,RW=6.2,RZ=0.85,RD=1.5,BW=0.5,BH=0.62,BD=0.5,BZ=0.55,FZ=BZ+BD/2+0.14,GG=0.45,EVEN=0.68;

  /* ---- the rail and the digits ---- */
  g.add(K.solid(RW,RT,RD,{x:RC,y:RT/2,z:RZ}));
  var status=K.plate('',{size:0.18,weight:600,color:pal.ink});status.position.set(0,RT/2,RZ+RD/2+0.002);g.add(status);
  var yearTag=K.plate('',{size:0.18,weight:700,color:pal.ink});yearTag.position.set(0,RT/2,RZ+RD/2+0.002);yearTag.visible=false;g.add(yearTag);
  var blocks=[],digits=[];
  for(i=0;i<8;i++){
    var b=K.solid(BW,BH,BD,{tone:TONE.white,edge:pal.slate,y:RT+BH/2,z:BZ});g.add(b);blocks.push(b);
    var d=K.plate(String(DIG[i]),{size:0.34,weight:600,color:pal.ink});d.position.set(0,RT+BH/2,BZ+BD/2+0.002);g.add(d);digits.push(d);
  }
  /* a group that has clicked together is one piece */
  var bars=[];
  for(i=0;i<8;i++){var m=K.solid(1,BH,BD,{tone:TONE.white,edge:pal.slate,y:RT+BH/2,z:BZ});m.visible=false;g.add(m);bars.push(m);}
  var frames=K.lines([],{color:pal.ink,dash:[5,4],width:1.25,opacity:0});g.add(frames);

  /* ---- the container: one block per unit to hold ---- */
  var TX=3.45,TZ=0.55,PW=1.3,PH=0.36,TW=0.95,UH=0.28,TH=8*UH+0.16;
  g.add(K.solid(PW,PH,PW,{x:TX,y:PH/2,z:TZ}));
  var tank=K.lines(K.boxEdges(TW,TH,TW),{color:pal.slate});tank.position.set(TX,PH+TH/2,TZ);g.add(tank);
  var count=K.plate('',{size:0.2,weight:700,color:pal.ink});count.position.set(TX,PH/2,TZ+PW/2+0.002);g.add(count);
  var lab=K.plate('',{size:0.22,weight:600,color:pal.ink,align:'center'});lab.rotation.x=-Math.PI/2;g.add(lab);
  var cubes=[];
  for(i=0;i<8;i++){var c=K.solid(0.8,UH-0.04,0.8,{tone:TONE.signal,edge:pal.signalShadow});c.visible=false;g.add(c);cubes.push({m:c,on:false,path:null});}
  function stackY(u){return PH+0.06+u*UH+(UH-0.04)/2;}

  /* ---- grouping ---- */
  function groupsOf(n){var out=[];for(var a=0;a<8;a+=n)out.push([a,Math.min(8,a+n)-1]);return out;}
  function isYear(gr){return gr[0]===YEAR&&gr[1]===YEAR+3;}
  /* the units memory has to hold: a meaningful group is one; a random group is split into pieces of at most three, as even as possible */
  function unitsOf(n){
    var out=[];
    groupsOf(n).forEach(function(gr){
      var len=gr[1]-gr[0]+1;
      if(isYear(gr)){out.push({a:gr[0],b:gr[1],year:true});return;}
      var k=Math.ceil(len/3),a=gr[0];
      for(var j=0;j<k;j++){var s=Math.round(len*(j+1)/k)-Math.round(len*j/k);out.push({a:a,b:a+s-1,year:false});a+=s;}
    });
    return out;
  }
  function layout(n){
    var x=[],j;
    if(n===1){for(j=0;j<8;j++)x.push(RC+(j-3.5)*EVEN);return x;}
    var gs=groupsOf(n),tot=8*BW+(gs.length-1)*GG,p=RC-tot/2;
    gs.forEach(function(gr){for(j=gr[0];j<=gr[1];j++){x.push(p+BW/2);p+=BW;}p+=GG;});
    return x;
  }

  var G=1,auto=true,AUTO=[1,2,3,4],ai=0,phase='slide',pt=0,xNow=layout(1),xFrom=xNow.slice(),xTo=xNow.slice(),units=[],held=0,fop=0;
  function place(){for(var j=0;j<8;j++){blocks[j].position.x=xNow[j];digits[j].position.x=xNow[j];}}
  function texts(){
    status.setText(G===1?tr({da:'8 cifre, ingen grupper',en:'8 digits, no groups'}):tr({da:'8 cifre i grupper af '+G,en:'8 digits in groups of '+G}));
    status.position.x=RC-RW/2+0.3+status.w/2;
    yearTag.setText(tr({da:'et årstal',en:'a year'}));
    count.setText(tr(held===1?{da:'1 enhed',en:'1 unit'}:{da:held+' enheder',en:held+' units'}));
    lab.setText(tr({da:['Enheder','at holde'],en:['Units','to hold']}));lab.position.set(TX,0.006,TZ+PW/2+0.2+lab.h/2);
  }
  function drawFrames(){
    var s=[],y0=RT+0.015,y1=RT+BH+0.12,p=0.09;
    units.forEach(function(u){var x0=xTo[u.a]-BW/2-p,x1=xTo[u.b]+BW/2+p;s.push([x0,y0,FZ,x1,y0,FZ],[x1,y0,FZ,x1,y1,FZ],[x1,y1,FZ,x0,y1,FZ],[x0,y1,FZ,x0,y0,FZ]);});
    frames.set(s);
  }
  function showBars(on){
    var gs=groupsOf(G);
    bars.forEach(function(m,j){
      var gr=gs[j];m.visible=on&&!!gr;
      if(m.visible){var a=xTo[gr[0]],b=xTo[gr[1]];m.scale.x=b-a+BW;m.position.x=(a+b)/2;}
    });
    blocks.forEach(function(b){b.visible=!on;});
  }
  /* a new grouping: the frames go, the container empties, and the digits slide to their new places */
  function regroup(n){
    G=n;phase='slide';pt=0;xFrom=xNow.slice();xTo=layout(n);units=unitsOf(n);
    showBars(false);fop=0;frames.setOpacity(0);yearTag.visible=false;
    cubes.forEach(function(c){if(c.on&&!c.path)c.drain=c.m.position.y;else{c.on=false;c.path=null;c.drain=null;c.m.visible=false;}});
    held=0;texts();if(api&&api.onUi)api.onUi();
  }
  function launch(){
    units.forEach(function(u,j){
      var c=cubes[j],x=(xTo[u.a]+xTo[u.b])/2;
      c.on=true;c.drain=null;c.t=-j*0.28;c.m.visible=false;
      c.path=[new THREE.Vector3(x,RT+BH+0.35,BZ),new THREE.Vector3(x+(TX-x)*0.55,PH+TH+0.75,(BZ+TZ)/2),new THREE.Vector3(TX,PH+TH+0.35,TZ),new THREE.Vector3(TX,stackY(j),TZ)];
      c.len=K.length(c.path);
    });
  }
  function update(dt){
    pt+=dt;var j,u;
    /* the container empties: what it held sinks into its foot */
    cubes.forEach(function(c){if(c.drain!==null&&c.drain!==undefined&&!c.path){c.m.position.y-=dt*4;if(c.m.position.y<PH-0.2){c.m.visible=false;c.on=false;c.drain=null;}}});
    if(phase==='slide'){
      u=K.ease(Math.min(1,pt/1.1));
      for(j=0;j<8;j++)xNow[j]=xFrom[j]+(xTo[j]-xFrom[j])*u;place();
      if(pt>=1.1){phase='click';pt=0;showBars(true);drawFrames();yearTag.visible=units.some(function(q){return q.year;});
        if(yearTag.visible)yearTag.position.x=(xTo[YEAR]+xTo[YEAR+3])/2;}
    }else if(phase==='click'){
      fop=Math.min(1,pt/0.4);frames.setOpacity(fop);
      if(pt>=0.6){phase='count';pt=0;launch();}
    }else if(phase==='count'){
      var flying=0;
      units.forEach(function(q,k){
        var c=cubes[k];if(!c.path)return;
        c.t+=dt;if(c.t<0){flying++;return;}
        var e=Math.min(1,c.t/0.8);c.m.visible=true;K.along(c.path,c.len*K.ease(e),c.m.position);
        if(e>=1){c.path=null;held++;texts();if(api&&api.onUi)api.onUi();}else flying++;
      });
      if(!flying){phase='hold';pt=0;}
    }else if(phase==='hold'){
      if(pt>=3.6&&auto){ai=(ai+1)%AUTO.length;regroup(AUTO[ai]);}
    }
  }
  place();regroup(1);
  var api={group:g,onUi:null,
    box:function(){return [[RC-RW/2-0.1,0,-0.3],[TX+PW/2+0.1,PH+TH+0.6,RZ+RD/2+0.1]];},
    update:update,
    relabel:texts,
    ui:{
      label:function(){return tr({da:'Gruppernes størrelse',en:'Size of the groups'});},
      ends:function(){return tr({da:['1 ciffer','4 cifre'],en:['1 digit','4 digits']});},
      min:1,max:4,step:1,
      value:function(){return G;},
      set:function(v){auto=false;v=Math.max(1,Math.min(4,Math.round(v)));if(v===G)return;regroup(v);},
      readout:function(){
        var n=unitsOf(G).length,y=G===4;
        return (G===1?tr({da:'Ingen grupper',en:'No groups'}):tr({da:'Grupper af '+G,en:'Groups of '+G}))+
          tr({da:' · '+n+' enheder at holde',en:' · '+n+' units to hold'})+(y?tr({da:' · 1989 er én',en:' · 1989 is one'}):'');
      },
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;if(auto)ai=Math.max(0,AUTO.indexOf(G));}
    }
  };
  return api;
};
})();

</script>
<script>/* m_cognitive-bias.js */
/* m_cognitive-bias.js — cognitive bias, shown by one well-studied case: anchoring.
   A figure (an abstract solid, no face) has to estimate how many blocks lie in a pile. Beside it stands a number on a plate,
   which has nothing to do with the pile. The figure sees the number, looks at the pile, and writes its estimate on its board.
   The estimate is pulled part of the way towards the number. Each estimate becomes a point on the board:
   the solid line is the true count, the dashed diagonal is an estimate equal to the number.
   The pull (40 %) and the noise are the model's. */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models['cognitive-bias']=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr;
  var g=new THREE.Group(),rnd=K.rng(1974);
  var TRUTH=40,PULL=0.4,NOISE=3;

  /* ---- the pile: forty blocks, heaped ---- */
  var PX=-0.45,PZ=-0.75,PT=0.22,CS=0.27;
  g.add(K.solid(2.6,PT,1.9,{x:PX,y:PT/2,z:PZ}));
  var layers=[[5,4],[4,3],[3,2],[2,1]],L,c,r,top=0;
  layers.forEach(function(d,li){
    for(c=0;c<d[0];c++)for(r=0;r<d[1];r++){
      var x=PX+(c-(d[0]-1)/2)*0.31+(rnd()-0.5)*0.05,z=PZ+(r-(d[1]-1)/2)*0.31+(rnd()-0.5)*0.05,y=PT+CS/2+li*CS;
      var m=K.solid(CS,CS,CS,{tone:TONE.white,edge:pal.slate,x:x,y:y,z:z});m.rotation.y=(rnd()-0.5)*0.35;g.add(m);top=Math.max(top,y+CS/2);
    }
  });
  var truthP=K.plate('',{size:0.15,weight:700,color:pal.ink});truthP.position.set(PX,PT/2,PZ+0.951);g.add(truthP);

  /* ---- the figure and its board ---- */
  var FX=-3.15,FZ=0.55,BH=1.6,HS=0.44;
  g.add(K.solid(0.62,BH,0.45,{tone:TONE.paper,edge:pal.slate,x:FX,y:BH/2,z:FZ}));
  g.add(K.solid(HS,HS,HS,{tone:TONE.paper,edge:pal.slate,x:FX,y:BH+HS/2+0.04,z:FZ}));
  var HEAD=new THREE.Vector3(FX,BH+HS/2+0.04,FZ);
  var EBZ=FZ+0.225+0.06;
  g.add(K.solid(0.98,0.66,0.06,{tone:TONE.white,edge:pal.ink,x:FX,y:0.95,z:EBZ}));
  var estL=K.plate('',{size:0.12,weight:600,color:pal.slate});estL.position.set(FX,1.18,EBZ+0.031);g.add(estL);
  var estN=K.plate('–',{size:0.34,weight:700,color:pal.ink});estN.position.set(FX,0.87,EBZ+0.031);g.add(estN);

  /* ---- the number beside it ---- */
  var AX=-4.6,AZ=-0.7,AY=1.5;
  g.add(K.solid(0.08,AY-0.3,0.08,{x:AX,y:(AY-0.3)/2,z:AZ}));
  g.add(K.solid(0.92,0.62,0.08,{tone:TONE.white,edge:pal.ink,x:AX,y:AY,z:AZ}));
  var anN=K.plate('',{size:0.4,weight:700,color:pal.ink});anN.position.set(AX,AY,AZ+0.041);g.add(anN);
  var SIGN=new THREE.Vector3(AX,AY,AZ),PILE=new THREE.Vector3(PX,top,PZ);

  /* the figure's line of sight: dashed, a connection */
  var sight=K.lines([],{color:pal.slate,dash:[4,3]});g.add(sight);sight.visible=false;
  function look(to,k){var p=HEAD.clone().lerp(to,k);sight.set([[HEAD.x,HEAD.y,HEAD.z,p.x,p.y,p.z]]);sight.visible=k>0.01;}

  /* ---- the board: estimate against the number ---- */
  var GX=3.7,GZ=0.3,GW=2.9,GH=3.6,FZB=GZ+0.071;
  g.add(K.solid(GW,GH,0.14,{x:GX,y:GH/2,z:GZ}));
  var ax0=GX-GW/2+0.55,ax1=GX+GW/2-0.25,ay0=0.75,ay1=3.0;
  function gx(a){return ax0+(ax1-ax0)*a/100;}
  function gy(e){return ay0+(ay1-ay0)*Math.max(0,Math.min(100,e))/100;}
  var axes=[[ax0,ay0,FZB,ax1,ay0,FZB],[ax0,ay0,FZB,ax0,ay1,FZB]],i;
  for(i=1;i<=4;i++){axes.push([gx(i*25),ay0,FZB,gx(i*25),ay0-0.06,FZB],[ax0,gy(i*25),FZB,ax0-0.06,gy(i*25),FZB]);}
  g.add(K.lines(axes,{color:pal.ink}));
  g.add(K.lines([[ax0,gy(TRUTH),FZB+0.002,ax1,gy(TRUTH),FZB+0.002]],{color:pal.slate}));
  g.add(K.lines([[gx(0),gy(0),FZB+0.002,gx(100),gy(100),FZB+0.002]],{color:pal.mist,dash:[4,3]}));
  var texts=[];
  function txt(o,x,y,align){var p=K.plate('',o);g.add(p);var q={p:p,x:x,y:y,align:align};texts.push(q);return q;}
  function setT(q,t){q.p.setText(t);q.p.position.set(q.x+(q.align==='r'?-q.p.w/2:q.align==='l'?q.p.w/2:0),q.y,FZB+0.004);}
  var title=txt({size:0.16,weight:700,color:pal.ink},ax0-0.4,GH-0.17,'l');
  var xs=[0,50,100].map(function(a){return txt({size:0.13,weight:400,color:pal.slate},gx(a),ay0-0.17,'c');});
  var ys=[0,50,100].map(function(a){return txt({size:0.13,weight:400,color:pal.slate},ax0-0.1,gy(a),'r');});
  var xl=txt({size:0.13,weight:600,color:pal.slate},ax1,ay0-0.38,'r');
  var yl=txt({size:0.13,weight:600,color:pal.slate},ax0-0.3,ay1+0.15,'l');
  var tl=txt({size:0.13,weight:600,color:pal.slate},ax1,gy(TRUTH)-0.14,'r');
  var dl=txt({size:0.13,weight:400,color:pal.slate},gx(78)-0.08,gy(92),'r');
  var fitL=K.lines([],{color:pal.signal,width:1.5});g.add(fitL);fitL.visible=false;
  var pts=[],ptMat=K.flat(pal.ink),ptOld=K.flat(pal.mist);
  function addPoint(a,e){
    var q=K.quad(0.08,0.08,ptMat,gx(a),gy(e),FZB+0.006);g.add(q);pts.push({q:q,a:a});
