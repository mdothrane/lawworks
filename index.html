    if(pts.length>24){var o=pts.shift();g.remove(o.q);}
    pts.forEach(function(p,j){p.q.material=j===pts.length-1?ptMat:ptOld;});
    fit(e);
  }
  var ests=[];
  function fit(){
    var as={},n=ests.length,sx=0,sy=0,sxx=0,sxy=0;
    ests.forEach(function(p){as[p.a]=1;sx+=p.a;sy+=p.e;sxx+=p.a*p.a;sxy+=p.a*p.e;});
    if(Object.keys(as).length<3||n<4){fitL.visible=false;return;}
    var b=(n*sxy-sx*sy)/(n*sxx-sx*sx),a=(sy-b*sx)/n;
    fitL.set([[gx(0),gy(a),FZB+0.007,gx(100),gy(a+b*100),FZB+0.007]]);fitL.visible=true;
  }

  /* ---- one round: the number, the look at it, the look at the pile, the estimate ---- */
  var anchor=10,shown=10,est=null,auto=true,SEQ=[90,25,75,0,100,55,10],si=-1,phase='roll',pt=0,rollT=0;
  function gauss(){var u=1-rnd(),v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
  function estimate(a){return Math.max(0,Math.round(TRUTH+PULL*(a-TRUTH)+gauss()*NOISE));}
  function showAnchor(v){if(v!==shown){shown=v;anN.setText(String(v));}}
  function begin(roll){phase=roll?'roll':'see';pt=0;rollT=0;look(SIGN,0);if(est!==null){est=null;estN.setText('–');}}
  function update(dt){
    pt+=dt;
    if(phase==='roll'){
      /* the number turns over a few times before it settles: it comes from nowhere in particular */
      rollT+=dt;if(rollT>=0.11&&pt<0.6){rollT=0;showAnchor(Math.floor(rnd()*101));}
      if(pt>=0.7){showAnchor(anchor);phase='see';pt=0;}
    }else if(phase==='see'){
      look(SIGN,K.ease(Math.min(1,pt/0.4)));
      if(pt>=1.0){phase='look';pt=0;}
    }else if(phase==='look'){
      var u=K.ease(Math.min(1,pt/0.5)),p=SIGN.clone().lerp(PILE,u);sight.set([[HEAD.x,HEAD.y,HEAD.z,p.x,p.y,p.z]]);
      if(pt>=1.4){phase='write';pt=0;est=estimate(anchor);estN.setText(String(est));ests.push({a:anchor,e:est});if(ests.length>24)ests.shift();addPoint(anchor,est);if(api&&api.onUi)api.onUi();}
    }else if(phase==='write'){
      if(pt>=0.4){phase='hold';pt=0;sight.visible=false;}
    }else if(phase==='hold'){
      if(pt>=2.0){
        if(auto){si=(si+1)%SEQ.length;anchor=SEQ[si];begin(true);if(api&&api.onUi)api.onUi();}
        else begin(false);
      }
    }
  }
  function relabel(){
    truthP.setText(tr({da:TRUTH+' i bunken',en:TRUTH+' in the pile'}));
    estL.setText(tr({da:'Mit skøn',en:'My estimate'}));
    setT(title,tr({da:'Skøn over for tallet',en:'Estimate against the number'}));
    xs.forEach(function(q,j){setT(q,String([0,50,100][j]));});ys.forEach(function(q,j){setT(q,String([0,50,100][j]));});
    setT(xl,tr({da:'tallet ved siden af',en:'the number beside it'}));
    setT(yl,tr({da:'skøn',en:'estimate'}));
    setT(tl,tr({da:'i bunken: '+TRUTH,en:'in the pile: '+TRUTH}));
    setT(dl,tr({da:'skøn = tallet',en:'estimate = number'}));
  }
  anN.setText(String(anchor));relabel();begin(false);
  var api={group:g,onUi:null,
    box:function(){return [[-5.1,0,-1.8],[5.2,3.6,1.3]];},
    update:update,
    relabel:relabel,
    ui:{
      label:function(){return tr({da:'Tallet ved siden af',en:'The number beside it'});},
      ends:function(){return ['0','100'];},
      min:0,max:100,step:5,
      value:function(){return anchor;},
      set:function(v){auto=false;v=Math.round(v/5)*5;if(v===anchor&&phase!=='hold')return;anchor=v;showAnchor(v);begin(false);if(api&&api.onUi)api.onUi();},
      readout:function(){return tr({da:'Tallet '+anchor+' · skøn '+(est===null?'–':est)+' · i bunken '+TRUTH,en:'Number '+anchor+' · estimate '+(est===null?'–':est)+' · in the pile '+TRUTH});},
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;}
    }
  };
  return api;
};
})();

</script>
<script>/* m_cognitive-load.js */
/* m_cognitive-load.js — cognitive load as a container of fixed volume.
   Working memory is a container with eight places. Two kinds of blocks go into it: the task's own (Signal, the focus)
   and the extra ones the interface demands (paper). The interface's blocks cannot be refused: they come with using it.
   What the task needs and does not fit falls out over the rim, onto the tray of what was dropped.
   The handle sets how many blocks the interface demands. Eight places and six task blocks are abstract numbers, the model's. */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models['cognitive-load']=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr;
  var g=new THREE.Group();
  var C=8,T=6,EMAX=8,B=0.48,PL=0.3;
  function v3(x,y,z){return new THREE.Vector3(x,y,z);}

  /* ---- the two sources ---- */
  var SRC={T:{x:-4.15,z:-0.55,w:1.7,cols:3},I:{x:-1.95,z:1.2,w:2.2,cols:4}},SD=1.2;
  ['T','I'].forEach(function(k){var o=SRC[k];g.add(K.solid(o.w,PL,SD,{x:o.x,y:PL/2,z:o.z}));});
  function srcPos(kind,i){
    /* the place on its source of the i-th block to leave (the first to leave stands nearest the container) */
    var o=SRC[kind],c=o.cols-1-(i%o.cols),r=Math.floor(i/o.cols);
    return v3(o.x+(c-(o.cols-1)/2)*0.52,PL+B/2,o.z+(r?-0.27:0.27));
  }
  /* ---- the container: eight places ---- */
  var TX=0.65,TZ=0.25,PH=0.36,SL=0.6,TW=2*SL+0.06,THt=4*SL+0.06,TD=SL+0.06;
  g.add(K.solid(1.9,PH,1.3,{x:TX,y:PH/2,z:TZ}));
  var tank=K.lines(K.boxEdges(TW,THt,TD),{color:pal.slate});tank.position.set(TX,PH+THt/2,TZ);g.add(tank);
  function slotPos(s){var r=Math.floor(s/2),c=r%2?1-s%2:s%2;return v3(TX+(c?0.5:-0.5)*SL,PH+0.03+SL/2+r*SL,TZ);}
  /* empty places are drawn as what they are: the outline of where a block can be (in the middle plane, so a block hides it) */
  var pl=[],h=B/2-0.01,fz=TZ;
  for(var s=0;s<C;s++){var c0=slotPos(s);pl.push([c0.x-h,c0.y-h,fz,c0.x+h,c0.y-h,fz],[c0.x+h,c0.y-h,fz,c0.x+h,c0.y+h,fz],[c0.x+h,c0.y+h,fz,c0.x-h,c0.y+h,fz],[c0.x-h,c0.y+h,fz,c0.x-h,c0.y-h,fz]);}
  g.add(K.lines(pl,{color:pal.borderStrong,dash:[3,3]}));
  var RIM=v3(TX,PH+THt+B/2+0.02,TZ);
  /* ---- the tray of what fell out ---- */
  var RX=3.25,RZ=0.25,RH=0.3;
  g.add(K.solid(1.8,RH,1.3,{x:RX,y:RH/2,z:RZ}));
  function trayPos(i){return v3(RX-0.55+(i%3)*0.55,RH+B/2,RZ+(Math.floor(i/3)?-0.3:0.3));}

  /* ---- plates: counts on the fronts, names on the floor ---- */
  var vT=K.plate('',{size:0.2,weight:700,color:pal.ink}),vI=K.plate('',{size:0.2,weight:700,color:pal.ink}),vC=K.plate('',{size:0.2,weight:700,color:pal.ink}),vR=K.plate('',{size:0.2,weight:700,color:pal.ink});
  vT.position.set(SRC.T.x,PL/2,SRC.T.z+SD/2+0.002);vI.position.set(SRC.I.x,PL/2,SRC.I.z+SD/2+0.002);vC.position.set(TX,PH/2,TZ+0.651);vR.position.set(RX,RH/2,RZ+0.651);
  [vT,vI,vC,vR].forEach(function(p){g.add(p);});
  var nT=K.plate('',{size:0.2,weight:600,color:pal.ink}),nI=K.plate('',{size:0.2,weight:600,color:pal.ink}),nC=K.plate('',{size:0.2,weight:600,color:pal.ink,align:'center'}),nR=K.plate('',{size:0.2,weight:600,color:pal.ink,align:'center'});
  [nT,nI,nC,nR].forEach(function(p){p.rotation.x=-Math.PI/2;g.add(p);});

  /* ---- the blocks ---- */
  function mk(kind){var m=K.solid(B,B,B,kind==='T'?{tone:TONE.signal,edge:pal.signalShadow}:{tone:TONE.paper,edge:pal.slate});m.visible=false;g.add(m);return {m:m,kind:kind,legs:null};}
  var taskB=[],ifB=[],i;
  for(i=0;i<T;i++)taskB.push(mk('T'));
  for(i=0;i<EMAX;i++)ifB.push(mk('I'));

  var E=2,auto=true,SEQ=[0,2,4,6],si=1,phase='appear',pt=0,plan=[],lost=0,landed=0;
  /* the order things arrive in: the interface's blocks are spread over the first eight arrivals, so they always get in;
     whatever the task still needs after that does not fit */
  function order(e){
    var A=T+e,M=Math.min(C,A),seq=[],ii=[],k;
    for(k=0;k<e;k++)ii.push(Math.floor((k+0.5)*M/e));
    var ti=0,fi=0;
    for(k=0;k<A;k++){if(ii.indexOf(k)>=0)seq.push(ifB[fi++]);else seq.push(taskB[ti++]);}
    return seq;
  }
  function setScaleY(b,k){b.m.scale.y=Math.max(0.001,k);}
  function at(b,p){b.m.position.copy(p);}
  function begin(){
    plan=order(E);lost=0;landed=0;phase='appear';pt=0;
    taskB.concat(ifB).forEach(function(b){b.m.visible=false;b.legs=null;b.done=false;});
    var ti=0,fi=0;
    plan.forEach(function(b,k){
      b.src=srcPos(b.kind,b.kind==='T'?ti++:fi++);b.m.visible=true;at(b,b.src);setScaleY(b,0.001);
      if(k<C){b.dst=slotPos(k);b.out=false;}else{b.out=true;b.dst=trayPos(k-C);}
    });
    texts();
  }
  /* a leg: from a to b over d seconds, eased, lifted by an arc */
  function launch(b){
    var L=[];
    if(!b.out)L.push({a:b.src,b:b.dst,d:0.75,arc:0.9});
    else{L.push({a:b.src,b:RIM,d:0.75,arc:0.9});L.push({a:RIM,b:RIM,d:0.3,arc:0});L.push({a:RIM,b:b.dst,d:0.85,arc:0.35,fall:true});}
    b.legs=L;b.li=0;b.lt=0;
  }
  var tmp=new THREE.Vector3();
  function stepBlock(b,dt){
    if(!b.legs)return;
    var l=b.legs[b.li];b.lt+=dt;var u=Math.min(1,b.lt/l.d),e=K.ease(u);
    if(l.fall){/* over the rim and down: sideways first, then falling, no bounce */
      var ex=K.ease(Math.min(1,u*1.6)),ey=u*u;
      tmp.set(l.a.x+(l.b.x-l.a.x)*ex,l.a.y+(l.b.y-l.a.y)*ey+Math.sin(Math.PI*Math.min(1,u*1.6))*l.arc*(1-u),l.a.z+(l.b.z-l.a.z)*ex);
    }else{tmp.copy(l.a).lerp(l.b,e);tmp.y+=Math.sin(Math.PI*e)*l.arc;}
    at(b,tmp);
    if(u>=1){b.li++;b.lt=0;if(b.li>=b.legs.length){b.legs=null;b.done=true;at(b,b.dst);landed++;if(b.out){lost++;vR.setText(String(lost));}}}
  }
  var GAP=0.42;
  function update(dt){
    pt+=dt;var k;
    if(phase==='appear'){
      var u=K.ease(Math.min(1,pt/0.5));plan.forEach(function(b){setScaleY(b,u);b.m.position.y=b.src.y-B/2*(1-u);});
      if(pt>=0.9){phase='run';pt=0;}
    }else if(phase==='run'){
      for(k=0;k<plan.length;k++){var b=plan[k];if(!b.done&&!b.legs&&pt>=k*GAP)launch(b);stepBlock(b,dt);}
      if(landed>=plan.length){phase='hold';pt=0;if(api&&api.onUi)api.onUi();}
    }else if(phase==='hold'){
      if(pt>=(auto?3.2:4.5)){phase='clear';pt=0;}
    }else if(phase==='clear'){
      var c=1-K.ease(Math.min(1,pt/0.6));plan.forEach(function(b){setScaleY(b,c);b.m.position.y=b.dst.y-B/2*(1-c);});
      if(pt>=0.6){if(auto){si=(si+1)%SEQ.length;E=SEQ[si];if(api&&api.onUi)api.onUi();}begin();}
    }
  }
  /* a change by hand: show where everything ends up at once */
  function jump(){
    begin();
    plan.forEach(function(b){b.done=true;b.legs=null;setScaleY(b,1);at(b,b.dst);});
    landed=plan.length;lost=Math.max(0,plan.length-C);phase='hold';pt=0;texts();
  }
  function texts(){
    vT.setText(String(T));vI.setText(String(E));
    vC.setText(tr({da:'Plads til '+C,en:'Room for '+C}));
    vR.setText(String(lost));
    nT.setText(tr({da:['Opgavens','klodser'],en:['The task’s','blocks']}));
    nI.setText(tr({da:['Interfacets','ekstra klodser'],en:['The interface’s','extra blocks']}));
    nC.setText(tr({da:'Arbejdshukommelse',en:'Working memory'}));
    nR.setText(tr({da:['Tabt fra','opgaven'],en:['Dropped from','the task']}));
    nT.position.set(SRC.T.x-SRC.T.w/2+0.05+nT.w/2,0.006,SRC.T.z+SD/2+0.12+nT.h/2);
    nI.position.set(SRC.I.x-SRC.I.w/2+0.05+nI.w/2,0.006,SRC.I.z+SD/2+0.12+nI.h/2);
    nC.position.set(TX,0.006,TZ+0.65+0.12+nC.h/2);nR.position.set(RX,0.006,RZ+0.65+0.12+nR.h/2);
  }
  begin();
  var api={group:g,onUi:null,
    box:function(){return [[-5.0,0,-1.2],[4.15,3.4,2.4]];},
    update:update,
    relabel:texts,
    ui:{
      label:function(){return tr({da:'Hvor meget interfacet kræver',en:'How much the interface demands'});},
      ends:function(){return tr({da:['Intet ekstra','Meget'],en:['Nothing extra','A lot']});},
      min:0,max:EMAX,step:1,
      value:function(){return E;},
      set:function(v){auto=false;v=Math.round(v);if(v===E&&phase==='hold')return;E=v;jump();},
      readout:function(){
        var l=Math.max(0,T+E-C);
        return tr({da:'Interface '+E+' + opgave '+T+' på '+C+' pladser · '+l+' af opgavens klodser tabt',en:'Interface '+E+' + task '+T+' in '+C+' places · '+l+' of the task’s blocks dropped'});},
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;}
    }
  };
  return api;
};
})();

</script>
<script>/* m_common-region.js */
/* m_common-region.js — the law of common region on a plate.
   Twelve blocks stand in two clusters; distance alone splits them into two groups.
   A region (a flat panel on the plate) grows out from the middle. Blocks that lie wholly inside it are seen as one group,
   even across the gap; the blocks left outside still group by distance. The dashed frames are the groups the eye makes.
   The rule is the model's simplification: in reality region and distance compete, and the region usually wins. */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models['common-region']=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr;
  var g=new THREE.Group();
  var PY=0.32,PZ=0.25,PD=3.1,TOP=PY,BS=0.52;
  g.add(K.solid(7.0,PY,PD,{x:0,y:PY/2,z:PZ}));
  var status=K.plate('',{size:0.18,weight:600,color:pal.ink,padX:0.42});status.position.set(0,PY/2,PZ+PD/2+0.001);g.add(status);

  /* the blocks: two clusters of three columns and two rows, the same pitch both ways inside a cluster */
  var COLS=[-2.6,-1.8,-1.0,1.0,1.8,2.6],ROWS=[-0.4,0.4],RZ=0,blocks=[];
  COLS.forEach(function(x,ci){ROWS.forEach(function(z){
    var b=K.solid(BS,BS,BS,{tone:TONE.paper,x:x,y:TOP+BS/2,z:RZ+z});g.add(b);blocks.push({m:b,x:x,z:RZ+z,side:ci<3?0:1,col:ci});
  });});

  /* the region: a thin panel lying on the plate, growing out from the middle. It is the thing the handle changes. */
  var RH=0.035,RD=2.3;
  var region=K.solid(1,RH,RD,{tone:TONE.focal,edge:pal.signal,x:0,y:TOP+RH/2,z:RZ});g.add(region);
  /* the region only comes to rest with its edge in a gap between two columns, never under a block:
     empty (edge in the wide middle gap), the inner columns, two columns on each side, all of them */
  var W0=0.5,W1=3.15,MARGIN=0.1,EDGES=[0.5,1.4,2.2,3.15],STOPS=EDGES.map(function(e){return (e-W0)/(W1-W0);});
  var frames=K.lines([],{color:pal.ink,dash:[5,4],width:1.25});g.add(frames);

  var v=0,hw=W0,sig='',fade=1,state='two',count=0,ngroups=2;
  function rect(x0,z0,x1,z1,y){return [[x0,y,z0,x1,y,z0],[x1,y,z0,x1,y,z1],[x1,y,z1,x0,y,z1],[x0,y,z1,x0,y,z0]];}
  function layout(){
    hw=W0+(W1-W0)*v;
    region.scale.x=hw*2;
    /* a block belongs to the region when it lies wholly inside it */
    var inside=[],out=[[],[]];
    blocks.forEach(function(b,i){if(Math.abs(b.x)+BS/2<=hw-MARGIN)inside.push(i);else out[b.side].push(i);});
    var groups=[];
    if(inside.length)groups.push(inside);
    out.forEach(function(a){if(a.length)groups.push(a);});
    return {groups:groups,inside:inside};
  }
  function draw(dt){
    var lay=layout(),key=lay.groups.map(function(a){return a.join(',');}).join('|');
    if(key!==sig){
      sig=key;fade=0;count=lay.inside.length;
      state=!count?'two':count===blocks.length?'one':'three';
      /* drawn level with the tops of the blocks, so the groups lie above the region that makes them */
      var s=[],P=0.05,y=TOP+BS+0.004;
      lay.groups.forEach(function(a){
        var x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
        a.forEach(function(i){var b=blocks[i];x0=Math.min(x0,b.x-BS/2);x1=Math.max(x1,b.x+BS/2);z0=Math.min(z0,b.z-BS/2);z1=Math.max(z1,b.z+BS/2);});
        s=s.concat(rect(x0-P,z0-P,x1+P,z1+P,y));
      });
      frames.set(s);ngroups=lay.groups.length;
      paintStatus();if(api&&api.onUi)api.onUi();
    }
    if(fade<1){fade=Math.min(1,fade+dt/0.35);frames.setOpacity(fade);}
  }
  var STATUS={two:{da:'To grupper: afstanden afgør',en:'Two groups: distance decides'},
    three:{da:'Tre grupper: området samler på tværs af afstanden',en:'Three groups: the region joins across the gap'},
    one:{da:'Én gruppe: området rummer dem alle',en:'One group: the region holds them all'}};
  function paintStatus(){status.setText(tr(STATUS[state]));}

  /* auto: an empty region, then one that takes the inner columns, then more, all, and back */
  var KEYS=[0,1,2,3,2,1],ki=0,hold=0,auto=true,from=v,to=v,at=0,mk=1,HOLD=3.6,MOVE=1.2;
  function goTo(i){at=i;from=v;to=STOPS[i];mk=0;}
  draw(0);
  var api={group:g,onUi:null,
    box:function(){return [[-3.6,0,-1.35],[3.6,1.1,1.85]];},
    update:function(dt){
      if(mk<1){mk=Math.min(1,mk+dt/MOVE);v=from+(to-from)*K.ease(mk);}
      else if(auto){hold+=dt;if(hold>=HOLD){hold=0;ki=(ki+1)%KEYS.length;goTo(KEYS[ki]);}}
      draw(dt);
    },
    relabel:paintStatus,
    ui:{
      label:function(){return tr({da:'Områdets størrelse',en:'Size of the region'});},
      ends:function(){return tr({da:['Lille','Stort'],en:['Small','Large']});},
      min:0,max:3,step:1,
      value:function(){return at;},
      set:function(x){auto=false;goTo(Math.max(0,Math.min(3,Math.round(x))));},
      readout:function(){
        var n=ngroups;
        return tr({da:'Området rummer ',en:'The region holds '})+count+tr({da:' af 12 klodser · ',en:' of 12 blocks · '})+n+' '+(n===1?tr({da:'gruppe',en:'group'}):tr({da:'grupper',en:'groups'}));
      },
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;hold=0;}
    }
  };
  paintStatus();
  return api;
};
})();

</script>
<script>/* m_doherty.js */
/* m_doherty.js — the Doherty threshold as a stylus and a machine that take turns.
   The stylus presses a key; the key stays blue until the machine answers on its screen, after its response time.
   A tape on the desk records the turns: the stylus's own time (dark), the extra time it needs after a wait (slate),
   and the waiting itself (white). The board counts actions per minute and plots each finished action.
   The extra time follows the IBM brief (Doherty & Thadhani 1982), which reports Doherty and Kelisky's observation that each second
   of slower response added a similar delay to the user's time for the next step. All times here are the model's.
   The brief argues for subsecond response; it gives no 400 ms limit, so no such line is drawn. */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models.doherty=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr,num=TB.num;
  var g=new THREE.Group(),i;
  /* the model: the stylus needs U0 seconds of its own per action, plus one second for every second it has waited */
  var U0=1.0,SMIN=0.25,SMAX=3;
  function userT(s){return U0+s;}
  function rate(s){return 60/(userT(s)+s);}
  /* the other condition: the user's time stays as it is at the fastest response, so only the waiting is added */
  var UC=userT(SMIN);function rateW(s){return 60/(UC+s);}
  var rnd=K.rng(20);

  /* ---- the desk and the machine ---- */
  var DY=0.3,DX0=-4.9,DX1=1.4,DZ0=-2.3,DZ1=2.75;
  g.add(K.solid(DX1-DX0,DY,DZ1-DZ0,{x:(DX0+DX1)/2,y:DY/2,z:(DZ0+DZ1)/2}));
  var MX=-2.75,MZ=-1.3,MW=2.7,MH=2.4,MD=1.3,MF=MZ+MD/2;
  g.add(K.solid(MW,MH,MD,{tone:TONE.white,x:MX,y:DY+MH/2,z:MZ}));
  var SW=2.2,SH=1.45,SCY=DY+MH-0.2-SH/2;
  g.add(K.quad(SW,SH,K.flat(pal.fog),MX,SCY,MF+0.002));
  var sx0=MX-SW/2,sx1=MX+SW/2,sy0=SCY-SH/2,sy1=SCY+SH/2,zf=MF+0.003;
  g.add(K.lines([[sx0,sy0,zf,sx1,sy0,zf],[sx1,sy0,zf,sx1,sy1,zf],[sx1,sy1,zf,sx0,sy1,zf],[sx0,sy1,zf,sx0,sy0,zf]],{color:pal.slate}));
  /* what the machine answers: a line on its screen per response, the newest in ink */
  var matNew=K.flat(pal.ink),matOld=K.flat(pal.mist),scrL=[],lw=[];
  for(i=0;i<5;i++){var q=K.quad(1,0.09,matOld,0,0,MF+0.005);q.visible=false;g.add(q);scrL.push(q);}
  function paintScreen(){
    for(var j=0;j<5;j++){var q=scrL[j];
      if(j<lw.length){q.visible=true;q.scale.x=lw[j];q.position.x=sx0+0.18+lw[j]/2;q.position.y=sy1-0.22-j*0.25;q.material=j===lw.length-1?matNew:matOld;}
      else q.visible=false;}
  }
  var spec=K.plate('',{size:0.17,weight:600,color:pal.ink});g.add(spec);

  /* ---- the key and the stylus ---- */
  var KX=-0.45,KZ=0.35,KH=0.14,KTOP=DY+KH;
  var key=K.solid(1.0,KH,0.72,{tone:TONE.white,x:KX,y:DY+KH/2,z:KZ});g.add(key);
  var keyOn=false;
  function keyTone(on){if(on===keyOn)return;keyOn=on;key.setTone(on?TONE.signal:TONE.white);key.setEdge(on?pal.signalShadow:pal.borderStrong);}
  var LEN=1.5,TILT=-0.25,rod=K.solid(0.08,LEN,0.08,{tone:TONE.dark,edge:pal.midnight});rod.rotation.z=TILT;g.add(rod);
  var REST=[KX+0.5,KTOP+0.62,KZ+0.12],HOV=[KX,KTOP+0.2,KZ],PRS=[KX,KTOP-0.05,KZ];
  function lerp3(a,b,k){return [a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k];}
  function setTip(p){
    rod.position.set(p[0]-Math.sin(TILT)*LEN/2,p[1]+Math.cos(TILT)*LEN/2,p[2]);
    /* the key gives way under the tip */
    key.position.y=DY+KH/2-Math.max(0,Math.min(0.05,KTOP-p[1]));
  }

  /* ---- the tape: the last twelve seconds, newest at the right ---- */
  var TX0=-4.55,TX1=0.95,TZ=1.6,TD=0.46,TW=12,TRATE=(TX1-TX0)/TW,TBY=DY+0.03,SEGH=0.05;
  g.add(K.solid(TX1-TX0+0.1,0.03,TD+0.12,{tone:TONE.region,edge:pal.borderStrong,x:(TX0+TX1)/2,y:DY+0.015,z:TZ}));
  var KIND={x:{tone:TONE.slate,edge:pal.dusk},u:{tone:TONE.dark,edge:pal.midnight},w:{tone:TONE.white,edge:pal.slate}};
  var pools={x:[],u:[],w:[]};
  function pool(k,n){
    while(pools[k].length<=n){var m=K.solid(1,SEGH,TD,{tone:KIND[k].tone,edge:KIND[k].edge,y:TBY+SEGH/2,z:TZ});g.add(m);pools[k].push(m);}
    return pools[k][n];
  }
  var ticks=K.lines([],{color:pal.slate});g.add(ticks);
  /* the legend lies on the desk below the tape: a swatch of the tape itself, and what it is */
  var leg=['u','x','w'].map(function(k){
    var sw=K.solid(0.22,SEGH,0.22,{tone:KIND[k].tone,edge:KIND[k].edge,y:DY+SEGH/2,z:2.27});g.add(sw);
    var p=K.plate('',{size:0.15,weight:600,color:pal.ink});p.rotation.x=-Math.PI/2;p.position.set(0,DY+0.002,2.27);g.add(p);
    return {k:k,sw:sw,p:p};
  });
  var LEG={u:{da:'Pennen handler',en:'Stylus acts'},x:{da:'Ekstra tid efter ventetid',en:'Extra time after a wait'},w:{da:'Venter på maskinen',en:'Waiting for the machine'}};

  /* ---- the board: actions per minute, and every finished action as a point ---- */
  var BX=3.4,BZ=-0.45,BW=3.6,BH=3.9,FZ=BZ+0.071;
  g.add(K.solid(BW,BH,0.14,{x:BX,y:BH/2,z:BZ}));
  var ax0=BX-BW/2+0.6,ax1=BX+BW/2-0.3,ay0=0.65,ay1=2.5,XMAX=3,YMAX=45;
  function gx(s){return ax0+(ax1-ax0)*s/XMAX;}
  function gy(r){return ay0+(ay1-ay0)*Math.min(r,YMAX)/YMAX;}
  var ax=[[ax0,ay0,FZ,ax1,ay0,FZ],[ax0,ay0,FZ,ax0,ay1,FZ]],grid=[];
  for(i=1;i<=3;i++)ax.push([gx(i),ay0,FZ,gx(i),ay0-0.07,FZ]);
  for(i=1;i<=4;i++){ax.push([ax0,gy(i*10),FZ,ax0-0.07,gy(i*10),FZ]);grid.push([ax0,gy(i*10),FZ,ax1,gy(i*10),FZ]);}
  g.add(K.lines(ax,{color:pal.ink}));g.add(K.lines(grid,{color:pal.border}));
  function txt(o,x,y,al){var p=K.plate('',o);p.position.set(x,y,FZ+0.002);p.al=al||'c';p.ax=x;g.add(p);return p;}
  function put(p,t){p.setText(t);p.position.x=p.ax+(p.al==='r'?-p.w/2:p.al==='l'?p.w/2:0);}
  var tick=[];
  for(i=0;i<=3;i++)tick.push(txt({size:0.15,weight:400,color:pal.slate},gx(i),ay0-0.2));
  for(i=0;i<=4;i++)tick.push(txt({size:0.15,weight:400,color:pal.slate},ax0-0.12,gy(i*10),'r'));
  var xl=txt({size:0.15,weight:600,color:pal.slate},ax1,ay0-0.44,'r');
  var title=txt({size:0.19,weight:700,color:pal.ink},ax0-0.35,BH-0.3,'l');
  var big=txt({size:0.5,weight:700,color:pal.ink},ax0-0.35,BH-0.82,'l');
  var bigU=txt({size:0.16,weight:600,color:pal.slate},0,BH-0.9,'l');
  /* the two curves: the model, and the dashed other condition where only the waiting is added */
  function poly(f){var p=[],n=40;for(var j=0;j<=n;j++){var a=SMIN+(SMAX-SMIN)*Math.pow(j/n,1.6);p.push([gx(a),gy(f(a)),FZ+0.005]);}return p;}
  /* dashes laid out along the whole curve, so they do not start over at every short piece of it */
  function dashed(pl,on,off){
    var out=[],draw=true,left=on;
    for(var j=0;j<pl.length-1;j++){
      var a=pl[j],b=pl[j+1],L=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]),u=0;
      while(u<L-1e-9){var d=Math.min(left,L-u),k0=u/L,k1=(u+d)/L;
        if(draw)out.push([a[0]+(b[0]-a[0])*k0,a[1]+(b[1]-a[1])*k0,a[2]+(b[2]-a[2])*k0,a[0]+(b[0]-a[0])*k1,a[1]+(b[1]-a[1])*k1,a[2]+(b[2]-a[2])*k1]);
        u+=d;left-=d;if(left<=1e-9){draw=!draw;left=draw?on:off;}}
    }
    return out;
  }
  var fitL=K.lines(K.chain(poly(rate)),{color:pal.signal,width:1.5});g.add(fitL);fitL.visible=false;
  g.add(K.lines(dashed(poly(rateW),0.075,0.055),{color:pal.ink}));
  /* the legend sits above the grid, clear of the curves and the grid lines */
  var lgY1=2.66,lgY2=2.46,lgX=gx(0.8);
  g.add(K.lines([[lgX,lgY1,FZ+0.005,lgX+0.32,lgY1,FZ+0.005]],{color:pal.signal,width:1.5}));
  g.add(K.lines(dashed([[lgX,lgY2,FZ+0.005],[lgX+0.32,lgY2,FZ+0.005]],0.075,0.055),{color:pal.ink}));
  var lg1=txt({size:0.14,weight:600,color:pal.ink},lgX+0.42,lgY1,'l'),lg2=txt({size:0.14,weight:600,color:pal.ink},lgX+0.42,lgY2,'l');
  var pts=[],ptNew=K.flat(pal.ink),ptOld=K.flat(pal.mist);
  function addPoint(s,r){
    var q=K.quad(0.085,0.085,ptNew,gx(s),gy(r),FZ+0.007);g.add(q);pts.push({q:q,s:s});
    if(pts.length>40){var o=pts.shift();g.remove(o.q);}
    paintPoints();
    var seen={};pts.forEach(function(p){seen[Math.round(p.s*20)]=1;});
    fitL.visible=Object.keys(seen).length>=3;
  }
  function paintPoints(){pts.forEach(function(p){p.q.material=Math.abs(p.s-S)<0.001?ptNew:ptOld;});}

  /* ---- turns ---- */
  var S=1.0,auto=true,AUTO=[3,1.5,1,0.5,0.25],ai=2,nAt=0,tAt=0;
  var clock=0,ph='extra',pt=0,uAct=U0,cyc0=0,cycOK=true,lastCycle=null,segs=[];
  function seg(k){if(segs.length)segs[segs.length-1].t1=clock;segs.push({k:k,t0:clock,t1:null});}
  function dur(){return ph==='act'?uAct:S;}
  function enter(p){
    ph=p;pt=0;
    if(p==='extra')seg('x');
    else if(p==='act'){uAct=U0*(0.9+0.2*rnd());seg('u');}
    else{keyTone(true);seg('w');}
  }
  function respond(){
    keyTone(false);
    var c=clock-cyc0;cyc0=clock;lastCycle=c;
    if(cycOK)addPoint(S,60/c);
    cycOK=true;
    lw.push(0.45+1.3*rnd());if(lw.length>5)lw.shift();paintScreen();
    counter();
    if(auto){nAt++;if(nAt>=(S>=1.5?1:2)&&tAt>=3.5){ai=(ai+1)%AUTO.length;setS(AUTO[ai]);}}
    if(api&&api.onUi)api.onUi();
  }
  function setS(v){S=Math.max(SMIN,Math.min(SMAX,v));nAt=0;tAt=0;paintPoints();labels();}
  function pose(){
    var p;
    if(ph==='extra')p=REST;
    else if(ph==='act'){var k=pt/uAct;p=k<0.6?lerp3(REST,HOV,K.ease(k/0.6)):lerp3(HOV,PRS,K.ease(Math.min(1,(k-0.6)/0.4)));}
    else p=lerp3(PRS,REST,K.ease(Math.min(1,pt/Math.min(0.45,S*0.9))));
    setTip(p);
  }
  function tape(){
    while(segs.length>1&&segs[0].t1!==null&&segs[0].t1<clock-TW)segs.shift();
    var used={x:0,u:0,w:0},k;
    for(var j=0;j<segs.length;j++){
      var s=segs[j],a=Math.max(clock-TW,s.t0),b=s.t1===null?clock:s.t1;
      var x0=TX1-(clock-a)*TRATE,x1=TX1-(clock-b)*TRATE,L=x1-x0;
      if(L<0.004)continue;
      var m=pool(s.k,used[s.k]++);m.visible=true;m.scale.x=L;m.position.x=(x0+x1)/2;
    }
    for(k in pools)for(j=used[k];j<pools[k].length;j++)pools[k][j].visible=false;
    /* a tick for every second, moving with the tape */
    var tk=[],z0=TZ-TD/2-0.05,t=Math.ceil(clock-TW);
    for(;t<=clock;t++){var x=TX1-(clock-t)*TRATE;tk.push([x,TBY+0.002,z0,x,TBY+0.002,z0-0.1]);}
    ticks.set(tk);
  }
  function step(dt){
    clock+=dt;pt+=dt;tAt+=dt;
    for(var guard=0;guard<4&&pt>=dur();guard++){
      var over=pt-dur();
      if(ph==='extra')enter('act');else if(ph==='act')enter('wait');else{respond();enter('extra');}
      pt=over;
    }
    pose();tape();
  }

  /* ---- text ---- */
  function counter(){
    put(big,lastCycle?String(Math.round(60/lastCycle)):'–');
    bigU.ax=big.position.x+big.w/2+0.12;put(bigU,tr({da:'i minuttet, seneste handling',en:'per minute, last action'}));
  }
  function labels(){
    spec.setText(tr({da:'Svartid ',en:'Response time '})+num(S,2)+' s');spec.position.set(MX,DY+0.32,MF+0.002);
  }
  function relabel(){
    labels();counter();
    for(var j=0;j<=3;j++)put(tick[j],String(j));
    for(j=0;j<=4;j++)put(tick[4+j],String(j*10));
    put(xl,tr({da:'Svartid, sekunder',en:'Response time, seconds'}));
    put(title,tr({da:'Handlinger i minuttet',en:'Actions per minute'}));
    put(lg1,tr({da:'med ekstra brugertid',en:'with extra user time'}));
    put(lg2,tr({da:'kun ventetiden',en:'waiting only'}));
    var x=TX0-0.05;
    leg.forEach(function(l){l.sw.position.x=x+0.11;l.p.setText(tr(LEG[l.k]));l.p.position.x=x+0.32+l.p.w/2;x+=0.32+l.p.w+0.32;});
  }

  enter('extra');relabel();paintScreen();step(0);
  var api={group:g,onUi:null,
    box:function(){return [[-5.0,0,-2.3],[5.2,3.9,2.8]];},
    update:function(dt){step(dt);},
    relabel:relabel,
    ui:{
      label:function(){return tr({da:'Maskinens svartid',en:'Machine response time'});},
      ends:function(){return tr({da:['0,25 s','3 s'],en:['0.25 s','3 s']});},
      min:SMIN,max:SMAX,step:0.05,
      value:function(){return S;},
      set:function(v){auto=false;if(Math.abs(v-S)<1e-6)return;cycOK=false;setS(+v);if(api.onUi)api.onUi();},
      readout:function(){
        return tr({da:'Svartid ',en:'Response '})+num(S,2)+' s · '+tr({da:'pennens tid ',en:'stylus time '})+num(userT(S),2)+' s · '+
          Math.round(rate(S))+tr({da:' handlinger i minuttet',en:' actions per minute'});},
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;if(auto){nAt=0;tAt=0;}}
    }
  };
  return api;
};
})();

</script>
<script>/* m_fitts.js */
/* m_fitts.js — Fitts's law as the 1954 reciprocal tapping apparatus.
   A stylus on a gantry taps back and forth between two target strips of width W, a distance D apart (centre to centre).
   Every tap is measured, and the measurement is plotted: movement time against the index of difficulty.
   The straight line is not drawn in advance; it appears when the points show it. */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models.fitts=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr,num=TB.num;
  var g=new THREE.Group();
  /* the law's constants for this model. Movement time MT = A + B · ID, ID = log2(D/W + 1) (Shannon form, MacKenzie 1989).
     A and B are set in the range reported for mouse pointing; they are the model's, not a measurement. */
  var P=TB.FITTS||{A:0.05,B:0.22};
  var D_MM=160,U=4.4/D_MM,BX=-1.9,ZS=0.9,TOP=0.4,SH=0.06,CONTACT=TOP+SH;
  var W_MM=64,auto=true,AUTO=[64,32,16,8,5],autoI=0,autoN=0,PER=5;
  function ID(w){return Math.log(D_MM/w+1)/Math.LN2;}

  /* ---- the board ---- */
  var board=K.solid(6.8,TOP,3.2,{x:BX,y:TOP/2,z:1.1});g.add(board);
  var spec=K.plate('',{size:0.19,weight:600,color:pal.ink});spec.position.set(BX,TOP/2,2.7+0.002);g.add(spec);
  function cx(side){return BX+(side?1:-1)*D_MM*U/2;}
  var strips=[0,1].map(function(s){var m=K.solid(1,SH,1.9,{tone:TONE.focal,edge:pal.signal,x:cx(s),y:TOP+SH/2,z:ZS});g.add(m);return m;});
  var wNow=W_MM*U;
  function setStrips(w){wNow=w;strips.forEach(function(m){m.scale.x=w;});dims();}
  /* dimension lines on the board, the drawing's own way of saying W and D */
  var dimL=K.lines([],{color:pal.ink});g.add(dimL);
  var tW=K.plate('W',{size:0.22,weight:700,color:pal.ink});tW.rotation.x=-Math.PI/2;g.add(tW);
  var tD=K.plate('D',{size:0.22,weight:700,color:pal.ink});tD.rotation.x=-Math.PI/2;g.add(tD);
  function dims(){
    var y=TOP+0.004,zw=2.08,zd=2.48,a=cx(1)-wNow/2,b=cx(1)+wNow/2,c0=cx(0),c1=cx(1),t=0.09,s=[];
    s.push([a,y,zw,b,y,zw],[a,y,zw-t,a,y,zw+t],[b,y,zw-t,b,y,zw+t]);
    s.push([c0,y,zd,c1,y,zd],[c0,y,zd-t,c0,y,zd+t],[c1,y,zd-t,c1,y,zd+t]);
    /* extension lines from the strips down to the dimension lines */
    s.push([a,y,ZS+0.95,a,y,zw+t],[b,y,ZS+0.95,b,y,zw+t],[c0,y,ZS+0.95,c0,y,zd+t],[c1,y,ZS+0.95,c1,y,zd+t]);
    dimL.set(s);
    /* each letter beside its own dimension line, inside the board */
    tW.position.set(a-0.12-tW.w/2,y+0.001,zw);
    tD.position.set((c0+c1)/2,y+0.001,zd-0.2);
  }

  /* ---- the gantry: a rail across the board, a carriage, an arm and the stylus ---- */
  var RY=2.35,RZ=-0.75;
  [-5.6,1.8].forEach(function(x){g.add(K.solid(0.16,RY,0.16,{x:x,y:RY/2,z:RZ}));});
  g.add(K.solid(7.56,0.14,0.14,{x:-1.9,y:RY,z:RZ}));
  var car=new THREE.Group();g.add(car);
  car.add(K.solid(0.46,0.38,0.42,{y:RY,z:RZ}));
  car.add(K.solid(0.1,0.1,ZS-RZ,{y:RY,z:(ZS+RZ)/2}));
  var rod=K.solid(0.08,1,0.08,{tone:TONE.dark,edge:pal.midnight});car.add(rod);
  function setTip(x,y){car.position.x=x;var L=RY-0.05-y;rod.scale.y=L;rod.position.set(0,y+L/2,ZS);}

  /* ---- marks: where the stylus has landed, on each strip ---- */
  var dotMat=K.flat(pal.ink),oldMat=K.flat(pal.mist),dots=[[],[]];
  function mark(side,x){
    var q=K.quad(0.07,0.07,dotMat,x,CONTACT+0.003,ZS+(Math.random()-0.5)*1.2);q.rotation.x=-Math.PI/2;g.add(q);dots[side].push(q);
    dots[side].forEach(function(d,i){d.material=i<dots[side].length-6?oldMat:dotMat;});
    if(dots[side].length>14){var o=dots[side].shift();g.remove(o);}
  }
  function clearMarks(){[0,1].forEach(function(s){dots[s].forEach(function(d){g.remove(d);});dots[s]=[];});}

  /* ---- the graph: a board standing to the right ---- */
  var GX=3.85,GZ=0.55,GW=3.7,GH=3.5,FZ=GZ+0.071;
  g.add(K.solid(GW,GH,0.14,{x:GX,y:GH/2,z:GZ}));
  var ax0=GX-GW/2+0.55,ax1=GX+GW/2-0.25,ay0=0.7,ay1=2.75,IDMAX=6,MTMAX=1.6;
  function gx(id){return ax0+(ax1-ax0)*id/IDMAX;}
  function gy(mt){return ay0+(ay1-ay0)*mt/MTMAX;}
  var axes=[[ax0,ay0,FZ,ax1,ay0,FZ],[ax0,ay0,FZ,ax0,ay1,FZ]],i;
  for(i=1;i<=IDMAX;i++)axes.push([gx(i),ay0,FZ,gx(i),ay0-0.07,FZ]);
  for(i=1;i<=3;i++)axes.push([ax0,gy(i*0.5),FZ,ax0-0.07,gy(i*0.5),FZ]);
  g.add(K.lines(axes,{color:pal.ink}));
  var gridL=[];for(i=1;i<=3;i++)gridL.push([ax0,gy(i*0.5),FZ,ax1,gy(i*0.5),FZ]);
  g.add(K.lines(gridL,{color:pal.border}));
  var texts=[];
  function txt(t,o,x,y,align){var p=K.plate(t,o);p.position.set(x+(align==='r'?-p.w/2:align==='l'?p.w/2:0),y,FZ+0.002);g.add(p);texts.push({p:p,x:x,align:align});return p;}
  for(i=0;i<=IDMAX;i+=2)txt(String(i),{size:0.15,weight:400,color:pal.slate},gx(i),ay0-0.2);
  for(i=0;i<=3;i++)txt(num(i*0.5,1),{size:0.15,weight:400,color:pal.slate},ax0-0.12,gy(i*0.5),'r');
  var xl=txt('',{size:0.15,weight:600,color:pal.slate},ax1,ay0-0.42,'r');
  var yl=txt('',{size:0.15,weight:600,color:pal.slate},ax0,ay1+0.2,'l');
  var title=txt('',{size:0.17,weight:700,color:pal.ink},ax0-0.35,GH-0.25,'l');
  var fitL=K.lines([],{color:pal.signal,width:1.5});g.add(fitL);fitL.visible=false;
  var pts=[],ptMat=K.flat(pal.ink),ptOld=K.flat(pal.mist);
  function addPoint(id,mt,w){
    var q=K.quad(0.085,0.085,ptMat,gx(id),gy(Math.min(mt,MTMAX)),FZ+0.004);g.add(q);pts.push({q:q,id:id,mt:mt,w:w});
    if(pts.length>45){var o=pts.shift();g.remove(o.q);}
    paintPoints();fit();
  }
  function paintPoints(){pts.forEach(function(p){p.q.material=p.w===W_MM?ptMat:ptOld;});}
  function fit(){
    var ids={},n=pts.length,sx=0,sy=0,sxx=0,sxy=0;
    pts.forEach(function(p){ids[Math.round(p.id*10)]=1;sx+=p.id;sy+=p.mt;sxx+=p.id*p.id;sxy+=p.id*p.mt;});
    if(Object.keys(ids).length<3||n<6){fitL.visible=false;return;}
    var b=(n*sxy-sx*sy)/(n*sxx-sx*sx),a=(sy-b*sx)/n,x0=0,x1=IDMAX;
    var y0=a+b*x0,y1=a+b*x1;if(y1>MTMAX){x1=(MTMAX-a)/b;y1=MTMAX;}
    fitL.set([[gx(x0),gy(Math.max(0,y0)),FZ+0.006,gx(x1),gy(y1),FZ+0.006]]);fitL.visible=true;
  }

  /* ---- motion: one trial is a primary movement and, for small targets, corrective ones before landing ---- */
  var side=0,trial=null,lastMT=null;
  function gauss(){var u=1-Math.random(),v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
  function plan(){
    var to=1-side,id=ID(W_MM),T=Math.max(0.2,P.A+P.B*id+gauss()*0.035),w=W_MM*U,c=cx(to);
    var xe=c+Math.max(-0.47*w,Math.min(0.47*w,gauss()*w/4.133));
    var nc=id<2.6?0:id<3.6?1:id<4.6?2:3,fp=[1,0.72,0.62,0.56][nc],x=cx(side),dir=to?1:-1,legs=[],t=0;
    var e=(Math.random()<0.7?-1:1)*dir*(w/2+0.03+Math.random()*0.05*D_MM*U),from=car.position.x;
    if(!nc)legs.push({x0:from,x1:xe,t0:0,t1:T*0.92,lift:0.55,land:true});
    else{
      legs.push({x0:from,x1:c+e,t0:0,t1:T*fp,lift:0.55,hover:0.13});t=T*fp;
      var step=(T*0.92-t)/nc,xp=c+e;
      for(var k=0;k<nc;k++){var xn=k===nc-1?xe:c+e*Math.pow(0.35,k+1);legs.push({x0:xp,x1:xn,t0:t,t1:t+step,lift:0,hover:0.13,land:k===nc-1});xp=xn;t+=step;}
    }
    trial={to:to,id:id,T:T,t:0,legs:legs,xe:xe,w:W_MM,done:false};
  }
  function mj(k){return k*k*k*(10-15*k+6*k*k);}
  function stepTrial(dt){
    if(!trial)plan();
    trial.t+=dt;var t=trial.t,L=trial.legs,leg=L[L.length-1],x,y;
    for(var k=0;k<L.length;k++){if(t<=L[k].t1){leg=L[k];break;}}
    var u=Math.min(1,Math.max(0,(t-leg.t0)/(leg.t1-leg.t0))),m=mj(u);
    x=leg.x0+(leg.x1-leg.x0)*m;
    if(leg===L[0]){var end=leg.land?0:leg.hover;y=CONTACT+leg.lift*Math.sin(Math.PI*u)+end*sstep(0.5,1,u);}
    else{y=CONTACT+(leg.land?leg.hover*(1-sstep(0.55,1,u)):leg.hover);}
    setTip(x,y);
    if(t>=trial.T*0.92&&!trial.done){
      trial.done=true;setTip(trial.xe,CONTACT);mark(trial.to,trial.xe);addPoint(trial.id,trial.T,trial.w);lastMT=trial.T;readout();
    }
    if(t>=trial.T){side=trial.to;trial=null;
      if(auto){autoN++;if(autoN>=PER){autoN=0;autoI=(autoI+1)%AUTO.length;setW(AUTO[autoI],true);}}
    }
  }
  function sstep(a,b,x){var k=Math.min(1,Math.max(0,(x-a)/(b-a)));return k*k*(3-2*k);}

  /* ---- the handle: target width ---- */
  var wFrom=wNow,wTo=wNow,wK=1;
  function setW(mm,fromAuto){
    mm=Math.round(mm);if(mm===W_MM)return;W_MM=mm;wFrom=wNow;wTo=mm*U;wK=0;clearMarks();paintPoints();readout();
    if(!fromAuto&&ctx.onChange)ctx.onChange();
    if(api&&api.onUi)api.onUi();
  }
  function readout(){
    spec.setText(tr({da:'D 160 mm  ·  W ',en:'D 160 mm  ·  W '})+W_MM+' mm  ·  ID '+num(ID(W_MM),2)+' bit');
    spec.position.x=BX;
    title.setText('MT = a + b · log₂(D/W + 1)');title.position.x=ax0-0.35+title.w/2;
    xl.setText(tr({da:'ID, bit',en:'ID, bits'}));xl.position.x=ax1-xl.w/2;
    yl.setText(tr({da:'MT, sekunder',en:'MT, seconds'}));yl.position.x=ax0+yl.w/2-0.25;
  }

  setStrips(wNow);readout();setTip(cx(0),CONTACT);
  var api={group:g,onUi:null,
    box:function(){return [[-5.6,0,-1.0],[5.75,3.6,2.8]];},
    update:function(dt){
      if(wK<1){wK=Math.min(1,wK+dt/0.3);setStrips(wFrom+(wTo-wFrom)*K.ease(wK));}
      stepTrial(dt);
    },
    relabel:readout,
    ui:{
      label:function(){return tr({da:'Målets bredde W',en:'Target width W'});},
      ends:function(){return tr({da:['Smal','Bred'],en:['Narrow','Wide']});},
      min:0,max:100,step:1,
      value:function(){return Math.round(100*Math.log(W_MM/5)/Math.log(64/5));},
      set:function(v){auto=false;setW(5*Math.pow(64/5,v/100));},
      readout:function(){return W_MM+' mm · ID '+num(ID(W_MM),2)+' bit'+(lastMT?tr({da:' · seneste tryk ',en:' · last tap '})+num(lastMT,2)+' s':'');},
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;if(auto){autoN=0;setW(AUTO[autoI],true);}}
    }
  };
  return api;
};
})();

</script>
<script>/* m_flow.js */
/* m_flow.js — flow as a channel on a board of challenge against skill (Csikszentmihalyi 1975).
   A block's skill grows at a steady pace; the challenge rises at a rate set by the handle. Matched, the block stays in the raised
   channel along the diagonal; too fast and it heads for anxiety, too slow for boredom. A board measures the share of the run in each state.
   The channel's width and all speeds are the model's. Across studies the balance relates to flow only moderately (Fong et al. 2015). */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models.flow=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr,num=TB.num;
  var g=new THREE.Group(),i;
  /* plane: skill s runs to the right, challenge c runs to the back */
  var PY=0.2,OX=-3.1,LW=5.2,OZ=2.35,LD=5.2,D=0.13,CH=0.04;
  function X(s){return OX+s*LW;}
  function Z(c){return OZ-c*LD;}
  g.add(K.solid(6.1,PY,6.1,{x:-0.5,y:PY/2,z:-0.2}));

  /* the channel: |c - s| <= D, cut by the edges of the plane, raised a little */
  function prism(P,y0,h,t,edge){
    var pos=[],col=[],c=new THREE.Color(),y1=y0+h,n=P.length,j;
    function tri(a,b,d,hex){pos.push(a[0],a[1],a[2],b[0],b[1],b[2],d[0],d[1],d[2]);c.setHex(hex);for(var q=0;q<3;q++)col.push(c.r,c.g,c.b);}
    for(j=1;j<n-1;j++)tri([P[0][0],y1,P[0][1]],[P[j][0],y1,P[j][1]],[P[j+1][0],y1,P[j+1][1]],t[0]);
    var ln=[];
    for(j=0;j<n;j++){
      var a=P[j],b=P[(j+1)%n],dx=b[0]-a[0],dz=b[1]-a[1],L=Math.hypot(dx,dz),hex=Math.abs(dx/L)>0.5?t[1]:t[2];
      tri([a[0],y0,a[1]],[b[0],y0,b[1]],[b[0],y1,b[1]],hex);tri([a[0],y0,a[1]],[b[0],y1,b[1]],[a[0],y1,a[1]],hex);
      ln.push([a[0],y1,a[1],b[0],y1,b[1]],[a[0],y0,a[1],b[0],y0,b[1]],[a[0],y0,a[1],a[0],y1,a[1]]);
    }
    var geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
    var m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}));
    m.add(K.lines(ln,{color:edge}));
    return m;
  }
  var band=[[0,0],[D,0],[1,1-D],[1,1],[1-D,1],[0,D]].map(function(p){return [X(p[0]),Z(p[1])];});
  g.add(prism(band,PY,CH,TONE.focal,pal.signal));
  /* the two axes along the plane's front and left edges */
  g.add(K.lines([[X(0),PY+0.003,Z(0),X(1),PY+0.003,Z(0)],[X(0),PY+0.003,Z(0),X(0),PY+0.003,Z(1)]],{color:pal.ink}));
  function lying(o,ang){var p=K.plate('',o);p.rotation.order='YXZ';p.rotation.y=ang||0;p.rotation.x=-Math.PI/2;g.add(p);return p;}
  var tAnx=lying({size:0.32,weight:700,color:pal.slate}),tBore=lying({size:0.32,weight:700,color:pal.slate}),tFlow=lying({size:0.3,weight:700,color:pal.signalShadow},Math.PI/4);
  var tSkill=lying({size:0.22,weight:600,color:pal.ink}),tChal=lying({size:0.22,weight:600,color:pal.ink},Math.PI/2);
  /* the region names sit where no run's trace can pass: the steepest run (3.2 x) climbs right of 'Anxiety',
     the flattest (0.3 x) passes above 'Boredom' */
  function regionNames(){tAnx.position.set(X(0.04)+tAnx.w/2,PY+0.003,Z(0.86));tBore.position.set(X(0.78),PY+0.003,Z(0.13));}/* beside the middle of the channel, where the block's trace runs */
  tFlow.position.set(X(0.66)-0.19,PY+CH+0.003,Z(0.66)-0.19);

  /* the block and its trace */
  var BS=0.36,blk=K.solid(BS,BS,BS,{tone:TONE.white});g.add(blk);
  var trIn=K.lines([],{color:pal.signal,width:1.5}),trOut=K.lines([],{color:pal.slate,width:1.25});g.add(trIn);g.add(trOut);
  var state='';
  function look(st){if(st===state)return;state=st;blk.setTone(st==='flow'?TONE.signal:TONE.white);blk.setEdge(st==='flow'?pal.signalShadow:pal.borderStrong);}
  function region(s,c){var d=c-s;return Math.abs(d)<=D?'flow':d>0?'anx':'bore';}

  /* the board: share of the run in each state */
  var BX=3.95,BZ=-1.0,BW=2.4,BH=3.0,FZ=BZ+0.071,bx0=BX-BW/2;
  g.add(K.solid(BW,BH,0.14,{x:BX,y:BH/2,z:BZ}));
  function txt(o,x,y,al){var p=K.plate('',o);p.position.set(x,y,FZ+0.002);p.al=al||'c';p.ax=x;g.add(p);return p;}
  function put(p,t){p.setText(t);p.position.x=p.ax+(p.al==='r'?-p.w/2:p.al==='l'?p.w/2:0);}
  var title=txt({size:0.18,weight:700,color:pal.ink},bx0+0.18,BH-0.3,'l');
  var ROWS=[{k:'anx',y:2.1},{k:'flow',y:1.5},{k:'bore',y:0.9}],BAR0=bx0+1.05,BARL=0.72;
  ROWS.forEach(function(r){
    r.lab=txt({size:0.15,weight:600,color:pal.ink},BAR0-0.1,r.y,'r');
    r.val=txt({size:0.15,weight:700,color:pal.ink},BAR0+BARL+0.08,r.y,'l');
    r.bar=K.solid(1,0.3,0.05,{tone:r.k==='flow'?TONE.focal:TONE.paper,edge:r.k==='flow'?pal.signal:pal.slate,y:r.y,z:FZ+0.026});r.bar.visible=false;g.add(r.bar);
    g.add(K.lines([[BAR0,r.y-0.2,FZ+0.002,BAR0,r.y+0.2,FZ+0.002]],{color:pal.ink}));
    r.shown=-1;
  });
  var foot=txt({size:0.13,weight:600,color:pal.slate,lead:1.3},bx0+0.18,0.42,'l');

  /* ---- a run ---- */
  var v=50,auto=true,AUTO=[50,88,50,12],ai=0,phase='run',pt=0,s=0,c=0,S0=0.06,RUN=7.5,tm={anx:0,flow:0,bore:0},trace=[],lastT=0;
  function r(){return Math.pow(2,(v-50)/30);}
  function begin(){phase='run';pt=0;s=S0;c=S0;tm={anx:0,flow:0,bore:0};trace=[{s:s,c:c,k:'flow'}];lastT=0;ROWS.forEach(function(q){q.shown=-1;});place();}
  function place(){var k=region(s,c);look(k);blk.position.set(X(s),PY+(k==='flow'?CH:0)+BS/2,Z(c));}
  function drawTrace(){
    var a=[],b=[];for(var j=0;j<trace.length-1;j++){var p=trace[j],q=trace[j+1],sg=[X(p.s),PY+CH+0.004,Z(p.c),X(q.s),PY+CH+0.004,Z(q.c)];(p.k==='flow'&&q.k==='flow'?a:b).push(sg);}
    trIn.set(a);trOut.set(b);
  }
  function share(k){var T=tm.anx+tm.flow+tm.bore;return T?tm[k]/T:0;}
  function ran(){return tm.anx+tm.flow+tm.bore>0;}
  function board(){
    ROWS.forEach(function(q){var f=share(q.k),pc=Math.round(100*f);
      q.bar.visible=f>0.004;q.bar.scale.x=Math.max(0.001,BARL*f);q.bar.position.x=BAR0+BARL*f/2;
      if(!ran())pc=-2;if(pc!==q.shown){q.shown=pc;put(q.val,pc<0?'–':pc+' %');}});
  }
  function update(dt){
    pt+=dt;
    if(phase==='run'){
      var ds=(0.97-S0)/RUN*dt;s+=ds;c+=ds*r();
      var k=region(s,c);tm[k]+=dt;
      if(pt-lastT>0.1){trace.push({s:Math.min(1,s),c:Math.max(0,Math.min(1,c)),k:k});lastT=pt;if(trace.length>260)trace.shift();drawTrace();}
      if(s>=0.97||c>=0.97||c<=0.01){s=Math.min(s,0.97);c=Math.max(0.01,Math.min(c,0.97));trace.push({s:s,c:c,k:region(s,c)});drawTrace();phase='hold';pt=0;if(api&&api.onUi)api.onUi();}
      place();board();
    }else if(phase==='hold'){
      if(pt>=2.6){phase='back';pt=0;this_from=[s,c];}
    }else if(phase==='back'){
      var u=K.ease(Math.min(1,pt/0.8));s=this_from[0]+(S0-this_from[0])*u;c=this_from[1]+(S0-this_from[1])*u;place();
      trIn.setOpacity(1-u);trOut.setOpacity(1-u);
      if(u>=1){trIn.setOpacity(1);trOut.setOpacity(1);if(auto){ai=(ai+1)%AUTO.length;v=AUTO[ai];}begin();drawTrace();texts();if(api&&api.onUi)api.onUi();}
    }
  }
  var this_from=[0,0];
  function texts(){
    tAnx.setText(tr({da:'Angst',en:'Anxiety'}));tBore.setText(tr({da:'Kedsomhed',en:'Boredom'}));regionNames();tFlow.setText('Flow');
    tSkill.setText(tr({da:'Evner',en:'Skill'}));tSkill.position.set(X(0.5),PY+0.003,OZ+0.3);
    tChal.setText(tr({da:'Udfordring',en:'Challenge'}));tChal.position.set(OX-0.27,PY+0.003,Z(0.5));
    put(title,tr({da:'Andel af turen',en:'Share of the run'}));
    var L={anx:{da:'Angst',en:'Anxiety'},flow:{da:'Flow',en:'Flow'},bore:{da:'Kedsomhed',en:'Boredom'}};
    ROWS.forEach(function(q){put(q.lab,tr(L[q.k]));q.shown=-1;});
    put(foot,[tr({da:'Udfordringen stiger',en:'The challenge rises'}),num(r(),1)+tr({da:' × så hurtigt som evnerne',en:' × as fast as skill'})]);
    board();
  }
  begin();texts();drawTrace();
  var api={group:g,onUi:null,
    box:function(){return [[-3.6,0,-3.3],[5.2,3.0,2.9]];},
    update:update,
    relabel:texts,
    ui:{
      label:function(){return tr({da:'Hvor hurtigt udfordringen stiger',en:'How fast the challenge rises'});},
      ends:function(){return tr({da:['Langsommere end evnerne','Hurtigere end evnerne'],en:['Slower than skill','Faster than skill']});},
      min:0,max:100,step:1,
      value:function(){return v;},
      set:function(x){auto=false;v=+x;texts();if(phase!=='run'){begin();drawTrace();}if(api.onUi)api.onUi();},
      readout:function(){
        return tr({da:'Udfordringen stiger ',en:'Challenge rises '})+num(r(),1)+tr({da:' × så hurtigt som evnerne · i kanalen ',en:' × as fast as skill · in the channel '})+(ran()?Math.round(100*share('flow'))+tr({da:'\u00a0% af turen',en:'\u00a0% of the run'}):'–');},
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;if(auto&&phase==='hold')pt=0;}
    }
  };
  return api;
};
})();

</script>
<script>/* m_goalgradient.js */
/* m_goalgradient.js — the goal-gradient effect as a stamp card.
   Ten purchases earn a reward. The stylus stamps one slot per purchase, and the time to the next purchase depends on how full the card looks:
   the fuller it is, the sooner the next stamp. Each stamp's pace (stamps per week) becomes a column on the board.
   The handle gives 0–4 stamps from the start. The card grows by the same number of slots, so ten purchases are still needed,
   as in the café study by Kivetz, Urminsky & Zheng (2006), where a 12-stamp card with 2 stamps given was finished faster than a 10-stamp card.
   The pace function is the model's: interval = T0 / (1 + A · share of the card filled). */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models['goal-gradient']=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr,num=TB.num;
  var g=new THREE.Group(),i;
  var NEED=10,HMAX=4,T0=3.5,A=0.6,DAY=0.3;
  function interval(f,n){return T0/(1+A*f/n);}          /* days to the next purchase, with f of n slots filled */
  function pace(f,n){return 7/interval(f,n);}            /* stamps per week */
  function total(h){var s=0;for(var k=0;k<NEED;k++)s+=interval(h+k,NEED+h);return s;}

  /* ---- the card on its plinth ---- */
  var PY=0.3,PX0=-4.95,PX1=1.45,PZ=0.85,PD=1.75;
  g.add(K.solid(PX1-PX0,PY,PD,{x:(PX0+PX1)/2,y:PY/2,z:PZ}));
  var P=0.42,CX0=-4.75,CZ=0.72,CT=0.05,CTOP=PY+CT,SL=0.32;
  var card=K.solid(1,CT,1.15,{tone:TONE.white,y:PY+CT/2,z:CZ});g.add(card);
  function sx(i){return CX0+0.15+P*(i+0.5);}
  var slots=K.lines([],{color:pal.borderStrong});g.add(slots);
  var goal=K.lines([],{color:pal.signal,width:1.5});g.add(goal);
  var goalT=K.plate('',{size:0.14,weight:700,color:pal.signalShadow});goalT.rotation.x=-Math.PI/2;g.add(goalT);
  function sq(x,z,s,y){var a=s/2;return [[x-a,y,z-a,x+a,y,z-a],[x+a,y,z-a,x+a,y,z+a],[x+a,y,z+a,x-a,y,z+a],[x-a,y,z+a,x-a,y,z-a]];}
  var cardW=0,cwFrom=0,cwTo=0,cwK=1,slotN=0;
  function layCard(w){
    cardW=w;card.scale.x=w;card.position.x=CX0+w/2;
    if(slotN)paintSlots(slotN);
  }
  /* the reward slot and its name sit at the card's right end, so while the card grows or shrinks they move with it
     and never hang off it; the other slots are drawn only where the card already is */
  function paintSlots(n){
    slotN=n;var gx=CX0+cardW-0.15-P/2,s=[];
    for(var j=0;j<n-1;j++){if(sx(j)>gx-P+0.001)break;s=s.concat(sq(sx(j),CZ,SL,CTOP+0.002));}
    slots.set(s);goal.set(sq(gx,CZ,SL,CTOP+0.003));
    goalT.position.set(gx,CTOP+0.003,CZ+0.36);
  }
  var stamps=[];
  for(i=0;i<NEED+HMAX;i++){var st=K.solid(0.25,0.04,0.25,{tone:TONE.dark,edge:pal.midnight,y:CTOP+0.02,z:CZ});st.visible=false;st.kind='e';g.add(st);stamps.push(st);}
  /* a stamp: given (grey), earned (dark), or the last one, which earns the reward (blue) */
  function stampAs(j,given){var s=stamps[j],kind=given?'g':(j===N()-1?'r':'e');
    if(s.kind!==kind){s.kind=kind;s.setTone(kind==='g'?TONE.slate:kind==='r'?TONE.signal:TONE.dark);s.setEdge(kind==='g'?pal.dusk:kind==='r'?pal.signalShadow:pal.midnight);}
    s.position.x=sx(j);s.visible=true;}
  var cap=K.plate('',{size:0.17,weight:600,color:pal.ink});g.add(cap);
  var dayP=K.plate('',{size:0.17,weight:700,color:pal.ink});g.add(dayP);

  /* ---- the stylus ---- */
  var LEN=1.25,HOV=CTOP+0.42,rod=K.solid(0.08,LEN,0.08,{tone:TONE.dark,edge:pal.midnight});g.add(rod);
  function setTip(x,y){rod.position.set(x,y+LEN/2,CZ);}

  /* ---- the board: pace per stamp ---- */
  var BX=3.45,BZ=-0.2,BW=3.4,BH=3.9,FZ=BZ+0.071;
  g.add(K.solid(BW,BH,0.14,{x:BX,y:BH/2,z:BZ}));
  var ax0=BX-BW/2+0.55,ax1=BX+BW/2-0.25,ay0=0.62,ay1=2.32,YMAX=4;
  function gx(k){return ax0+(ax1-ax0)*(k-0.5)/NEED;}
  function gy(v){return ay0+(ay1-ay0)*v/YMAX;}
  var axl=[[ax0,ay0,FZ,ax1,ay0,FZ],[ax0,ay0,FZ,ax0,ay1,FZ]],grid=[];
  for(i=1;i<=4;i++){axl.push([ax0,gy(i),FZ,ax0-0.07,gy(i),FZ]);grid.push([ax0,gy(i),FZ,ax1,gy(i),FZ]);}
  g.add(K.lines(axl,{color:pal.ink}));g.add(K.lines(grid,{color:pal.border}));
  function txt(o,x,y,al){var p=K.plate('',o);p.position.set(x,y,FZ+0.002);p.al=al||'c';p.ax=x;g.add(p);return p;}
  function put(p,t){p.setText(t);p.position.x=p.ax+(p.al==='r'?-p.w/2:p.al==='l'?p.w/2:0);}
  var yt=[];for(i=0;i<=4;i++)yt.push(txt({size:0.14,weight:400,color:pal.slate},ax0-0.12,gy(i),'r'));
  var xt=[];for(i=1;i<=NEED;i++)xt.push(txt({size:0.12,weight:400,color:pal.slate},gx(i),ay0-0.17));
  var xl=txt({size:0.14,weight:600,color:pal.slate},ax1,ay0-0.4,'r');
  var yl=txt({size:0.14,weight:600,color:pal.slate},ax0-0.25,ay1+0.2,'l');
  var title=txt({size:0.19,weight:700,color:pal.ink},ax0-0.3,BH-0.3,'l');
  var res=txt({size:0.16,weight:700,color:pal.ink},ax0-0.3,BH-0.66,'l');
  var resG=txt({size:0.15,weight:600,color:pal.slate},ax0-0.3,BH-0.92,'l');
  var CW=0.17,cols=[];
  for(i=1;i<=NEED;i++){var c=K.solid(CW,1,0.05,{tone:TONE.paper,edge:pal.slate,x:gx(i),z:FZ+0.026});c.visible=false;g.add(c);cols.push({m:c,h:0,to:0});}
  function setCol(j,h){var c=cols[j];c.h=h;c.m.visible=h>0.004;c.m.scale.y=Math.max(0.001,h);c.m.position.y=ay0+h/2;}
  /* dashed: the same ten purchases on a card without a head start */
  var ghost=K.lines([],{color:pal.ink,dash:[4,3]});g.add(ghost);
  function paintGhost(){
    if(!h){ghost.visible=false;resG.visible=false;return;}
    ghost.visible=true;resG.visible=true;
    var s=[],z=FZ+0.06,a=CW/2+0.025;
    for(var k=0;k<NEED;k++){var x=gx(k+1),y1=gy(pace(k,NEED));s.push([x-a,ay0,z,x-a,y1,z],[x-a,y1,z,x+a,y1,z],[x+a,y1,z,x+a,ay0,z]);}
    ghost.set(s);
  }

  /* ---- a run: ten purchases, a pause, and the next card ---- */
  var h=0,auto=true,AUTO=[0,2,4],ai=0,phase='run',pt=0,k=0,u=0,L=0,day=0,shownDay=-1,lastDone=null;
  function N(){return NEED+h;}
  function begin(){
    phase='run';pt=0;k=0;u=0;day=0;shownDay=-1;
    L=interval(h,N())*DAY;
    for(var j=0;j<stamps.length;j++){if(j<h)stampAs(j,true);else stamps[j].visible=false;}
    for(j=0;j<NEED;j++){setCol(j,0);cols[j].to=0;}
    paintSlots(N());paintGhost();texts();
  }
  function resize(fast){cwFrom=cardW;cwTo=N()*P+0.3;cwK=fast?0.7:0;}
  function stylus(){
    var n=N(),from=k+h-1,to=k+h,xf=from<0?CX0-0.1:sx(from),xt2=sx(Math.min(to,n-1)),x,y;
    if(phase!=='run'){x=sx(n-1);y=HOV;setTip(x,y);return;}
    var m=K.ease(Math.min(1,Math.max(0,(u-0.12)/0.35)));x=xf+(xt2-xf)*m;
    if(u<0.12)y=CTOP+0.04+(HOV-CTOP-0.04)*K.ease(u/0.12);else if(u>L-0.15)y=HOV-(HOV-CTOP-0.04)*K.ease(Math.min(1,(u-(L-0.15))/0.15));else y=HOV;
    if(k===0&&from<0&&u<0.12)y=HOV;
    setTip(x,y);
  }
  function update(dt){
    pt+=dt;
    if(cwK<1){cwK=Math.min(1,cwK+dt/0.8);layCard(cwFrom+(cwTo-cwFrom)*K.ease(cwK));}
    for(var j=0;j<NEED;j++){var c=cols[j];if(Math.abs(c.h-c.to)>0.001)setCol(j,c.h+(c.to-c.h)*Math.min(1,dt*9));}
    if(phase==='run'){
      u+=dt;day+=dt/DAY;
      if(Math.floor(day)!==shownDay){shownDay=Math.floor(day);dayText();}
      if(u>=L){
        /* a purchase: the stamp goes on the card and its pace onto the board */
        stampAs(h+k,false);cols[k].to=gy(pace(h+k,N()))-ay0;k++;u-=L;
        if(k>=NEED){phase='hold';pt=0;lastDone=total(h);day=lastDone;dayText();texts();if(api&&api.onUi)api.onUi();}
        else L=interval(h+k,N())*DAY;
      }
    }else if(phase==='hold'){
      if(pt>=3.6){phase='reset';pt=0;}
    }else if(phase==='reset'){
      var r=Math.min(1,pt/0.5);for(j=0;j<NEED;j++){cols[j].to=0;}
      if(r>=1){if(auto){ai=(ai+1)%AUTO.length;h=AUTO[ai];resize(false);}begin();if(api&&api.onUi)api.onUi();}
    }
    stylus();
  }
  function dayText(){
    dayP.setText(tr({da:'Dag ',en:'Day '})+(phase==='run'?String(shownDay):num(day,1)));
    dayP.position.set(PX1-0.3-dayP.w/2,PY/2,PZ+PD/2+0.002);
  }
  function texts(){
    cap.setText(tr({da:N()+' pladser, '+h+' givet · '+NEED+' køb til en belønning',en:N()+' slots, '+h+' given · '+NEED+' purchases to a reward'}));
    cap.position.set(PX0+0.3+cap.w/2,PY/2,PZ+PD/2+0.002);
    goalT.setText(tr({da:'Belønning',en:'Reward'}));
    put(title,tr({da:'Tempo pr. stempel',en:'Pace per stamp'}));
    put(res,phase==='run'?tr({da:'Kortet fyldes …',en:'Filling the card …'}):tr({da:'Fuldt kort på dag ',en:'Full card on day '})+num(total(h),1));
    put(resG,tr({da:'Uden forspring: dag ',en:'Without a head start: day '})+num(total(0),1));
    for(var j=0;j<=4;j++)put(yt[j],String(j));
    for(j=0;j<NEED;j++)put(xt[j],String(j+1));
    put(xl,tr({da:'Køb nr.',en:'Purchase no.'}));
    put(yl,tr({da:'Stempler pr. uge',en:'Stamps per week'}));
    dayText();
  }
  function setH(v,fast){h=Math.max(0,Math.min(HMAX,Math.round(v)));resize(fast);begin();}

  setH(0,true);layCard(N()*P+0.3);cwK=1;
  var api={group:g,onUi:null,
    box:function(){return [[-5.0,0,-0.4],[5.2,3.9,1.75]];},
    update:update,
    relabel:texts,
    ui:{
      label:function(){return tr({da:'Stempler givet fra start',en:'Stamps given at the start'});},
      ends:function(){return tr({da:['Ingen','4'],en:['None','4']});},
      min:0,max:HMAX,step:1,
      value:function(){return h;},
      set:function(v){auto=false;v=Math.round(v);if(v===h&&phase==='run')return;setH(v,true);if(api.onUi)api.onUi();},
      readout:function(){
        return tr({da:'Forspring '+h+' af '+N()+' · '+NEED+' køb · fuldt kort på dag ',en:'Head start '+h+' of '+N()+' · '+NEED+' purchases · full card on day '})+num(total(h),1)+
          (h?tr({da:' (uden forspring: dag ',en:' (no head start: day '})+num(total(0),1)+')':'');},
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;if(auto&&phase==='hold')pt=0;}
    }
  };
  return api;
};
})();

</script>
<script>/* m_hick.js */
/* m_hick.js — Hick's law as a choice reaction apparatus.
   A panel of n lamps, each with its button in front of it. One lamp lights, chosen at random (all equally likely and known).
   The dark stylus waits while the choice is made, then moves to the button and presses it.
   The reaction time is measured from the lamp to the moment the stylus starts to move: the movement itself is Fitts's law and is not counted.
   While the stylus waits, a line rises on the graph at n; when it moves, the line stops and leaves a point.
   RT = a + b · log2(n + 1). The constants are the model's. The curve is drawn only when the points show it. */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models.hick=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr,num=TB.num;
  var g=new THREE.Group(),rnd=K.rng(1952);
  /* the model's constants: a = 0.2 s, b = 0.15 s per bit. Not a measurement. */
  var A=0.2,BB=0.15,NMAX=10;
  function bits(n){return Math.log(n+1)/Math.LN2;}

  /* ---- the panel: lamps at the back, buttons in front ---- */
  var PX=-1.95,PZ=0.7,PW=6.2,PT=0.4,PD=2.4,LZ=0.05,BZ=1.2,SP=0.56;
  g.add(K.solid(PW,PT,PD,{x:PX,y:PT/2,z:PZ}));
  var spec=K.plate('',{size:0.19,weight:600,color:pal.ink});spec.position.set(PX,PT/2,PZ+PD/2+0.002);g.add(spec);
  var pairs=[],i;
  for(i=0;i<NMAX;i++){
    var lamp=K.solid(0.34,0.3,0.34,{tone:TONE.white,edge:pal.slate,y:PT+0.15,z:LZ});
    var btn=K.solid(0.4,0.14,0.4,{tone:TONE.white,edge:pal.slate,y:PT+0.07,z:BZ});
    var tie=K.lines([[0,PT+0.003,LZ+0.2,0,PT+0.003,BZ-0.23]],{color:pal.border});
    g.add(lamp);g.add(btn);g.add(tie);
    pairs.push({lamp:lamp,btn:btn,tie:tie,x:PX,fx:PX,tx:PX,s:0,fs:0,ts:0,on:false,down:0});
  }
  function slotX(k,n){return PX+(k-(n-1)/2)*SP;}
  function placePair(p){
    var s=Math.max(0.001,p.s);
    p.lamp.position.x=p.btn.position.x=p.x;p.tie.position.x=p.x;
    p.lamp.scale.set(s,s,s);p.lamp.position.y=PT+0.15*s;p.lamp.visible=p.btn.visible=p.tie.visible=p.s>0.01;
    var h=s*(1-0.55*p.down);p.btn.scale.set(s,Math.max(0.001,h),s);p.btn.position.y=PT+0.07*h;p.tie.scale.z=1;
  }
  function light(p,on){if(p.on===on)return;p.on=on;p.lamp.setTone(on?TONE.signal:TONE.white);p.lamp.setEdge(on?pal.signalShadow:pal.slate);}

  /* ---- the gantry and the stylus (as in Fitts) ---- */
  var RY=2.6,RZ=-0.9,HOME=1.35,HOVER=0.78,CONTACT=PT+0.14;
  [-5.0,1.1].forEach(function(x){g.add(K.solid(0.16,RY,0.16,{x:x,y:RY/2,z:RZ}));});
  g.add(K.solid(6.26,0.14,0.14,{x:-1.95,y:RY,z:RZ}));
  var car=new THREE.Group();g.add(car);
  car.add(K.solid(0.46,0.38,0.42,{y:RY,z:RZ}));
  car.add(K.solid(0.1,0.1,BZ-RZ,{y:RY,z:(BZ+RZ)/2}));
  var rod=K.solid(0.08,1,0.08,{tone:TONE.dark,edge:pal.midnight});car.add(rod);
  function setTip(x,y){car.position.x=x;var L=RY-0.05-y;rod.scale.y=L;rod.position.set(0,y+L/2,BZ);}

  /* ---- the graph ---- */
  var GX=3.7,GZ=0.55,GW=3.0,GH=4.0,FZ=GZ+0.071;
  g.add(K.solid(GW,GH,0.14,{x:GX,y:GH/2,z:GZ}));
  var ax0=GX-GW/2+0.55,ax1=GX+GW/2-0.22,ay0=1.4,ay1=3.4,RTMAX=1.0,by=ay0-0.8;
  function gx(n){return ax0+(ax1-ax0)*n/NMAX;}
  function gy(t){return ay0+(ay1-ay0)*Math.min(t,RTMAX)/RTMAX;}
  var axes=[[ax0,ay0,FZ,ax1,ay0,FZ],[ax0,ay0,FZ,ax0,ay1,FZ]];
  for(i=1;i<=NMAX;i++)axes.push([gx(i),ay0,FZ,gx(i),ay0-0.06,FZ]);
  for(i=1;i<=5;i++)axes.push([ax0,gy(i*0.2),FZ,ax0-0.06,gy(i*0.2),FZ]);
  /* a second scale under the first: the information, log2(n + 1), in bits. Each bit needs twice as many options plus one. */
  axes.push([ax0,by,FZ,ax1,by,FZ]);
  [0,1,3,7].forEach(function(n){axes.push([gx(n),by,FZ,gx(n),by-0.06,FZ]);});
  g.add(K.lines(axes,{color:pal.ink}));
  var grid=[];for(i=1;i<=5;i++)grid.push([ax0,gy(i*0.2),FZ,ax1,gy(i*0.2),FZ]);
  g.add(K.lines(grid,{color:pal.border}));
  var texts=[];
  function txt(t,o,x,y,align){var p=K.plate(t,o);g.add(p);var r={p:p,x:x,y:y,align:align};texts.push(r);put(r);return r;}
  function put(r){r.p.position.set(r.x+(r.align==='r'?-r.p.w/2:r.align==='l'?r.p.w/2:0),r.y,FZ+0.002);}
  function setT(r,t){r.p.setText(t);put(r);}
  [1,2,4,6,8,10].forEach(function(n){txt(String(n),{size:0.13,weight:400,color:pal.slate},gx(n),ay0-0.17);});
  for(i=0;i<=5;i+=1)txt('',{size:0.13,weight:400,color:pal.slate},ax0-0.1,gy(i*0.2),'r');
  var yLabs=texts.slice(-6);
  [[0,'0'],[1,'1'],[3,'2'],[7,'3']].forEach(function(a){txt(a[1],{size:0.13,weight:400,color:pal.slate},gx(a[0]),by-0.17);});
  var xl=txt('',{size:0.13,weight:600,color:pal.slate},ax1,ay0-0.4,'r');
  var bl=txt('',{size:0.13,weight:600,color:pal.slate},ax1,by-0.4,'r');
  var yl=txt('',{size:0.13,weight:600,color:pal.slate},ax0-0.25,ay1+0.2,'l');
  var title=txt('',{size:0.17,weight:700,color:pal.ink},ax0-0.4,GH-0.22,'l');
  var meas=K.lines([],{color:pal.ink,width:2});g.add(meas);meas.visible=false;
  var fitL=K.lines([],{color:pal.signal,width:1.5});g.add(fitL);fitL.visible=false;
  var pts=[],ptMat=K.flat(pal.ink),ptOld=K.flat(pal.mist);
  function addPoint(n,t){
    var q=K.quad(0.075,0.075,ptMat,gx(n)+(rnd()-0.5)*0.05,gy(t),FZ+0.004);g.add(q);pts.push({q:q,n:n,t:t});
    if(pts.length>48){var o=pts.shift();g.remove(o.q);}
    paintPoints();fit();
  }
  function paintPoints(){pts.forEach(function(p){p.q.material=p.n===N?ptMat:ptOld;});}
  function fit(){
    var ns={},m=pts.length,sx=0,sy=0,sxx=0,sxy=0;
    pts.forEach(function(p){var x=bits(p.n);ns[p.n]=1;sx+=x;sy+=p.t;sxx+=x*x;sxy+=x*p.t;});
    if(Object.keys(ns).length<3||m<6){fitL.visible=false;return;}
    var b=(m*sxy-sx*sy)/(m*sxx-sx*sx),a=(sy-b*sx)/m,seg=[],k,n0,n1;
    for(k=0;k<36;k++){n0=1+9*k/36;n1=1+9*(k+1)/36;seg.push([gx(n0),gy(a+b*bits(n0)),FZ+0.006,gx(n1),gy(a+b*bits(n1)),FZ+0.006]);}
    fitL.set(seg);fitL.visible=true;
  }

  /* ---- one trial: rest, a lamp lights, the stylus waits (measured), moves, presses, goes home ---- */
  var N=3,auto=true,SEQ=[3,7,10,1,5,2],si=0,perN=0,lastRT=null,tr0=null,tipX=PX,tipY=HOME;
  function gauss(){var u=1-rnd(),v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
  function newTrial(){tr0={ph:'rest',t:0,k:Math.floor(rnd()*N),n:N,rt:Math.max(0.15,A+BB*bits(N)+gauss()*0.035)};}
  function sstep(a,b,x){var k=Math.min(1,Math.max(0,(x-a)/(b-a)));return k*k*(3-2*k);}
  function stepTrial(dt){
    if(!tr0)newTrial();
    var T=tr0,p=pairs[T.k];T.t+=dt;
    if(T.ph==='rest'){setTip(tipX=PX,tipY=HOME);if(T.t>=0.6){T.ph='wait';T.t=0;light(p,true);meas.visible=true;}}
    else if(T.ph==='wait'){
      meas.set([[gx(T.n),ay0,FZ+0.005,gx(T.n),gy(Math.min(T.t,T.rt)),FZ+0.005]]);
      if(T.t>=T.rt){T.ph='move';T.t=0;meas.visible=false;addPoint(T.n,T.rt);lastRT=T.rt;if(api&&api.onUi)api.onUi();
        T.mt=0.3+0.07*Math.abs(p.x-PX);}
    }else if(T.ph==='move'){
      var u=Math.min(1,T.t/T.mt),e=K.ease(u);setTip(tipX=PX+(p.x-PX)*e,tipY=HOME+(HOVER-HOME)*sstep(0,1,u));
      if(u>=1){T.ph='press';T.t=0;}
    }else if(T.ph==='press'){
      /* down onto the button and up again; the lamp goes out when the button is down */
      var d=Math.sin(Math.PI*Math.min(1,T.t/0.3));setTip(p.x,HOVER+(CONTACT-HOVER)*d);p.down=d;
      if(T.t>=0.15)light(p,false);
      if(T.t>=0.3){p.down=0;T.ph='home';T.t=0;T.hx=p.x;T.hy=HOVER;}
    }else if(T.ph==='home'){
      var w=Math.min(1,T.t/0.45),f=K.ease(w);setTip(tipX=T.hx+(PX-T.hx)*f,tipY=T.hy+(HOME-T.hy)*f);
      if(w>=1){var real=!T.abort;tr0=null;if(real&&auto){perN++;if(perN>=3){perN=0;si=(si+1)%SEQ.length;setN(SEQ[si]);}}}
    }
  }
  /* a change by hand: put out the lamp, and the stylus goes home from wherever it is */
  function abort(){
    if(tr0){var p=pairs[tr0.k];light(p,false);p.down=0;}
    meas.visible=false;tr0={ph:'home',t:0,k:0,n:N,hx:tipX,hy:tipY,abort:true};
  }

  /* ---- the handle: the number of lamps ---- */
  var lk=1;
  function setN(n){
    n=Math.max(1,Math.min(NMAX,Math.round(n)));if(n===N)return;N=n;lastRT=null;
    pairs.forEach(function(p,k){p.fx=p.x;p.fs=p.s;p.tx=k<N?slotX(k,N):(p.s>0.01?p.x:slotX(k,N));p.ts=k<N?1:0;});lk=0;
    paintPoints();readout();if(api&&api.onUi)api.onUi();
  }
  function readout(){
    spec.setText('n = '+N+'  ·  log₂(n + 1) = '+num(bits(N),2)+' bit');
  }
  function labels(){
    setT(title,'RT = a + b · log₂(n + 1)');
    setT(xl,tr({da:'n, antal lamper',en:'n, number of lamps'}));
    setT(bl,'log₂(n + 1), bit');
    setT(yl,tr({da:'RT, sekunder',en:'RT, seconds'}));
    yLabs.forEach(function(r,k){setT(r,num(k*0.2,1));});
  }
  pairs.forEach(function(p,k){p.x=p.tx=slotX(k,N);p.s=p.ts=k<N?1:0;placePair(p);});
  readout();labels();setTip(PX,HOME);
  var api={group:g,onUi:null,
    box:function(){return [[-5.2,0,-1.1],[5.2,4.0,2.0]];},
    update:function(dt){
      if(lk<1){lk=Math.min(1,lk+dt/0.5);var e=K.ease(lk);pairs.forEach(function(p){p.x=p.fx+(p.tx-p.fx)*e;p.s=p.fs+(p.ts-p.fs)*e;});}
      pairs.forEach(placePair);
      stepTrial(dt);
    },
    relabel:function(){readout();labels();},
    ui:{
      label:function(){return tr({da:'Antal lamper n',en:'Number of lamps n'});},
      ends:function(){return ['1','10'];},
      min:1,max:NMAX,step:1,
      value:function(){return N;},
      set:function(v){auto=false;v=Math.round(v);if(v===N)return;abort();setN(v);},
      readout:function(){return 'n = '+N+' · log₂(n + 1) = '+num(bits(N),2)+' bit'+(lastRT?tr({da:' · seneste reaktion ',en:' · last reaction '})+num(lastRT,2)+' s':'');},
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;if(auto){perN=0;}}
    }
  };
  return api;
};
})();

</script>
<script>/* m_jakob.js */
/* m_jakob.js — Jakob's law as two identical machines.
   The left machine has its four controls where they usually sit. The right machine has the same controls; the handle moves some of them.
   The stylus has learnt the usual layout, so on the new machine it goes to the usual place first. Every control that has been moved
   costs a stop where it ought to be and a detour to where it is. The tank fills with the time the task takes; the dashed ring is the time
   on the usual layout. Speeds and pauses are the model's, not measurements. */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models.jakob=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr,num=TB.num;
  var g=new THREE.Group();
  var MW=3.7,MH=0.5,MD=2.9,AX=-3.05,BX=0.85,MZ=-0.2;
  var COLS=[-1.36,-0.45,0.45,1.36],BACK=-0.8,FRONT=0.42;
  /* the four controls, in the order the task uses them; `away` is where the new machine puts a control once it is moved */
  var C=[
    {name:{da:'1 Tænd',en:'1 Power'},w:0.42,h:0.13,d:0.42,home:[COLS[0],BACK],away:[COLS[2],FRONT]},
    {name:{da:'2 Program',en:'2 Program'},w:0.48,h:0.22,d:0.48,home:[COLS[3],BACK],away:[COLS[1],FRONT]},
    {name:{da:'3 Styrke',en:'3 Level'},w:0.66,h:0.08,d:0.22,home:[COLS[0],FRONT],away:[COLS[2],BACK]},
    {name:{da:'4 Start',en:'4 Start'},w:0.66,h:0.16,d:0.42,home:[COLS[3],FRONT],away:[COLS[1],BACK]}
  ];
  var MOVES=[3,0,1,2];
  function moved(ci,k){return MOVES.indexOf(ci)<k;}
  function spot(ci,k){return moved(ci,k)?C[ci].away:C[ci].home;}

  /* ---- the two machines ---- */
  var names=[AX,BX].map(function(x){
    g.add(K.solid(MW,MH,MD,{x:x,y:MH/2,z:MZ}));
    var p=K.plate('',{size:0.22,weight:600,color:pal.ink});p.position.set(x,MH/2,MZ+MD/2+0.002);g.add(p);return p;
  });
  function control(c,x,z){
    var m=K.solid(c.w,c.h,c.d,{tone:TONE.white,x:x,y:MH+c.h/2,z:z});g.add(m);
    /* the route and the trace may run behind a name, so the name is set on the panel's own colour, above the lines */
    var l=K.plate('',{size:0.17,weight:600,color:pal.slate,bg:pal.surface,padX:0.04});l.rotation.x=-Math.PI/2;g.add(l);
    var o={m:m,l:l,c:c,state:'',lift:0};
    /* a control being moved is lifted clear of the others; its name waits on the panel until it is set down */
    o.at=function(x,z,lift){o.lift=lift||0;m.position.set(x,MH+c.h/2+o.lift,z);l.position.set(x,MH+0.008,z+c.d/2+0.17);l.visible=o.lift<0.001;};
    o.at(x,z);return o;
  }
  var A=C.map(function(c){return control(c,AX+c.home[0],MZ+c.home[1]);});
  var B=C.map(function(c){return control(c,BX+c.home[0],MZ+c.home[1]);});
  /* where a moved control usually sits: its outline, dashed */
  var ghosts=C.map(function(c){
    var l=K.lines(K.boxEdges(c.w,c.h,c.d),{color:pal.ink,dash:[4,3]});l.position.set(BX+c.home[0],MH+c.h/2,MZ+c.home[1]);l.visible=false;g.add(l);return l;
  });
  function paint(o,s){if(o.state===s)return;o.state=s;
    o.m.setTone(s==='press'?TONE.signal:s==='done'?TONE.focal:TONE.white);o.m.setEdge(s==='press'?pal.signalShadow:s==='done'?pal.signal:pal.borderStrong);}

  /* the route on the usual layout, and the stylus's trace on the new one */
  var YL=MH+0.005;
  function route(x0,list){return K.chain(list.map(function(p){return [x0+p[0],YL,MZ+p[1]];}));}
  g.add(K.lines(route(AX,C.map(function(c){return c.home;})),{color:pal.ink}));
  var trace=K.lines([],{color:pal.ink});g.add(trace);

  /* ---- the stylus ---- */
  var PL=1.1,pen=K.solid(0.08,PL,0.08,{tone:TONE.dark,edge:pal.midnight});g.add(pen);
  function setPen(p){pen.position.set(BX+p[0],p[1]+PL/2,MZ+p[2]);}

  /* ---- the tank: time for the task ---- */
  var TX=4.45,TZ=-0.2,TH=2.5,PH=0.34;
  g.add(K.solid(1.1,PH,1.1,{x:TX,y:PH/2,z:TZ}));
  var tank=K.lines(K.boxEdges(0.82,TH,0.82),{color:pal.slate});tank.position.set(TX,PH+TH/2,TZ);g.add(tank);
  var fill=K.solid(0.8,1,0.8,{tone:TONE.paper,edge:pal.slate,x:TX,z:TZ});g.add(fill);
  var ring=K.lines([],{color:pal.ink,dash:[4,3]});g.add(ring);
  var val=K.plate('',{size:0.2,weight:700,color:pal.ink});val.position.set(TX,PH/2,TZ+0.551);g.add(val);
  var lab=K.plate('',{size:0.2,weight:600,color:pal.ink,align:'center'});lab.rotation.x=-Math.PI/2;g.add(lab);

  /* ---- the task: a script of eased moves, in panel coordinates [u, y, w] ---- */
  var HOV=MH+0.62,LOOK=MH+0.36,REST=[0,MH+1.1,1.9],SPEED=3.2,PAUSE=0.5;
  function script(k){
    var S=[],cur=REST,tot=0;
    function seg(b,d,o){S.push({a:cur,b:b,d:d,t0:tot,o:o||{}});tot+=d;cur=b;}
    function mv(u,w,o){var b=[u,HOV,w],dd=Math.sqrt((b[0]-cur[0])*(b[0]-cur[0])+(b[1]-cur[1])*(b[1]-cur[1])+(b[2]-cur[2])*(b[2]-cur[2]));o=o||{};o.mv=true;seg(b,Math.max(0.3,dd/SPEED),o);}
    C.forEach(function(c,ci){
      var h=c.home,a=spot(ci,k);
      mv(h[0],h[1],{first:ci===0});
      if(moved(ci,k)){
        /* it looks where the control usually is, finds nothing, and has to search */
        seg([h[0],LOOK,h[1]],0.22,{look:ci});seg([h[0],LOOK,h[1]],PAUSE,{look:ci});seg([h[0],HOV,h[1]],0.22,{look:ci});
        mv(a[0],a[1]);
      }
      var top=MH+c.h+0.004;
      seg([a[0],top,a[1]],0.16);seg([a[0],top,a[1]],0.16,{press:ci});seg([a[0],HOV,a[1]],0.16,{done:ci});
    });
    var tm=tot;
    mv(REST[0],REST[2],{ret:true});S[S.length-1].b=REST;
    return {S:S,T:tot,Tm:tm};
  }
  var TIME=[0,1,2,3,4].map(function(k){return script(k).Tm;}),TMAX=TIME[4]*1.12;
  function hOf(t){return TH*Math.min(1,t/TMAX);}
  function setFill(t){var h=Math.max(0.001,hOf(t));fill.scale.y=h;fill.position.y=PH+h/2;fill.visible=t>0.02;}
  function setRing(){var y=PH+hOf(TIME[0]),a=0.49,x=TX,z=TZ;ring.set([[x-a,y,z-a,x+a,y,z-a],[x+a,y,z-a,x+a,y,z+a],[x+a,y,z+a,x-a,y,z+a],[x-a,y,z+a,x-a,y,z-a]]);}
  setRing();

  /* ---- state ---- */
  var k=0,auto=true,AUTO=[0,1,2,4],ai=0,phase='layout',pt=0,lay=[],run=null,lastI=-1,shownT='',HOLD=2.6,SLOT=0.9,LIFT=0.34,MOVE=0;
  C.forEach(function(c,ci){lay.push({from:c.home.slice(),to:c.home.slice(),lift0:0,start:-1});});
  function setK(v,fromAuto){
    v=Math.max(0,Math.min(4,Math.round(v)));
    k=v;
    /* the controls that move go one at a time, lifted over the others, so none passes through another */
    var n=0;
    lay.forEach(function(L,ci){var o=B[ci];L.from=[o.m.position.x-BX,o.m.position.z-MZ];L.to=spot(ci,k).slice();L.lift0=o.lift;
      L.start=(Math.abs(L.from[0]-L.to[0])+Math.abs(L.from[1]-L.to[1])>0.01||L.lift0>0.001)?SLOT*(n++):-1;});
    MOVE=SLOT*n;
    phase='layout';pt=0;run=null;B.forEach(function(o){paint(o,'');});ghosts.forEach(function(gh,ci){gh.setColor(pal.ink);});
    trace.set([]);setFill(0);setPen(REST);value(0);
    if(api&&api.onUi)api.onUi();
  }
  function startRun(){run=script(k);run.t=0;lastI=-1;B.forEach(function(o){paint(o,'');});trace.set([]);}
  function value(t){var s=num(t,1)+' s';if(s!==shownT){shownT=s;val.setText(s);}}
  function texts(){
    names[0].setText(tr({da:'Sådan plejer det at være',en:'The usual layout'}));
    names[1].setText(tr({da:'Din maskine',en:'Your machine'}));
    A.concat(B).forEach(function(o){o.l.setText(tr(o.c.name));o.at(o.m.position.x,o.m.position.z,o.lift);});
    lab.setText(tr({da:['Tid for','opgaven'],en:['Time for','the task']}));lab.position.set(TX,0.006,TZ+0.7+lab.h/2);
    shownT='';value(run?Math.min(run.t,run.Tm):0);
  }
  function ev(sg,start){
    var o=sg.o;
    if(o.look!==undefined)ghosts[o.look].setColor(start?pal.signal:pal.ink);
    if(start&&o.press!==undefined)paint(B[o.press],'press');
    if(!start&&o.done!==undefined)paint(B[o.done],'done');
  }
  function stepRun(dt){
    run.t+=dt;var S=run.S,t=run.t,i=0,q;
    while(i<S.length-1&&t>S[i].t0+S[i].d)i++;
    /* every boundary crossed since the last frame, in order, even when a short segment is skipped */
    for(q=lastI+1;q<=i;q++){if(q>0)ev(S[q-1],false);ev(S[q],true);}
    lastI=Math.max(lastI,i);
    var sg=S[i],u=Math.min(1,Math.max(0,(t-sg.t0)/sg.d)),e=K.ease(u),p=[sg.a[0]+(sg.b[0]-sg.a[0])*e,sg.a[1]+(sg.b[1]-sg.a[1])*e,sg.a[2]+(sg.b[2]-sg.a[2])*e];
    setPen(p);
    /* the trace: every stop it has made on the panel, and the way to where it is now */
    var pts=[],segs=[];
    for(q=0;q<i;q++){if(S[q].o.mv&&!S[q].o.ret)pts.push(S[q].b);}
    if(sg.o.mv&&!sg.o.ret&&!sg.o.first)pts.push(p);
    for(q=0;q<pts.length-1;q++)segs.push([BX+pts[q][0],YL,MZ+pts[q][2],BX+pts[q+1][0],YL,MZ+pts[q+1][2]]);
    trace.set(segs);
    var tm=Math.min(t,run.Tm);setFill(tm);value(tm);
    if(t>=run.T){ev(S[S.length-1],false);return true;}
    return false;
  }

  texts();setPen(REST);setFill(0);
  var api={group:g,onUi:null,
    box:function(){return [[-4.9,0,-1.7],[5.0,2.9,1.9]];},
    update:function(dt){
      pt+=dt;
      if(phase==='layout'){
        lay.forEach(function(L,ci){
          if(L.start<0){B[ci].at(BX+L.to[0],MZ+L.to[1]);return;}
          var u=Math.min(1,Math.max(0,(pt-L.start)/SLOT)),x=L.from[0],z=L.from[1],y;
          if(u<0.25){y=L.lift0+(LIFT-L.lift0)*K.ease(u/0.25);}
          else if(u<0.75){var e=K.ease((u-0.25)/0.5);y=LIFT;x+= (L.to[0]-L.from[0])*e;z+=(L.to[1]-L.from[1])*e;}
          else{y=LIFT*(1-K.ease((u-0.75)/0.25));x=L.to[0];z=L.to[1];}
          if(u>=1){y=0;x=L.to[0];z=L.to[1];}
          B[ci].at(BX+x,MZ+z,y);});
        ghosts.forEach(function(gh,ci){var on=moved(ci,k);gh.visible=on;});
        if(pt>=MOVE+0.4){phase='run';pt=0;startRun();}
      }else if(phase==='run'){
        if(stepRun(dt)){phase='hold';pt=0;if(api&&api.onUi)api.onUi();}
      }else if(phase==='hold'){
        if(pt>=HOLD){
          if(auto){ai=(ai+1)%AUTO.length;setK(AUTO[ai],true);}
          else{phase='run';pt=0;startRun();}
        }
      }
    },
    relabel:texts,
    ui:{
      label:function(){return tr({da:'Flyttede betjeningsdele',en:'Controls moved'});},
      ends:function(){return tr({da:['Alt, hvor det plejer','Alle fire flyttet'],en:['All where they usually are','All four moved']});},
      min:0,max:4,step:1,
      value:function(){return k;},
      set:function(v){auto=false;setK(v);},
      readout:function(){
        var d=TIME[k]-TIME[0];
        return tr({da:k+' af 4 flyttet · ',en:k+' of 4 moved · '})+num(TIME[k],1)+' s'+(k?tr({da:' · omvej ',en:' · detour '})+'+'+num(d,1)+' s':tr({da:' · ingen omvej',en:' · no detour'}));
      },
      auto:function(){return auto;},
      setAuto:function(b){auto=!!b;if(auto){ai=Math.max(0,AUTO.indexOf(k));}}
    }
  };
  return api;
};
})();

</script>
<script>/* m_mentalmodel.js */
/* m_mentalmodel.js — a mental model as a sketch of a closed machine's inside.
   On the left a machine: a tank, a block and a unit joined by a pipe, and an outlet at the side. A cover hides them.
   On the right the user's sketch of the inside, drawn as dashed ghost parts on a board of the same size.
   The handle sets how much the machine shows of itself: first a lamp and a level window on the cover, then the cover slides back.
   Each part the machine has shown, the sketch moves to where it really is. The guess and the rule are schematic, not measured. */
(function(){
'use strict';
var TB=window.TB;TB.models=TB.models||{};
TB.models['mental-model']=function(ctx){
  var K=ctx.kit,pal=ctx.cfg.pal,TONE=ctx.cfg.tone,tr=TB.tr;
  var g=new THREE.Group();
  var MX=-2.35,SX=2.45,Z0=0.05,BH=0.3,CW=3.4,CH=2.1,CD=2.3,SLIDE=2.45;
  function V(x,y,z){return new THREE.Vector3(x,y,z);}

  /* ---- the machine: a long base, so the cover has somewhere to slide ---- */
  g.add(K.solid(CW,BH,CD+SLIDE+0.2,{x:MX,y:BH/2,z:Z0-(SLIDE+0.2)/2}));
  var mName=K.plate('',{size:0.2,weight:600,color:pal.ink});mName.position.set(MX,BH/2,Z0+CD/2+0.002);g.add(mName);
  /* the real parts, in plot coordinates relative to the base: x, z, and size */
  var REAL={T:{x:-0.95,z:-0.4,w:0.8,h:1.55,d:0.8},B:{x:0.1,z:0.35,w:0.95,h:0.6,d:0.8},U:{x:1.0,z:-0.45,w:0.6,h:1.0,d:0.6}};
  ['T','B','U'].forEach(function(k){var r=REAL[k];g.add(K.solid(r.w,r.h,r.d,{tone:TONE.white,x:MX+r.x,y:BH+r.h/2,z:Z0+r.z}));});
  function P(x,y,z){return V(MX+x,y,Z0+z);}
  var pipes=[
    [P(-0.55,1.2,-0.4),P(0.1,1.2,-0.4),P(0.1,1.2,0.35),P(0.1,0.9,0.35)],
    [P(0.575,0.6,0.35),P(1.0,0.6,0.35),P(1.0,0.6,-0.15)],
    [P(1.0,1.1,-0.15),P(1.0,1.1,CD/2+0.3)]
  ].map(function(pts){var p=K.pipe(0.07);p.set(pts);p.tone(TONE.signal,pal.signalShadow);p.fill(-1);g.add(p);return p;});

  /* the cover, with what it can show on its face: a lamp that says the machine is working, and a window on the tank's level */
  var cg=new THREE.Group();g.add(cg);
  cg.add(K.solid(CW,CH,CD,{x:MX,y:BH+CH/2,z:Z0}));
  var FZ=Z0+CD/2+0.003,ind=new THREE.Group();cg.add(ind);
  var GX=MX+REAL.T.x,GY0=BH+0.35,GH=1.3,GW=0.22;
  ind.add(K.quad(GW,GH,K.flat(pal.surface),GX,GY0+GH/2,FZ));
  ind.add(K.lines([[GX-GW/2,GY0,FZ,GX+GW/2,GY0,FZ],[GX+GW/2,GY0,FZ,GX+GW/2,GY0+GH,FZ],[GX+GW/2,GY0+GH,FZ,GX-GW/2,GY0+GH,FZ],[GX-GW/2,GY0+GH,FZ,GX-GW/2,GY0,FZ]],{color:pal.ink}));
  var lvl=K.quad(GW-0.06,1,K.flat(pal.signal),GX,0,FZ+0.002);ind.add(lvl);
  var lampMat=K.flat(pal.chip),LX=MX+REAL.U.x,LY=BH+CH-0.4;
  ind.add(K.quad(0.24,0.24,lampMat,LX,LY,FZ));
  ind.add(K.lines([[LX-0.12,LY-0.12,FZ,LX+0.12,LY-0.12,FZ],[LX+0.12,LY-0.12,FZ,LX+0.12,LY+0.12,FZ],[LX+0.12,LY+0.12,FZ,LX-0.12,LY+0.12,FZ],[LX-0.12,LY+0.12,FZ,LX-0.12,LY-0.12,FZ]],{color:pal.ink}));
  var tLvl=K.plate('',{size:0.15,weight:600,color:pal.slate});tLvl.position.set(GX,GY0-0.17,FZ);ind.add(tLvl);
  var tLamp=K.plate('',{size:0.15,weight:600,color:pal.slate});tLamp.position.set(LX,LY-0.29,FZ);ind.add(tLamp);
  function setLevel(f){var h=Math.max(0.001,(GH-0.06)*f);lvl.scale.y=h;lvl.position.y=GY0+0.03+h/2;}

  /* ---- the sketch: a board the size of the machine, with the parts where the user believes they are ---- */
  g.add(K.solid(CW,BH,CD,{x:SX,y:BH/2,z:Z0}));
