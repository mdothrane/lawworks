<!DOCTYPE html>
<html lang="da"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOTH: LAWWORKS</title>
<meta name="description" content="De 30 love fra Laws of UX, bygget som små modeller, du kan gætte på, se arbejde og selv prøve. Dansk og engelsk.">
<meta property="og:title" content="MOTH: LAWWORKS">
<meta property="og:description" content="De 30 love fra Laws of UX, bygget som små modeller, du kan se arbejde og selv prøve.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lawworks.mortenthrane.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
/* MOTH: LAWWORKS. The frame is the MOTH: TOKENWORKS HUD: every value is a MOTH token.
   Inter 700 / 600 / 400, uppercase eyebrows with a short bar, 1px rules. The panel is monochrome; Signal belongs to the models.
   v8 is written for the phone first: the base rules are the narrow layout (the model on top, the text under it);
   from 900px the text stands in a column beside the model. */
:root{
  color-scheme:light;
  --midnight:#1A1E31;--midnight2:#2A3050;
  --fog:#F5F6FA;--surface:#FCFCFD;--chip:#ECEEF4;--border:#DDE0EA;--border-strong:#C2C7D6;
  --ink:#1C1E29;--slate:#5C617A;--mist:#8E93A8;--white:#FFFFFF;
  --signal:#3A6EE8;
  --sans:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --k:.6667;
  --t-title:700 calc(54px*var(--k))/1.18 var(--sans);
  --t-card:700 calc(42px*var(--k))/1.19 var(--sans);
  --t-label:600 calc(32px*var(--k))/1.22 var(--sans);
  --t-quote:600 calc(28px*var(--k))/1.22 var(--sans);
  --t-body:400 calc(27px*var(--k))/1.4 var(--sans);
  --t-small:400 calc(24px*var(--k))/1.45 var(--sans);
  --t-eyebrow:600 calc(22px*var(--k))/1.2 var(--sans);
  --t-tag:600 calc(18px*var(--k))/1.2 var(--sans);
  --t-caption:400 calc(18px*var(--k))/1.35 var(--sans);
  --top:56px;
  --mh:clamp(200px,40vh,380px);
  --dock:clamp(440px,34vw,580px);
}
@supports (height:1svh){:root{--mh:clamp(200px,40svh,380px)}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--fog);color:var(--ink);font-family:var(--sans)}
.app{position:fixed;inset:0;overflow:hidden;background:var(--fog);color:var(--ink);font:var(--t-small);-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1,'cv11' 1}
.stage{position:absolute;inset:var(--top) 0 0 0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
button{font:inherit;color:inherit;background:none;border:0;border-radius:0;padding:0;margin:0;cursor:pointer;text-align:left}
:focus{outline:none}
:focus-visible{outline:2px solid var(--midnight);outline-offset:2px}
h1,h2,h3,h4,p,ol,ul,dl,dd{margin:0;padding:0}
ol,ul{list-style:none}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--border-strong);text-underline-offset:3px}
a:hover{text-decoration-color:var(--ink)}
a.btn,a.item,a.gnode,a.mark,.bar a,.pn a{text-decoration:none}
code{font:inherit;font-weight:600}
.label{font:var(--t-tag);text-transform:uppercase;color:var(--slate);letter-spacing:.02em}
.kicker{font:var(--t-eyebrow);text-transform:uppercase;color:var(--slate)}
.kicker::before{content:'';display:block;width:32px;height:2px;margin-bottom:8px;background:var(--midnight)}
.kicker a{color:inherit;text-decoration:none}
.kicker a:hover{text-decoration:underline;text-underline-offset:3px}
[tabindex="-1"]:focus{outline:none}
.wide-only{display:none}

/* ---------- top bar ---------- */
.top{position:absolute;left:0;right:0;top:0;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 12px 0 0;background:var(--surface);border-bottom:1px solid var(--border);z-index:3}
.mark{display:flex;align-items:center;gap:12px;height:100%;padding:0 8px 0 12px;min-width:0}
.mark-m{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--midnight);color:var(--white);font:700 14px/1 var(--sans);flex:none}
.mark:hover .mark-m{background:var(--midnight2)}
.mark-word{font:700 15px/1 var(--sans);white-space:nowrap}
.app[data-view="map"] .mark-word{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.groups{display:none;gap:4px}
.gnode{height:32px;display:grid;place-items:center;padding:0 10px;border:1px solid var(--border-strong);font:var(--t-tag);color:var(--slate);background:var(--surface);white-space:nowrap}
.gnode:hover{color:var(--ink);border-color:var(--ink)}
.gnode.is-here{background:var(--midnight);color:var(--white);border-color:var(--midnight)}
.ver{flex:none;margin-left:auto;font:var(--t-tag);color:var(--slate);white-space:nowrap}
.ver-short{display:none}
.lang{display:flex;align-items:stretch;flex:none;height:36px;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;font:var(--t-tag)}
.lang button{display:grid;place-items:center;padding:0 10px;font:var(--t-tag);font-weight:600;color:var(--slate);background:var(--surface)}
.lang button.on{background:var(--midnight);color:var(--white)}
.lang button:not(.on):hover{color:var(--ink)}
.lang:hover{border-color:var(--ink)}

/* ---------- the text: under the model on a phone ---------- */
.dock{position:absolute;left:0;right:0;top:calc(var(--top) + var(--mh));bottom:0;z-index:2}
.app[data-view="map"] .dock{top:var(--top)}
.panel{height:100%;overflow:auto;scrollbar-gutter:stable;overscroll-behavior:contain;padding:20px 20px 48px;border-top:1px solid var(--border);background:var(--surface);scrollbar-width:thin;scrollbar-color:var(--border-strong) var(--surface)}
.app[data-view="map"] .panel{border-top:0}

/* ---------- caption, kind of model and play control, on the drawing ---------- */
.vf{display:none;position:absolute;left:calc(var(--dock) + 24px);top:76px;pointer-events:none;font:var(--t-caption);color:var(--slate);gap:8px;flex-wrap:wrap;z-index:1}
.vf-a{color:var(--ink);font-weight:600}
.vf-b::before{content:'·';margin-right:8px}
.vf-b:empty{display:none}
.scenebar{position:absolute;right:12px;top:calc(var(--top) + var(--mh) - 44px);z-index:1;display:flex;gap:8px;align-items:center}
.app[data-view="map"] .scenebar{display:none}
.play{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);font:var(--t-tag);color:var(--slate)}
.play:hover{color:var(--ink);border-color:var(--ink)}
.play[hidden]{display:none}
.play i{display:inline-block;width:10px;height:10px;position:relative}
.play[data-on="1"] i::before,.play[data-on="1"] i::after{content:'';position:absolute;top:0;bottom:0;width:3px;background:currentColor}
.play[data-on="1"] i::before{left:1px}.play[data-on="1"] i::after{right:1px}
.play[data-on="0"] i{border-style:solid;border-width:5px 0 5px 9px;border-color:transparent transparent transparent currentColor;width:0;height:0}
.tag{position:absolute;left:12px;top:calc(var(--top) + var(--mh) - 44px);z-index:1;display:grid;gap:2px;max-width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.tag b{font:var(--t-tag);text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
.tag span{display:none;font:var(--t-caption);color:var(--slate)}
.tag[hidden]{display:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:12px 20px;border:1px solid var(--midnight);border-radius:8px;background:var(--midnight);color:var(--white);font:400 16px/1.25 var(--sans)}
.btn::after{content:'\2192'}
.btn:hover{background:var(--midnight2);border-color:var(--midnight2)}
.btn.ghost{background:var(--white);color:var(--midnight);border-color:var(--border-strong)}
.btn.ghost:hover{border-color:var(--midnight)}
.txtbtn{display:inline-block;min-height:32px;font:var(--t-caption);color:var(--slate);text-decoration:underline;text-decoration-color:var(--border-strong);text-underline-offset:3px}
.txtbtn:hover{color:var(--ink);text-decoration-color:var(--ink)}
.txtbtn:disabled{color:var(--mist);text-decoration:none;cursor:default}

/* ---------- overview and groups: a list with a still of each model ---------- */
.title h1{font:var(--t-title);margin:8px 0 16px}
.lede{font:var(--t-body);color:var(--slate);max-width:42ch}
.lede+.lede{margin-top:12px}
.cta{margin-top:24px}
.note{margin-top:24px;font:var(--t-caption);color:var(--slate)}
.glist{margin-top:24px}
.gh{display:flex;align-items:baseline;gap:8px;margin-top:28px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
.gh b{font:var(--t-quote)}
.gh span{font:var(--t-caption);color:var(--slate);margin-left:auto}
.item{display:grid;grid-template-columns:72px 24px minmax(0,1fr);gap:10px;align-items:center;width:100%;padding:8px 0;border-bottom:1px solid var(--border)}
.thumb{display:block;width:72px;height:54px;object-fit:cover;border:1px solid var(--border);border-radius:6px;background:var(--fog)}
.item:hover b,.item.is-hot b{text-decoration:underline;text-underline-offset:3px}
.item .n{font:var(--t-tag);color:var(--slate)}
.item b{font-weight:600}
.item small{display:block;font:var(--t-caption);color:var(--slate);margin-top:2px}
.credit{margin-top:32px;padding-top:16px;border-top:1px solid var(--border);font:var(--t-caption);color:var(--slate)}
.credit p+p{margin-top:8px}

/* ---------- one law ---------- */
/* the law's own bar stays at the top of the panel while the text scrolls under it; on a phone it is one row:
   number and name, previous and next (the /M mark leads back to the overview) */
.bar{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;padding:20px 0 12px;margin:-20px 0 20px;border-bottom:1px solid var(--border);position:sticky;top:-20px;z-index:3;background:var(--surface);box-shadow:0 0 0 40px var(--surface);clip-path:inset(0 -40px 0 -40px)}
.bar .back{display:none;font:var(--t-caption);color:var(--slate)}
.bar .back:hover{color:var(--ink)}
.bar-a{display:flex;align-items:baseline;gap:8px 12px;min-width:0;flex:1}
.crumb{display:flex;align-items:baseline;gap:8px;min-width:0}
.crumb code{font:var(--t-tag);color:var(--slate)}
.crumb b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn{display:flex;gap:6px;flex:none}
.pn a{text-decoration:none;height:40px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--border-strong);border-radius:8px;color:var(--slate);background:var(--surface);font:var(--t-caption);white-space:nowrap;overflow:hidden}
.pn a code{font:var(--t-tag);color:var(--slate)}
.pn-n{display:none;overflow:hidden;text-overflow:ellipsis}
.pn a:hover{border-color:var(--ink);color:var(--ink)}
.law h2{font:var(--t-card);margin-top:8px}
.orig{font:var(--t-caption);color:var(--slate);margin-top:4px}
.law .lede{margin-top:16px;color:var(--ink)}
.sec{margin-top:28px}
.sec>h3,.card>h3{font:var(--t-tag);text-transform:uppercase;color:var(--slate);letter-spacing:.02em;margin-bottom:10px}
.sec>p+p{margin-top:10px}
.pts li{position:relative;padding-left:20px;margin-top:8px}
.pts li::before{content:'';position:absolute;left:2px;top:.62em;width:6px;height:6px;background:var(--midnight)}
.hint{margin-top:12px;font:var(--t-caption);color:var(--slate)}
/* the question and its answer */
.card{padding:16px;border:1px solid var(--border-strong);border-radius:12px;background:var(--white)}
.q{font:var(--t-quote)}
.opts,.res{display:grid;gap:8px;margin-top:14px}
.opt{min-height:48px;text-align:left;padding:10px 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);font:var(--t-small);color:var(--ink)}
.opt:hover{border-color:var(--ink)}
#skip{margin-top:4px}
.res li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;color:var(--slate)}
.res li.is-mine{color:var(--ink);border-style:dashed;border-color:var(--ink)}
.res li.is-right{color:var(--ink);font-weight:600;border-style:solid;border-color:var(--midnight);box-shadow:inset 0 0 0 1px var(--midnight)}
.res em{font:var(--t-tag);font-style:normal;text-transform:uppercase;letter-spacing:.02em;color:var(--slate);white-space:nowrap}
.ans{margin-top:18px}
.ans h4{font:var(--t-quote)}
.ans>p{margin-top:8px}
.sn{margin-top:14px}
.sn div{padding:10px 0;border-top:1px solid var(--border)}
.sn dt{font:var(--t-tag);text-transform:uppercase;color:var(--slate);letter-spacing:.02em}
.sn dd{margin-top:4px}
.try{margin-top:8px;padding-top:16px;border-top:1px solid var(--border)}
.try-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.try-h label{font:var(--t-quote)}
.range{margin-top:8px}
.range input{width:100%;margin:0;appearance:none;-webkit-appearance:none;background:transparent;height:40px;cursor:pointer}
.range input::-webkit-slider-runnable-track{height:2px;background:var(--border-strong)}
.range input::-moz-range-track{height:2px;background:var(--border-strong)}
.range input::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-11px;border-radius:4px;background:var(--midnight);border:2px solid var(--white);box-shadow:0 0 0 1px var(--midnight)}
.range input::-moz-range-thumb{width:20px;height:20px;border-radius:4px;background:var(--midnight);border:2px solid var(--white);box-shadow:0 0 0 1px var(--midnight)}
.range input:focus-visible{outline:2px solid var(--midnight);outline-offset:4px}
.ends{display:flex;justify-content:space-between;gap:12px;font:var(--t-caption);color:var(--slate)}
.readout{margin-top:12px;font:var(--t-small);font-weight:600;font-variant-numeric:tabular-nums}
.try .txtbtn{margin-top:8px}
.again{display:block;margin-top:12px}
/* related laws */
.rel li{display:grid;gap:2px;padding:10px 0;border-bottom:1px solid var(--border)}
.rel li:first-child{border-top:1px solid var(--border)}
.rel a{text-decoration:none}
.rel a b{font-weight:600}
.rel a:hover b,.rel a.is-hot b{text-decoration:underline;text-underline-offset:3px}
.rel code{font:var(--t-tag);color:var(--slate)}
.rel span{font:var(--t-caption);color:var(--slate)}
/* about the law */
.ev3 div{display:grid;grid-template-columns:minmax(8em,38%) minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--border)}
.ev3 div:first-child{border-top:1px solid var(--border)}
.ev3 dt{font:var(--t-caption);color:var(--slate)}
.ev3 dd{font-weight:600}
.evwhy{margin-top:10px}
.fold{margin-top:20px;border-top:1px solid var(--border)}
.fold+.fold{margin-top:0}
.fold summary{display:flex;justify-content:space-between;align-items:center;min-height:48px;cursor:pointer;list-style:none;font:var(--t-tag);text-transform:uppercase;letter-spacing:.02em;color:var(--slate)}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:'+';font:var(--t-quote);color:var(--ink)}
.fold[open] summary::after{content:'\2212'}
.fold summary:hover{color:var(--ink)}
.fold[open]{padding-bottom:16px}
.fold .pts li:first-child{margin-top:0}
.cite{font:var(--t-caption);color:var(--slate)}
.cite+.cite{margin-top:6px}
.links{margin-top:10px}
.links li{margin-top:6px}
.links small{color:var(--slate)}
.nextlaw{margin-top:32px}
/* without 3D: a still of the model in place of the drawing */
.still{display:none}
.no3d #gl,.no3d .scenebar,.no3d .vf{display:none}
.no3d .still{display:block;position:absolute;left:0;right:0;top:0;width:100%;height:var(--mh);object-fit:contain}
.no3d[data-view="map"] .still{display:none}
.no3d-note{margin-top:16px;padding:12px 14px;border:1px solid var(--border-strong);border-radius:8px;background:var(--chip);font:var(--t-caption);color:var(--ink)}

/* ---------- very narrow ---------- */
@media (max-width:400px){
  .ver-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .ver-short{display:inline}
  .top{gap:8px}
  .panel{padding-left:16px;padding-right:16px}
  .card{padding:14px 12px}
  .item{grid-template-columns:64px 22px minmax(0,1fr);gap:8px}
  .thumb{width:64px;height:48px}
}

/* ---------- wide, and a phone on its side: the text in a column beside the model ---------- */
@media (min-width:900px),(min-width:600px) and (max-height:520px){
  .wide-only{display:inline}
  .top{gap:16px;padding-right:16px}
  .mark{padding:0 16px}
  .mark-word{font-size:16px}
  .lang{height:32px}
  .lang button{padding:0 8px}
  .dock,.app[data-view="map"] .dock{top:var(--top);right:auto;width:var(--dock)}
  .panel{padding:32px 40px 48px;border-top:0;border-right:1px solid var(--border)}
  .vf{display:flex}
  .scenebar,.app[data-view="map"] .scenebar{display:flex;top:auto;bottom:16px;right:20px}
  .play{height:32px}
  .tag{left:calc(var(--dock) + 24px);top:auto;bottom:16px;max-width:280px;padding:8px 12px}
  .tag span{display:block}
  .bar{flex-wrap:wrap;gap:8px 12px;padding:32px 0 16px;margin:-32px 0 24px;top:-32px}
  .bar .back{display:inline}
  .bar-a{width:100%;flex:none}
  .pn{justify-content:space-between;width:100%}
  .pn a{height:32px;max-width:49%}
  .pn-n{display:inline}
  .card{padding:16px 20px 20px}
  .item{grid-template-columns:32px minmax(0,1fr);gap:8px;align-items:baseline;padding:10px 0}
  .thumb{display:none}
  .no3d .still{left:var(--dock);width:calc(100% - var(--dock));height:100%}
}
/* a phone on its side: a narrower column, so the model keeps room */
@media (max-width:899px) and (min-width:600px) and (max-height:520px){
  :root{--dock:min(46vw,400px)}
  .panel{padding:20px 20px 40px}
  .bar{padding-top:20px;margin-top:-20px;top:-20px}
  .vf{display:none}
  .tag span{display:none}
}
/* the group buttons in the top bar need the room of a wide screen */
@media (min-width:900px){
  .groups{display:flex;margin-left:auto}
  .ver{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app" id="app" data-view="map">
  <div class="stage"><canvas id="gl" aria-label=""></canvas><img class="still" id="still" alt=""></div>
  <div class="tag" id="tag" hidden></div>
  <header class="top">
    <a class="mark" href="#" id="home"><span class="mark-m" aria-hidden="true">/M</span><span class="mark-word">MOTH: LAWWORKS</span></a>
    <nav class="groups" id="groups" aria-label="Grupper"></nav>
    <span class="ver" id="ver"><span class="ver-long">Version 8.2</span><span class="ver-short" aria-hidden="true">v8.2</span></span>
    <div class="lang" id="lang" role="group" aria-label="Sprog"><button type="button" data-l="da" lang="da">DA</button><button type="button" data-l="en" lang="en">EN</button></div>
  </header>
  <aside class="dock"><div class="panel" id="panel"></div></aside>
  <div class="vf" id="vf"><span class="vf-a" id="vfa"></span><span class="vf-b" id="vfb"></span></div>
  <div class="scenebar"><button class="play" id="play" data-on="1"><i></i><span></span></button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>/* cfg.js */
/* cfg.js — shared palette and view settings. Lifted from MOTH: TOKENWORKS (cfg.js) so the drawing grammar is the same:
   MOTH tokens value for value, three face tones per solid, no light and no shadow. */
window.TB=window.TB||{};
(function(){
'use strict';
var TB=window.TB;

/* Colour management, as in TOKENWORKS: three.js r128 treats hex as linear; we make hex, CSS strings and HSL mean sRGB. */
(function(){
  if(!window.THREE||THREE.Color.prototype.__tbManaged)return;
  var P=THREE.Color.prototype,setHex=P.setHex,getHex=P.getHex,setStyle=P.setStyle,setHSL=P.setHSL,getHSL=P.getHSL,getStyle=P.getStyle,tmp=new THREE.Color();
  P.__tbManaged=true;
  P.setHex=function(h){setHex.call(this,h);return this.convertSRGBToLinear();};
  P.getHex=function(){tmp.r=this.r;tmp.g=this.g;tmp.b=this.b;tmp.convertLinearToSRGB();return getHex.call(tmp);};
  P.setHSL=function(h,s,l){setHSL.call(this,h,s,l);return this.convertSRGBToLinear();};
  P.getHSL=function(t){tmp.r=this.r;tmp.g=this.g;tmp.b=this.b;tmp.convertLinearToSRGB();return getHSL.call(tmp,t);};

    var w=0,h=0,meas=lines.map(function(l){
      var lw=0,ls=0;l.forEach(function(r){ctx.font=font(r);r._w=ctx.measureText(r.t).width/R;lw+=r._w;ls=Math.max(ls,r.s||size);});
      w=Math.max(w,lw);h+=ls*lead;return {w:lw,s:ls};
    });
    var W=q.w||(w+padX*2),H=q.h||(h+padY*2);
    cv.width=Math.max(2,Math.ceil(W*R));cv.height=Math.max(2,Math.ceil(H*R));
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
    if(q.bg!==undefined&&q.bg!==null){ctx.fillStyle=css(q.bg);ctx.fillRect(0,0,cv.width,cv.height);}
    var y=(H-h)/2;
    lines.forEach(function(l,i){
      var a=q.align||'left',x=a==='left'?padX:a==='right'?W-padX-meas[i].w:(W-meas[i].w)/2,s=meas[i].s;
      l.forEach(function(r){
        ctx.font=font(r);ctx.textBaseline='alphabetic';ctx.textAlign='left';
        ctx.fillStyle=css(r.c!==undefined?r.c:(q.color!==undefined?q.color:pal.ink));
        ctx.fillText(r.t,x*R,(y+s*lead*0.5+(r.s||size)*0.36)*R);x+=r._w;
      });
      y+=s*lead;
    });

/* redraw everything that carries type, once the typeface has arrived */
K.refont=function(root){(root||scene).traverse(function(o){if(o.redraw){try{o.redraw();}catch(e){}}});};

/* ---------- marks ---------- */
/* open chevron: the arrowhead of a connection. Lies in the plane spanned by `dir` and `across`. */
K.chevron=function(tip,dir,across,size){
  var t=V(tip),d=V(dir).clone().normalize(),a=V(across).clone().normalize(),s=size||0.12;
  var p=t.clone().addScaledVector(d,-s).addScaledVector(a,s*0.72),q=t.clone().addScaledVector(d,-s).addScaledVector(a,-s*0.72);
  return [[p.x,p.y,p.z,t.x,t.y,t.z],[q.x,q.y,q.z,t.x,t.y,t.z]];
};
K.along=function(pts,dist,out){
  out=out||new THREE.Vector3();
  for(var i=0;i<pts.length-1;i++){var L=pts[i].distanceTo(pts[i+1]);if(dist<=L||i===pts.length-2){return out.copy(pts[i]).lerp(pts[i+1],L?Math.min(1,dist/L):0);}dist-=L;}
  return out.copy(pts[pts.length-1]);
};
K.length=function(pts){var s=0;for(var i=0;i<pts.length-1;i++)s+=pts[i].distanceTo(pts[i+1]);return s;};

/* ---------- time: calm. Things ease in and out, and nothing bounces. ---------- */
K.ease=function(k){return k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;};
K.FPS=12;
K.tick=function(t,fps){return Math.floor(t*(fps||K.FPS));};
K.after=function(sec,fn,tag){var o={t:now+sec,fn:fn,tag:tag||null};timers.push(o);return o;};
K.clear=function(tag){timers=timers.filter(function(o){return o.tag!==tag;});runs=runs.filter(function(o){return o.tag!==tag;});};
K.steps=function(n,stepSec,fn,done,tag){
  for(var i=1;i<=n;i++)(function(i){K.after(i*stepSec,function(){fn(i,n);},tag);})(i);
  if(done)K.after(n*stepSec+0.0005,done,tag);
};
/* run fn(k) with k from 0 to 1 over dur seconds; k is linear, callers ease it */
K.run=function(dur,fn,done,tag){runs.push({t0:now,dur:Math.max(0.001,dur),fn:fn,done:done||null,tag:tag||null});};
/* move through the points, eased over the whole way */
K.travel=function(obj,pts,dur,done,tag){
  var p=[obj.position.clone()].concat(pts.map(function(x){return V(x).clone();})),len=K.length(p);
  K.run(dur,function(k){K.along(p,len*K.ease(k),obj.position);},done,tag);return dur;
};
K.move=function(obj,to,speed,done,tag){
  var from=obj.position.clone(),t=V(to).clone(),dur=from.distanceTo(t)/(speed||4);
  K.run(dur,function(k){obj.position.copy(from).lerp(t,K.ease(k));},done,tag);return dur;
};
K.now=function(){return now;};
K.rng=function(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};};

K.init=function(sc,renderer){

};
K.update=function(dt,t){
  now=t;
  var i;

    var keep=[],fin=[];
    for(i=0;i<runs.length;i++){var r=runs[i],k=Math.min(1,(now-r.t0)/r.dur);try{r.fn(k);}catch(e){}if(k<1)keep.push(r);else fin.push(r);}
    runs=keep.concat(runs.filter(function(r){return keep.indexOf(r)<0&&fin.indexOf(r)<0;}));
    for(i=0;i<fin.length;i++)if(fin[i].done){try{fin[i].done();}catch(e){if(window.console)console.warn('[TB.kit]',e);}}
  }
  if(!timers.length)return;
  var due=[],rest=[];
  for(i=0;i<timers.length;i++)(timers[i].t<=now?due:rest).push(timers[i]);
  timers=rest;
  due.sort(function(a,b){return a.t-b.t;});
  for(var j=0;j<due.length;j++){try{due[j].fn();}catch(e){if(window.console)console.warn('[TB.kit]',e);}}
};

/* ---------- TB.fx: what the integrator expects ---------- */
TB.fx={
  init:K.init,update:K.update,
  tween:function(obj,to,dur,ease,cb){
    var from={},k;for(k in to)from[k]=obj[k];

  },
  burst:function(){},
  label:function(text,o){return K.plate(text,o);}
};

<script>/* env.js */
/* env.js — the sheet: a Fog ground with the faint MOTH grid, thinning out towards the edge so the drawing has no frame. */
(function(){
'use strict';
var TB=window.TB,K=TB.kit,pal=TB.cfg.pal;
TB.env={build:function(sc){
  sc.background=new THREE.Color().setRGB(0xf5/255,0xf6/255,0xfa/255);
  var fine=[],coarse=[],X=60,Z=46,i;
  function fade(x,z){var d=Math.max(Math.abs(x)/X,Math.abs(z)/Z);return Math.max(0,1-Math.pow(d,3));}
  function add(list,ax,az,bx,bz){
    var n=14,j;
    for(j=0;j<n;j++){
      var x0=ax+(bx-ax)*j/n,z0=az+(bz-az)*j/n,x1=ax+(bx-ax)*(j+1)/n,z1=az+(bz-az)*(j+1)/n;
      list.push([x0,0,z0,x1,0,z1,fade(x0,z0),fade(x1,z1)]);
    }
  }
  for(i=-X;i<=X;i++)add(i%4===0?coarse:fine,i+0.5,-Z,i+0.5,Z);
  for(i=-Z;i<=Z;i++)add(i%4===0?coarse:fine,-X,i+0.5,X,i+0.5);
  /* the grid is the bottom layer. It is drawn first of all, right after the grey group bands and before anything else,
     blended but without writing depth: whatever lies on the ground afterwards (a white plate, a word) simply covers it,
     however coarse the depth buffer of the device is */
  var a=K.lines(fine,{color:pal.gridFaint,fade:true}),b=K.lines(coarse,{color:pal.grid,fade:true});
  [a,b].forEach(function(m){var mt=m.material;mt.transparent=false;mt.blending=THREE.CustomBlending;mt.blendSrc=THREE.SrcAlphaFactor;mt.blendDst=THREE.OneMinusSrcAlphaFactor;mt.depthWrite=false;m.renderOrder=-1;sc.add(m);});
}};
})();

<script>/* laws.js */
window.TB.LAWS=[{"id": "proximity", "no": "01", "g": 0, "name": {"da": "Nærhedsloven", "en": "Law of Proximity"}, "orig": "Law of Proximity", "def": {"da": "Ting, der står tæt på hinanden, ses som en gruppe. Afstand alene kan fortælle, hvad der hører sammen, før man har læst et ord.", "en": "Things that are close together are seen as a group. Distance alone can say what belongs together, before a word has been read."}, "design": {"da": ["Sæt en label tættere på sit eget felt end på nabofeltet. Afstanden alene kan binde dem sammen; der er ikke brug for en streg.", "Prøv mellemrum, før du tegner streger og bokse. Mellemrum er den billigste måde at gruppere på.", "Ens afstande overalt giver ingen struktur. Brug små afstande inden for en gruppe og større mellem grupper."], "en": ["Place a label closer to its own field than to the neighbouring one. Distance alone can bind them; no line is needed.", "Try space before drawing lines and boxes. Space is the cheapest way to group.", "Equal distances everywhere give no structure. Use small distances within a group and larger ones between groups."]}, "ev": "percept", "evWhy": {"da": "Et gestaltprincip, der også er målt kvantitativt. I gitre af prikker afhænger grupperingen kun af forholdet mellem afstandene, ikke af deres størrelse, og tendensen til at gruppere aftager jævnt, jo mere ens afstandene bliver.", "en": "A Gestalt principle that has also been measured quantitatively. In dot lattices, grouping depends only on the ratio between distances, not on their size, and the tendency to group fades steadily as the distances become more alike."}, "origin": ["Wertheimer, M. (1923). Untersuchungen zur Lehre von der Gestalt II. <i>Psychologische Forschung</i>, 4, 301–350. Engelsk/English: Ellis, W. D. (red./ed.) (1938), <i>A Source Book of Gestalt Psychology</i>, 71–88.", "Kubovy, M., Holcombe, A. O. & Wagemans, J. (1998). On the lawfulness of grouping by proximity. <i>Cognitive Psychology</i>, 35(1), 71–98."], "links": [{"t": "Wertheimer (1923): Laws of Organization in Perceptual Forms, engelsk oversættelse / English translation", "u": "https://psychclassics.yorku.ca/Wertheimer/Forms/forms.htm"}, {"t": "Proximity Principle in Visual Design", "u": "https://www.nngroup.com/articles/gestalt-proximity/"}], "model": {"da": ["Fire labels og fire felter står på en skærm. Kun afstandene ændrer sig: fra labelen til dens eget felt og fra labelen til feltet over.", "Mærkerne i højre margen er afstandene. De stiplede rammer er de grupper, afstandene skaber.", "Står labelen tættest på sit eget felt, læses formularen som fire par. Er afstandene ens, forsvinder parrene. Står labelen tættest på feltet over, hører den visuelt til det forkerte felt.", "Det er forholdet mellem afstandene, ikke deres størrelse, der afgør grupperingen. Modellens tærskel er en forenkling: et mellemrum, der er mindst halvanden gang så stort som det mindste, skiller grupper."], "en": ["Four labels and four fields stand on a screen. Only the distances change: from each label to its own field, and from each label to the field above.", "The marks in the right margin are the distances. The dashed frames are the groups the distances make.", "When the label is closest to its own field, the form reads as four pairs. When the distances are equal, the pairs disappear. When the label is closest to the field above, it visually belongs to the wrong field.", "It is the ratio between the distances, not their size, that decides the grouping. The model’s threshold is a simplification: a gap at least one and a half times the smallest gap separates groups."]}, "type": "experience", "ev3": ["principle", "solid", "direct"], "predict": {"q": {"da": "Labelen flyttes tættere på feltet over end på sit eget. Hvilket felt ser den så ud til at høre til?", "en": "The label moves closer to the field above than to its own. Which field does it then seem to belong to?"}, "opts": [{"da": "Sit eget, for det er dens felt", "en": "Its own, because that is its field"}, {"da": "Feltet over, for det står den tættest på", "en": "The field above, because it is closest"}, {"da": "Ingen af dem; afstand betyder ikke noget", "en": "Neither; distance does not matter"}], "a": 1, "why": {"da": "Øjet grupperer efter forholdet mellem afstandene. Står labelen tættest på feltet over, hører den visuelt til det.", "en": "The eye groups by the ratio between the distances. When the label is closest to the field above, it belongs to it visually."}}, "shows": {"da": "At afstand alene kan binde en label til et felt.", "en": "That distance alone can tie a label to a field."}, "notShows": {"da": "At afstand altid vinder. Flader, streger og lighed kan veje tungere.", "en": "That distance always wins. Regions, lines and similarity can outweigh it."}, "counter": {"da": "Når afstandene er ens, grupperer afstanden ingenting. Er der ikke plads til forskel i afstand, så brug flader eller streger i stedet.", "en": "When the distances are equal, distance groups nothing. If there is no room for a difference in spacing, use regions or lines instead."}, "counterSet": 50, "related": [["common-region", {"da": "En fælles flade kan veje tungere end afstand", "en": "A shared region can outweigh distance"}], ["similarity", {"da": "Lighed og nærhed lægges sammen", "en": "Similarity and proximity add up"}]], "answerSet": 88, "loops": false}, {"id": "similarity", "no": "02", "g": 0, "name": {"da": "Lighedsloven", "en": "Law of Similarity"}, "orig": "Law of Similarity", "def": {"da": "Ting, der ligner hinanden i form, farve, størrelse eller retning, opfattes som sammenhørende, også når der står andre ting imellem dem.", "en": "Things that look alike in shape, colour, size or orientation are seen as belonging together, even when other things stand between them."}, "design": {"da": ["Giv ting med samme funktion samme udseende, fx alle links eller alle primære knapper.", "Ting, der ser ens ud, forventes at opføre sig ens. Hvis to elementer opfører sig forskelligt, så lad dem også se forskellige ud."], "en": ["Give things with the same function the same look, for example all links or all primary buttons.", "Things that look alike are expected to behave alike. If two elements behave differently, let them look different too."]}, "ev": "percept", "evWhy": {"da": "En klassisk grupperingsfaktor, der er let at demonstrere og står centralt i forskningen i perceptuel gruppering. Når lighed og nærhed peger i hver sin retning, afgør styrken af dem begge, hvilken gruppering der vinder; målinger tyder på, at de to effekter lægges sammen.", "en": "A classic grouping factor that is easy to demonstrate and central in research on perceptual grouping. When similarity and proximity point different ways, the strength of both decides which grouping wins; measurements suggest the two effects add up."}, "origin": ["Wertheimer, M. (1923). Untersuchungen zur Lehre von der Gestalt II. <i>Psychologische Forschung</i>, 4, 301–350.", "Kubovy, M. &amp; van den Berg, M. (2008). The whole is equal to the sum of its parts: A probabilistic model of grouping by proximity and similarity in regular patterns. <i>Psychological Review</i>, 115(1), 131–154."], "links": [{"t": "Similarity Principle in Visual Design", "u": "https://www.nngroup.com/articles/gestalt-similarity/"}, {"t": "Wertheimer (1923): Laws of Organization in Perceptual Forms, engelsk oversættelse / English translation", "u": "https://psychclassics.yorku.ca/Wertheimer/Forms/forms.htm"}], "model": {"da": ["Seks rækker med seks klodser står på en tavle med præcis lige store mellemrum, både vandret og lodret. Afstanden kan derfor ikke gruppere dem.", "Grebet ændrer hver anden række: klodserne bliver fladere og mørkere, trin for trin. Når forskellen er stor nok, ser øjet rækker i stedet for et gitter, og de stiplede rammer viser dem.", "Tærsklen er modellens forenkling. I virkeligheden vokser grupperingen gradvist med forskellen; der er ingen skarp grænse.", "Lighed og nærhed virker sammen, og målinger tyder på, at de to effekter lægges sammen. Her er afstandene ens, så det kun er ligheden, der grupperer."], "en": ["Six rows of six blocks stand on a board with exactly equal spacing, across and down. Distance therefore cannot group them.", "The handle changes every other row: its blocks become shallower and darker, step by step. Once the difference is large enough, the eye sees rows instead of a grid, and the dashed frames show them.", "The threshold is the model’s simplification. In reality grouping grows gradually with the difference; there is no sharp line.", "Similarity and proximity work together, and measurements suggest the two effects add up. Here the spacing is equal, so only similarity groups."]}, "type": "experience", "ev3": ["principle", "solid", "direct"], "predict": {"q": {"da": "Alle klodser står med præcis lige store mellemrum. Hvad sker der, når hver anden række bliver fladere og mørkere?", "en": "All blocks stand with exactly equal gaps. What happens when every other row becomes flatter and darker?"}, "opts": [{"da": "Intet, for afstanden er den samme", "en": "Nothing, because the spacing is the same"}, {"da": "Øjet begynder at se rækker", "en": "The eye starts to see rows"}, {"da": "Øjet begynder at se søjler", "en": "The eye starts to see columns"}], "a": 1, "why": {"da": "Ligheden grupperer, selv om afstandene er ens: klodserne i hver række ligner hinanden og ses som én række.", "en": "Similarity groups even though the spacing is equal: the blocks in each row are alike and are seen as one row."}}, "shows": {"da": "At ens udseende grupperer, når afstanden ikke gør det.", "en": "That similar appearance groups things when spacing does not."}, "notShows": {"da": "En skarp grænse. I virkeligheden vokser grupperingen gradvist med forskellen.", "en": "A sharp threshold. In reality grouping grows gradually with the difference."}, "counter": {"da": "Giv ikke ting samme udseende, hvis de opfører sig forskelligt. Det, der ligner hinanden, forventes at virke ens.", "en": "Do not give things the same look if they behave differently. Things that look alike are expected to work alike."}, "counterSet": null, "related": [["proximity", {"da": "Afstand og lighed lægges sammen", "en": "Distance and similarity add up"}], ["von-restorff", {"da": "Det ene, der ikke ligner, skiller sig ud", "en": "The one that differs stands out"}]], "answerSet": 100, "loops": false}, {"id": "common-region", "no": "03", "g": 0, "name": {"da": "Loven om fælles område", "en": "Law of Common Region"}, "orig": "Law of Common Region", "def": {"da": "Ting inden for samme afgrænsede område ses som en gruppe, også når de står længere fra hinanden end fra ting uden for området.", "en": "Things inside the same bounded area are seen as a group, even when they stand further apart than from things outside the area."}, "design": {"da": ["Kort, paneler og baggrundsflader grupperer stærkt. Brug dem, når mellemrum ikke er nok.", "Hver ramme er en gruppering mere at aflæse. Rammer i rammer kan vise et hierarki, men brug ikke flere niveauer, end indholdet har."], "en": ["Cards, panels and background areas group strongly. Use them when space is not enough.", "Every frame is one more grouping to read. Frames inside frames can show a hierarchy, but use no more levels than the content has."]}, "ev": "percept", "evWhy": {"da": "Et nyere grupperingsprincip, som Stephen Palmer beskrev i 1992; det er ikke et af de oprindelige gestaltprincipper fra 1923. Palmers demonstrationer viste, at et fælles område kan veje tungere end både nærhed og lighed, og senere forsøg med reaktionstider har bekræftet effekten.", "en": "A newer grouping principle, described by Stephen Palmer in 1992, not one of the original Gestalt principles from 1923. Palmer’s demonstrations showed that a common region can outweigh both proximity and similarity, and later reaction-time experiments have confirmed the effect."}, "origin": ["Palmer, S. E. (1992). Common region: A new principle of perceptual grouping. <i>Cognitive Psychology</i>, 24(3), 436–447."], "links": [{"t": "The Principle of Common Region: Containers Create Groupings", "u": "https://www.nngroup.com/articles/common-region/"}, {"t": "Wagemans m.fl. / et al. (2012): A Century of Gestalt Psychology in Visual Perception I", "u": "https://ruccs.sas.rutgers.edu/images/archive/personal-manish-singh/papers/Wagemans_etal_2012_I.pdf"}], "model": {"da": ["Tolv klodser står i to klynger på en plade. Inden for en klynge er afstanden kort, mellem klyngerne lang, så afstanden alene deler dem i to grupper.", "Grebet gør et område større: en tynd, lyseblå plade, der vokser ud fra midten. Klodser, der står helt inde på den, ses som én gruppe, også på tværs af det store mellemrum. Klodserne udenfor grupperes stadig efter afstand. De stiplede rammer er de grupper, øjet ser.", "Modellens regel er en forenkling: en klods hører til området, når den står helt inden for det, og så vinder området. I virkeligheden konkurrerer område og afstand, men Palmers demonstrationer viste, at et fælles område kan veje tungere end både nærhed og lighed."], "en": ["Twelve blocks stand in two clusters on a plate. Inside a cluster the distances are short, between the clusters long, so distance alone splits them into two groups.", "The handle enlarges a region: a thin, light blue panel that grows out from the middle. Blocks that stand wholly on it are seen as one group, even across the wide gap. The blocks outside still group by distance. The dashed frames are the groups the eye sees.", "The model’s rule is a simplification: a block belongs to the region when it stands wholly inside it, and then the region wins. In reality region and distance compete, but Palmer’s demonstrations showed that a common region can outweigh both proximity and similarity."]}, "type": "experience", "ev3": ["principle", "solid", "direct"], "predict": {"q": {"da": "En lys plade vokser ud under de inderste klodser i begge klynger. Hvordan ser øjet grupperne?", "en": "A light panel grows out under the innermost blocks of both clusters. How does the eye see the groups?"}, "opts": [{"da": "Stadig to klynger; afstanden afgør", "en": "Still two clusters; distance decides"}, {"da": "Klodserne på pladen bliver én gruppe på tværs af mellemrummet", "en": "The blocks on the panel become one group across the gap"}, {"da": "Alle tolv bliver én gruppe", "en": "All twelve become one group"}], "a": 1, "why": {"da": "Et fælles område kan samle på tværs af afstanden. Klodserne udenfor grupperes stadig efter afstand.", "en": "A common region can join across the gap. The blocks outside still group by distance."}}, "shows": {"da": "At et fælles område kan samle ting på tværs af afstand.", "en": "That a common region can join things across distance."}, "notShows": {"da": "At området altid vinder. Område og afstand konkurrerer, og modellens regel er en forenkling.", "en": "That the region always wins. Region and distance compete, and the model’s rule is a simplification."}, "counter": {"da": "En ramme om det hele skiller intet fra resten. Her rummer området alle tolv; modellen gør dem til én gruppe, men afstanden grupperer stadig inden i rammen.", "en": "A frame around everything sets nothing apart. Here the region holds all twelve; the model makes them one group, but spacing still groups inside the frame."}, "counterSet": 3, "related": [["proximity", {"da": "Det, et område kan veje tungere end", "en": "What a region can outweigh"}], ["uniform-connectedness", {"da": "En anden måde at binde ting sammen", "en": "Another way to tie things together"}]], "answerSet": 1, "loops": false}, {"id": "uniform-connectedness", "no": "04", "g": 0, "name": {"da": "Loven om forbundethed", "en": "Law of Uniform Connectedness"}, "orig": "Law of Uniform Connectedness", "def": {"da": "En streg eller et andet synligt bindeled mellem to ting får dem til at se ud, som om de hører sammen.", "en": "A line or other visible link between two things makes them look as if they belong together."}, "design": {"da": ["Forbind trinene i et forløb med en linje, så rækkefølgen ses uden at blive forklaret.", "En linje er en stærk påstand om sammenhæng. Brug den kun, hvor der er en."], "en": ["Connect the steps of a process with a line, so the order is seen without being explained.", "A line is a strong claim of a relation. Use it only where there is one."]}, "ev": "percept", "evWhy": {"da": "At forbinde elementer med en streg er en stærk grupperingsfaktor. Navnet stammer dog fra Palmer og Rock (1994), og hos dem betyder »uniform connectedness« noget andet: at sammenhængende flader med samme farve eller tekstur bliver opfattet som én enhed. Reglen om forbindende streger kalder de »element connectedness«. Deres påstand om, at det sker før al anden gruppering, er omstridt.", "en": "Connecting elements with a line is a strong grouping factor. The name, though, comes from Palmer and Rock (1994), and to them “uniform connectedness” means something else: that a connected region of one colour or texture is perceived as a single unit. The rule about connecting lines they call “element connectedness”. Their claim that it comes before all other grouping is disputed."}, "origin": ["Palmer, S. & Rock, I. (1994). Rethinking perceptual organization: The role of uniform connectedness. <i>Psychonomic Bulletin &amp; Review</i>, 1(1), 29–55."], "links": [{"t": "Wagemans m.fl. / et al. (2012): A Century of Gestalt Psychology in Visual Perception I", "u": "https://ruccs.sas.rutgers.edu/images/archive/personal-manish-singh/papers/Wagemans_etal_2012_I.pdf"}, {"t": "Connectedness: Gestalt Principle for User Interface Design (video)", "u": "https://www.nngroup.com/videos/connectedness-gestalt/"}], "model": {"da": ["Seks klodser står på række. Afstand og form gør dem til tre par: to terninger, to lave plader og to terninger.", "Grebet styrer, hvor langt to rør når. De vokser fra den inderste terning i hvert af de yderste par mod den nærmeste lave plade. Så længe et rør ikke når frem, sker der intet. Når det lander, er forbindelsen der, og øjet grupperer på tværs af parrene: forbindelsen kan vinde over både afstand og form. De stiplede rammer er de grupper, øjet ser.", "Modellens regel er en forenkling: et rør tæller kun, når det rører begge klodser, og så afgør det grupperingen. I virkeligheden konkurrerer forbindelse, afstand og lighed, og forbindelsen vinder ikke altid.", "At forbinde ting med en streg eller et rør er det, Palmer og Rock kalder »element connectedness«. Deres »uniform connectedness« betyder noget andet: at en sammenhængende flade i samme farve eller tekstur opfattes som én enhed."], "en": ["Six blocks stand in a row. Distance and shape make them three pairs: two cubes, two low slabs and two cubes.", "The handle sets how far two pipes reach. They grow from the inner cube of each outer pair towards the nearest slab. While a pipe falls short, nothing changes. When it lands, the connection is made, and the eye groups across the pairs: the connection can win over both distance and shape. The dashed frames are the groups the eye sees.", "The model’s rule is a simplification: a pipe counts only when it touches both blocks, and then it decides the grouping. In reality connection, distance and similarity compete, and the connection does not always win.", "Joining things with a line or a pipe is what Palmer and Rock call “element connectedness”. Their “uniform connectedness” means something else: that a connected area of one colour or texture is seen as a single unit."]}, "type": "experience", "ev3": ["principle", "solid", "direct"], "predict": {"q": {"da": "Rør vokser mellem klodser fra forskellige par. Hvad sker der, når de når frem?", "en": "Pipes grow between blocks from different pairs. What happens when they arrive?"}, "opts": [{"da": "Intet; afstand og form afgør stadig", "en": "Nothing; distance and shape still decide"}, {"da": "De forbundne klodser ses som en gruppe på tværs af parrene", "en": "The connected blocks are seen as a group across the pairs"}, {"da": "Alle seks bliver én gruppe", "en": "All six become one group"}], "a": 1, "why": {"da": "Et synligt bindeled kan gruppere på tværs af både afstand og form.", "en": "A visible link can group across both distance and shape."}}, "shows": {"da": "At et synligt bindeled kan gruppere på tværs af afstand og form.", "en": "That a visible link can group across distance and shape."}, "notShows": {"da": "Retning. En streg viser, hvad der hænger sammen, og i et forløb hvad der følger efter hvad, men ikke hvilken vej; det kræver pile eller numre. Det, der vises, kalder Palmer og Rock »element connectedness«.", "en": "Direction. A line shows what belongs together, and in a sequence what follows what, but not which way; that takes arrows or numbers. What is shown is what Palmer and Rock call “element connectedness”."}, "counter": {"da": "En streg mellem ting, der ikke hører sammen, skaber en sammenhæng, der ikke findes. Her forbinder rørene klodser fra hver sit par.", "en": "A line between things that do not belong together creates a connection that is not there. Here the pipes join blocks from different pairs."}, "counterSet": 100, "related": [["common-region", {"da": "Et område binder også på tværs", "en": "A region also binds across"}], ["proximity", {"da": "Det, et bindeled kan veje tungere end", "en": "What a link can outweigh"}]], "answerSet": 100, "loops": false}, {"id": "praegnanz", "no": "05", "g": 0, "name": {"da": "Prägnanz-loven", "en": "Law of Prägnanz"}, "orig": "Law of Prägnanz", "def": {"da": "Når et billede kan opfattes på flere måder, ser vi den mest enkle og regelmæssige ordning, billedet tillader. Få, regelmæssige figurer vinder over mange uregelmæssige.", "en": "When an image can be seen in more than one way, we see the simplest, most regular organisation it allows. A few regular figures win over many irregular ones."}, "design": {"da": ["Byg ikoner og illustrationer af få, enkle former.", "Hvis en form kan læses på flere måder, vælger øjet den enkleste. Tjek, at det er den, du mener."], "en": ["Build icons and illustrations from a few simple shapes.", "If a shape can be read in several ways, the eye picks the simplest. Check that it is the one you mean."]}, "ev": "percept", "evWhy": {"da": "Gestaltpsykologiens overordnede princip og samtidig det mest uklare. Tendensen mod den enkleste organisering er anerkendt, men »enkleste« har aldrig fået én præcis definition.", "en": "The overarching principle of Gestalt psychology and also the vaguest. The tendency towards the simplest organisation is accepted, but “simplest” has never been given one precise definition."}, "origin": ["Wertheimer, M. (1923). Untersuchungen zur Lehre von der Gestalt II. <i>Psychologische Forschung</i>, 4, 301–350.", "Koffka, K. (1935). <i>Principles of Gestalt Psychology</i>. Harcourt, Brace."], "links": [{"t": "Wagemans m.fl. / et al. (2012): A Century of Gestalt Psychology in Visual Perception II", "u": "https://pmc.ncbi.nlm.nih.gov/articles/PMC3728284"}, {"t": "Wertheimer (1923): Laws of Organization in Perceptual Forms, engelsk oversættelse / English translation", "u": "https://psychclassics.yorku.ca/Wertheimer/Forms/forms.htm"}], "model": {"da": ["På soklen ligger en indlagt flade, der læses som et lyst kvadrat med en grå cirkel over det ene hjørne. De stiplede linjer viser den læsning: to hele figurer, også det hjørne af kvadratet, der er skjult under cirklen.", "Grebet trækker fladen fra hinanden som en sprængtegning, hvert stykke til sit eget niveau. Så ses det, den faktisk består af: fem uregelmæssige stykker, og ingen af dem er et kvadrat eller en cirkel.", "Mens stykkerne ligger samlet, tillader billedet begge læsninger, og øjet vælger den enkleste: få, regelmæssige figurer frem for mange uregelmæssige. Når stykkerne skilles, holder den enkle læsning ikke længere.", "Skiftet er modellens forenkling: den enkle læsning gælder, mens stykkerne ligger samlet, og forsvinder, så snart de skilles. Hvad »enkleste« præcist betyder, har aldrig fået én fast definition."], "en": ["On the plinth lies an inlay that reads as a light square with a grey circle over one corner. The dashed lines show that reading: two whole figures, including the corner of the square hidden under the circle.", "The handle pulls the inlay apart like an exploded drawing, each piece to its own level. Then you see what it is actually made of: five irregular pieces, none of them a square or a circle.", "While the pieces lie together, the picture allows both readings, and the eye picks the simplest: a few regular figures rather than many irregular ones. Once the pieces part, the simple reading no longer holds.", "The switch is the model’s simplification: the simple reading holds while the pieces lie together and is gone as soon as they part. What “simplest” means exactly has never been given one fixed definition."]}, "type": "experience", "ev3": ["principle", "mixed", "caveat"], "predict": {"q": {"da": "Hvad ser du på soklen, før stykkerne trækkes fra hinanden?", "en": "What do you see on the plinth before the pieces are pulled apart?"}, "opts": [{"da": "Fem uregelmæssige stykker", "en": "Five irregular pieces"}, {"da": "Et kvadrat og en cirkel", "en": "A square and a circle"}, {"da": "En cirkel med et hak", "en": "A circle with a notch"}], "a": 1, "why": {"da": "Øjet vælger den enkleste læsning, billedet tillader. Fladen består af fem uregelmæssige stykker, og ingen af dem er et kvadrat eller en cirkel.", "en": "The eye picks the simplest reading the image allows. The surface is five irregular pieces, none of them a square or a circle."}}, "shows": {"da": "At øjet vælger den enkleste ordning, billedet tillader.", "en": "That the eye picks the simplest organisation the image allows."}, "notShows": {"da": "Hvad »enkleste« præcist betyder. Det har ingen fast definition, og samme billede kan også vise andre principper, fx at øjet fuldender det skjulte.", "en": "What “simplest” means exactly. It has no fixed definition, and the same image can also show other principles, such as the eye completing what is hidden."}, "counter": {"da": "Når den enkleste læsning er den forkerte, vildleder den. Her ses et kvadrat og en cirkel, selv om fladen er fem stykker. Tjek, at et ikon ikke kan læses som noget enklere, end du mener.", "en": "When the simplest reading is the wrong one, it misleads. Here you see a square and a circle although the surface is five pieces. Check that an icon cannot be read as something simpler than you mean."}, "counterSet": 0, "related": [["occam", {"da": "Det enkle foretrækkes også som metode", "en": "The simple is preferred as a method too"}], ["similarity", {"da": "En anden regel for, hvad der ses som én ting", "en": "Another rule for what is seen as one thing"}]], "answerSet": 100, "loops": false}, {"id": "aesthetic-usability", "no": "06", "g": 0, "name": {"da": "Æstetik-brugbarhedseffekten", "en": "Aesthetic-Usability Effect"}, "orig": "Aesthetic-Usability Effect", "def": {"da": "Folk forventer ofte, at et pænt design er lettere at bruge end et mindre pænt design med samme funktion. Skønheden farver især førstehåndsindtrykket af brugbarheden.", "en": "People often expect an attractive design to be easier to use than a less attractive one with the same function. The impression of beauty mainly colours the first impression of usability."}, "design": {"da": ["Et pænt design giver et godt første indtryk. Forsøgene er uenige om, hvorvidt det også dækker over dårlig brugbarhed efter brug, så mål, hvad folk gør, ikke kun hvad de siger.", "Æstetik er ikke pynt. Den påvirker, hvordan produktet bliver vurderet, i hvert fald før brug."], "en": ["An attractive design makes a good first impression. Studies disagree on whether it also masks poor usability after use, so measure what people do, not only what they say.", "Aesthetics is not decoration. It affects how the product is judged, at least before use."]}, "ev": "robust", "evWhy": {"da": "Sammenhængen mellem skønhed og forventet brugbarhed er fundet både i Japan (1995) og i Israel (1997). Efter brug er billedet blandet: i ét kontrolleret forsøg ændrede udseendet ikke vurderingen af brugbarheden, mens dårlig brugbarhed trak vurderingen af skønheden ned; i et andet blev den pæne udgave vurderet som mere brugbar, og opgaverne blev løst hurtigere på den.", "en": "The link between beauty and expected usability has been found in both Japan (1995) and Israel (1997). After use the picture is mixed: in one controlled experiment looks did not change the usability rating, while poor usability lowered the beauty rating; in another, the attractive version was rated more usable and tasks were completed faster on it."}, "origin": ["Kurosu, M. &amp; Kashimura, K. (1995). Apparent usability vs. inherent usability. <i>CHI ’95 Conference Companion</i>, 292–293.", "Tractinsky, N. (1997). Aesthetics and apparent usability: Empirically assessing cultural and methodological issues. <i>CHI ’97</i>.", "Tuch, A. N., Roth, S. P., Hornbæk, K., Opwis, K. &amp; Bargas-Avila, J. A. (2012). Is beautiful really usable? <i>Computers in Human Behavior</i>, 28(5), 1596–1607.", "Sonderegger, A. &amp; Sauer, J. (2010). The influence of design aesthetics in usability testing. <i>Applied Ergonomics</i>, 41(3), 403–410."], "links": [{"t": "The Aesthetic-Usability Effect", "u": "https://www.nngroup.com/articles/aesthetic-usability-effect/"}, {"t": "Kurosu & Kashimura (1995): Apparent Usability vs. Inherent Usability", "u": "https://chi1995.chistatic.hosting.acm.org/proceedings/shortppr/mk_bdy.htm"}], "model": {"da": ["To pengeautomater (forsøget fra 1995 brugte også pengeautomater, dér 26 skærmlayout med de samme taster) har de samme taster, den samme skærm og den samme fejl: OK-tasten sidder langt fra tastaturet, oppe i hjørnet. A er rodet. Grebet rydder op i B: tasterne flugter og får samme størrelse og tone, og skærmen kommer på plads. Ingen tast flyttes til et bedre sted.", "To penne løser den samme opgave i takt: fire cifre og så den lange vej op til OK. Arbejdet er det samme på begge maskiner.", "Tavlen viser A ved siden af B. Den forventede brugbarhed før brug følger grebet; den sammenhæng er fundet både i Japan og i Israel. Den målte brugbarhed flytter sig ikke, fordi funktion og fejl er de samme. Det er modellens antagelse, og ét forsøg fandt faktisk, at opgaverne blev løst hurtigere på den pæne udgave.", "Vurderingen efter brug er tegnet som et stiplet interval, fordi forsøgene er uenige: i ét ændrede udseendet ikke vurderingen, i et andet blev den pæne udgave vurderet som mere brugbar. Højderne er skematiske og modellens egne, ikke data."], "en": ["Two cash machines (the 1995 experiment also used cash machines, there 26 screen layouts with the same keys) have the same keys, the same screen and the same fault: the OK key sits far from the keypad, up in the corner. A is untidy. The handle tidies B: its keys line up and take one size and one tone, and the screen straightens. No key moves to a better place.", "Two pens do the same task in step: four digits, then the long way up to OK. The work is the same on both machines.", "The board shows A beside B. Expected usability before use follows the handle; that link has been found in both Japan and Israel. Measured usability does not move, because function and faults are the same. That is the model’s assumption, and one experiment did find that tasks were completed faster on the attractive version.", "The rating after use is drawn as a dashed range, because the experiments disagree: in one, looks did not change the rating; in another, the attractive version was rated more usable. The heights are schematic and the model’s own, not data."]}, "type": "illustration", "ev3": ["finding", "mixed", "direct"], "predict": {"q": {"da": "B bliver ryddelig, men OK-tasten sidder stadig langt væk. Hvad sker der med den målte brugbarhed i modellen?", "en": "B is tidied, but the OK key is still far away. What happens to the measured usability in the model?"}, "opts": [{"da": "Den stiger, fordi B ser bedre ud", "en": "It rises, because B looks better"}, {"da": "Den er den samme, fordi opgaven og fejlen er de samme", "en": "It stays the same, because the task and the fault are the same"}, {"da": "Den falder", "en": "It drops"}], "a": 1, "why": {"da": "Udseendet flytter forventningen før brug. Modellen antager, at den målte brugbarhed er den samme; ét forsøg fandt dog, at opgaverne blev løst hurtigere på den pæne udgave.", "en": "Looks move the expectation before use. The model assumes measured usability stays the same; one experiment did find tasks were solved faster on the attractive version."}}, "shows": {"da": "At udseendet påvirker, hvor brugbart noget forventes at være, før det bliver brugt.", "en": "That looks affect how usable something is expected to be before it is used."}, "notShows": {"da": "Hvor meget. Målerne er skematiske, og hvad udseendet betyder efter brug, er forsøgene uenige om.", "en": "How much. The gauges are schematic, and the experiments disagree on what looks mean after use."}, "counter": {"da": "Pynt flytter ikke en dårligt placeret knap. Her er B ryddelig, men OK-tasten sidder lige langt væk.", "en": "Polish does not move a badly placed button. Here B is tidy, but the OK key is just as far away."}, "counterSet": 100, "related": [["cognitive-bias", {"da": "Førstehåndsindtrykket er en skævhed i bedømmelsen", "en": "The first impression is a bias in judgement"}], ["peak-end", {"da": "Også en regel om, hvordan oplevelser vurderes", "en": "Also a rule about how experiences are judged"}]], "answerSet": 100, "loops": true}, {"id": "selective-attention", "no": "07", "g": 1, "name": {"da": "Selektiv opmærksomhed", "en": "Selective Attention"}, "orig": "Selective Attention", "def": {"da": "Vi lægger kun mærke til en lille del af det, vi ser og hører, som regel det, der hænger sammen med det, vi er i gang med. Resten kan gå helt forbi os.", "en": "We notice only a small part of what we see and hear, usually what relates to what we are doing. The rest can pass us by entirely."}, "design": {"da": ["Brugere, der løser en opgave, overser ofte ting, der ikke hører til opgaven, fx bannere og beskeder i et hjørne.", "Læg vigtige beskeder der, hvor opmærksomheden allerede er, fx ved den knap, brugeren lige har trykket på."], "en": ["Users solving a task often overlook things outside the task, such as banners and messages in a corner.", "Put important messages where attention already is, for example next to the button the user has just pressed."]}, "ev": "robust", "evWhy": {"da": "Blandt de bedst underbyggede fund i kognitiv psykologi, fra forsøg med en indtalt tekst i hvert øre (1953) til forsøg, hvor folk overser en gorilla midt i billedet (1999). Et kendt eksempel i UX er bannerblindhed.", "en": "Among the best established findings in cognitive psychology, from experiments with a different recorded message in each ear (1953) to experiments where people miss a gorilla in the middle of the scene (1999). A well-known example in UX is banner blindness."}, "origin": ["Cherry, E. C. (1953). Some experiments on the recognition of speech, with one and with two ears. <i>Journal of the Acoustical Society of America</i>, 25(5), 975–979.", "Simons, D. J. &amp; Chabris, C. F. (1999). Gorillas in our midst. <i>Perception</i>, 28(9), 1059–1074."], "links": [{"t": "Tunnel Vision and Selective Attention", "u": "https://www.nngroup.com/articles/tunnel-vision-and-selective-attention/"}, {"t": "Cherry (1953): Some Experiments on the Recognition of Speech, with One and with Two Ears", "u": "https://jontalle.web.engr.illinois.edu/Public/CherrySpeech2Ears53.pdf"}], "model": {"da": ["Klodserne kører på et bånd. Opgaven er at tælle terningerne: fokus tager én terning ad gangen og følger den til tællestregen, hvor tælleren går op. De flade fliser skal ikke tælles.", "Ind imellem kører en høj, mørk klods forbi. Enten fanger opmærksomheden den, og fokus forlader opgaven et øjeblik, eller også kører den forbi uset. Hver passage bliver et mærke på tavlen: udfyldt er set, hult er overset.", "Grebet styrer, hvor mange af hver seks klodser der skal tælles. Jo mere der er at tælle, jo travlere er fokus, og jo oftere bliver den høje klods overset.", "Chancen for at se den høje klods er modellens og står i tavlens højre kolonne. I Simons og Chabris’ forsøg fra 1999 overså 46 % den uventede hændelse (en gorilla eller en kvinde med paraply); gorillaen alene blev overset af 56 %. Når tælleopgaven var sværere, med to optællinger i stedet for én, overså 55 % den, mod 36 % ved den lette. I modellen er det mængden at tælle, der gør opgaven sværere."], "en": ["The blocks ride a belt. The task is to count the cubes: the focus takes one cube at a time and follows it to the counting line, where the counter goes up. The flat tiles are not counted.", "Now and then a tall, dark block passes. Either attention catches it, and the focus leaves the task for a moment, or it passes unseen. Each pass becomes a mark on the board: filled is noticed, hollow is missed.", "The handle sets how many of every six blocks are to be counted. The more there is to count, the busier the focus, and the more often the tall block is missed.", "The chance of noticing the tall block is the model’s and stands in the board’s right-hand column. In Simons and Chabris’s 1999 experiments, 46 % missed the unexpected event (a gorilla or a woman with an umbrella); the gorilla alone was missed by 56 %. When the counting task was harder, with two separate counts instead of one, 55 % missed it, against 36 % on the easy task. In the model it is the amount to count that makes the task harder."]}, "type": "simulation", "ev3": ["finding", "solid", "caveat"], "predict": {"q": {"da": "Der kommer flere terninger at tælle. Hvad sker der med chancen for at se den høje klods?", "en": "There are more cubes to count. What happens to the chance of noticing the tall block?"}, "opts": [{"da": "Den stiger, fordi man kigger mere", "en": "It rises, because you look more"}, {"da": "Den falder", "en": "It drops"}, {"da": "Den er den samme", "en": "It stays the same"}], "a": 1, "why": {"da": "Jo travlere opmærksomheden er med opgaven, jo oftere går det uventede forbi. I Simons og Chabris’ forsøg overså flere den uventede hændelse, når tælleopgaven var sværere.", "en": "The more the task occupies attention, the more often the unexpected goes by. In Simons and Chabris’s experiment, more people missed the unexpected event when the counting task was harder."}}, "shows": {"da": "At en travl opmærksomhed oftere overser det, der ikke hører til opgaven.", "en": "That busy attention more often misses what is not part of the task."}, "notShows": {"da": "Præcise tal for mennesker; chancerne er modellens. Effekten svækkes også, når man ved, hvad der kommer.", "en": "Exact figures for people; the chances are the model’s. The effect also weakens when you know what is coming."}, "counter": {"da": "Læg ikke en vigtig advarsel uden for det, brugeren er i gang med. Her er opgaven travl, og den høje klods bliver oftest overset.", "en": "Do not put an important warning outside what the user is doing. Here the task is busy, and the tall block is missed most of the time."}, "counterSet": 5, "related": [["von-restorff", {"da": "Det, der skiller sig ud, huskes bedre", "en": "What stands out is remembered better"}], ["cognitive-load", {"da": "En travl opgave tager plads", "en": "A busy task takes up room"}]], "answerSet": 5, "loops": true}, {"id": "cognitive-load", "no": "08", "g": 1, "name": {"da": "Kognitiv belastning", "en": "Cognitive Load"}, "orig": "Cognitive Load", "def": {"da": "Hvor meget tankearbejde noget kræver. Arbejdshukommelsen har begrænset plads, og alt det, interfacet selv kræver, tager af den plads, opgaven skulle have haft.", "en": "How much thinking something demands. Working memory has limited room, and everything the interface itself demands takes room the task should have had."}, "design": {"da": ["Fjern alt, der kræver opmærksomhed uden at hjælpe opgaven.", "Lad systemet huske for brugeren: genbrug oplysninger, og vis valgmuligheder i stedet for at kræve, at de huskes."], "en": ["Remove everything that demands attention without helping the task.", "Let the system remember for the user: reuse information, and show options instead of requiring them to be remembered."]}, "ev": "robust", "evWhy": {"da": "Det er velunderbygget, at en begrænset arbejdshukommelse gør ekstra mentale krav dyre i tid og fejl. Swellers teori om kognitiv belastning er derimod kritiseret: dens opdeling i typer af belastning og måden at måle dem på er svære at teste.", "en": "It is well supported that a limited working memory makes extra mental demands costly in time and errors. Sweller’s cognitive load theory, however, is criticised: its split into types of load and the way they are measured are hard to test."}, "origin": ["Sweller, J. (1988). Cognitive load during problem solving: Effects on learning. <i>Cognitive Science</i>, 12(2), 257–285.", "de Jong, T. (2010). Cognitive load theory, educational research, and instructional design. <i>Instructional Science</i>, 38(2), 105–134."], "links": [{"t": "Minimize Cognitive Load to Maximize Usability", "u": "https://www.nngroup.com/articles/minimize-cognitive-load/"}, {"t": "de Jong (2010): Cognitive load theory … some food for thought", "u": "https://ris.utwente.nl/ws/files/6597420/Jong10cognitive.pdf"}], "model": {"da": ["Arbejdshukommelsen er en beholder med otte pladser. To slags klodser skal derind: opgavens egne, som er i fokus, og de ekstra, som interfacet kræver.", "Interfacets klodser kan ikke afvises; de følger med, når man bruger det. Det, opgaven stadig mangler, når beholderen er fuld, falder ud over kanten og lander på bakken med det tabte.", "Grebet styrer, hvor mange klodser interfacet kræver. I modellen koster de først noget, når beholderen er fuld; derfra koster hver ekstra klods opgaven en klods. I virkeligheden koster ekstra krav også tid, før grænsen er nået.", "Otte pladser og seks klodser er abstrakte tal, modellens egne: arbejdshukommelse kan ikke måles i klodser. Otte er ikke et bud på kapaciteten; forskningen finder omkring fire enheder, når man ikke kan gentage eller gruppere. Teorien om kognitiv belastning deler belastningen op i flere typer; modellen nøjes med to, opgavens og interfacets."], "en": ["Working memory is a container with eight places. Two kinds of blocks have to go in: the task’s own, which are in focus, and the extra ones the interface demands.", "The interface’s blocks cannot be refused; they come with using it. Whatever the task still needs when the container is full falls out over the rim and lands on the tray of what was dropped.", "The handle sets how many blocks the interface demands. In the model they cost nothing until the container is full; from then on, each extra block costs the task a block. In reality extra demands also cost time before the limit is reached.", "Eight places and six blocks are abstract numbers, the model’s own: working memory cannot be measured in blocks. Eight is not an estimate of capacity; research finds about four units when rehearsal and grouping are prevented. Cognitive load theory splits load into several types; the model makes do with two, the task’s and the interface’s."]}, "type": "illustration", "ev3": ["finding", "mixed", "caveat"], "predict": {"q": {"da": "Interfacet kræver flere ting af hukommelsen. Hvad sker der med opgaven?", "en": "The interface asks more of memory. What happens to the task?"}, "opts": [{"da": "Ingenting; interfacet har sin egen plads", "en": "Nothing; the interface has its own room"}, {"da": "Opgaven mister pladser, når beholderen er fuld", "en": "The task loses places once the container is full"}, {"da": "Opgaven får mere plads", "en": "The task gets more room"}], "a": 1, "why": {"da": "Det, interfacet kræver, tager af den plads, opgaven skulle have haft. I modellen koster det først noget, når beholderen er fuld; i virkeligheden koster ekstra krav også tid før det.", "en": "What the interface demands takes room the task should have had. In the model it only costs once the container is full; in reality extra demands also cost time before that."}}, "shows": {"da": "At det, interfacet kræver, konkurrerer med opgaven om den samme begrænsede plads.", "en": "That what the interface demands competes with the task for the same limited room."}, "notShows": {"da": "Den virkelige kapacitet. Beholderen er en forenklet metafor, og otte pladser er modellens tal; forskningen finder omkring fire enheder.", "en": "The real capacity. The container is a simplified metaphor, and eight places is the model’s number; research finds about four units."}, "counter": {"da": "Belastning er ikke et argument for at skjule det, opgaven har brug for. Så skal brugeren huske det selv, og det belaster mere.", "en": "Load is no argument for hiding what the task needs. Then users must remember it themselves, which adds to the load."}, "counterSet": null, "related": [["working-memory", {"da": "Den begrænsede plads, belastningen tager af", "en": "The limited room the load takes from"}], ["chunking", {"da": "Færre enheder at holde", "en": "Fewer units to hold"}]], "answerSet": 8, "loops": true}, {"id": "hick", "no": "09", "g": 1, "name": {"da": "Hicks lov", "en": "Hick’s Law"}, "orig": "Hick’s Law (Hick-Hyman)", "def": {"da": "Tiden, det tager at vælge, vokser med antallet af lige sandsynlige valgmuligheder, men langsommere end antallet: med logaritmen af det.", "en": "The time it takes to choose grows with the number of equally likely options, but more slowly than the number: with its logarithm."}, "design": {"da": ["Når brugeren kender mulighederne, koster en ekstra mulighed kun lidt tid. Del derfor ikke et kendt valg op i flere trin bare for at vise færre muligheder ad gangen; hvert trin har sin egen grundtid.", "Loven gælder for valg mellem kendte, godt indøvede muligheder. Er de ikke lige sandsynlige, følger tiden informationsmængden, så hyppige valg går hurtigere. Når man leder efter noget i en ukendt liste, vokser tiden nogenlunde i takt med listens længde."], "en": ["When users know the options, one more option costs little time. So do not split a familiar choice into several steps just to show fewer options at a time; every step adds its own base time.", "The law holds for choices between known, well-practised options. When they are not equally likely, time follows the information involved, so frequent choices are faster. When searching an unfamiliar list, time grows roughly in step with the length of the list."]}, "ev": "measured", "evWhy": {"da": "En af de få kvantitative love i psykologien, gentaget mange gange for kendte, lige sandsynlige og godt indøvede valg. Den bliver ofte brugt forkert i UX: den taler snarere imod, at færre valg altid er bedre, fordi tiden vokser langsommere end antallet; og når man leder i en ukendt liste, vokser tiden nogenlunde i takt med listens længde.", "en": "One of the few quantitative laws in psychology, replicated many times for known, equally likely and well practised choices. It is often misused in UX: it speaks against rather than for “fewer is always better”, because time grows more slowly than the number of options; and when searching an unfamiliar list, time grows roughly in step with its length."}, "origin": ["Hick, W. E. (1952). On the rate of gain of information. <i>Quarterly Journal of Experimental Psychology</i>, 4(1), 11–26.", "Hyman, R. (1953). Stimulus information as a determinant of reaction time. <i>Journal of Experimental Psychology</i>, 45(3), 188–196.", "Liu, W., Gori, J., Rioul, O., Beaudouin-Lafon, M. &amp; Guiard, Y. (2020). How relevant is Hick’s law for HCI? <i>CHI 2020</i>."], "links": [{"t": "Hick’s Law: Designing Long Menu Lists (video)", "u": "https://www.nngroup.com/videos/hicks-law-long-menus/"}, {"t": "Hick’s law (Wikipedia)", "u": "https://en.wikipedia.org/wiki/Hick%27s_law"}], "model": {"da": ["Et panel med n lamper, hver med sin knap foran. En lampe tænder, valgt tilfældigt; alle er lige sandsynlige og kendte. Pennen venter, mens valget træffes, og flytter sig så til knappen og trykker.", "Reaktionstiden måles fra det øjeblik, lampen tænder, til pennen begynder at bevæge sig. Imens stiger en streg i grafen ved n; når pennen flytter sig, stopper stregen og efterlader et punkt. Selve bevægelsen hører under Fitts’ lov og tælles ikke med.", "Grebet styrer antallet af lamper. Kurven tegnes først, når punkterne viser den, og den flader ud: at gå fra 1 til 3 lamper koster lige så meget tid som at gå fra 3 til 7. Den nederste skala viser informationen, log₂(n + 1), i bit; hver ekstra bit kræver, at n + 1 fordobles, og lægger det samme til tiden.", "Konstanterne er modellens: a = 0,2 s og b = 0,15 s pr. bit. Formen log₂(n + 1) gælder for kendte, lige sandsynlige og godt indøvede valg; er valgene ikke lige sandsynlige, følger tiden informationen i bit. Når man leder efter noget i en ukendt liste, vokser tiden nogenlunde i takt med listens længde."], "en": ["A panel of n lamps, each with its button in front. One lamp lights, chosen at random; all are equally likely and known. The stylus waits while the choice is made, then moves to the button and presses it.", "The reaction time is measured from the moment the lamp lights until the stylus starts to move. Meanwhile a line rises on the graph at n; when the stylus sets off, the line stops and leaves a point. The movement itself belongs to Fitts’s law and is not counted.", "The handle sets the number of lamps. The curve is drawn only when the points show it, and it flattens: going from 1 to 3 lamps costs as much time as going from 3 to 7. The lower scale shows the information, log₂(n + 1), in bits; each extra bit needs n + 1 to double, and adds the same to the time.", "The constants are the model’s: a = 0.2 s and b = 0.15 s per bit. The form log₂(n + 1) holds for known, equally likely, well-practised choices; when they are not equally likely, time follows the information in bits. When searching for something in an unfamiliar list, time grows roughly in step with the length of the list."]}, "type": "simulation", "ev3": ["law", "solid", "caveat"], "predict": {"q": {"da": "At gå fra 1 til 3 lamper koster lidt tid. Hvad koster det at gå fra 3 til 7?", "en": "Going from 1 to 3 lamps costs a little time. What does going from 3 to 7 cost?"}, "opts": [{"da": "Omtrent det samme", "en": "About the same"}, {"da": "Dobbelt så meget", "en": "Twice as much"}, {"da": "Fire gange så meget", "en": "Four times as much"}], "a": 0, "why": {"da": "Tiden følger log₂(n + 1): hver gang n + 1 fordobles, lægges det samme til. Fra 1 til 3 går n + 1 fra 2 til 4, fra 3 til 7 fra 4 til 8: begge gange en fordobling.", "en": "Time follows log₂(n + 1): each doubling of n + 1 adds the same. From 1 to 3, n + 1 goes from 2 to 4; from 3 to 7, from 4 to 8: a doubling both times."}}, "shows": {"da": "At valgtiden vokser langsommere end antallet af kendte, lige sandsynlige muligheder.", "en": "That choice time grows more slowly than the number of known, equally likely options."}, "notShows": {"da": "At lede i en ukendt liste; dér vokser tiden nogenlunde med længden. Tiderne er beregnet af modellen, ikke målt.", "en": "Searching an unfamiliar list; there time grows roughly with length. The times are computed by the model, not measured."}, "counter": {"da": "Del ikke et kendt valg op i flere trin for at vise færre muligheder ad gangen. Hvert trin har sin egen grundtid.", "en": "Do not split a familiar choice into more steps to show fewer options at a time. Each step has its own base time."}, "counterSet": null, "related": [["choice-overload", {"da": "Når mange valg bliver en byrde", "en": "When many options become a burden"}], ["fitts", {"da": "Bevægelsen efter valget", "en": "The movement after the choice"}]], "answerSet": 7, "loops": true}, {"id": "choice-overload", "no": "10", "g": 1, "name": {"da
