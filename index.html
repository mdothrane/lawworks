": "For mange valg", "en": "Choice Overload"}, "orig": "Choice Overload", "def": {"da": "Mange valgmuligheder kan i nogle situationer gøre det sværere at vælge og mindre tilfredsstillende at have valgt.", "en": "In some situations, many options can make it harder to choose and less satisfying to have chosen."}, "design": {"da": ["Når mange muligheder er nødvendige, så hjælp med filtre, sortering og et fornuftigt standardvalg.", "Skær ikke blindt ned. Effekten afhænger af, hvor svært valget er, og hvor godt folk kender området."], "en": ["When many options are needed, help with filters, sorting and a sensible default.", "Do not cut blindly. The effect depends on how hard the choice is and how well people know the domain."]}, "ev": "contested", "evWhy": {"da": "Det kendte forsøg med syltetøj fra 2000 er ikke blevet bekræftet konsekvent. En metaanalyse af 50 forsøg fra 2010 fandt en gennemsnitlig effekt tæt på nul. En senere metaanalyse fra 2015 fandt effekten under bestemte forhold: et komplekst udvalg, en svær beslutningsopgave, usikre præferencer og et ønske om at bruge mindst mulig energi.", "en": "The well-known jam experiment from 2000 has not been confirmed consistently. A 2010 meta-analysis of 50 experiments found a mean effect close to zero. A later meta-analysis from 2015 found the effect under specific conditions: complex choice sets, hard decisions, uncertain preferences and a wish to spend as little effort as possible."}, "origin": ["Iyengar, S. S. &amp; Lepper, M. R. (2000). When choice is demotivating. <i>Journal of Personality and Social Psychology</i>, 79(6), 995–1006.", "Scheibehenne, B., Greifeneder, R. &amp; Todd, P. M. (2010). Can there ever be too many options? <i>Journal of Consumer Research</i>, 37(3), 409–425.", "Chernev, A., Böckenholt, U. &amp; Goodman, J. (2015). Choice overload: A conceptual review and meta-analysis. <i>Journal of Consumer Psychology</i>, 25(2), 333–358."], "links": [{"t": "Scheibehenne m.fl. / et al. (2010): Can There Ever Be Too Many Options?", "u": "https://abcwest.cogs.indiana.edu/pmwiki/pdf/scheibehenne.options.2010.pdf"}, {"t": "Iyengar & Lepper (2000): When Choice is Demotivating", "u": "https://faculty.washington.edu/jdb/345/345%20Articles/Iyengar%20&%20Lepper%20(2000).pdf"}], "model": {"da": ["Hylden har et antal varianter. Fokus sammenligner dem én ad gangen og tager så den bedste.", "De to målere viser begge sider. Chancen for, at der står et godt match på hylden, stiger med antallet, men mindre og mindre. Tiden til at sammenligne vokser med hver variant.", "Tavlen viser nettoen, gevinst minus omkostning, i forhold til en hylde med to varianter. Den er tegnet som et stiplet bånd og ikke som en linje, fordi det afhænger af forholdene, hvor tungt sammenligningen vejer. I modellen bliver flere varianter ved med at være en fordel ved et let valg med klare ønsker; ved et svært valg med uklare ønsker vender det. Stregen ved det valgte antal viser spændet.", "Alle tal er modellens. Forskningen er uenig om, hvor stor ulempen er. En metaanalyse af 50 forsøg fandt en gennemsnitlig effekt tæt på nul; en senere fandt, at effekten afhænger af forholdene og vokser med et komplekst udvalg, en svær beslutning, usikre præferencer og et ønske om at spare kræfter."], "en": ["The shelf holds a number of variants. The focus compares them one at a time and then takes the best one.", "The two gauges show both sides. The chance that a good match is on the shelf rises with the number, but less and less. The time spent comparing grows with every variant.", "The board shows the net, gain minus cost, compared with a shelf of two variants. It is drawn as a dashed band, not a line, because how heavily comparing weighs depends on the conditions. In the model, more variants stay an advantage with an easy choice and clear wants; with a hard choice and unclear wants, it turns. The line at the chosen number shows the range.", "All numbers are the model’s. The research disagrees about how large the cost is. A meta-analysis of 50 experiments found a mean effect close to zero; a later one found that the effect depends on the conditions and grows with a complex choice set, a hard decision, uncertain preferences and a wish to save effort."]}, "type": "simulation", "ev3": ["finding", "contested", "caveat"], "predict": {"q": {"da": "Flere varianter på hylden. Bliver valget bedre eller dårligere?", "en": "More variants on the shelf. Does the choice get better or worse?"}, "opts": [{"da": "Altid bedre", "en": "Always better"}, {"da": "Altid dårligere", "en": "Always worse"}, {"da": "Det afhænger af, hvor svært valget er", "en": "It depends on how hard the choice is"}], "a": 2, "why": {"da": "Flere varianter giver større chance for et godt match, men også mere at sammenligne. Ved et let valg med klare ønsker vejer gevinsten tungest; ved et svært valg kan det vende.", "en": "More variants raise the chance of a good match but also add comparing. With an easy choice and clear wishes the gain weighs most; with a hard choice it can turn."}}, "shows": {"da": "At flere muligheder både giver et bedre match og mere at sammenligne.", "en": "That more options give both a better match and more comparing."}, "notShows": {"da": "Én grænse for, hvornår det er for mange. Forskningen er uenig om, hvor stor ulempen er, og antallet alene beskriver ikke, hvor svært valget er.", "en": "A single cut-off for “too many”. Research disagrees on how large the downside is, and the number alone does not describe how hard the choice is."}, "counter": {"da": "Skær ikke ned, når folk ved, hvad de leder efter. Her er der 30 varianter, og ved et let valg med klare ønsker er det stadig en fordel.", "en": "Do not cut back when people know what they are looking for. Here there are 30 variants, and with an easy choice and clear wishes that is still an advantage."}, "counterSet": 30, "related": [["hick", {"da": "Tiden for et valg mellem kendte muligheder", "en": "The time for a choice between known options"}], ["cognitive-bias", {"da": "Standardvalg påvirker, hvad der vælges", "en": "Defaults affect what is chosen"}]], "answerSet": 30, "loops": true}, {"id": "cognitive-bias", "no": "11", "g": 1, "name": {"da": "Kognitive bias", "en": "Cognitive Bias"}, "orig": "Cognitive Bias", "def": {"da": "Systematiske skævheder i den måde, vi bedømmer og beslutter på. Hurtige tommelfingerregler virker det meste af tiden, men fejler på forudsigelige måder.", "en": "Systematic distortions in how we judge and decide. Quick rules of thumb work most of the time, but fail in predictable ways."}, "design": {"da": ["Standardvalg, rækkefølge og formulering påvirker beslutninger. Brug det til brugerens fordel, aldrig imod.", "Tjek din egen fortolkning af research for skævheder: led også efter det, der modsiger dig."], "en": ["Defaults, order and wording affect decisions. Use them in the user’s favour, never against.", "Check your own reading of research for bias: look for what contradicts you as well."]}, "ev": "robust", "evWhy": {"da": "»Kognitiv bias« er en samlebetegnelse, så evidensen afhænger af den enkelte skævhed. I et stort gentagelsesprojekt (Many Labs, 2014) med 36 forsøgsgrupper blev 10 af 13 kendte psykologiske effekter bekræftet, blandt andet forankring og framing.", "en": "“Cognitive bias” is an umbrella term, so the evidence depends on the particular bias. In a large replication project (Many Labs, 2014) across 36 samples, 10 of 13 well-known psychological effects replicated, among them anchoring and framing."}, "origin": ["Tversky, A. &amp; Kahneman, D. (1974). Judgment under uncertainty: Heuristics and biases. <i>Science</i>, 185(4157), 1124–1131.", "Klein, R. A. m.fl./et al. (2014). Investigating variation in replicability: A “Many Labs” replication project. <i>Social Psychology</i>, 45(3), 142–152."], "links": [{"t": "Tversky & Kahneman: Judgment Under Uncertainty (rapport/report 1973)", "u": "https://apps.dtic.mil/sti/pdfs/AD0767426.pdf"}, {"t": "Decision Frames: How Cognitive Biases Affect UX Practitioners", "u": "https://www.nngroup.com/articles/decision-framing-cognitive-bias-ux-pros/"}], "model": {"da": ["En figur skal skønne, hvor mange klodser der ligger i bunken. Ved siden af står et tal på et skilt, og det har intet med bunken at gøre. Figuren skal først sige, om der er flere eller færre klodser end tallet; så kigger den på bunken og skriver sit skøn på sin tavle.", "Skønnet trækkes et stykke mod tallet. Hvert skøn bliver et punkt i grafen: den vandrette linje er det rigtige antal, den stiplede diagonal er et skøn, der er lig med tallet. Punkterne lægger sig mellem de to, og når der er nok af dem, tegnes linjen gennem dem.", "Grebet styrer tallet. Et højt tal giver et højt skøn og et lavt tal et lavt skøn, selv om bunken er den samme.", "Det kaldes forankring og er en af de bedst undersøgte skævheder; den blev bekræftet i det store gentagelsesprojekt Many Labs fra 2014, hvor folk først sammenlignede med tallet. Et tal, man blot ser i forbifarten, har ikke flyttet skønnet i nyere gentagelser. Hvor langt skønnet trækkes, her 40 % af vejen, og hvor meget skønnene spreder sig, er modellens tal; i forsøgene varierer trækket."], "en": ["A figure has to estimate how many blocks lie in the pile. Beside it stands a number on a sign, and it has nothing to do with the pile. The figure must first say whether there are more or fewer blocks than the number; then it looks at the pile and writes its estimate on its board.", "The estimate is pulled part of the way towards the number. Each estimate becomes a point on the graph: the horizontal line is the true count, the dashed diagonal is an estimate equal to the number. The points settle between the two, and once there are enough of them, the line through them is drawn.", "The handle sets the number. A high number gives a high estimate and a low number a low one, though the pile stays the same.", "This is called anchoring, one of the best-studied biases; it replicated in the large Many Labs project from 2014, where people first compared with the number. A number merely seen in passing has not moved estimates in recent replications. How far the estimate is pulled, here 40 % of the way, and how much it scatters are the model’s numbers; in experiments the pull varies."]}, "type": "simulation", "ev3": ["concept", "mixed", "caveat"], "predict": {"q": {"da": "Figuren skal først sige, om der er flere eller færre klodser end tallet på skiltet. Tallet har intet med bunken at gøre. Påvirker det skønnet?", "en": "The figure must first say whether there are more or fewer blocks than the number on the sign. The number has nothing to do with the pile. Does it affect the estimate?"}, "opts": [{"da": "Nej, figuren kan jo se bunken", "en": "No, the figure can see the pile"}, {"da": "Ja, skønnet trækkes mod tallet", "en": "Yes, the estimate is pulled towards the number"}, {"da": "Kun hvis tallet er lavt", "en": "Only if the number is low"}], "a": 1, "why": {"da": "Det kaldes forankring. Når man har sammenlignet med tallet, trækker det skønnet, også når tallet tydeligvis er tilfældigt. Et tal, man blot ser i forbifarten, har ikke flyttet skønnet i nyere gentagelser.", "en": "This is anchoring. Once you have compared with the number, it pulls the estimate, even when the number is clearly random. A number merely seen in passing has not moved estimates in recent replications."}}, "shows": {"da": "Forankring, ét eksempel på en kognitiv bias.", "en": "Anchoring, one example of a cognitive bias."}, "notShows": {"da": "Alle skævheder. Kognitiv bias er en samlebetegnelse, og hvor langt et skøn trækkes, varierer i forsøgene; her er det 40 %.", "en": "All biases. Cognitive bias is an umbrella term, and how far an estimate is pulled varies between experiments; here it is 40%."}, "counter": {"da": "Brug ikke forankring imod brugeren, fx en høj »førpris« ved siden af tilbuddet. Her trækker et højt tal skønnet op.", "en": "Do not use anchoring against users, such as a high “was” price next to the offer. Here a high number pulls the estimate up."}, "counterSet": 100, "related": [["peak-end", {"da": "Hukommelsen er også skæv", "en": "Memory is biased too"}], ["aesthetic-usability", {"da": "Udseendet farver bedømmelsen", "en": "Looks colour the judgement"}]], "answerSet": 100, "loops": true}, {"id": "occam", "no": "12", "g": 1, "name": {"da": "Occams ragekniv", "en": "Occam’s Razor"}, "orig": "Occam’s Razor", "def": {"da": "Hvis to forklaringer passer lige godt med det, vi ved, så foretræk den, der kræver færrest ekstra antagelser. I design: når to løsninger løser opgaven lige godt, så vælg den enkleste.", "en": "If two explanations fit the evidence equally well, prefer the one that needs fewer extra assumptions. In design: when two solutions do the job equally well, choose the simpler one."}, "design": {"da": ["Fjern elementer, indtil kun det nødvendige er tilbage.", "Enkelhed afgør kun mellem lige gode løsninger. Det er ikke en grund til at fjerne noget, brugeren har brug for."], "en": ["Remove elements until what remains is necessary.", "Simplicity only decides between equally good solutions. It is not a reason to remove something the user needs."]}, "ev": "heuristic", "evWhy": {"da": "Et metodisk princip om sparsommelighed, ikke et empirisk fund om brugere. Hvorfor det enkle skal foretrækkes, er stadig til debat i videnskabsfilosofien.", "en": "A methodological principle of parsimony, not an empirical finding about users. Why the simpler option should be preferred is still debated in the philosophy of science."}, "origin": ["Tilskrevet William af Ockham (ca. 1287–1347). Den kendte formulering om ikke at mangfoldiggøre ting ud over det nødvendige findes ikke i hans egne tekster. / Attributed to William of Ockham (c. 1287–1347). The famous wording about not multiplying entities beyond necessity is not found in his own texts."], "links": [{"t": "William of Ockham (Stanford Encyclopedia of Philosophy)", "u": "https://plato.stanford.edu/entries/ockham/"}, {"t": "Simplicity (Stanford Encyclopedia of Philosophy)", "u": "https://plato.stanford.edu/entries/simplicity/"}], "model": {"da": ["To maskiner leverer det samme: klodser fra en beholder, ad et bånd og ned i en spand, i samme takt. Den bageste har ekstra dele: et hjul, der drejer, et stempel, der skubber, og et rør, der fører væk. De bevæger sig, men rører intet af det, resultatet går igennem.", "Grebet fjerner delene én ad gangen fra den bageste maskine. En fjernet del står et øjeblik tilbage som en stiplet skygge. Tællerne ved spandene går op i samme takt, så de to resultater kan sammenlignes.", "Så længe det er de ekstra dele, der fjernes, ændrer resultatet sig ikke, og til sidst er de to maskiner ens. Den sidste del er båndet, og det var nødvendigt: uden det falder klodserne på gulvet, og intet når spanden.", "Barberkniven afgør kun mellem løsninger, der giver det samme. Den siger ikke, at det enkle er rigtigt, og den er ingen grund til at fjerne noget, resultatet har brug for. Det er et metodisk princip, ikke et fund om brugere."], "en": ["Two machines deliver the same thing: blocks from a dispenser, along a belt and into a bin, in step. The back one has extra parts: a wheel that turns, a piston that pushes and a pipe that leads away. They move, but they touch nothing the result passes through.", "The handle removes the parts one at a time from the back machine. A removed part stays for a moment as a dashed ghost. The counters at the bins go up in step, so the two results can be compared.", "As long as it is the extra parts that go, the result does not change, and in the end the two machines are the same. The last part is the belt, and it was needed: without it the blocks fall to the floor and nothing reaches the bin.", "The razor only decides between solutions that give the same result. It does not say that the simple one is true, and it is no reason to remove something the result needs. It is a methodological principle, not a finding about users."]}, "type": "illustration", "ev3": ["method", "untested", "analogy"], "predict": {"q": {"da": "Den bageste maskine mister sine ekstra dele én ad gangen. Hvornår ændrer resultatet sig?", "en": "The back machine loses its extra parts one at a time. When does the result change?"}, "opts": [{"da": "Med det samme", "en": "Straight away"}, {"da": "Først når en nødvendig del fjernes", "en": "Only when a necessary part is removed"}, {"da": "Aldrig", "en": "Never"}], "a": 1, "why": {"da": "Delene, der intet bidrager, kan fjernes uden at ændre resultatet. Den sidste, båndet, var nødvendig.", "en": "The parts that contribute nothing can go without changing the result. The last one, the belt, was needed."}}, "shows": {"da": "At dele, der intet bidrager til resultatet, kan fjernes.", "en": "That parts contributing nothing to the result can be removed."}, "notShows": {"da": "At enklere altid er bedre. Samme resultat betyder ikke lige let at forstå, og at sammenligne antagelser i en forklaring med dele i et interface er en analogi.", "en": "That simpler is always better. The same result does not mean equally easy to understand, and comparing assumptions in an explanation with parts of an interface is an analogy."}, "counter": {"da": "Barberkniven er ingen grund til at fjerne noget, resultatet har brug for. Her er båndet fjernet, og intet når spanden.", "en": "The razor is no reason to remove something the result needs. Here the belt is gone, and nothing reaches the bucket."}, "counterSet": 4, "related": [["tesler", {"da": "Noget kompleksitet kan ikke fjernes", "en": "Some complexity cannot be removed"}], ["praegnanz", {"da": "Øjet foretrækker også det enkle", "en": "The eye prefers the simple too"}]], "answerSet": null, "loops": true}, {"id": "working-memory", "no": "13", "g": 2, "name": {"da": "Arbejdshukommelse", "en": "Working Memory"}, "orig": "Working Memory", "def": {"da": "Den del af hukommelsen, vi tænker med lige nu. Den holder få ting ad gangen og mister dem hurtigt, hvis vi ikke gentager dem.", "en": "The part of memory we think with right now. It holds a few things at a time and loses them quickly unless we rehearse them."}, "design": {"da": ["Lad ikke brugeren huske noget fra én skærm til den næste. Vis det igen.", "Genkendelse er lettere end genkaldelse. Vis valgmulighederne i stedet for at kræve, at de huskes."], "en": ["Do not make users remember something from one screen to the next. Show it again.", "Recognition is easier than recall. Show the options instead of requiring them to be remembered."]}, "ev": "robust", "evWhy": {"da": "At arbejdshukommelsen har lille kapacitet, omkring tre til fem enheder, når man ikke kan gentage eller gruppere, er blandt de bedst underbyggede fund i kognitiv psykologi. Hvordan den er bygget op, er stadig til debat.", "en": "That working memory has a small capacity, about three to five units when rehearsal and grouping are prevented, is among the best established findings in cognitive psychology. How it is built is still debated."}, "origin": ["Baddeley, A. D. &amp; Hitch, G. (1974). Working memory. I/In G. H. Bower (red./ed.), <i>The Psychology of Learning and Motivation</i>, 8, 47–89."], "links": [{"t": "Working Memory and External Memory", "u": "https://www.nngroup.com/articles/working-memory-external-memory/"}, {"t": "Cowan (2001): The magical number 4 in short-term memory", "u": "https://memory.psych.missouri.edu/assets/doc/articles/2001/cowan-bbs-2001.pdf"}], "model": {"da": ["Opgaven kræver et antal ting på én gang. Pennen lægger dem ud som klodser på arbejdsfladen, én på hver plads, og går derefter rundt til dem igen og igen.", "En klods synker, mens den blegner. Når pennen rører den, bliver den genopfrisket af opmærksomheden og rejser sig igen. Pennen kan kun være ét sted ad gangen, så jo flere klodser, jo længere venter hver af dem.", "Grebet styrer, hvor mange ting opgaven kræver. Op til fire kan holdes i live. Ved flere er de første klodser blegnet helt, før pennen når tilbage, og når opgaven skal bruge dem, er kun omkring fire til rådighed (blå). De stiplede pladser er det, der gik tabt.", "Tallene er modellens: en klods blegner på 3,6 sekunder, og et besøg tager 0,8 sekunder. De er valgt, så grænsen lander på omkring fire, i tråd med de tre til fem enheder, forskningen finder, når man hverken kan gentage tingene for sig selv eller gruppere dem; pennens besøg står for opmærksomhed, ikke for indre gentagelse. Selve tiderne er ikke målt. Forfald og genopfriskning er modellens billede; hvordan arbejdshukommelsen er bygget op, er stadig til debat."], "en": ["The task needs a number of things at once. The stylus lays them out as blocks on the work surface, one to a place, and then goes round them again and again.", "A block sinks as it fades. When the stylus touches it, attention refreshes it and it rises again. The stylus can only be in one place at a time, so the more blocks there are, the longer each one waits.", "The handle sets how many things the task needs. Up to four can be kept alive. With more, the first blocks have faded completely before the stylus gets back, and when the task needs them, only about four are available (blue). The dashed places are what was lost.", "The numbers are the model’s: a block fades in 3.6 seconds and a visit takes 0.8 seconds. They are chosen so that the limit lands at about four, in line with the three to five units research finds when rehearsal and grouping are prevented; the stylus’s visits stand for attention, not inner rehearsal. The timings themselves are not measured. Decay and refreshing are the model’s picture; how working memory is built is still debated."]}, "type": "simulation", "ev3": ["finding", "solid", "caveat"], "predict": {"q": {"da": "Opgaven kræver otte ting på én gang, og de kan hverken gentages eller grupperes. Hvor mange kan holdes i live?", "en": "The task needs eight things at once, and they can be neither rehearsed nor grouped. How many can be kept alive?"}, "opts": [{"da": "Alle otte", "en": "All eight"}, {"da": "Omkring fire", "en": "About four"}, {"da": "Omkring syv", "en": "About seven"}], "a": 1, "why": {"da": "Uden gentagelse og gruppering finder forskningen omkring tre til fem enheder.", "en": "Without rehearsal and grouping, research finds about three to five units."}}, "shows": {"da": "At kun få ting kan holdes i live på én gang, når de hverken kan gentages eller grupperes.", "en": "That only a few things can be kept alive at once when they can be neither rehearsed nor grouped."}, "notShows": {"da": "Hvordan arbejdshukommelsen er bygget op. Om ting glemmes, fordi tiden går, eller fordi andet forstyrrer, er omstridt, og den bruges også til at bearbejde, ikke kun til at holde.", "en": "How working memory is built. Whether things are forgotten because time passes or because something else interferes is disputed, and it is also used to process, not only to hold."}, "counter": {"da": "Grænsen er ingen grænse for, hvor meget en skærm må vise. Det, der står på skærmen, skal netop ikke holdes i hovedet.", "en": "The limit is no limit on how much a screen may show. What is on the screen is exactly what need not be held in mind."}, "counterSet": null, "related": [["miller", {"da": "Tallet syv, og hvorfor det blev fire", "en": "The number seven, and why it became four"}], ["chunking", {"da": "Hvordan grupper giver plads til mere", "en": "How groups make room for more"}]], "answerSet": 8, "loops": true}, {"id": "miller", "no": "14", "g": 2, "name": {"da": "Millers lov", "en": "Miller’s Law"}, "orig": "Miller’s Law", "def": {"da": "George Miller beskrev i 1956, at vi kan holde omkring syv, plus eller minus to, enheder i korttidshukommelsen. Nyere forskning peger snarere på omkring fire meningsfulde enheder.", "en": "In 1956 George Miller reported that we can hold about seven, plus or minus two, units in short-term memory. Later research points rather to about four meaningful units."}, "design": {"da": ["Brug ikke »7 ± 2« som regel for, hvor mange punkter en menu må have. En menu bliver læst, den skal ikke huskes.", "Det brugbare i Millers artikel er chunking: gruppér information, så der er færre enheder at holde."], "en": ["Do not use “7 ± 2” as a rule for how many items a menu may have. A menu is read; it does not have to be remembered.", "The useful part of Miller’s paper is chunking: group information so there are fewer units to hold."]}, "ev": "contested", "evWhy": {"da": "Miller mente selv, at det var et tilfælde, at tallet syv dukkede op så mange steder. Nyere forskning anslår kapaciteten til omkring fire enheder, når gentagelse og gruppering holdes ude. Reglen om højst syv punkter i en menu er en fejllæsning, fordi menuer bliver genkendt, ikke husket.", "en": "Miller himself suspected that the recurrence of seven in so many places was a coincidence. Later research estimates capacity at about four units when rehearsal and grouping are ruled out. The rule of at most seven menu items is a misreading, because menus are recognised, not recalled."}, "origin": ["Miller, G. A. (1956). The magical number seven, plus or minus two. <i>Psychological Review</i>, 63(2), 81–97.", "Cowan, N. (2001). The magical number 4 in short-term memory. <i>Behavioral and Brain Sciences</i>, 24(1), 87–114."], "links": [{"t": "Miller (1956): The Magical Number Seven, Plus or Minus Two", "u": "https://psychclassics.yorku.ca/Miller/index.htm"}, {"t": "Cowan (2001): The magical number 4 in short-term memory", "u": "https://memory.psych.missouri.edu/assets/doc/articles/2001/cowan-bbs-2001.pdf"}], "model": {"da": ["De samme cifre vises ét ad gangen i tre rækker. Bagefter holder hver række det, den kan, og cifrene ud over grænsen falder ud og efterlader en stiplet plads.", "Grebet styrer antallet af cifre, fra 3 til 12. Forreste række: når cifrene hverken kan gentages eller grupperes, fx fordi man skal sige noget andet højt imens, holder den omkring fire. Midterste række: almindelig gentagelse, omkring syv, som Miller beskrev. Bagerste række: de samme cifre i grupper af tre holder længere, her ni.", "Grænserne er modellens tilnærmelser. Spændvidden varierer fra person til person og med materialet. I et rigtigt forsøg fordeler fejlene sig over rækken; i modellen er det de sidste cifre, der falder ud.", "Tallet syv handler om at gengive en række, man lige har set eller hørt. Det betyder ikke, at en menu højst må have syv punkter: en menu skal læses, ikke huskes."], "en": ["The same digits are shown one at a time in three rows. Afterwards each row keeps what it can hold, and the digits beyond its limit drop out and leave a dashed place.", "The handle sets the number of digits, from 3 to 12. Front row: when the digits can be neither rehearsed nor grouped, for example because you have to say something else out loud meanwhile, it holds about four. Middle row: ordinary rehearsal, about seven, as Miller described. Back row: the same digits in groups of three hold longer, here nine.", "The limits are the model’s approximations. Span varies from person to person and with the material. In a real test the errors spread across the row; in the model the last digits are the ones that drop out.", "Seven is about repeating a row you have just seen or heard. It does not mean that a menu may have at most seven items: a menu is read, not remembered."]}, "type": "simulation", "ev3": ["finding", "contested", "caveat"], "predict": {"q": {"da": "Tolv cifre, og man skal sige noget andet højt imens, så de hverken kan gentages eller grupperes. Hvor mange kan man holde på?", "en": "Twelve digits while saying something else aloud, so they can be neither rehearsed nor grouped. How many can you hold?"}, "opts": [{"da": "Omkring syv", "en": "About seven"}, {"da": "Omkring fire", "en": "About four"}, {"da": "Alle tolv", "en": "All twelve"}], "a": 1, "why": {"da": "Syv gælder almindelig gentagelse. Uden gentagelse og gruppering er det omkring fire.", "en": "Seven applies with ordinary rehearsal. Without rehearsal and grouping it is about four."}}, "shows": {"da": "At tallet afhænger af betingelserne: uden gentagelse, med gentagelse og i grupper.", "en": "That the number depends on the conditions: without rehearsal, with rehearsal and in groups."}, "notShows": {"da": "Faste pladser. Tallene er omtrentlige og varierer med person, materiale og metode.", "en": "Fixed slots. The numbers are approximate and vary with person, material and method."}, "counter": {"da": "Brug ikke 7 ± 2 som grænse for menupunkter. En menu bliver læst, den skal ikke huskes.", "en": "Do not use 7 ± 2 as a limit for menu items. A menu is read, not remembered."}, "counterSet": null, "related": [["working-memory", {"da": "Kapaciteten uden gentagelse", "en": "The capacity without rehearsal"}], ["chunking", {"da": "Det brugbare i Millers artikel", "en": "The useful part of Miller’s paper"}]], "answerSet": 12, "loops": true}, {"id": "chunking", "no": "15", "g": 2, "name": {"da": "Chunking", "en": "Chunking"}, "orig": "Chunking", "def": {"da": "At samle enkeltdele til større, meningsfulde enheder. Et telefonnummer i fire par er lettere at holde end otte løse cifre.", "en": "Joining single items into larger, meaningful units. A phone number in four pairs is easier to hold than eight loose digits."}, "design": {"da": ["Del lange tal og koder i grupper, fx kortnumre og kontonumre.", "Del lange formularer og tekster i afsnit med overskrifter."], "en": ["Split long numbers and codes into groups, for example card and account numbers.", "Split long forms and texts into sections with headings."]}, "ev": "robust", "evWhy": {"da": "At samle stof i større, meningsfulde enheder øger, hvor meget vi kan holde og huske. Det beskrev Miller i 1956 ud fra Sidney Smiths forsøg med at omkode binære cifre, og Chase og Simon viste det i deres skakforsøg i 1973; selv den moderne kapacitetsgrænse tælles i enheder.", "en": "Grouping material into larger, meaningful units increases how much we can hold and recall. Miller described it in 1956, drawing on Sidney Smith’s experiment in recoding binary digits, and Chase and Simon showed it in their chess experiments in 1973; even the modern capacity limit is counted in such units."}, "origin": ["Miller, G. A. (1956). The magical number seven, plus or minus two. <i>Psychological Review</i>, 63(2), 81–97.", "Chase, W. G. &amp; Simon, H. A. (1973). Perception in chess. <i>Cognitive Psychology</i>, 4(1), 55–81."], "links": [{"t": "How Chunking Helps Content Processing", "u": "https://www.nngroup.com/articles/chunking/"}, {"t": "Miller (1956): The Magical Number Seven, Plus or Minus Two", "u": "https://psychclassics.yorku.ca/Miller/index.htm"}], "model": {"da": ["Otte cifre står på en skinne. Indholdet er det samme hele tiden; kun grupperingen skifter, og cifrene i en gruppe klikker sammen til ét stykke.", "De stiplede rammer er de enheder, hukommelsen skal holde. Hver enhed lægger en klods i beholderen til højre, så beholderen tæller enhederne. Grebet styrer gruppernes størrelse: otte løse cifre er otte enheder, par giver fire.", "Grupper på mere end tre cifre hjælper kun, hvis de betyder noget. I grupper af fire er 1989 et årstal og tæller som én enhed, mens de tilfældige 4726 stadig koster to: 47 og 26.", "Reglen er modellens forenkling: op til tre tilfældige cifre kan holdes som én enhed, længere tilfældige grupper kan ikke. I virkeligheden afhænger det af, hvad man kender i forvejen, hvad der bliver til én enhed, ligesom skakmestre husker en stilling fra et rigtigt parti i større bidder end svagere spillere, men ikke en tilfældig stilling."], "en": ["Eight digits stand on a rail. The content stays the same all the time; only the grouping changes, and the digits in a group click together into one piece.", "The dashed frames are the units memory has to hold. Each unit drops a block into the container on the right, so the container counts the units. The handle sets the size of the groups: eight loose digits are eight units, pairs make four.", "Groups of more than three digits only help if they mean something. In groups of four, 1989 is a year and counts as one unit, while the random 4726 still costs two: 47 and 26.", "The rule is the model’s simplification: up to three random digits can be held as one unit, longer random groups cannot. In reality what becomes one unit depends on what you already know, just as chess masters recall a position from a real game in bigger pieces than weaker players do, but not a random position."]}, "type": "simulation", "ev3": ["finding", "solid", "caveat"], "predict": {"q": {"da": "Otte cifre deles i grupper af fire: 1989 og 4726. Hvor mange enheder skal holdes?", "en": "Eight digits are split into groups of four: 1989 and 4726. How many units must be held?"}, "opts": [{"da": "To", "en": "Two"}, {"da": "Tre", "en": "Three"}, {"da": "Otte", "en": "Eight"}], "a": 1, "why": {"da": "1989 er et årstal og én enhed. De tilfældige 4726 koster stadig to: 47 og 26.", "en": "1989 is a year and one unit. The random 4726 still costs two: 47 and 26."}}, "shows": {"da": "At meningsfulde grupper giver færre enheder at holde.", "en": "That meaningful groups give fewer units to hold."}, "notShows": {"da": "At visuel gruppering altid skaber enheder. Små grupper hjælper, men en lang gruppe bliver kun til én enhed, hvis den betyder noget for den, der skal huske den.", "en": "That visual grouping always makes units. Small groups help, but a long group only becomes one unit if it means something to the person remembering it."}, "counter": {"da": "Lange grupper hjælper kun, hvis de betyder noget. Her står 4726 som én gruppe på fire, men koster stadig to enheder.", "en": "Long groups only help if they mean something. Here 4726 is one group of four but still costs two units."}, "counterSet": 4, "related": [["miller", {"da": "Hvor få enheder der er plads til", "en": "How few units there is room for"}], ["proximity", {"da": "Visuel gruppering, som ikke er det samme", "en": "Visual grouping, which is not the same"}]], "answerSet": 4, "loops": false}, {"id": "serial-position", "no": "16", "g": 2, "name": {"da": "Seriepositionseffekten", "en": "Serial Position Effect"}, "orig": "Serial Position Effect", "def": {"da": "Når vi skal gengive en liste med det samme, husker vi bedst de første og de sidste elementer. En udbredt forklaring er, at de første er nået at blive gentaget, og at de sidste stadig er friske.", "en": "When recalling a list straight away, we remember the first and the last items best. A common explanation is that the first have been rehearsed more and the last are still fresh."}, "design": {"da": ["Skal folk kunne huske en liste senere, fx trinene i en vejledning, så læg det vigtigste først. Fordelen for de sidste punkter forsvinder, når der går lidt tid med noget andet. I en navigation, man ser, mens man vælger, gælder effekten ikke direkte.", "Skal folk huske punkterne bagefter, er det dem midt i en lang liste, der oftest bliver glemt."], "en": ["If people must recall a list later, such as the steps in a guide, put the most important first. The advantage for the last items disappears once some time passes doing something else. In a navigation you see while choosing, the effect does not apply directly.", "If people need to remember the items afterwards, the ones in the middle of a long list are forgotten most often."]}, "ev": "robust", "evWhy": {"da": "Et gammelt og ofte gentaget fund i hukommelsesforskningen. At bruge det på interfaces, hvor punkterne bliver set og ikke husket fra en liste, er en overførsel, ikke noget forsøgene har målt direkte.", "en": "An old and often replicated finding in memory research. Applying it to interfaces, where items are seen rather than recalled from a list, is an extrapolation, not something the experiments measured directly."}, "origin": ["Murdock, B. B. (1962). The serial position effect of free recall. <i>Journal of Experimental Psychology</i>, 64(5), 482–488."], "links": [{"t": "Primacy Effect: Put Important Things First (video)", "u": "https://www.nngroup.com/videos/primacy-effect/"}, {"t": "Serial-position effect (Wikipedia)", "u": "https://en.wikipedia.org/wiki/Serial-position_effect"}], "model": {"da": ["Listen ligger med bagsiden op. Ét kort ad gangen rejser sig, viser sit ord og lægger sig igen. Lige bagefter rejser hukommelsen de kort, den har fået med (blå); de glemte ligger tilbage som omrids.", "Tavlen står lige bag rækken, så hvert kort har sin søjle: modellens chance for at huske ordet på den plads. De første og især de sidste huskes bedst. Den stiplede linje er kurven for den forrige listelængde.", "Grebet styrer listens længde, fra 5 til 20 ord. Korte lister huskes næsten hele. Jo længere listen er, jo dybere synker midten, mens begyndelsen og slutningen holder.", "Kurven er skematisk og gælder gengivelse med det samme, i den form Murdock fandt i 1962; tallene er modellens. Hvilke kort der huskes i en enkelt runde, trækkes ud fra chancerne, så runderne varierer. Ordene flytter plads fra liste til liste: det er pladsen, ikke ordet, der tæller."], "en": ["The list lies face down. One card at a time stands up, shows its word and lies down again. Straight afterwards memory stands up the cards it kept (blue); the forgotten ones stay down as outlines.", "The board stands right behind the row, so each card has its bar: the model’s chance of recalling the word in that place. The first and especially the last are recalled best. The dashed line is the curve for the previous list length.", "The handle sets the length of the list, from 5 to 20 words. Short lists are recalled almost whole. The longer the list, the lower the middle sinks, while the beginning and the end hold.", "The curve is schematic and applies to recall straight away, in the shape Murdock found in 1962; the numbers are the model’s. Which cards are recalled in a single round is drawn from the chances, so rounds vary. The words move from list to list: it is the place, not the word, that counts."]}, "type": "simulation", "ev3": ["finding", "solid", "caveat"], "predict": {"q": {"da": "Tyve ord vises ét ad gangen og skal gengives med det samme. Hvilke huskes dårligst?", "en": "Twenty words are shown one at a time and recalled straight away. Which are remembered worst?"}, "opts": [{"da": "De første", "en": "The first"}, {"da": "Dem i midten", "en": "Those in the middle"}, {"da": "De sidste", "en": "The last"}], "a": 1, "why": {"da": "De første og især de sidste huskes bedst ved gengivelse med det samme. Midten synker, jo længere listen er.", "en": "The first and especially the last are remembered best when recalled straight away. The middle sinks as the list grows longer."}}, "shows": {"da": "Hvad der huskes, når en liste skal gengives lige efter.", "en": "What is remembered when a list is recalled right after."}, "notShows": {"da": "At det gælder en navigation, man ser, mens man vælger. Og med en pause, hvor man laver noget andet, før gengivelsen forsvinder fordelen for de sidste.", "en": "That it applies to a navigation you see while you choose. And with a pause filled with something else before recall, the advantage for the last items disappears."}, "counter": {"da": "Ved korte lister er effekten lille, og i en navigation, man ser, mens man vælger, gælder den ikke direkte. Her er listen fem ord og huskes næsten helt.", "en": "In short lists the effect is small, and in a navigation you see while choosing it does not apply directly. Here the list is five words and is remembered almost whole."}, "counterSet": 5, "related": [["von-restorff", {"da": "Det afvigende løftes over kurven", "en": "The odd one is lifted above the curve"}], ["peak-end", {"da": "Slutningen vejer også tungt i mindet", "en": "The end also weighs heavily in memory"}]], "answerSet": 20, "loops": true}, {"id": "von-restorff", "no": "17", "g": 2, "name": {"da": "Von Restorff-effekten", "en": "Von Restorff Effect"}, "orig": "Von Restorff Effect (isolation effect)", "def": {"da": "Et element, der skiller sig ud fra en række ensartede, huskes bedre end de andre.", "en": "An item that differs from a run of similar ones is remembered better than the rest."}, "design": {"da": ["Skal noget huskes bagefter, fx en vigtig betingelse, så lad det skille sig ud fra resten. Fremhæver man alt, skiller intet sig ud.", "Lad ikke farve alene bære forskellen. Ikke alle kan se den, og WCAG kræver et ekstra kendetegn."], "en": ["If something must be remembered afterwards, such as an important condition, make it stand out from the rest. Highlight everything and nothing stands out.", "Do not let colour alone carry the difference. Not everyone can see it, and WCAG requires another cue."]}, "ev": "robust", "evWhy": {"da": "Effekten er robust og let at gentage. Den skyldes dog ikke kun, at det afvigende fanger blikket: den optræder også, når det afvigende står tidligt i listen, før det kan skille sig ud. Von Restorff forklarede den med, at de ens elementer forstyrrer hinanden.", "en": "The effect is robust and easy to replicate. It is not only because the different item catches the eye, though: it also appears when the different item comes early in the list, before it can stand out. Von Restorff explained it by the similar items interfering with each other."}, "origin": ["von Restorff, H. (1933). Über die Wirkung von Bereichsbildungen im Spurenfeld. <i>Psychologische Forschung</i>, 18, 299–342."], "links": [{"t": "MacLeod (2020): Zeigarnik and von Restorff: The memory effects and the stories behind them", "u": "https://uwaterloo.ca/memory-attention-cognition-lab/sites/default/files/uploads/files/zeigarnik2020.pdf"}, {"t": "Von Restorff effect (Wikipedia)", "u": "https://en.wikipedia.org/wiki/Von_Restorff_effect"}], "model": {"da": ["Elleve klodser med hver sit tal rejser sig én ad gangen og synker igen. Lige bagefter rejser hukommelsen de klodser, den har fået med; de glemte står som stiplede omrids.", "Grebet styrer, hvor anderledes den sjette klods midt i rækken er: først kun i farve, derefter også i højde, så forskellen ikke kun hviler på farven.", "Tavlen viser modellens chance for at huske hver plads. Rækken har i sig selv seriepositionseffektens U-form; den afvigende klods løftes over sine naboer, og det stiplede er dens søjle, når alle klodser er ens. Hvilke klodser der huskes i en enkelt runde, trækkes ud fra chancerne.", "Modellen holder det enkelt, men effekten skyldes ikke kun, at det afvigende fanger blikket: den viser sig også, når det afvigende kommer tidligt i listen, før det kan skille sig ud. Von Restorff forklarede den med, at de ens elementer forstyrrer hinanden. Hvor meget den afvigende klods løftes, er modellens tal."], "en": ["Eleven blocks, each with a number, rise one at a time and sink again. Straight afterwards memory raises the blocks it kept; the forgotten ones stand as dashed outlines.", "The handle sets how different the sixth block, in the middle of the row, is: first in colour only, then in height too, so the difference does not rest on colour alone.", "The board shows the model’s chance of recalling each place. The row by itself has the U shape of the serial position effect; the different block is lifted above its neighbours, and the dashed outline is its bar when all the blocks are the same. Which blocks are recalled in a single round is drawn from the chances.", "The model keeps it simple, but the effect is not only the odd item catching the eye: it also appears when the odd item comes early in the list, before it can stand out. Von Restorff explained it by the similar items interfering with each other. How far the different block is lifted is the model’s number."]}, "type": "simulation", "ev3": ["finding", "solid", "caveat"], "predict": {"q": {"da": "Én klods midt i rækken skiller sig ud. Hvad sker der med chancen for at huske den?", "en": "One block in the middle of the row stands out. What happens to the chance of remembering it?"}, "opts": [{"da": "Den stiger", "en": "It rises"}, {"da": "Den falder, fordi den forstyrrer", "en": "It drops, because it disturbs"}, {"da": "Den er den samme", "en": "It stays the same"}], "a": 0, "why": {"da": "Det, der skiller sig ud fra en række ensartede, huskes bedre end sine naboer.", "en": "What stands out from a row of alike things is remembered better than its neighbours."}}, "shows": {"da": "At det, der skiller sig ud, huskes bedre.", "en": "That what stands out is remembered better."}, "notShows": {"da": "At effekten kun skyldes, at det afvigende fanger blikket. Den viser sig også, når det afvigende står tidligt i listen, før der er noget at skille sig ud fra.", "en": "That the effect is only about catching the eye. It also appears when the odd item comes early in the list, before there is anything to stand out from."}, "counter": {"da": "Fremhævning hjælper kun det fremhævede. Her løftes den sjette klods, mens naboerne huskes som før.", "en": "Highlighting helps only what is highlighted. Here the sixth block is lifted while its neighbours are remembered as before."}, "counterSet": 3, "related": [["serial-position", {"da": "Kurven, det afvigende løftes over", "en": "The curve the odd one is lifted above"}], ["selective-attention", {"da": "At fange blikket er en anden effekt", "en": "Catching the eye is a different effect"}]], "answerSet": 3, "loops": true}, {"id": "peak-end", "no": "18", "g": 2, "name": {"da": "Peak-end-reglen", "en": "Peak-End Rule"}, "orig": "Peak-End Rule", "def": {"da": "Når vi bagefter vurderer en oplevelse, siger det mest intense og det sidste øjeblik omtrent lige så meget om vurderingen som gennemsnittet af hele oplevelsen, og mere end begyndelsen. Hvor længe den varede, betyder næsten intet.", "en": "When we judge an experience afterwards, the most intense and the last moment predict the judgement about as well as the average of the whole experience, and better than the beginning. How long it lasted matters hardly at all."}, "design": {"da": ["Design slutningen bevidst. Et køb, der ender med en fejlbesked, kan trække mindet om hele købet ned, selv om resten gik godt.", "Find oplevelsens værste øjeblik, og gør det mindre slemt, før du polerer resten.", "Spørg også bagefter, ikke kun undervejs. Det er mindet, mere end oplevelsen undervejs, der forudsiger, om folk vil gentage den."], "en": ["Design the ending on purpose. A purchase that ends in an error message can drag down the memory of the whole purchase, even if the rest went well.", "Find the worst moment of the experience and make it less bad before polishing the rest.", "Ask afterwards as well, not only during. It is the memory, more than the experience along the way, that predicts whether people choose to repeat it."]}, "ev": "robust", "evWhy": {"da": "En metaanalyse fra 2022 af 174 effekter fandt stærk støtte til reglen og næsten ingen betydning af varigheden. Top og slut forudsagde vurderingen omtrent lige så godt som gennemsnittet af hele oplevelsen og bedre end begyndelsen eller udviklingen undervejs. Det er stadig en tendens, ikke en lov uden undtagelser. Mange gengivelser siger, at 80 % valgte det lange forsøg; i artiklen var det 22 af 32, og det tredje forsøg blev aldrig gennemført.", "en": "A 2022 meta-analysis of 174 effects found strong support for the rule and almost no effect of duration. Peak and end predicted the rating about as well as the average of the whole experience, and better than the beginning or the trend. It is still a tendency, not a law without exceptions. Many retellings say 80% chose the long trial; in the paper it was 22 of 32, and the third trial was never run."}, "origin": ["Kahneman, D., Fredrickson, B. L., Schreiber, C. A. &amp; Redelmeier, D. A. (1993). When more pain is preferred to less: Adding a better end. <i>Psychological Science</i>, 4(6), 401–405.", "Redelmeier, D. A. &amp; Kahneman, D. (1996). Patients’ memories of painful medical treatments. <i>Pain</i>, 66(1), 3–8.", "Alaybek, B. m.fl./et al. (2022). All’s well that ends (and peaks) well? A meta-analysis of the peak-end rule and duration neglect. <i>Organizational Behavior and Human Decision Processes</i>, 170, 104149."], "links": [{"t": "Kahneman m.fl. / et al. (1993): When More Pain Is Preferred to Less", "u": "https://ius.uzh.ch/dam/jcr:5ae9adc9-61ec-4174-b37c-4b752f36c23b/Kahnemann%20et%20al.%20-%20When%20More%20Pain%20is%20Preferred%20to%20Less%20(1993).pdf"}], "model": {"da": ["Hver søjle er fem sekunders ubehag, mens forsøget står på. Beholderen til højre fyldes med alt ubehaget undervejs.", "Bagefter tager hukommelsen to søjler: den værste og den sidste. Det huskede ubehag er gennemsnittet af de to.", "Det lange forsøg fortsætter med 30 sekunder, der er mildere, men stadig ubehagelige. Det giver mere ubehag i alt og alligevel et mildere minde. Det stiplede er det andet forsøg, så de to kan sammenlignes.", "Modellen følger forsøget med koldt vand fra 1993: 60 sekunder med hånden i 14 °C vand, og i det lange forsøg 30 sekunder mere, mens vandet blev omkring 1 °C varmere. Da forsøgspersonerne skulle vælge, hvilket forsøg der skulle gentages, valgte 22 af 32 det lange. Skalaen fra 0 til 10 er skematisk; tallene er modellens."], "en": ["Each column is five seconds of discomfort while the trial goes on. The container on the right fills with all the discomfort along the way.", "Afterwards memory takes two columns: the worst and the last. The remembered discomfort is the mean of the two.", "The long trial goes on with 30 seconds that are milder but still unpleasant. That gives more discomfort in total and still a milder memory. The dashed shapes are the other trial, so the two can be compared.", "The model follows the cold-water experiment from 1993: 60 seconds with a hand in 14 °C water, and in the long trial 30 seconds more while the water grew about 1 °C warmer. Asked which trial to repeat, 22 of 32 chose the long one. The 0 to 10 scale is schematic; the numbers are the model’s."]}, "type": "simulation", "ev3": ["finding", "solid", "caveat"], "predict": {"q": {"da": "Det lange forsøg har 30 sekunder ekstra med mildere, men stadig ubehageligt vand. Hvilket forsøg huskede de fleste som værst?", "en": "The long trial has 30 extra seconds of milder but still unpleasant water. Which trial did most people remember as worse?"}, "opts": [{"da": "Det lange, for der er mere ubehag i alt", "en": "The long one, as there is more discomfort in total"}, {"da": "Det korte, for det slutter på det værste", "en": "The short one, as it ends at the worst"}, {"da": "De huskes ens", "en": "They are remembered alike"}], "a": 1, "why": {"da": "Mindet vægter det værste og det sidste øjeblik. I forsøget fra 1993 valgte 22 af 32 at gentage det lange.", "en": "Memory weighs the worst and the last moment. In the 1993 experiment, 22 of 32 chose to repeat the long one."}}, "shows": {"da": "At en mildere slutning kan give et mildere minde, selv med mere ubehag i alt.", "en": "That a milder ending can give a milder memory, even with more discomfort in total."}, "notShows": {"da": "At resten af oplevelsen er ligegyldig. Gennemsnittet af hele oplevelsen forudsiger vurderingen omtrent lige så godt.", "en": "That the rest of the experience does not matter. The average of the whole experience predicts the rating about as well."}, "counter": {"da": "Brug ikke en god slutning til at dække over et dårligt forløb. Her giver det lange forsøg et mildere minde, men mere ubehag i alt.", "en": "Do not use a good ending to cover up a bad experience. Here the long trial gives a milder memory but more discomfort in total."}, "counterSet": 30, "related": [["serial-position", {"da": "Også her vejer slutningen tungt", "en": "Here, too, the end weighs heavily"}], ["cognitive-bias", {"da": "Mindet er en skæv opgørelse", "en": "Memory is a biased account"}]], "answerSet": 30, "loops": true}, {"id": "fitts", "no": "19", "g": 3, "name": {"da": "Fitts’ lov", "en": "Fitts’s Law"}, "orig": "Fitts’s Law", "def": {"da": "Tiden, det tager at ramme et mål, vokser med afstanden til målet og falder med målets bredde. Det er forholdet mellem de to, der tæller.", "en": "The time it takes to hit a target grows with the distance to it and falls with its width. It is the ratio between the two that counts."}, "design": {"da": ["Gør det vigtige stort, og placér det tæt på, hvor hånden eller markøren allerede er.", "Hele det klikbare område tæller. Gør hele rækken eller kortet klikbart, ikke kun teksten.", "Med mus er skærmens kanter og hjørner særligt lette at ramme, fordi markøren stopper der. Med fingre gælder det ikke, og målene skal være store nok til en finger."], "en": ["Make what matters large, and place it close to where the hand or pointer already is.", "The whole clickable area counts. Make the whole row or card clickable, not only the text.", "With a mouse, the edges and corners of the screen are especially easy to hit because the pointer stops there. With fingers that does not hold, and targets must be large enough for a finger."]}, "ev": "measured", "evWhy": {"da": "Bevægelsestiden følger sværhedsgraden i en ret linje på tværs af hænder, mus, pegeplader og berøringsskærme og over årtier. Målt efter standarden ISO 9241-9 ligger mus på 3,7 til 4,9 bit i sekundet. Formlen beskriver gennemsnit over mange forsøg, ikke det enkelte klik.", "en": "Movement time follows difficulty in a straight line across hands, mice, touchpads and touchscreens and over decades. Measured to the ISO 9241-9 standard, mice come out at 3.7 to 4.9 bits per second. The formula describes averages over many trials, not the single click."}, "origin": ["Fitts, P. M. (1954). The information capacity of the human motor system in controlling the amplitude of movement. <i>Journal of Experimental Psychology</i>, 47(6), 381–391.", "MacKenzie, I. S. (1989). A note on the information-theoretic basis for Fitts’ law. <i>Journal of Motor Behavior</i>, 21, 323–330.", "Soukoreff, R. W. &amp; MacKenzie, I. S. (2004). Towards a standard for pointing device evaluation. <i>International Journal of Human-Computer Studies</i>, 61, 751–789."], "links": [{"t": "Fitts’s Law and Its Applications in UX", "u": "https://www.nngroup.com/articles/fitts-law/"}, {"t": "MacKenzie (1992): Fitts’ Law as a Research and Design Tool in HCI", "u": "https://www.yorku.ca/mack/hci1992.html"}], "model": {"da": ["Apparatet er bygget efter Fitts’ forsøg fra 1954: en pen slår skiftevis ned på to plader med bredden W og afstanden D. Forsøgspersonerne skulle ramme så mange gange som muligt, men lægge vægt på præcision.", "Små mål kræver, at pennen bremser og retter ind, før den lander. Prikkerne på pladerne viser, hvor den har ramt.", "Hvert tryk bliver et punkt i grafen: sværhedsgraden ID = log₂(D/W + 1) ud ad den vandrette akse, tiden op ad den lodrette. Linjen tegnes først, når punkterne viser den. Denne udgave af ID er den, der bruges i HCI i dag; MacKenzie indførte den i 1989.", "Konstanterne a og b er modellens: a = 0,05 s og b = 0,22 s pr. bit. De giver en gennemstrømning på omkring 4,2 bit i sekundet, inden for de 3,7–4,9 bit i sekundet, der er målt for mus. Fitts’ egne forsøgspersoner var omkring dobbelt så hurtige med pennen."], "en": ["The apparatus is modelled on Fitts’s 1954 experiment: a stylus taps the two plates of width W at distance D in turn. Subjects were to score as many hits as they could, but emphasise accuracy.", "Small targets make the stylus slow down and correct before it lands. The dots on the plates show where it has hit.", "Each tap becomes a point on the graph: the index of difficulty ID = log₂(D/W + 1) along the horizontal axis, time up the vertical one. The line is drawn only when the points show it. This form of ID is the one used in HCI today; MacKenzie introduced it in 1989.", "The constants a and b are the model’s: a = 0.05 s and b = 0.22 s per bit. They give a throughput of about 4.2 bits per second, within the 3.7–4.9 bits per second measured for mice. Fitts’s own subjects were about twice as fast with the stylus."]}, "type": "simulation", "ev3": ["law", "solid", "direct"], "predict": {"q": {"da": "Målet gøres dobbelt så bredt; afstanden er den samme. Hvad sker der med tiden?", "en": "The target is made twice as wide; the distance is the same. What happens to the time?"}, "opts": [{"da": "Den halveres", "en": "It halves"}, {"da": "Den falder, men bliver ikke halveret", "en": "It drops, but does not halve"}, {"da": "Den er den samme", "en": "It stays the same"}], "a": 1, "why": {"da": "Tiden følger log₂(D/W + 1). Bredden hjælper, men logaritmisk, og der er en fast grundtid.", "en": "Time follows log₂(D/W + 1). Width helps, but logarithmically, and there is a fixed base time."}}, "shows": {"da": "At tiden følger forholdet mellem afstand og målets udstrækning i bevægelsens retning.", "en": "That time follows the ratio between distance and the target’s extent in the direction of movement."}, "notShows": {"da": "Fejl og det at finde målet. Formlen beskriver gennemsnit over mange forsøg, og tiderne her er beregnet af modellen.", "en": "Errors, or finding the target. The formula describes averages over many trials, and the times here are computed by the model."}, "counter": {"da": "Fitts’ lov siger intet om at finde målet, kun om at ramme det, når man ved, hvor det er. Et stort mål hjælper ikke, hvis det ikke kan findes.", "en": "Fitts’s law says nothing about finding the target, only about hitting it once you know where it is. A big target does not help if it cannot be found."}, "counterSet": null, "related": [["hick", {"da": "Tiden før bevægelsen", "en": "The time before the movement"}], ["doherty", {"da": "Tempoet i samspillet med maskinen", "en": "The pace of working with the machine"}]], "answerSet": null, "loops": true}, {"id": "doherty", "no": "20", "g": 3, "name": {"da": "Doherty-tærsklen", "en": "Doherty Threshold"}, "orig": "Doherty Threshold", "def": {"da": "Jo hurtigere computeren svarer, jo hurtigere arbejder brugeren, fordi ingen af dem venter på den anden. Grænsen på 400 millisekunder, der ofte bliver nævnt, står ikke i kilden: IBM-notatet fra 1982 taler for svartider under ét sekund.", "en": "The faster the computer responds, the faster the user works, because neither waits for the other. The often quoted limit of 400 milliseconds is not in the source: the IBM brief from 1982 argues for response times under one second."}, "design": {"da": ["Vis straks, at en handling er modtaget, også når resultatet ikke er klar endnu.", "Når noget tager tid, så vis fremskridt, og lad brugeren gøre andet imens."], "en": ["Show at once that an action has been received, even when the result is not ready.", "When something takes time, show progress, and let the user do something else meanwhile."]}, "ev": "heuristic", "evWhy": {"da": "Kilden er et kort notat fra IBM baseret på målinger ved mainframe-terminaler, ikke en fagfællebedømt undersøgelse. Den nævner ikke 400 millisekunder; den taler for svartider under ét sekund. Hurtig respons er klart bedre, men 400 ms er en tommelfingerregel, ikke en målt grænse.", "en": "The source is a short IBM brief based on measurements at mainframe terminals, not a peer-reviewed study. It does not mention 400 milliseconds; it argues for response times under one second. Fast response is clearly better, but 400 ms is a rule of thumb, not a measured limit."}, "origin": ["Doherty, W. J. &amp; Thadhani, A. J. (1982, november/November). <i>The Economic Value of Rapid Response Time</i>. IBM."], "links": [{"t": "Doherty & Thadhani (1982): The Economic Value of Rapid Response Time (Computer History Museum)", "u": "https://archive.computerhistory.org/resources/access/text/2024/03/102751398-05-01-acc.pdf"}, {"t": "Response Times: The 3 Important Limits", "u": "https://www.nngroup.com/articles/response-times-3-important-limits/"}], "model": {"da": ["Den mørke pen og maskinen skiftes til at handle. Pennen trykker på tasten, og tasten er blå, indtil maskinen svarer på skærmen. Båndet på bordet viser de sidste tolv sekunder: mørkt er pennen, der handler, hvidt er ventetid på maskinen.", "Grebet styrer maskinens svartid fra 0,25 til 3 sekunder. Tavlen viser, hvor mange handlinger pennen når i minuttet, og hver færdig handling bliver et punkt i grafen.", "Et langsomt svar koster også brugeren tid. IBM-notatet af Doherty og Thadhani (1982) gengiver en iagttagelse fra Doherty og Kelisky: hvert sekund længere svartid lagde en tilsvarende forsinkelse til brugerens tid for det næste skridt. Modellen viser den tid som det grå stykke på båndet. Den stiplede kurve er antallet, hvis kun ventetiden kom oveni.", "Tider og antal er modellens, ikke målinger. I notatets egne tal gik en programmør fra omkring 180 til 371 transaktioner i timen, da svartiden faldt fra 3 til 0,3 sekunder. De ofte nævnte 400 ms står ikke i notatet, så modellen tegner ingen grænse dér."], "en": ["The dark stylus and the machine take turns. The stylus presses the key, and the key stays blue until the machine answers on its screen. The tape on the desk shows the last twelve seconds: dark is the stylus acting, white is waiting for the machine.", "The handle sets the machine’s response time from 0.25 to 3 seconds. The board shows how many actions the stylus gets through per minute, and each finished action becomes a point on the graph.", "A slow answer also costs the user time. The IBM brief by Doherty and Thadhani (1982) reports an observation by Doherty and Kelisky: each second of slower response added a similar delay to the user’s time for the next step. The model shows that time as the grey part of the tape. The dashed curve is the count if only the waiting were added.", "The times and counts are the model’s, not measurements. In the brief’s own figures, a programmer went from about 180 to 371 transactions an hour when response time fell from 3 to 0.3 seconds. The often quoted 400 ms is not in the brief, so the model draws no limit there."]}, "type": "simulation", "ev3": ["rule", "mixed", "direct"], "predict": {"q": {"da": "Maskinen svarer på 3 sekunder i stedet for 0,25. Hvad sker der med brugerens egen tid pr. handling?", "en": "The machine answers in 3 seconds instead of 0.25. What happens to the user’s own time per action?"}, "opts": [{"da": "Den er den samme; kun ventetiden vokser", "en": "It stays the same; only the waiting grows"}, {"da": "Den vokser også", "en": "It grows too"}, {"da": "Den falder, fordi man når at tænke", "en": "It drops, because there is time to think"}], "a": 1, "why": {"da": "IBM-notatet gengiver en iagttagelse: en længere svartid gjorde også brugerens næste skridt langsommere.", "en": "The IBM memo reports an observation: a longer response time also made the user’s next step slower."}}, "shows": {"da": "At en langsom maskine også gør brugeren langsommere.", "en": "That a slow machine also makes the user slower."}, "notShows": {"da": "En universel grænse, hverken 400 ms eller ét sekund. Kilden er et notat med målinger ved terminaler, og tiderne her er modellens.", "en": "A universal threshold, neither 400 ms nor one second. The source is a memo with measurements at terminals, and the times here are the model’s."}, "counter": {"da": "Gør ikke et tal som 400 ms til en regel; det står ikke i kilden. Kan maskinen ikke svare hurtigt, så vis straks, at handlingen er modtaget.", "en": "Do not turn a figure like 400 ms into a rule; it is not in the source. When the machine cannot answer fast, show at once that the action was received."}, "counterSet": null, "related": [["flow", {"da": "Hurtig feedback er en af flowets betingelser", "en": "Fast feedback is one of flow’s conditions"}], ["fitts", {"da": "Brugerens egen del af tiden", "en": "The user’s own share of the time"}]], "answerSet": 3, "loops": true}, {"id": "goal-gradient", "no": "21", "g": 3, "name": {"da": "Målgradienteffekten", "en": "Goal-Gradient Effect"}, "orig": "Goal-Gradient Effect", "def": {"da": "Jo tættere vi er på et mål, jo hurtigere arbejder vi hen imod det.", "en": "The closer we are to a goal, the faster we work towards it."}, "design": {"da": ["Vis fremskridt, så brugeren kan se, hvor tæt målet er.", "Et lille forspring kan øge tempoet mod målet, fx en opgave, der allerede er markeret som gjort."], "en": ["Show progress, so the user can see how close the goal is.", "A small head start can increase the pace towards the goal, for example a task already marked as done."]}, "ev": "robust", "evWhy": {"da": "Clark Hull beskrev det for rotter i 1932, og Kivetz, Urminsky og Zheng fandt det samme for mennesker i 2006, fx med stempelkort i en café. Effekten af et givet forspring er også fundet uafhængigt af dem. Kurven er dog ikke altid jævn: motivationen kan også være høj langt fra målet og dykke midtvejs.", "en": "Clark Hull described it for rats in 1932, and Kivetz, Urminsky and Zheng found the same in people in 2006, for example with café stamp cards. The head-start effect has also been found independently. The curve is not always smooth, though: motivation can also be high far from the goal and dip in the middle."}, "origin": ["Hull, C. L. (1932). The goal-gradient hypothesis and maze learning. <i>Psychological Review</i>, 39, 25–43.", "Kivetz, R., Urminsky, O. &amp; Zheng, Y. (2006). The goal-gradient hypothesis resurrected. <i>Journal of Marketing Research</i>, 43(1), 39–58.", "Nunes, J. C. &amp; Drèze, X. (2006). The endowed progress effect. <i>Journal of Consumer Research</i>, 32(4), 504–512.", "Bonezzi, A., Brendl, C. M. &amp; De Angelis, M. (2011). Stuck in the middle. <i>Psychological Science</i>, 22(5), 607–612."], "links": [{"t": "Kivetz, Urminsky & Zheng (2006): The Goal-Gradient Hypothesis Resurrected", "u": "https://business.columbia.edu/sites/default/files-efs/pubfiles/1200/goalgradient.pdf"}], "model": {"da": ["Ti køb giver en belønning. Pennen stempler en plads pr. køb, og tempoet for hvert stempel, målt i stempler pr. uge, bliver en søjle på tavlen.", "Grebet giver 0–4 stempler fra start (grå). Kortet får lige så mange ekstra pladser, så der stadig skal ti køb til, som i caféforsøget af Kivetz, Urminsky og Zheng (2006): et kort med 12 pladser og 2 givne stempler blev fyldt på 12,7 dage i gennemsnit mod 15,6 dage for et kort med 10 pladser.", "I modellen afhænger tiden til næste køb af, hvor fuldt kortet ser ud. Derfor stiger tempoet mod belønningen, og med et forspring er det højere allerede fra første køb. De stiplede søjler er de samme ti køb uden forspring.", "Tempo og dage er modellens. Kurven er jævn og stejlere end i caféen, hvor tiden mellem kafferne faldt med omkring en femtedel hen over kortet, og forspringet sparer mindre tid end i forsøget. Motivationen kan også dykke midtvejs; det udelader modellen."], "en": ["Ten purchases earn a reward. The stylus stamps one slot per purchase, and the pace of each stamp, in stamps per week, becomes a column on the board.", "The handle gives 0–4 stamps from the start (grey). The card gets the same number of extra slots, so ten purchases are still needed, as in the café study by Kivetz, Urminsky and Zheng (2006): a 12-stamp card with 2 stamps given was filled in 12.7 days on average, against 15.6 days for a 10-stamp card.", "In the model the time to the next purchase depends on how full the card looks. So the pace rises towards the reward, and with a head start it is higher from the first purchase. The dashed columns are the same ten purchases without a head start.", "The pace and the days are the model’s. Its curve is smooth and steeper than in the café, where the time between coffees fell by about a fifth over the card, and its head start saves less time than the study found. Motivation can also dip in the middle, which the model leaves out."]}, "type": "simulation", "ev3": ["finding", "solid", "caveat"], "predict": {"q": {"da": "Et kort med to stempler givet fra start kræver stadig ti køb. Bliver det fyldt hurtigere end et kort uden?", "en": "A card with two stamps given at the start still needs ten purchases. Is it filled faster than a card without?"}, "opts": [{"da": "Ja", "en": "Yes"}, {"da": "Nej, det er de samme ti køb", "en": "No, it is the same ten purchases"}, {"da": "Det bliver langsommere", "en": "It is slower"}], "a": 0, "why": {"da": "I caféforsøget blev kortet med forspring fyldt hurtigere: 12,7 mod 15,6 dage i gennemsnit.", "en": "In the café study the card with a head start was filled faster: 12.7 versus 15.6 days on average."}}, "shows": {"da": "At tempoet stiger mod målet, og at et forspring hjælper.", "en": "That the pace rises towards the goal, and that a head start helps."}, "notShows": {"da": "At kurven altid er jævn. Motivationen kan også være høj langt fra målet og dykke midtvejs.", "en": "That the curve is always smooth. Motivation can also be high far from the goal and dip midway."}, "counter": {"da": "Regn ikke med, at tempoet holder efter målet. I caféen gik de første køb på det næste kort langsommere igen.", "en": "Do not expect the pace to last past the goal. In the café, the first purchases on the next card were slower again."}, "counterSet": null, "related": [["zeigarnik", {"da": "Trangen til at gøre det færdigt", "en": "The urge to finish"}], ["flow", {"da": "Klare mål og tydeligt fremskridt", "en": "Clear goals and visible progress"}]], "answerSet": 2, "loops": true}, {"id": "zeigarnik", "no": "22", "g": 3, "name": {"da": "Zeigarnik-effekten", "en": "Zeigarnik Effect"}, "orig": "Zeigarnik Effect", "def": {"da": "Bluma Zeigarnik fandt i 1927, at afbrudte opgaver blev husket bedre end afsluttede. Nyere forskning bekræfter ikke hukommelsesfordelen, men nok at vi har lyst til at genoptage afbrudte opgaver.", "en": "In 1927 Bluma Zeigarnik found that interrupted tasks were remembered better than completed ones. Later research does not confirm the memory advantage, but does confirm that we tend to want to resume interrupted tasks."}, "design": {"da": ["Vis tydeligt, hvad der mangler, fx en profil, der er næsten udfyldt.", "Brug det med måde. Ufærdige opgaver, der bliver hængende, kan også stresse."], "en": ["Show clearly what is missing, for example a profile that is nearly complete.", "Use it sparingly. Unfinished tasks that linger can also stress people."]}, "ev": "contested", "evWhy": {"da": "En metaanalyse fra 2025 fandt ingen hukommelsesfordel for afbrudte opgaver; de blev husket lige så godt som afsluttede. Tendensen til at ville genoptage afbrudte opgaver, kaldet Ovsiankina-effekten, er derimod solid.", "en": "A 2025 meta-analysis found no memory advantage for interrupted tasks; they were remembered as well as completed ones. The tendency to want to resume interrupted tasks, called the Ovsiankina effect, is solid, however."}, "origin": ["Zeigarnik, B. (1927). Das Behalten erledigter und unerledigter Handlungen. <i>Psychologische Forschung</i>, 9, 1–85.", "Ghibellini, R. &amp; Meier, B. (2025). Interruption, recall and resumption: a meta-analysis of the Zeigarnik and Ovsiankina effects. <i>Humanities and Social Sciences Communications</i>, 12, 962."], "links": [{"t": "Ghibellini & Meier (2025): Interruption, recall and resumption", "u": "https://www.kog.psy.unibe.ch/e48276/e1785865/s41599-025-05000-w1_ger.pdf"}, {"t": "MacLeod (2020): Zeigarnik and von Restorff: The memory effects and the stories behind them", "u": "https://uwaterloo.ca/memory-attention-cognition-lab/sites/default/files/uploads/files/zeigarnik2020.pdf"}], "model": {"da": ["Seks opgaver står på række, og pennen bygger dem et slag ad gangen. Grebet styrer, hvor mange der bliver afbrudt: den næste opgave kalder (dens kontur bliver blå), før pennen er færdig (den sidste bliver bare afbrudt), og den manglende del står tilbage som en stiplet kontur.", "Når arbejdet er slut, er pennen fri. Den går tilbage til omkring to ud af tre af de afbrudte opgaver og gør dem færdige (blå). Trangen til at genoptage kaldes Ovsiankina-effekten, og den er solid: en metaanalyse fra 2025 fandt, at afbrudte opgaver blev genoptaget omkring 67 % af gangene mod 50 %, som man ville vente ved rent tilfælde. Beholderen på tavlen fyldes med modellens andel.", "Hukommelsesfordelen vises ikke som en kendsgerning. Zeigarnik fandt i 1927, at afbrudte opgaver blev husket næsten dobbelt så godt (1,9 ×, den stiplede kontur). Samme metaanalyse fandt 0,99 × på tværs af 38 publikationer: omtrent lige godt. Derfor er de to søjler lige høje, og den afbrudte står i et stiplet bånd, der skematisk markerer usikkerheden.", "Hvilke opgaver der bliver afbrudt og genoptaget, følger et fast mønster, der giver to ud af tre. Beholderen og procenten under den tæller, hvad modellen gør; 67 % og 50 %, 1,9 × og 0,99 × kommer fra undersøgelserne, og båndets bredde er modellens."], "en": ["Six tasks stand in a row, and the stylus builds them tap by tap. The handle sets how many are interrupted: the next task calls (its outline turns blue) before the stylus is done (the last one is simply cut off), and the missing part stays as a dashed outline.", "When the work is over, the stylus is free. It goes back to about two in three of the interrupted tasks and finishes them (blue). This urge to resume is the Ovsiankina effect, and it is solid: a 2025 meta-analysis found interrupted tasks resumed about 67 % of the time, against 50 % by chance. The container on the board fills with the model’s share.", "The memory advantage is not shown as fact. Zeigarnik found in 1927 that interrupted tasks were recalled almost twice as well (1.9 ×, the dashed outline). The same meta-analysis found 0.99 × across 38 publications: about equal. So the two columns are the same height, and the interrupted one stands in a dashed band that marks the uncertainty schematically.", "Which tasks are interrupted and resumed follows a fixed pattern that gives two in three. The container and the percentage under it count what the model does; 67 % and 50 %, 1.9 × and 0.99 × come from the studies, and the band’s width is the model’s."]}, "type": "simulation", "ev3": ["finding", "contested", "caveat"], "predict": {"q": {"da": "Tre af seks opgaver bliver afbrudt. Hvad huskes bedst bagefter?", "en": "Three of six tasks are interrupted. What is remembered best afterwards?"}, "opts": [{"da": "De afbrudte", "en": "The interrupted ones"}, {"da": "De afsluttede", "en": "The finished ones"}, {"da": "Omtrent lige godt", "en": "About equally well"}], "a": 2, "why": {"da": "En metaanalyse fra 2025 fandt ingen generel hukommelsesfordel. Men afbrudte opgaver bliver oftere genoptaget, end man ville vente ved rent tilfælde.", "en": "A 2025 meta-analysis found no general memory advantage. But interrupted tasks are resumed more often than chance would predict."}}, "shows": {"da": "At afbrudte opgaver oftere bliver genoptaget, end man ville vente ved rent tilfælde.", "en": "That interrupted tasks are resumed more often than chance would predict."}, "notShows": {"da": "At de huskes bedre. Det fandt metaanalysen ikke.", "en": "That they are remembered better. The meta-analysis did not find that."}, "counter": {"da": "Regn ikke med, at en halvfærdig opgave bliver husket bedre. Folk vender ofte tilbage til den, men ikke altid: her bliver omkring hver tredje liggende.", "en": "Do not count on a half-done task being remembered better. People often return to it, but not always: here about one in three is left."}, "counterSet": 6, "related": [["goal-gradient", {"da": "Tæt på målet arbejder vi hurtigere", "en": "Near the goal we work faster"}], ["working-memory", {"da": "Hvad hukommelsen faktisk holder", "en": "What memory actually holds"}]], "answerSet": 3, "loops": true}, {"id": "flow", "no": "23", "g": 3, "name": {"da": "Flow", "en": "Flow"}, "orig": "Flow", "def": {"da": "En tilstand af fuld fordybelse, hvor man glemmer tid og sig selv. Den opstår typisk, når udfordringen passer til ens evner, og der er klare mål og hurtig feedback.", "en": "A state of full absorption in which one loses track of time and self. It typically arises when the challenge matches one’s skills, with clear goals and quick feedback."}, "design": {"da": ["Giv hurtig og tydelig feedback på hver handling.", "Lad sværhedsgraden følge brugerens evner, fx ved at vise avancerede funktioner, når der er brug for dem."], "en": ["Give quick, clear feedback on every action.", "Let difficulty follow the user’s skill, for example by showing advanced features when they are needed."]}, "ev": "robust", "evWhy": {"da": "Flow er en veldokumenteret oplevelse. Balancen mellem udfordring og evner hænger moderat sammen med flow på tværs af 28 studier, svagere i arbejde og uddannelse. Definitioner og målemetoder varierer stadig.", "en": "Flow is a well documented experience. The balance of challenge and skill is moderately related to flow across 28 studies, more weakly at work and in education. Definitions and measures still vary."}, "origin": ["Csikszentmihalyi, M. (1975). <i>Beyond Boredom and Anxiety</i>. Jossey-Bass.", "Csikszentmihalyi, M. (1990). <i>Flow: The Psychology of Optimal Experience</i>. Harper &amp; Row.", "Fong, C. J., Zaleski, D. J. &amp; Leach, J. K. (2015). The challenge–skill balance and antecedents of flow: A meta-analytic investigation. <i>The Journal of Positive Psychology</i>, 10(5), 425–446."], "links": [{"t": "Peifer m.fl. / et al. (2022): A Scoping Review of Flow Research", "u": "https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2022.815665/full"}, {"t": "Encouraging Flow State in Products (video)", "u": "https://www.nngroup.com/videos/flow-state/"}], "model": {"da": ["Pladen er et kort over udfordring (bagud) mod evner (mod højre). Det hævede blå bånd langs diagonalen er flowkanalen, med angst på den side, hvor udfordringen er størst, og kedsomhed på den anden, som i Csikszentmihalyis model.", "Klodsens evner vokser i et jævnt tempo, og grebet styrer, hvor hurtigt udfordringen stiger. Følges de ad, bliver klodsen i kanalen; stiger udfordringen for hurtigt, kører den mod angst, og for langsomt, mod kedsomhed. Tavlen til højre viser, hvor stor en del af turen klodsen er i hver tilstand.", "Drejer man på grebet undervejs, knækker sporet, der hvor klodsen er, så udfordringen kan sænkes eller øges, til klodsen finder kanalen igen.", "Modellen lader balancen afgøre alt og udelader andre betingelser som klare mål og hurtig feedback. På tværs af 28 studier (Fong m.fl., 2015) hænger balancen mellem udfordring og evner kun moderat sammen med flow. Kanalens bredde og tempoet er modellens."], "en": ["The plate is a map of challenge (towards the back) against skill (to the right). The raised blue band along the diagonal is the flow channel, with anxiety on the high-challenge side and boredom on the other, as in Csikszentmihalyi’s model.", "The block’s skill grows at a steady pace, and the handle sets how fast the challenge rises. When the two keep pace, the block stays in the channel; when the challenge rises too fast it heads for anxiety, and too slowly for boredom. The board on the right shows the share of the run spent in each state.", "Turning the handle during a run bends the path from where the block is, so the challenge can be eased or raised until the block finds the channel again.", "The model lets the balance decide everything and leaves out other conditions, such as clear goals and quick feedback. Across 28 studies (Fong and colleagues, 2015) the challenge–skill balance relates to flow only moderately. The channel’s width and the speeds are the model’s."]}, "type": "illustration", "ev3": ["concept", "mixed", "caveat"], "predict": {"q": {"da": "Udfordringen stiger meget hurtigere end evnerne. Hvor havner klodsen?", "en": "The challenge rises much faster than skill. Where does the block end up?"}, "opts": [{"da": "I flowkanalen", "en": "In the flow channel"}, {"da": "I angst", "en": "In anxiety"}, {"da": "I kedsomhed", "en": "In boredom"}], "a": 1, "why": {"da": "I den klassiske flowmodel fører for høj udfordring i forhold til evnerne mod angst, for lav mod kedsomhed.", "en": "In the classic flow model, too much challenge for one’s skill leads towards anxiety, too little towards boredom."}}, "shows": {"da": "Den klassiske flowmodel: balancen me
